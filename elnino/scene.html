<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:R;src:url(fonts/Rubik-ExtraBold.ttf);font-weight:800}
@font-face{font-family:RM;src:url(fonts/Rubik-Medium.ttf)}
html,body{margin:0;background:#000}canvas{width:540px;height:960px;display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Эль-Ниньо" — satellite-map explainer (remake of a geoglobe_tales reel). render(T) is deterministic, T = video seconds.
const W = 1080, H = 1920, OFF = 0.3, END = 95.4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const gl = document.createElement('canvas'); gl.width = W / 4; gl.height = H / 4; const gx = gl.getContext('2d');
let CAPS = []; const MAP = new Image(), SST = new Image();
const MLON0 = 60, MY1 = 117.30871701272397, SI = 24, SSI = 6;   // map grid: lon 60..345, Miller y ±117.3, 24 px/deg
const D2R = Math.PI / 180, EMO = '"Noto Color Emoji"';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .35) => clamp((t - a) / f) * clamp((b - t) / f);
const lerp = (a, b, k) => a + (b - a) * k;
const my = lat => 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * D2R)) / D2R;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- camera keys: [voice time, lon(60..345), lat, px/deg] ----------
const CAM = [[-1, 262, 22, 24], [1.6, 268, 8, 10], [6.8, 250, 6, 8.2], [9.5, 238, 6, 7.6], [14.0, 215, 4, 7.2], [21.1, 208, 2, 9],
  [24.8, 160, -4, 8], [26.3, 132, -10, 11], [30.1, 280, -5, 12], [35.3, 212, 4, 7.2], [40.6, 225, 2, 8.6],
  [47.1, 255, 48, 8.4], [49.3, 262, 36, 9.5], [51.3, 288, -6, 9], [53.1, 128, -16, 10.5], [56.3, 122, 24, 6.6],
  [64.6, 215, 12, 6.6], [70.6, 232, 4, 8.6], [75.2, 230, 22, 7.2], [79.2, 205, 22, 6.6], [83.6, 225, 10, 7.6]];
let cam = { lon: 262, y: my(22), s: 24 };
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  const A = CAM[i], P = CAM[Math.max(0, i - 1)], from = i === 0 ? A : P;
  const k = ease((t - A[0]) / 1.5);
  const ls = Math.log(from[3]) + (Math.log(A[3]) - Math.log(from[3])) * k;
  const sc = Math.exp(ls) * (1 + (t - A[0]) * 0.006);   // slow push-in so the map never freezes
  const s = Math.max(8.3, sc); let y = lerp(my(from[2]), my(A[2]), k);
  y = Math.min(MY1 - H * .46 / s - .5, Math.max(-MY1 + H * .54 / s + .5, y));   // keep the map filling the frame
  return { lon: lerp(from[1], A[1], k), y, s };
}
const PX = (lon, lat) => [W / 2 + (lon - cam.lon) * cam.s, H * .46 - (my(lat) - cam.y) * cam.s];

// ---------- helpers ----------
function txt(s, x, y, size, col = '#fff', font = 'R', glow = null, gb = .5) {
  ctx.font = `800 ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = size * gb; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.fillText(s, x, y); }
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = size * .18; ctx.shadowOffsetY = size * .05; ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function emoji(e, x, y, size, a = 1, rot = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = size * .15; ctx.shadowOffsetY = size * .05; ctx.fillText(e, 0, 0); ctx.restore();
}
function label(s, lon, lat, a, size = 40) { if (a <= 0) return; const [x, y] = PX(lon, lat); ctx.globalAlpha = a; txt(s, x, y, size, '#fff', 'RM'); ctx.globalAlpha = 1; }
// soft glowing blob in geo coords, drawn into the low-res glow layer
function blob(lon, lat, dlon, dlat, col, a) {
  if (a <= 0) return; const [x, y] = PX(lon, lat); const rx = dlon * cam.s / 4, ry = Math.max(4, (my(lat + dlat) - my(lat)) * cam.s / 4);
  gx.save(); gx.globalAlpha = a; gx.translate(x / 4, y / 4); gx.scale(rx, ry);
  const g = gx.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, col); g.addColorStop(.55, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  gx.fillStyle = g; gx.beginPath(); gx.arc(0, 0, 1, 0, Math.PI * 2); gx.fill(); gx.restore();
}
function thermo(x, y, val, a, max = 3.5, s = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  const hot = clamp(val / 1.5), col = `rgb(${lerp(60, 230, hot)},${lerp(110, 40, hot)},${lerp(230, 60, hot)})`;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#f4f6f8'; ctx.beginPath(); ctx.roundRect(-13, -120, 26, 130, 13); ctx.fill(); ctx.beginPath(); ctx.arc(0, 18, 26, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 18, 19, 0, Math.PI * 2); ctx.fill();
  const hgt = 20 + 90 * clamp(val / max); ctx.fillRect(-6, 10 - hgt, 12, hgt);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '800 40px R'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineJoin = 'round';
  const s2 = '+' + val.toFixed(1).replace('.', ',') + '°'; ctx.strokeText(s2, 26, -95); ctx.fillStyle = '#fff'; ctx.fillText(s2, 26, -95);
  ctx.restore();
}
// desk fan seen from the side-front, blowing west (to the left)
function fan(x, y, size, spin, a, puff = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(size / 200, size / 200);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 25; ctx.shadowOffsetY = 10;
  // base + stand
  ctx.fillStyle = '#dfe6ee'; ctx.beginPath(); ctx.ellipse(10, 150, 80, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5aa0d8'; ctx.beginPath(); ctx.ellipse(10, 144, 70, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9eef3'; ctx.fillRect(2, 40, 18, 105);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  // motor housing
  ctx.fillStyle = '#eef2f6'; ctx.beginPath(); ctx.ellipse(40, -10, 45, 38, 0, 0, Math.PI * 2); ctx.fill();
  // cage (tilted ellipse facing left)
  ctx.save(); ctx.translate(-10, -10); ctx.scale(.62, 1);
  ctx.fillStyle = 'rgba(235,242,248,.35)'; ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 2); ctx.fill();
  // blades
  ctx.fillStyle = 'rgba(250,252,255,.92)';
  for (let k = 0; k < 3; k++) { ctx.save(); ctx.rotate(spin + k * Math.PI * 2 / 3); ctx.beginPath(); ctx.ellipse(0, -52, 30, 50, .35, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  ctx.fillStyle = '#cfd8e2'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,255,255,.75)';
  for (let k = 0; k < 24; k++) { const an = k * Math.PI / 12; ctx.beginPath(); ctx.moveTo(Math.cos(an) * 22, Math.sin(an) * 22); ctx.lineTo(Math.cos(an) * 110, Math.sin(an) * 110); ctx.stroke(); }
  for (const r of [45, 78]) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
  if (puff > 0) {   // broken: grey smoke puffs
    for (let k = 0; k < 7; k++) { const an = k * 1.7, r = 40 + 70 * puff; ctx.globalAlpha = a * (1 - puff) * .85; ctx.fillStyle = '#e6e9ee';
      ctx.beginPath(); ctx.arc(-10 + Math.cos(an) * r * .6, -10 + Math.sin(an) * r * .5 - 40 * puff, 30 + 40 * puff, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}
// wind streaks (deterministic): each streak at a latitude, flowing west
const STREAKS = []; for (let i = 0; i < 70; i++) STREAKS.push({ lat: -16 + rnd() * 32, ph: rnd() * 400, sp: 9 + rnd() * 6, len: 10 + rnd() * 10, w: 1 + rnd() * 2.2 });
function winds(t, k, lon0 = 140, lon1 = 280, latScale = 1) {
  if (k <= 0) return; ctx.save(); ctx.lineCap = 'round';
  for (const s of STREAKS) {
    const span = lon1 - lon0 + 40, p = ((s.ph + t * s.sp) % span), head = lon1 + 20 - p, tail = head + s.len;
    const lat = s.lat * latScale + Math.sin(head * .05 + s.ph) * 1.2;
    const [x1, y1] = PX(head, lat), [x2, y2] = PX(tail, lat + .6);
    const fade = clamp(p / 15) * clamp((span - p) / 15) * k;
    if (fade <= 0) continue;
    const g = ctx.createLinearGradient(x1, y1, x2, y2); g.addColorStop(0, `rgba(255,255,255,${.85 * fade})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = s.w * 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 - 6, x2, y2); ctx.stroke();
  }
  ctx.restore();
}
function arrowUp(x0, y0, len, k, a) {
  if (k <= 0 || a <= 0) return; const L = len * eout(k), bend = Math.sin(x0) * 30;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#ff6a3d'; ctx.fillStyle = '#ff6a3d'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(120,20,0,.6)'; ctx.shadowBlur = 10;
  const x1 = x0 + bend * k, y1 = y0 - L; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 + bend * .2, y0 - L * .5, x1, y1); ctx.stroke();
  const an = Math.atan2(y1 - (y0 - L * .5), x1 - (x0 + bend * .2)); ctx.translate(x1, y1); ctx.rotate(an);
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-14, -16); ctx.lineTo(-14, 16); ctx.closePath(); ctx.fill(); ctx.restore();
}
const ARROWS = []; for (let i = 0; i < 16; i++) ARROWS.push({ lon: 190 + rnd() * 80, lat: -8 + rnd() * 14, d: rnd() * 1.6, len: 260 + rnd() * 380 });
const FAMINE = [[78, 23], [76.5, 14], [80, 18], [113, 36], [109, 33], [117, 31], [110, -7], [106, 17], [127, 37.5], [86, 26]];
const EMBERS = []; for (let i = 0; i < 60; i++) EMBERS.push([rnd(), rnd(), .5 + rnd()]);

// ---------- main render ----------
function drawMap(t) {
  ctx.fillStyle = '#163f4c'; ctx.fillRect(0, 0, W, H);
  const sx = (cam.lon - W / 2 / cam.s - MLON0) * SI, sy = (MY1 - (cam.y + H * .46 / cam.s)) * SI, sw = W / cam.s * SI, sh = H / cam.s * SI;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  // clip source rect to the image, map destination accordingly
  const cx0 = Math.max(0, sx), cy0 = Math.max(0, sy), cx1 = Math.min(MAP.width, sx + sw), cy1 = Math.min(MAP.height, sy + sh);
  const dx = (cx0 - sx) / sw * W, dy = (cy0 - sy) / sh * H, dw = (cx1 - cx0) / sw * W, dh = (cy1 - cy0) / sh * H;
  ctx.drawImage(MAP, cx0, cy0, cx1 - cx0, cy1 - cy0, dx, dy, dw, dh);
  if (dy > 0) { ctx.fillStyle = '#1b4652'; ctx.fillRect(0, 0, W, dy + 1); }
  if (dy + dh < H) { ctx.fillStyle = '#e9eef0'; ctx.fillRect(0, dy + dh - 1, W, H - dy - dh + 1); }
}
function drawSST(a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const sx = (cam.lon - W / 2 / cam.s - MLON0) * SSI, sy = (MY1 - (cam.y + H * .46 / cam.s)) * SSI;
  ctx.drawImage(SST, sx, sy, W / cam.s * SSI, H / cam.s * SSI, 0, 0, W, H); ctx.restore();
}
function render(T) {
  const t = T - OFF;
  cam = camAt(t);
  // famine scene: dark, desaturated map
  const dark = win(t, 56.2, 64.6, .6), heat = win(t, 77.4, 83.7, .8), hot2027 = win(t, 79.2, 83.7, .5);
  ctx.filter = dark > 0 ? `grayscale(${.75 * dark}) brightness(${1 - .55 * dark})` : 'none';
  drawMap(t); ctx.filter = 'none';
  // pink tint over the eastern Pacific in the opening (as in the original)
  gx.clearRect(0, 0, gl.width, gl.height);
  blob(240, 8, 70, 30, 'rgba(225,130,170,.9)', .38 * win(t, -2, 3.2, 1.2));
  // ---- heat-map overlays ----
  drawSST(.9 * win(t, 6.8, 9.6, .4) + .92 * win(t, 64.6, 70.6, .6));
  // ---- warm / cold water ----
  const wk = win(t, 24.8, 35.6, .6);                                      // warm pool travels west
  const wl = lerp(250, 150, ease((t - 24.9) / 2.2));
  blob(wl, 0, 32, 8, 'rgba(255,110,110,.95)', .6 * wk);
  blob(274, -6, 9, 11, 'rgba(60,230,255,.95)', .75 * win(t, 32.4, 37.6, .5));     // cold water off Peru / Ecuador
  blob(205, 0, 26, 9, 'rgba(60,220,255,.9)', .5 * win(t, 32.8, 37.6, .5));
  { const k = ease((t - 37.6) / 3.2), a = win(t, 35.6, 47.1, .5);        // El Niño: warm water spreads back east
    blob(lerp(150, 212, k), 0, lerp(32, 62, k), lerp(8, 10, k), 'rgba(255,110,110,.95)', .62 * a); }
  blob(255, 56, 26, 9, 'rgba(255,60,50,.95)', .75 * win(t, 47.2, 53.1, .5));       // Canada warm
  blob(262, 32.5, 17, 3.2, 'rgba(70,200,255,.95)', .8 * win(t, 49.4, 53.1, .4));   // southern US rain
  blob(281, -4, 4.5, 11, 'rgba(40,110,255,.95)', .85 * win(t, 51.4, 53.6, .4));    // South America floods
  blob(130, -14, 22, 13, 'rgba(255,200,60,.95)', .6 * win(t, 53.6, 56.6, .4));      // drought
  blob(230, 0, 48, 10, 'rgba(255,110,110,.95)', .65 * win(t, 70.6, 79.4, .6));     // record warm pool
  if (heat > 0) { const r = ease((t - 77.4) / 2); blob(230, 10, 30 + 140 * r, 10 + 50 * r, 'rgba(255,150,40,.95)', .45 * heat); }
  ctx.save(); ctx.filter = 'blur(6px)'; ctx.globalAlpha = 1; ctx.drawImage(gl, 0, 0, W, H); ctx.restore();
  // 2027: world turns hot
  if (hot2027 > 0) { ctx.save(); ctx.globalAlpha = .55 * hot2027; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = '#ff5a00'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = .25 * hot2027; ctx.fillStyle = '#7a1500'; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.fillStyle = '#ffb347'; for (const [ex, ey, es] of EMBERS) { const y = ((ey - t * .05 * es) % 1 + 1) % 1; ctx.globalAlpha = hot2027 * .7; ctx.beginPath(); ctx.arc(ex * W, y * H, 3 * es, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }

  // ---- winds ----

  winds(t, win(t, 14.4, 35.6, .8) * 1 + win(t, 35.6, 40.4, .3) * lerp(1, .15, ease((t - 36.9) / 2.5)), 120, 282);
  // ---- scene objects ----
  { // fan near Ecuador
    const a = win(t, 1.9, 14.6, .4), [x, y] = PX(268, -2), spinV = t < 5.5 ? t * 18 : 5.5 * 18 + (1 - Math.exp(-(t - 5.5) * 1.2)) * 15;
    const sz = 190 * back((t - 1.9) / .5) * cam.s / 10;
    fan(x, y - sz * .3, sz, spinV, a, clamp((t - 5.6) / 1.3) * (t < 7 ? 1 : 0));
  }
  { const a = win(t, 3.3, 6.2, .3); if (a > 0) { const [x, y] = PX(238, 3); ctx.globalAlpha = a; txt('Восточная часть', x, y - 40, 52, '#bfefff', 'R', '#2aa8ff', .6); txt('Тихого океана', x, y + 25, 52, '#bfefff', 'R', '#2aa8ff', .6); ctx.globalAlpha = 1; } }
  { const a = win(t, 7.0, 9.6, .3); if (a > 0) { const [x, y] = PX(255, 2); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.ellipse(x, y, 330, 190, -.18, -1.4, -1.4 + Math.PI * 2 * eout((t - 7) / .7)); ctx.stroke(); ctx.restore(); } }
  { const a = win(t, 10.2, 14.1, .3); if (a > 0) { ctx.save(); ctx.globalAlpha = a; const sc = back((t - 10.2) / .45); ctx.translate(W / 2, H * .36); ctx.scale(sc, sc);
      const sup = clamp((t - 12.5) / .3);

      if (sup > 0) { ctx.globalAlpha = a * sup; ctx.save(); ctx.translate(0, -140); const s2 = back((t - 12.5) / .4); ctx.scale(s2, s2); txt('Супер', 0, 0, 130, '#ffffff', 'R', '#ff2a2a', .55); ctx.restore(); }
      ctx.restore(); } }
  { const a = win(t, 18.2, 21.2, .35); if (a > 0) { const [x, y] = PX(205, 6); ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(-.07); txt('Пассаты', 0, 0, 96, '#ffffff', 'R', '#8fd8ff', .5); ctx.restore(); } }
  { const a = win(t, 19.8, 21.4, .3); if (a > 0) { ctx.save(); ctx.globalAlpha = a * .8; ctx.strokeStyle = '#e8f2f7'; ctx.fillStyle = '#e8f2f7'; ctx.lineWidth = 16; ctx.lineCap = 'round';
      for (const la of [-4, -10]) { const k = eout((t - 19.8) / .8), [x1, y1] = PX(255, la), [x2, y2] = PX(lerp(255, 165, k), la);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x2 - 30, y2); ctx.lineTo(x2 + 14, y2 - 30); ctx.lineTo(x2 + 14, y2 + 30); ctx.closePath(); ctx.fill(); }
      ctx.restore(); } }
  { const a = win(t, 21.3, 25.0, .4); for (const [l0, la, sz] of [[240, 4, 110], [225, -6, 90], [262, -2, 80]]) { const [x, y] = PX(l0 - (t - 21.3) * 6, la); emoji('⛵', x, y + Math.sin(t * 3 + la) * 6, sz, a); } }
  label('Индонезия', 117, 2, win(t, 26.4, 30.1, .3), 44); label('Австралия', 134, -24, win(t, 27.4, 30.1, .3), 44);
  { const a = win(t, 28.9, 30.4, .3); const [x, y] = PX(118, 8); emoji('🌧️', x, y - 30 + 8 * Math.sin(t * 2), 150, a * eout((t - 28.9) / .4)); }
  label('Эквадор', 281.5, -1.2, win(t, 31.4, 35.3, .3), 42); label('Перу', 284, -10, win(t, 30.7, 35.3, .3), 42);
  { const a = win(t, 34.2, 37.4, .3), [x, y] = PX(292, 4), [x2, y2] = PX(286, -13); emoji('☀️', x, y - 40, 140 * back((t - 34.2) / .4), a, t * .3); emoji('🏜️', x2, y2, 110 * back((t - 34.5) / .4), a); }
  { const a = win(t, 41.6, 43.9, .25); if (a > 0) { const vals = [[205, 3, 1.2, 41.7], [222, -4, 1.4, 41.9], [242, 2, 0.6, 42.0], [228, 6, 1.9, 42.3]];
      for (const [lo, la, v, t0] of vals) { const [x, y] = PX(lo, la); const k = clamp((t - t0) / .8); thermo(x, y, v * eout(k) + (t > 42.8 ? (v < 1 ? 1.6 : .6) * eout((t - 42.8) / .8) : 0), a * clamp((t - t0) / .2), 2.5, 1.1); } } }
  { // Canada / US / South America weather icons
    const a1 = win(t, 47.3, 53.1, .3); for (const [lo, la, d] of [[245, 58, 0], [262, 54, .3], [252, 50, .6]]) { const [x, y] = PX(lo, la); const k = clamp((t - 47.3 - d) / .4); emoji('🌤️', x, y, 105 * back(k), a1 * k); }
