const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const eob = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = (a, b = 0, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const U = h => { const [r, gg, b] = hex(h); return (255 << 24 | b << 16 | gg << 8 | r) >>> 0; };

let ID, P32;
function beginPx() { ID = g.createImageData(W, H); P32 = new Uint32Array(ID.data.buffer); }
function endPx() { g.putImageData(ID, 0, 0); }
const px = (x, y, u) => { if (x >= 0 && x < W && y >= 0 && y < H) P32[y * W + x] = u; };
// vertical dithered gradient through a list of colours
function gradV(y0, y1, cols) {
  const us = cols.map(U);
  for (let y = y0; y < y1; y++) {
    const f = (y - y0) / Math.max(1, y1 - y0 - 1) * (us.length - 1), i = Math.min(us.length - 2, Math.floor(f)), fr = f - i;
    for (let x = 0; x < W; x++) P32[y * W + x] = fr > BAY[(y & 3) * 4 + (x & 3)] ? us[i + 1] : us[i];
  }
}
const q = (t, fps = 12) => Math.floor(t * fps) / fps;   // retro step time

// sprites: strings + palette; s = size of one sprite pixel in low-res pixels

    if (keep && !keep(i, j)) continue;
    gx.fillStyle = pal[ch]; gx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s);

}

// ---------- hi-res text ----------
function px8(sz) { return `${sz}px PS2P`; }
function hudText(t, x, y, sz, col, align = 'center') {
  ctx.font = px8(sz); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(t, x + sz / 8 * 2, y + sz / 8 * 2);

}
// stepped (pixel) panel
function panel(x, y, w, h, fill = BR.navy, edge = BR.amber, a = 1, bw = 8) {
  ctx.save(); ctx.globalAlpha *= a;
  x = Math.round(x / 4) * 4; y = Math.round(y / 4) * 4; w = Math.round(w / 4) * 4; h = Math.round(h / 4) * 4;
  ctx.fillStyle = edge;
  ctx.fillRect(x + bw, y, w - 2 * bw, h); ctx.fillRect(x, y + bw, w, h - 2 * bw);
  ctx.fillStyle = fill;
  ctx.fillRect(x + bw, y + bw, w - 2 * bw, h - 2 * bw);
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(x + bw, y + bw, w - 2 * bw, 8);
  ctx.restore();
}
// date plaque that drops in from the top
function plaque(t, u, out = 99, y0 = 250) {
  if (u < 0 || u > out) return;
  const k = eob(clamp(u / .35)), ko = clamp((out - u) / .25);
  ctx.font = px8(34); const w = ctx.measureText(t).width + 80;

  hudText(t, OW / 2, y + 2, 34, BR.white);
  ctx.restore();
}

// ---------- photo card: pixelated, then sharp ----------
function pixPhoto(img, x, y, w, h, res, crop) {
  const [sx, sy, sw, sh] = crop || [0, 0, img.width, img.height];
  if (res >= 1) { ctx.imageSmoothingEnabled = true; ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h); return; }
  const rw = Math.max(4, Math.round(w * res)), rh = Math.max(4, Math.round(h * res));
  pc.width = rw; pc.height = rh; pg.imageSmoothingEnabled = true; pg.drawImage(img, sx, sy, sw, sh, 0, 0, rw, rh);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(pc, 0, 0, rw, rh, x, y, w, h); ctx.imageSmoothingEnabled = true;
}
const RES = [.02, .035, .06, .1, .18, .32, 1];
function resAt(k) { return RES[Math.min(RES.length - 1, Math.floor(clamp(k) * RES.length))]; }
function card(img, cx, cy, w, h, u, dur, title, sub, pop = 'drop') {
  if (!img || u < 0 || u > dur) return;
  const a = Math.min(clamp(u / .2), clamp((dur - u) / .3));
  const k = pop === 'drop' ? eob(clamp(u / .4)) : 1;
  const ww = w * (pop === 'pop' ? eob(clamp(u / .35)) : 1), hh = h * (pop === 'pop' ? eob(clamp(u / .35)) : 1);
  const x = cx - ww / 2, y = cy - hh / 2 - (1 - k) * 120;
  const res = u < 1.4 ? resAt(u / 1.4) : (u > dur - .5 ? resAt((dur - u) / .5) : 1);
  ctx.save(); ctx.globalAlpha = a;
  panel(x - 20, y - 20, ww + 40, hh + 150, BR.navy, BR.amber, 1, 8);
  const ar = img.width / img.height, br = ww / hh; let crop;
  if (ar > br) { const sw = img.height * br; crop = [(img.width - sw) / 2, 0, sw, img.height]; } else { const sh = img.width / br; crop = [0, 0, img.width, sh]; }
  pixPhoto(img, x, y, ww, hh, res, crop);
  hudText(title, cx, y + hh + 50, title.length > 14 ? Math.min(22, Math.floor((ww + 20) / title.length)) : 28, BR.amber);
  ctx.font = '500 34px MX'; ctx.fillStyle = BR.white; ctx.textAlign = 'center'; ctx.fillText(sub, cx, y + hh + 100);
  ctx.restore();
}

// ---------- mode-7 steppe ground (scenes 1 and 4) ----------
function ground(hz, scroll, pal, rivers, sway = 0) {
  const grassA = U(pal.a), grassB = U(pal.b), tuft = U(pal.t), water = U(pal.w), water2 = U(pal.w2), bank = U(pal.k);
  for (let y = hz; y < H; y++) {
    const dy = y - hz + 1, d = 900 / dy, z = d + scroll;
    const band = (Math.floor(z * .045) & 1);
    for (let x = 0; x < W; x++) {
      const wx = (x - W / 2 + sway) * d / 60;
      let col = band ? grassA : grassB;
      if (hash(Math.floor(wx * .9), Math.floor(z * .35)) > .93) col = tuft;
      if (rivers) for (const r of rivers) {
        const cx = r.x + r.a * Math.sin(z * .004 + r.p), dw = Math.abs(wx - cx);
        if (dw < r.w) col = (hash(Math.floor(wx), Math.floor(z * .2 + scroll * .02)) > .85) ? water2 : water;
        else if (dw < r.w + 3) col = bank;
      }
      P32[y * W + x] = col;
    }
  }
}

// scene 2: game map between the rivers
const MAPX = 15, MAPY = 120, CELL = 10, MCOLS = 24, MROWS = 28;
function riverX(r, row) { return r === 0 ? 3.2 + 1.6 * Math.sin(row * .35) + row * .06 : 19.6 + 1.3 * Math.sin(row * .3 + 1.5) - row * .04; }
SC.s2 = {
  draw(gx, u, d) {
    beginPx(); gradV(0, H, ['#0d0a2a', '#17104a']);
    // map frame
    const prog = clamp((u - .6) / (d - 1.6));
    const seeds = [[8, 6], [14, 11], [10, 17], [16, 20]];
    for (let r = 0; r < MROWS; r++) for (let cI = 0; cI < MCOLS; cI++) {
      const x0 = MAPX + cI * CELL, y0 = MAPY + r * CELL;
      let col;
      const l = riverX(0, r), rr = riverX(1, r);
      const sea = r >= 24 && (cI > 2 && cI < 22 - (r - 24));
      if (sea) col = (cI + r) % 2 ? '#2e64b0' : '#2a5ca4';
      else if (Math.abs(cI - l) < .9 || Math.abs(cI - rr) < .9) col = '#3d86d8';
      else if (cI < l || cI > rr) col = (cI + r) % 2 ? '#8a7a4a' : '#83734a';
      else {
        let near = 99; for (const [sx, sy] of seeds) near = Math.min(near, Math.hypot(cI - sx, (r - sy) * .9));
        const gray = near + hash(cI, r) * 2.5 < prog * 13;
        col = gray ? ((cI + r) % 2 ? '#8d8d96' : '#7e7e88') : ((cI + r) % 2 ? '#4caa4a' : '#43a043');
      }

      for (let y = 0; y < CELL; y++) for (let x = 0; x < CELL; x++) px(x0 + x, y0 + y, (x === CELL - 1 || y === CELL - 1) ? ue : uc);
    }
    endPx();
    // tiny yurts on the green and the khan's palace
    const yurt = (x, y, col) => { R(gx, x, y + 2, 6, 4, col); R(gx, x + 1, y, 4, 2, col); R(gx, x + 2, y + 3, 2, 3, '#3a2416'); };
    for (let i = 0; i < 9; i++) { const cI = 6 + Math.floor(hash(i, 9) * 11), r = 3 + Math.floor(hash(i, 4) * 19); yurt(MAPX + cI * CELL + 2, MAPY + r * CELL + 2, '#f1e6c8'); }
    R(gx, MAPX + 8 * CELL - 2, MAPY + 6 * CELL - 4, 14, 10, '#d9a441'); R(gx, MAPX + 8 * CELL + 2, MAPY + 6 * CELL - 9, 6, 5, '#d9a441'); R(gx, MAPX + 8 * CELL + 4, MAPY + 6 * CELL - 13, 2, 4, '#a8322c');
  },
  cam: () => ({ z: 1, x: W / 2, y: H / 2 }),
  hud(u, d) {
    const prog = clamp((u - .6) / (d - 1.6)), pct = Math.round(100 - prog * 88);

    const a = clamp(u / .3);
    ctx.save(); ctx.globalAlpha = a;
    panel(60, 150, 960, 150, 'rgba(19,11,84,.95)');
    const col = pct > 55 ? '#4caa4a' : pct > 30 ? BR.amber : BR.red;
