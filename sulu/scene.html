    const g = ctx.createLinearGradient(w - 120, 0, w, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(w - 120, 0, 120, H);
    ctx.fillStyle = '#fbf6ea'; ctx.fillRect(w - 6, 0, 12, H); ctx.restore();
  }
  // 4 -> 5: flash
  const fl = 1 - ap(t, M.s5, .35); if (s === 5 && fl > 0) { ctx.fillStyle = `rgba(255,250,235,${fl})`; ctx.fillRect(0, 0, W, H); }
  // 5 -> 6: panel goes dark
  if (s === 5) { const d = ap(t, M.s6 - .35, .35); if (d > 0) { ctx.fillStyle = `rgba(0,0,0,${d})`; ctx.fillRect(0, 0, W, H); } }
  if (s === 6) { const d = 1 - ap(t, M.s6, .35); if (d > 0) { ctx.fillStyle = `rgba(0,0,0,${d})`; ctx.fillRect(0, 0, W, H); }
    const f2 = 1 - ap(t, M.chn - .15, .3); if (t >= M.chn - .15 && f2 > 0) { ctx.fillStyle = `rgba(0,0,0,${f2})`; ctx.fillRect(0, 0, W, H); } }
  if (s >= 2 && s <= 6) panelFrame();
  captions(t);
  logo(t > END - 1.9 ? 0 : .82);
  endCard(t);
  ctx.restore();
};
