  ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 30; rr(ctx, -w / 2, -h / 2, w, h, 22); ctx.fillStyle = C.pill; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();

function card(x, y, w, h, a, edge = C.line) {

  ctx.shadowColor = 'transparent'; ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
const yearRun = (T, y0, y1, t0, t1) => Math.round(lerp(y0, y1, easeIO(seg(T, t0, t1))));
function campCount(T) {                                       // the 0/3 .. 3/3 counter
  const k = win2(T, M.three - .1, M.S12 - .1) * (inFilm(T) ? 0 : 1); if (k <= 0) return;
  const n = [M.karlag, M.step, M.alzh].filter(t => T >= t - .05).length, last = [M.three, M.karlag, M.step, M.alzh][n], pop = 1 + .15 * Math.sin(Math.PI * seg(T, last - .05, last + .3));
  ctx.save(); ctx.translate(108, 112); ctx.scale(pop, pop); ctx.globalAlpha = k; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 18;
  rr(ctx, -64, -40, 128, 80, 40); ctx.fillStyle = C.pill; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = rgba(C.warn, .8); ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha = k; txt(n + '/3', 108, 128, { size: 46, weight: 800, fam: 'IT', color: n ? C.acc : '#fff', shadow: 0 }); ctx.restore();
}
function hud(T) {
  // 1: the hook
  const h1 = win2(T, .5, M.S2 + .4, .5, .4);
  if (h1 > 0) { txt(L.gulag, W / 2, 470, { size: 150, weight: 900, fam: 'IT', color: C.warn, alpha: h1, ls: 10, sb: 34 }); tag(L.gulagSub, 560, h1 * ap(T, 1.0, .4), '#fff'); }
  // 2: three camps
  const t2 = win2(T, M.three - .1, M.S3 - .05);
  if (t2 > 0) { txt('3', W / 2 - 20, 470, { size: 170, weight: 900, fam: 'IT', color: C.acc, alpha: t2, sb: 30, align: 'right' }); txt(L.three, W / 2 + 6, 455, { size: 80, weight: 800, fam: 'IT', alpha: t2, align: 'left' }); }
  // 3: no way out
  const rn = win2(T, M.run - .1, M.S4 - .05); if (rn > 0) plate(L.run, W / 2, 380, 58, rn, { fill: C.warn, color: '#fff', pop: 1 });
  // 4: Karlag
  const kl = win2(T, M.karlag - .1, M.len - .1); if (kl > 0) plate(L.karlag, W / 2, 360, 76, kl, { fill: C.warn, color: '#fff', pop: 1, ls: 2 });
  // 5: deportations + the counter

  const mn = win2(T, M.mln - .2, M.S6 - .05);
  if (mn > 0) { const v = Math.round(1000000 * easeOut5(seg(T, M.mln - .1, M.mln + 1.1)) / 10000) * 10000; txt(fmt(v) + '+', W / 2, 520, { size: 130, weight: 900, fam: 'IT', color: C.acc, alpha: mn, sb: 30, ls: 2 });
    tag(L.mln.toUpperCase(), 600, mn, '#fff'); }
  // 6: Steplag, 1954, 40 days
  const st = win2(T, M.step - .1, M.y54 - .05); if (st > 0) plate(L.step, W / 2, 360, 76, st, { fill: C.warn, color: '#fff', pop: 1, ls: 2 });
  datePlate(L.y54, win2(T, M.y54 - .1, M.S7 - .05), 300, C.warn);
  const dd = win2(T, M.d40 - .2, M.S7 - .05);
  if (dd > 0) { const n = Math.round(40 * easeIO(seg(T, M.d40 - .1, M.d40 + 1.3))); txt(String(n), W / 2 - 14, 520, { size: 130, weight: 900, fam: 'IT', color: C.acc, alpha: dd, align: 'right', sb: 30 });
    txt(L.days, W / 2 + 4, 505, { size: 64, weight: 800, fam: 'IT', alpha: dd, align: 'left' }); }
  const tn = win2(T, M.tank - .1, M.S7 - .05); if (tn > 0) tag(L.tanks, 620, tn, C.warn);
  // 7: ALZhIR
  const az = win2(T, M.alzh - .1, M.S8 - .05); if (az > 0) plate(L.alz, W / 2, 360, 80, az, { fill: C.warn, color: '#fff', pop: 1, ls: 6 });
  // 9: Gulbahram
  const gk = win2(T, M.gul - .2, M.S10 - .05);
  if (gk > 0) { portrait(W / 2, 470, gk, T); plate(L.gul, W / 2, 660, 44, gk, { fill: C.card, color: '#fff', ls: 1, stroke: rgba(C.acc, .7) }); txt(L.gulSub, W / 2, 738, { size: 34, weight: 600, alpha: gk * ap(T, M.gul + .3, .3), color: 'rgba(255,255,255,.85)', sb: 12 }); }
  // 12: ҰБТ / ЕНТ
  const uk = win2(T, M.ubt - .15, M.S13 + .1);
  if (uk > 0) {
    plate(L.ubt, W / 2, 290, 66, uk, { pop: 1, ls: 6 });
    const q = ap(T, M.q - .1, .35) * uk, a = ap(T, M.ans - .1, .35) * uk, m = ap(T, M.may - .1, .35) * uk;
    if (q > 0) { card(W / 2, 470, 900, 180, q); txt(L.qL, W / 2, 432, { size: 30, weight: 800, ls: 6, color: C.acc, alpha: q, shadow: 0 }); txt(L.q, W / 2, 505, { size: 54, weight: 800, fam: 'IT', alpha: q, shadow: 0 }); }
    if (a > 0) { card(W / 2, 700, 900, 220, a, rgba('#3ddc84', .8)); txt(L.aL, W / 2, 640, { size: 30, weight: 800, ls: 6, color: '#3ddc84', alpha: a, shadow: 0 });
      L.a.forEach((s, i) => txt(s, W / 2, 706 + i * 60, { size: 46, weight: 800, fam: 'IT', color: C.acc, alpha: a, shadow: 0 })); }
    if (m > 0) { card(W / 2, 920, 900, 150, m); txt(L.may, W / 2, 908, { size: 54, weight: 900, fam: 'IT', color: C.acc, alpha: m, shadow: 0 }); txt(L.maySub, W / 2, 960, { size: 34, weight: 600, alpha: m, shadow: 0 }); }
  }
}
// 13: the arrow to the profile header
function finale(T) {
  const ar = ap(T, M.link - .4, .4); if (ar <= 0) return;
  const ay = 980 + 14 * Math.sin(T * 6.5), hh = 170; ctx.save(); ctx.globalAlpha = ar; ctx.strokeStyle = C.acc; ctx.lineWidth = 18; ctx.lineCap = ctx.lineJoin = 'round'; ctx.shadowColor = C.acc; ctx.shadowBlur = 26;
  ctx.beginPath(); ctx.moveTo(W / 2, ay + hh * .6); ctx.lineTo(W / 2, ay - hh * .6); ctx.moveTo(W / 2 - 70, ay - hh * .1); ctx.lineTo(W / 2, ay - hh * .65); ctx.lineTo(W / 2 + 70, ay - hh * .1); ctx.stroke(); ctx.restore();
  plate(L.link, W / 2, 1220, 54, ar, { pop: 1, ls: 2 });
}

// ---------------------------------------------------------------- the brand in the frame
const END0 = M.last + .55;
function logo() { ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(LOGO, W - 48 - LOGO.width, 48); ctx.restore(); }
function credit(T) { if (T < END0) txt(L.credit, W / 2, 1880, { size: 19, weight: 500, color: 'rgba(255,255,255,.42)', shadow: 0 }); }
function endCard(T) {
  const k = ease(seg(T, END0, END0 + .5)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, W, H);
  const s = lerp(.9, 1, easeOut(seg(T, END0, END0 + .8))), w = LOGO_BIG.width * s, h = LOGO_BIG.height * s, cy = 800;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO_BIG, W / 2 - w / 2, cy - h / 2, w, h); ctx.restore();
  const c = ap(T, END0 + .3, .4), d = ap(T, END0 + .5, .4);
  if (c > 0) txt(L.endA, W / 2, cy + 322 + (1 - c) * 12, { size: 66, weight: 800, fam: 'IT', color: C.acc, alpha: c, shadow: 0 });
  if (d > 0) txt(L.endB, W / 2, cy + 396 + (1 - d) * 12, { size: 40, weight: 600, color: 'rgba(255,255,255,.85)', alpha: d, shadow: 0 });
}

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, b: '#8fb6ff' };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });
const CH = CHUNKS.filter(Boolean);
function captions(T, y) {
  let i = -1; for (let k = 0; k < CH.length; k++) if (T >= CH[k].t0 - .07) i = k;
  if (i < 0) return; const c = CH[i], tEnd = Math.min(i + 1 < CH.length ? CH[i + 1].t0 - .07 : 1e9, c.t1 + .5);
  if (T > tEnd || T > END0) return;

  let tot = 0; its.forEach((it, k) => { tot += it.wd + (k < its.length - 1 && !it.w.g ? 17 : 0); });

    ctx.save(); ctx.translate(x + it.wd / 2, 0); ctx.scale(pop, pop); font(ctx, it.size, it.weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.globalAlpha = a * lerp(.4, 1, on); ctx.fillStyle = CAPCOL[it.w.c] || '#fff';
    ctx.fillText(it.s, 0, 0); ctx.shadowBlur = 5; ctx.fillText(it.s, 0, 0); ctx.restore();
    x += it.wd + (it.w.g ? 0 : 17);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- frame
const FLASH = [M.S4, M.S6, M.S7, M.S12];
async function render(T) {
  T = clamp(T, 0, END); T_NOW = T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    globeMat.uniforms.expo.value = lerp(.62, .82, seg(T, 0, 3)) * (1 + .5 * clamp((cam.lat - 47) / 10)) * (1 - .25 * win2(T, M.S12 + .2, M.S13 + .6, .6, .6)) * (1 - .3 * win2(T, M.kind + .2, M.S12 + 1, .8, .6));

window.render = render; window.setCamQ = c => { window.CAMQ = c; }; window.END = END; window.M = M;
