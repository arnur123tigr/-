// ---------- math ----------

  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = col; ctx.lineWidth = lw / s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-50, -40); ctx.quadraticCurveTo(-110, -70, -90, -130); ctx.moveTo(50, -40); ctx.quadraticCurveTo(110, -70, 90, -130); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-55, -45); ctx.quadraticCurveTo(0, -60, 55, -45); ctx.quadraticCurveTo(50, 40, 18, 90); ctx.lineTo(-18, 90); ctx.quadraticCurveTo(-50, 40, -55, -45); ctx.stroke();

function oxIdeo(x, y, s, col, lw = 12) {                    // ideogram: simplified, geometric

function scribe(x, y, s, T) {                                // flat Sumerian scribe (shaved head, kaunakes skirt) holding a tablet; (x,y) = feet

  ctx.fillStyle = SA2; for (let r = 0; r < 4; r++) for (let i = 0; i < 6; i++) { const yy = -210 + r * 58, xx = -95 - r * 9 + i * (38 + r * 3.5); ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 16, yy + 40, xx + 32, yy); ctx.fill(); }

  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(-26, -552, 30, 18, -.5, 0, 7); ctx.fill();
  ctx.fillStyle = NV; rr(-44, -526, 30, 10, 5); ctx.fill(); rr(14, -526, 30, 10, 5); ctx.fill();   // brows
  circ(-30, -500, 7, NV); circ(30, -500, 7, NV);
  ctx.strokeStyle = SKIN2; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14, -462); ctx.quadraticCurveTo(0, -454, 14, -462); ctx.stroke();
  ctx.save(); ctx.translate(95, -330); ctx.rotate(-.15); tablet(0, 0, 120, 150, { rows: 3, n: 4, sh: 6 }); ctx.restore();   // tablet in hand
  ctx.fillStyle = SKIN; circ(60, -290, 22, SKIN); circ(140, -290, 22, SKIN);

function ship(x, y, s, T) {                                  // flat Phoenician trading ship; (x,y) = waterline centre
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(T * 2.2) * .04);

function hourglass(x, y, s, f) {                             // f: 0..1 sand flow

    ctx.save(); scaleAt(900, 600, lk, .1); mug(900, 640, .55, T); ctx.restore();
    const pk = pop(T, M.loop + .3, .4); if (pk > 0) { ctx.save(); scaleAt(540, 790, pk); pill(L.loop, 540, 790, 40, TC, '#fff', { sh: 6 }); ctx.restore(); }
  }
}

// ---------- scene 8: quiz ----------
const CARD = { x: 110, y: 640, w: 860, h: 760 };
function scene8(T) {
  bgSand(T);
  const { x, y, w, h } = CARD, kIn = pop(T, M.s8 - .1, .5);
  ctx.save(); scaleAt(540, y + h / 2, kIn);
  box(x, y, w, h, 40, CR, 16);

  // little tablet in the corner
  tablet(x + w - 110, y + 90, 110, 130, { rows: 3, n: 4, sh: 6 });
  const kq = win(T, M.q - .15, .4);
  ctx.save(); ctx.globalAlpha = kq; L.q.forEach((s, i) => txt(s, x + w / 2, y + 220 + i * 80, fit(s, 66, w - 120), NV)); ctx.restore();

    txt(b, x + 172, yy + 2, 46, NV, { align: 'left' });

    ctx.restore();
  });

}

// ---------- scene 9: loop to the tablet + beer, arrow up ----------
function scene9(T) {
  bgSand(T);
  const k1 = pop(T, M.s9 + .2, .55), k2 = pop(T, M.s9 + .45, .5);

  ctx.save(); scaleAt(760, 1350, k2, .06); mug(760, 1360, .85, T); ctx.restore();
  const ka = pop(T, M.cta - .2, .5), bo = Math.abs(Math.sin((T - M.cta) * 6)) * 18;

// ---------- composition ----------
const SCN = [null, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const TR = { 2: 'slide', 3: 'fade', 4: 'fade', 5: 'up', 6: 'slide', 7: 'up', 8: 'slide', 9: 'slide' };
const DARK = { 2: 1, 3: 1, 5: 1, 7: 1 };
const st = k => k === 1 ? -1 : M['s' + k], en = k => k === 9 ? 1e9 : M['s' + (k + 1)] + .1;
function current(T) { let k = 1; for (let i = 2; i <= 9; i++) if (T >= M['s' + i] - .2) k = i; return k; }
function headline(T) {
  const k = current(T); if (k === 1 || T > B.end - 2.3) return;
  const id = 's' + k, t0 = M[id] + .2, o = k < 9 ? out(T, M['s' + (k + 1)] - .25, .2) : 1;
  const tx = L.h[id], f = fit(tx, 56, 760), a = pop(T, t0, .45) * o; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); scaleAt(470, 268, a);
  const wd = tw(tx, f) + 60; box(470 - wd / 2, 268 - 50, wd, 100, 50, DARK[k] ? BR.amber : NV, 8); txt(tx, 470, 271, f, DARK[k] ? NV : BR.amber);
  ctx.restore();
}
function captions(T) {
  if (T > B.end - 2.3) return;
  const cp = B.caps.find(x => T >= x.t0 && T < x.t1); if (!cp) return;
  const k = clamp((T - cp.t0) / .12);
  ctx.save(); let sz = 64; ctx.font = `${sz}px MB`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const words = cp.words.map(w => ({ ...w, t: w.w.toUpperCase() })), sp = 20;
  let wd = words.reduce((s, w) => s + ctx.measureText(w.t).width, 0) + sp * (words.length - 1);
  if (wd > 960) { sz = Math.floor(sz * 960 / wd); ctx.font = `${sz}px MB`; wd = words.reduce((s, w) => s + ctx.measureText(w.t).width, 0) + sp * (words.length - 1); }
  let x = OW / 2 - wd / 2; const y = 1700, s = .85 + .15 * eob(k);
  ctx.globalAlpha = k; ctx.translate(OW / 2, y); ctx.scale(s, s); ctx.translate(-OW / 2, -y); ctx.lineJoin = 'round';
  for (const w of words) {
    ctx.fillStyle = 'rgba(20,10,5,.5)'; ctx.fillText(w.t, x, y + 6);
    ctx.lineWidth = 12; ctx.strokeStyle = NV; ctx.strokeText(w.t, x, y);
    ctx.fillStyle = w.c === 'a' ? BR.amber : '#fff'; ctx.fillText(w.t, x, y);
    x += ctx.measureText(w.t).width + sp;
  }
  ctx.restore();
}
function logo(T) {
  const im = DARK[current(T)] ? IMG.logo : IMG.logoN, lh = 120, lw = lh * im.width / im.height;
  ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(im, OW - 44 - lw, 44, lw, lh); ctx.restore();
}
function endCard(T) {
  const t0 = B.end - 2.2; if (T < t0) return;
  const a = clamp((T - t0) / .35);
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, OW, OH);
  const lw = 440, lh = lw * IMG.logo.height / IMG.logo.width, s = .9 + .1 * eob(clamp((T - t0) / .45));
  ctx.drawImage(IMG.logo, OW / 2 - lw * s / 2, 700 - lh * s / 2, lw * s, lh * s);
  L.cta.forEach((t, i) => txt(t, OW / 2, 1080 + i * 84, fit(t, 62, 960), BR.amber));
  const bo = Math.sin(T * 6) * 10; ctx.fillStyle = BR.amber;
  ctx.beginPath(); ctx.moveTo(540, 1250 + bo); ctx.lineTo(610, 1330 + bo); ctx.lineTo(570, 1330 + bo); ctx.lineTo(570, 1420 + bo); ctx.lineTo(510, 1420 + bo); ctx.lineTo(510, 1330 + bo); ctx.lineTo(470, 1330 + bo); ctx.closePath(); ctx.fill();
  ctx.restore();
}
window.render = function (T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = SA; ctx.fillRect(0, 0, OW, OH);
  for (let k = 1; k <= 9; k++) {
    const s0 = st(k); if (T < s0 - .45 || T >= en(k)) continue;
    const kk = k === 1 ? 1 : ease(win(T, s0 - .45, .5)), tr = TR[k];
    ctx.save();
    if (tr === 'slide') ctx.translate(OW * (1 - kk), 0);
    else if (tr === 'up') ctx.translate(0, OH * (1 - kk));
    else if (tr === 'fade') ctx.globalAlpha = kk;
    SCN[k](T); ctx.restore();
  }
  headline(T); captions(T); logo(T); endCard(T);
  if (T < .15) { ctx.fillStyle = `rgba(242,215,166,${1 - T / .15})`; ctx.fillRect(0, 0, OW, OH); }
};

// ---------- load ----------
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
