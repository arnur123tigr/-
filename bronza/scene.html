// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const flick = (T, k) => 0.8 + 0.12 * Math.sin(T * 17 + k * 3.1) + 0.08 * Math.sin(T * 29.3 + k * 7.7);

const mats = {};
function mat(c, o = {}) {
  const k = c + JSON.stringify(o);
  if (!mats[k]) mats[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c, flatShading: true }, o));
  return mats[k];
}
const mesh = (geo, m) => new THREE.Mesh(geo, m);
function at(m, x, y, z, rx = 0, ry = 0, rz = 0) { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; }
const C = {
  skin: '#C98E62', skinD: '#A8714A', leather: '#7A5232', leatherD: '#5A3A22', wool: '#B9A27E', woolD: '#8E7A5A',
  wood: '#8A5A30', woodD: '#5E3B1E', black: '#151515', clay: '#B5723F', clayD: '#8A5230', stone: '#7D7A74', stoneD: '#5E5B57',
  mal: '#2FB57A', malD: '#1E8A5A', copper: '#D2672E', tin: '#AEB4BA', bronze: '#C8913A', gold: '#E2B23A'
};

// ---------- sky dome + lights ----------
const dome = mesh(new THREE.SphereGeometry(700, 16, 12), new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
dome.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(dome.geometry.attributes.position.count * 3), 3));
dome.renderOrder = -10; scene.add(dome);
scene.fog = new THREE.Fog('#DDE6DA', 60, 300);
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color(), _cc = new THREE.Color();
let skyKey = '';
function setSky(top, mid, hor) {
  scene.fog.color.set(hor);
  const key = top + mid + hor; if (key === skyKey) return; skyKey = key;
  _c1.set(top); _c2.set(mid); _c3.set(hor);
  const p = dome.geometry.attributes.position, c = dome.geometry.attributes.color;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 700;
    if (y > 0.25) _cc.copy(_c2).lerp(_c1, (y - 0.25) / 0.75); else if (y > 0) _cc.copy(_c3).lerp(_c2, y / 0.25); else _cc.copy(_c3);
    c.setXYZ(i, _cc.r, _cc.g, _cc.b);
  }
  c.needsUpdate = true;
}
const SKY = {
  day: ['#3A7CD0', '#86BCE6', '#E6E2C8'], dusk: ['#1E2350', '#7A4E62', '#E09A5E'], cave: ['#07051A', '#120B2E', '#1A1030'],
  studio: ['#05031A', '#0E0838', '#1A1246'], warm: ['#2A3F7A', '#B57A5E', '#F0C08A']
};
const hemi = new THREE.HemisphereLight('#E6F0FF', '#8C7A55', 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight('#FFF1D6', 2.2); sun.position.set(-40, 60, 30); scene.add(sun);
const rim = new THREE.DirectionalLight('#FEB300', 0); rim.position.set(20, 10, -30); scene.add(rim);
function plight(col, i, d) { const l = new THREE.PointLight(col, i, d, 1.4); scene.add(l); return l; }

// ---------- terrain ----------
function terrain(size, segs, hfn, colfn) {
  const g = new THREE.PlaneGeometry(size, size, segs, segs).rotateX(-Math.PI / 2).toNonIndexed();
  const p = g.attributes.position, col = new Float32Array(p.count * 3), cc = new THREE.Color();
  for (let i = 0; i < p.count; i++) p.setY(i, hfn(p.getX(i), p.getZ(i)));
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3, cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    cc.set(colfn(cx, cy, cz, hash(i * 0.37)));
    for (let k = 0; k < 3; k++) col.set([cc.r, cc.g, cc.b], (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  return mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
}
function scatter(grp, n, R, hfn, geo, cols, sc = 1, skip = () => false, seed = 0) {
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ flatShading: true }), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), cc = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const a = hash(i * 1.7 + seed) * Math.PI * 2, r = Math.sqrt(hash(i * 2.3 + seed + 5)) * R, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (skip(x, z)) { m4.makeScale(0, 0, 0); im.setMatrixAt(i, m4); im.setColorAt(i, cc.set('#000')); continue; }
    q.setFromEuler(new THREE.Euler(0, hash(i) * 6, 0)); const s = sc * (0.7 + hash(i * 5) * 0.7);
    m4.compose(V(x, hfn(x, z), z), q, V(s, s, s)); im.setMatrixAt(i, m4); im.setColorAt(i, cc.set(cols[i % cols.length]));
  }
  grp.add(im); return im;
}
const tuft = new THREE.ConeGeometry(0.16, 0.55, 3).translate(0, 0.27, 0);
const steppeCols = ['#B8B05A', '#A6A84E', '#C4B468', '#9FA34A', '#B3A956'];

// ---------- people ----------
function person(o) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const hips = new THREE.Group(); hips.position.y = 0.95; body.add(hips);
  const legs = [-1, 1].map(s => {
    const th = new THREE.Group(); th.position.set(s * 0.13, 0, 0); hips.add(th);
    th.add(at(mesh(new THREE.BoxGeometry(0.2, 0.48, 0.22), mat(o.legs)), 0, -0.24, 0));
    const sh = new THREE.Group(); sh.position.y = -0.48; th.add(sh);
    sh.add(at(mesh(new THREE.BoxGeometry(0.18, 0.44, 0.2), mat(o.legs)), 0, -0.22, 0));
    sh.add(at(mesh(new THREE.BoxGeometry(0.2, 0.12, 0.32), mat(o.shoes || C.leatherD)), 0, -0.43, 0.05));
    return { th, sh };
  });
  const torso = new THREE.Group(); hips.add(torso);
  torso.add(mesh(new THREE.CylinderGeometry(0.27, 0.34, 0.68, 6).translate(0, 0.34, 0), mat(o.coat)));
  torso.add(mesh(new THREE.CylinderGeometry(0.34, 0.4, 0.5, 6).translate(0, -0.25, 0), mat(o.coat)));
  if (o.belt) torso.add(at(mesh(new THREE.CylinderGeometry(0.33, 0.35, 0.09, 6), mat(o.belt)), 0, 0.05, 0));
  if (o.vest) torso.add(at(mesh(new THREE.CylinderGeometry(0.29, 0.355, 0.5, 6, 1, true), mat(o.vest, { side: THREE.DoubleSide })), 0, 0.42, 0));
  const arms = [-1, 1].map(s => {
    const sh = new THREE.Group(); sh.position.set(s * 0.33, 0.62, 0); torso.add(sh);
    sh.add(at(mesh(new THREE.BoxGeometry(0.16, 0.58, 0.17), mat(o.sleeve || o.coat)), 0, -0.28, 0));
    sh.add(at(mesh(new THREE.IcosahedronGeometry(0.085, 0), mat(o.skin)), 0, -0.62, 0));
    return { sh };
  });
  const head = new THREE.Group(); head.position.y = 0.76; torso.add(head);
  head.add(at(mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.12, 5), mat(o.skin)), 0, 0.02, 0));
  head.add(at(mesh(new THREE.SphereGeometry(0.2, 7, 5).scale(0.95, 1.05, 0.95), mat(o.skin)), 0, 0.24, 0));
  for (const s of [-1, 1]) head.add(at(mesh(new THREE.BoxGeometry(0.06, 0.035, 0.02), mat(C.black)), s * 0.075, 0.28, 0.185));
  head.add(at(mesh(new THREE.ConeGeometry(0.04, 0.08, 4).rotateX(Math.PI / 2), mat(o.skin)), 0, 0.22, 0.2));
  if (o.beard) head.add(at(mesh(new THREE.BoxGeometry(0.28, 0.14, 0.12).translate(0, -0.03, 0), mat(o.beard)), 0, 0.1, 0.13));
  if (o.hair) head.add(at(mesh(new THREE.SphereGeometry(0.215, 7, 4, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(o.hair)), 0, 0.27, -0.01));
  if (o.hat === 'cap') head.add(at(mesh(new THREE.ConeGeometry(0.22, 0.32, 6), mat(o.hatC || C.wool)), 0, 0.5, -0.02, -0.15));
  if (o.band) head.add(at(mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.06, 7), mat(o.band)), 0, 0.33, 0));
  const shd = mesh(new THREE.CircleGeometry(0.45, 10).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.28, depthWrite: false }));
  shd.position.y = 0.03; root.add(shd);
  return { root, body, hips, legs, torso, arms, head, shadow: shd };
}
function pose(p, q = {}) {
  p.root.visible = true;
  p.root.position.set(q.x || 0, q.y || 0, q.z || 0); p.root.rotation.set(0, q.ry || 0, 0);
  const sit = q.sit || 0, kneel = q.kneel || 0;
  p.body.position.y = (q.hop || 0) - sit * 0.42 - kneel * 0.45;
  p.torso.rotation.set(q.lean || 0, q.twist || 0, q.tilt || 0);
  for (const [i] of [[0], [1]]) {
    const L = i ? (q.legR || 0) : (q.legL || 0);
    const kn = i ? kneel : kneel * 0.5;
    p.legs[i].th.rotation.set(L - sit * 1.5 - kn * 1.5, 0, 0);
    p.legs[i].sh.rotation.set(Math.max(0, -L) * 1.2 + sit * 1.9 + kn * 2.1, 0, 0);
  }
  p.arms[0].sh.rotation.set(-(q.armL || 0), 0, -(q.armLout || 0) - 0.08);
  p.arms[1].sh.rotation.set(-(q.armR || 0), 0, (q.armRout || 0) + 0.08);
  p.head.rotation.set(q.headX || 0, q.headY || 0, 0);
  p.shadow.visible = q.shadow !== false;
}
const walkPose = (T, f = 7, a = 0.5) => ({ legL: Math.sin(T * f) * a, legR: -Math.sin(T * f) * a, armL: -Math.sin(T * f) * a * 0.6, armR: Math.sin(T * f) * a * 0.6, hop: Math.abs(Math.sin(T * f)) * 0.04 });
const people = [];
const coats = [C.leather, C.wool, '#8A6A42', C.woolD, '#6E4A2C', '#A08458'];
function worker(i, grp) {
  const p = person({ skin: hash(i) > 0.5 ? C.skin : C.skinD, coat: coats[i % coats.length], sleeve: coats[(i + 2) % coats.length], legs: i % 2 ? C.leatherD : '#6A5236', belt: '#3A2614', vest: i % 3 === 0 ? '#5E4A30' : null, beard: i % 3 === 1 ? '#2A1A10' : null, hair: '#1E140C', hat: i % 2 ? 'cap' : null, hatC: i % 4 === 1 ? '#C9B48A' : '#7A5A3A', band: i % 2 ? null : '#9A3A24' });

}

// ---------- animals ----------
function horse(col = '#8A4E26', dark = '#3A2414') {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  body.add(at(mesh(new THREE.BoxGeometry(0.72, 0.72, 1.9), mat(col)), 0, 1.36, 0));
  const neck = new THREE.Group(); neck.position.set(0, 1.5, 0.8); neck.rotation.x = 0.62; body.add(neck);
  neck.add(at(mesh(new THREE.BoxGeometry(0.3, 1.05, 0.46), mat(col)), 0, 0.48, 0));
  neck.add(at(mesh(new THREE.BoxGeometry(0.12, 1.0, 0.14), mat(dark)), 0, 0.5, -0.25));
  const head = new THREE.Group(); head.position.set(0, 0.95, 0); head.rotation.x = 0.28; neck.add(head);
  head.add(at(mesh(new THREE.BoxGeometry(0.32, 0.34, 0.78), mat(col)), 0, 0.02, 0.28));
  head.add(at(mesh(new THREE.BoxGeometry(0.26, 0.26, 0.2), mat(dark)), 0, -0.02, 0.7));
  for (const s of [-1, 1]) {
    head.add(at(mesh(new THREE.ConeGeometry(0.075, 0.3, 4), mat(col)), s * 0.1, 0.3, -0.02, -0.5, 0, s * 0.2));
    head.add(at(mesh(new THREE.BoxGeometry(0.02, 0.06, 0.07), mat(C.black)), s * 0.165, 0.08, 0.2));
  }
  const tail = mesh(new THREE.BoxGeometry(0.14, 0.9, 0.14).translate(0, -0.45, 0), mat(dark)); tail.position.set(0, 1.6, -0.95); tail.rotation.x = -0.35; body.add(tail);
  const legs = [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([sx, sz]) => {
    const th = new THREE.Group(); th.position.set(sx * 0.24, 1.05, sz * 0.72); body.add(th);
    th.add(at(mesh(new THREE.BoxGeometry(0.2, 0.52, 0.24), mat(col)), 0, -0.26, 0));
    const sh = new THREE.Group(); sh.position.y = -0.52; th.add(sh);
    sh.add(at(mesh(new THREE.BoxGeometry(0.13, 0.46, 0.15), mat(col)), 0, -0.23, 0));
    sh.add(at(mesh(new THREE.BoxGeometry(0.16, 0.08, 0.18), mat(C.black)), 0, -0.49, 0.01));
    return { th, sh, ph: (sx > 0 ? 0 : Math.PI) + (sz > 0 ? 0 : Math.PI / 2) };
  });

}
function horseAnim(h, T, amt = 1, f = 7) {
  h.legs.forEach(l => { const s = Math.sin(T * f + l.ph) * amt; l.th.rotation.x = s * 0.45; l.sh.rotation.x = Math.max(0, -Math.cos(T * f + l.ph)) * 0.7 * amt; });
  h.body.position.y = Math.abs(Math.sin(T * f)) * 0.05 * amt;
  h.neck.rotation.x = 0.62 + 0.06 * Math.sin(T * f * 0.5) * amt;

}
function cow(col, patch, i) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);

  if (patch) { body.add(at(mesh(new THREE.BoxGeometry(0.87, 0.5, 0.6), mat(patch)), 0, 1.15, 0.2 + hash(i) * 0.4 - 0.2)); body.add(at(mesh(new THREE.BoxGeometry(0.6, 0.82, 0.5), mat(patch)), 0.14, 1.06, -0.5)); }
  const head = new THREE.Group(); head.position.set(0, 1.2, 0.85); body.add(head);
  head.add(at(mesh(new THREE.BoxGeometry(0.42, 0.42, 0.55), mat(col)), 0, 0, 0.25));
  head.add(at(mesh(new THREE.BoxGeometry(0.36, 0.24, 0.18), mat('#D8A890')), 0, -0.1, 0.55));
  for (const s of [-1, 1]) {

    head.add(at(mesh(new THREE.BoxGeometry(0.2, 0.08, 0.1), mat(col)), s * 0.27, 0.08, 0.1));

  const legs = [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([sx, sz]) => { const l = at(mesh(new THREE.BoxGeometry(0.18, 0.68, 0.2).translate(0, -0.34, 0), mat(col)), sx * 0.27, 0.68, sz * 0.62); body.add(l); return l; });
  const tail = at(mesh(new THREE.BoxGeometry(0.06, 0.7, 0.06).translate(0, -0.35, 0), mat(col)), 0, 1.35, -0.85, -0.2); body.add(tail);

function chariot() {
  const root = new THREE.Group();
  const cart = new THREE.Group(); root.add(cart);
  cart.add(at(mesh(new THREE.BoxGeometry(1.1, 0.1, 0.85), mat(C.wood)), 0, 0.72, 0));
  for (const [x, z, w, d] of [[0, -0.42, 1.1, 0.06], [-0.54, 0, 0.06, 0.85], [0.54, 0, 0.06, 0.85]]) cart.add(at(mesh(new THREE.BoxGeometry(w, 0.5, d), mat(C.woodD)), x, 1.0, z));
  cart.add(at(mesh(new THREE.BoxGeometry(0.08, 0.08, 3.6), mat(C.woodD)), 0, 0.82, 2.0, -0.08));          // pole
  cart.add(at(mesh(new THREE.BoxGeometry(1.7, 0.08, 0.08), mat(C.woodD)), 0, 1.25, 3.55));                // yoke
  cart.add(at(mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.7, 5).rotateZ(Math.PI / 2), mat(C.woodD)), 0, 0.6, 0));
  const wheels = [-1, 1].map(s => {
    const w = new THREE.Group(); w.position.set(s * 0.78, 0.6, 0); cart.add(w);
    w.add(mesh(new THREE.TorusGeometry(0.56, 0.055, 4, 12).rotateY(Math.PI / 2), mat(C.woodD)));
    for (let k = 0; k < 10; k++) { const sp = mesh(new THREE.BoxGeometry(0.04, 1.08, 0.04), mat(C.wood)); sp.rotation.x = k * Math.PI / 10; w.add(sp); }
    w.add(mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 6).rotateZ(Math.PI / 2), mat(C.woodD)));
    return w;
  });
  const hs = [-1, 1].map(s => { const h = horse(s < 0 ? '#8A4E26' : '#B8875A', '#3A2414'); h.root.position.set(s * 0.45, 0, 3.6); root.add(h.root); return h; });
  const drv = worker(7, cart); drv.root.position.set(0, 0.77, -0.05);

// ---------- bronze axe (shaft-hole), basket ----------

  }

SC.s5 = (u, d, T) => {      // the mine grows; a mountain chart up to the XIII–XII c. BC peak
  mineLight(); const g = seg(u, 0.4, d - 0.6); mineLife(T, 6, g); mineCam(u * 0.6 + 2, d * 1.6, easeIO(seg(u, 0, d)));

// ===================================================================================
// frame: 3D -> low-res upscale + bloom + scanlines, then captions, logo, end card
// ===================================================================================
const ORDER = ['s1', 's2', 's3', 's4', 's5', 's6', 's7'];
const bloom = document.createElement('canvas'); bloom.width = LW / 3; bloom.height = LH / 3; const BL = bloom.getContext('2d');
function captions(T) {
  const cp = B.caps.find(x => T >= x.t0 && T < x.t1); if (!cp || T > B.end - 2.25) return;
  const k = clamp((T - cp.t0) / .12);
  O.save(); const words_ = cp.words.map(w => ({ ...w, t: w.w.toUpperCase() }));
  let sz = 74; O.font = `${sz}px MB`; const sp = 22;
  let tw = words_.reduce((s, w) => s + O.measureText(w.t).width, 0) + sp * (words_.length - 1);
  if (tw > 960) { sz = Math.floor(sz * 960 / tw); O.font = `${sz}px MB`; tw = words_.reduce((s, w) => s + O.measureText(w.t).width, 0) + sp * (words_.length - 1); }
  let x = W / 2 - tw / 2; const y = 1500 - (1 - k) * 18;
  O.globalAlpha = k; O.lineJoin = 'round'; O.textAlign = 'left'; O.textBaseline = 'middle';
  for (const w of words_) {
    O.lineWidth = 14; O.strokeStyle = 'rgba(10,6,40,.95)'; O.strokeText(w.t, x, y);
    O.fillStyle = w.c === 'a' ? BR.amber : BR.white; O.fillText(w.t, x, y); x += O.measureText(w.t).width + sp;
  }
  O.restore();
}
function endCard(T) {
  const t0 = B.end - 2.2; if (T < t0) return;
  const a = clamp((T - t0) / .3);
  O.save(); O.globalAlpha = a; O.fillStyle = BR.navy; O.fillRect(0, 0, W, H);
  const lw = 420, lh = lw * IMG.logo.height / IMG.logo.width, s = .9 + .1 * back(clamp((T - t0) / .4));
  O.drawImage(IMG.logo, W / 2 - lw * s / 2, 700 - lh * s / 2, lw * s, lh * s);
  O.font = '64px MB'; O.fillStyle = BR.amber; O.textAlign = 'center'; O.textBaseline = 'middle';
  TX.cta.forEach((t, i) => { fitFont(t, 64, W - 120); O.fillText(t, W / 2, 1080 + i * 86); });
  const b = Math.sin(T * 6) * 10; O.beginPath(); O.moveTo(W / 2, 1290 + b); O.lineTo(W / 2 - 50, 1360 + b); O.lineTo(W / 2 + 50, 1360 + b); O.fill(); O.fillRect(W / 2 - 14, 1356 + b, 28, 70);
  O.restore();
}
function logo() { const lh = 70, lw = lh * IMG.logo.width / IMG.logo.height; O.save(); O.globalAlpha = .82; O.drawImage(IMG.logo, W - 48 - lw, 48, lw, lh); O.restore(); }
function sceneAt(T) { let i = 0; for (let k = 0; k < ORDER.length; k++) if (T >= M[ORDER[k]]) i = k; return ORDER[i]; }
window.render = function (T) {
  const id = sceneAt(T), nx = ORDER[ORDER.indexOf(id) + 1], u = T - M[id], d = (nx ? M[nx] : B.end) - M[id];
  reset();
  const overlay = SC[id](u, d, T);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  O.imageSmoothingEnabled = true; O.imageSmoothingQuality = 'low';
  O.globalAlpha = 1; O.drawImage(glc, 0, 0, W, H);
  BL.globalCompositeOperation = 'copy'; BL.filter = 'blur(3px) brightness(1.1)'; BL.drawImage(glc, 0, 0, bloom.width, bloom.height); BL.filter = 'none';
  O.globalCompositeOperation = 'screen'; O.globalAlpha = 0.24; O.drawImage(bloom, 0, 0, W, H); O.globalAlpha = 1; O.globalCompositeOperation = 'source-over';
  O.fillStyle = 'rgba(0,0,0,0.05)'; for (let y = (Math.floor(T * 30) % 2) * 2; y < H; y += 4) O.fillRect(0, y, W, 2);
  const vg = O.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.72); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  O.fillStyle = vg; O.fillRect(0, 0, W, H);
  overlay && overlay();
  captions(T); logo(); endCard(T);
};
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
(async () => {
  B = (await (await fetch('beats.json')).json())[LANG]; M = B.m;
  [IMG.logo, IMG.dagger, IMG.pot] = await Promise.all(['brand/logo_white_transparent.png', 'photos/dagger.jpg', 'photos/pot.jpg'].map(load));
  try { const cr = await (await fetch('photos/credits.json')).json(); IMG.daggerCredit = cr.dagger; IMG.potCredit = cr.pot; } catch (e) { }
  await Promise.all(['74px MB', '40px MX'].map(f => document.fonts.load(f, 'АӘҒҚҢӨҰҮІ')));
  render(0);
  window.ready = true;
})();
