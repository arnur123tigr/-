// World: island centred at (0,0,-8), palace front faces +z (the sea),

import * as THREE from 'three';

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- materials ----------
const mats = {};
function mat(c, o = {}) {
  const k = c + JSON.stringify(o);

  return mats[k];
}
function mesh(geo, m) { return new THREE.Mesh(geo, m); }

}

const C = {

  trunk: '#8A5E34', leaf: '#3E9B35', leafD: '#2C7A2A', red: '#D3262A', gold: '#E8B33A', navy: '#1B2A55',

  sea: '#1C8FB8', lagoon: '#47D1C9', smoke: '#5B5B5B', brownD: '#4A2E18', beige: '#E6D7B5', silver: '#C9CED4'

// ---------- sky, fog, light ----------
const sky = canvasTex(8, 256, (c, w, h) => {

}, false);
scene.background = sky;

const hemi = new THREE.HemisphereLight('#E6F3FF', '#8C7A55', 1.15); scene.add(hemi);

// ---------- sea ----------
const seaGeo = new THREE.PlaneGeometry(420, 420, 70, 70).rotateX(-Math.PI / 2);
const sea = mesh(seaGeo, mat(C.sea)); sea.position.y = -0.1; scene.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();
function waves(T) {
  const p = seaGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {

}
const lagoon = mesh(new THREE.CircleGeometry(21, 14).rotateX(-Math.PI / 2), mat(C.lagoon)); lagoon.position.set(0, 0.04, -8); scene.add(lagoon);

// ---------- island ----------
const island = new THREE.Group(); island.position.set(0, 0, -8); scene.add(island);
{
  const g = new THREE.CylinderGeometry(15, 16.5, 1.2, 14, 1); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = 1 + 0.07 * Math.sin(Math.atan2(p.getZ(i), p.getX(i)) * 5); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); }
  const sand = mesh(g.translate(0, 0.2, 0), mat(C.sand)); island.add(sand);
  const g2 = new THREE.CylinderGeometry(11, 12, 0.3, 11).translate(0, 0.92, -1.5); island.add(mesh(g2, mat(C.grass)));

const TOPY = 0.8;
function palm(x, z, h = 4, lean = 0.2, ry = 0) {

  let y = 0, dx = 0; const n = 5;

    dx = Math.sin(lean) * (i + 0.5) * h / n * (i / n) * 1.6;
    s.position.set(dx, y + h / n / 2, 0); s.rotation.z = -lean * i / n; g.add(s); y += h / n * 0.98;
  }
  const top = new THREE.Group(); top.position.set(dx, y, 0); g.add(top);
  for (let k = 0; k < 7; k++) {
    const lf = mesh(new THREE.ConeGeometry(0.55, 2.6, 3).rotateZ(-Math.PI / 2).translate(1.3, 0, 0).scale(1, 0.25, 1), mat(k % 2 ? C.leaf : C.leafD));
    lf.rotation.set(0, k / 7 * Math.PI * 2, -0.45); top.add(lf);
  }
  const nut = mesh(new THREE.IcosahedronGeometry(0.18, 0), mat(C.brownD)); nut.position.set(0.15, -0.2, 0.1); top.add(nut);
  g.userData.top = top;

}
const palms = [[-9, 3, 4.2, 0.3, 0.4], [-11, -2, 3.6, 0.2, 1.4], [-7, 5.5, 3.2, 0.35, -0.5], [8.5, 4, 4.4, 0.3, 2.6], [11, -1, 3.8, 0.2, 3.3],
  [9.5, 7, 3.0, 0.4, 2.2], [-4, -6, 4.0, 0.15, 0.9], [5, -7, 4.2, 0.2, 2.0], [-12.5, 6, 3.4, 0.4, 0], [12, 3.5, 3.5, 0.35, 3.0]].map(a => palm(...a));

// ---------- palace ----------
const palace = new THREE.Group(); palace.position.set(0, TOPY, -2); island.add(palace); // world: (0,0.8,-10)

    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {

      if (door && r === rows - 1 && k === Math.floor(cols / 2)) { c.fillStyle = '#5A3A1E'; c.fillRect(cx - aw * 0.7, cy - ah * 0.7, aw * 1.4, ah * 1.2); continue; }
      c.fillStyle = '#2E3A48'; c.fillRect(cx - aw / 2, cy - ah / 2 + aw / 2, aw, ah - aw / 2);
      c.beginPath(); c.arc(cx, cy - ah / 2 + aw / 2, aw / 2, Math.PI, 0); c.fill();
    }
    c.fillStyle = '#C9C0AC'; c.fillRect(0, h - 1, w, 1);
  });
}
function block(w, h, d, tex, x, y, z) {
  const ms = [mat(C.wallSh), mat(C.wallSh), mat(C.white), mat(C.white), texMat(tex), texMat(tex)];
  const b = mesh(new THREE.BoxGeometry(w, h, d), ms); b.position.set(x, y + h / 2, z); palace.add(b); return b;
}
block(13, 3.4, 5.5, wallTex(7, 2, true), 0, 0, 0);
block(9.5, 2.8, 4.2, wallTex(5, 1), 0, 3.4, -0.3);
// balcony band + crenellations

for (let i = -6; i <= 6; i++) { const m = mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), mat(C.white)); m.position.set(i, 3.8, 2.75); palace.add(m); }
for (let i = -4; i <= 4; i++) { const m = mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), mat(C.white)); m.position.set(i, 6.45, 1.8); palace.add(m); }
// pillars on the front

palace.add(place(mesh(new THREE.BoxGeometry(13.4, 0.3, 1.2), mat(C.white)), { position: V(0, 3.3, 2.9) }));
// side back door (left wall) for Khalid's escape
const sideDoor = mesh(new THREE.BoxGeometry(0.1, 1.9, 1.1), mat('#5A3A1E')); sideDoor.position.set(-6.53, 0.95, -1.3); palace.add(sideDoor);
// clock tower
const tower = new THREE.Group(); tower.position.set(5.0, 0, -0.6); palace.add(tower);
tower.add(place(mesh(new THREE.BoxGeometry(2.4, 10.5, 2.4), [mat(C.white), mat(C.white), mat(C.white), mat(C.white), texMat(wallTex(1, 4)), mat(C.white)]), { position: V(0, 5.25, 0) }));
tower.add(place(mesh(new THREE.BoxGeometry(2.8, 0.35, 2.8), mat(C.wallSh)), { position: V(0, 10.6, 0) }));
tower.add(place(mesh(new THREE.BoxGeometry(2.1, 1.8, 2.1), mat(C.white)), { position: V(0, 11.65, 0) }));
tower.add(place(mesh(new THREE.ConeGeometry(1.75, 1.8, 4).rotateY(Math.PI / 4), mat('#3F6E5A')), { position: V(0, 13.45, 0) }));
const clockTex = canvasTex(64, 64, (c, w, h) => {
  c.fillStyle = '#FBF6E8'; c.beginPath(); c.arc(32, 32, 31, 0, 7); c.fill();
  c.strokeStyle = '#1A1A1A'; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#1A1A1A';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; c.fillRect(32 + Math.sin(a) * 25 - 2, 32 - Math.cos(a) * 25 - 2, i % 3 ? 3 : 5, i % 3 ? 3 : 5); }
});
const clock = new THREE.Group(); clock.position.set(0, 9.0, 1.22); tower.add(clock);
clock.add(mesh(new THREE.CircleGeometry(0.95, 16), texMat(clockTex)));
const ring = mesh(new THREE.TorusGeometry(0.97, 0.08, 4, 16), mat(C.gold)); clock.add(ring);
const hourH = new THREE.Group(), minH = new THREE.Group(); clock.add(hourH, minH);
hourH.add(place(mesh(new THREE.BoxGeometry(0.11, 0.5, 0.04), mat(C.black)), { position: V(0, 0.22, 0.04) }));
minH.add(place(mesh(new THREE.BoxGeometry(0.07, 0.8, 0.04), mat(C.black)), { position: V(0, 0.36, 0.07) }));
function setClock(h, m) { hourH.rotation.z = -((h % 12) + m / 60) / 12 * Math.PI * 2; minH.rotation.z = -(m / 60) * Math.PI * 2; }
// scorch marks after the shelling
const scorch = [];
[[-3.5, 1.6, 2.78, 1.4], [2.2, 4.6, 1.82, 1.1], [-1, 2.4, 2.78, 1.0], [4.6, 7.0, 0.62, 0.9]].forEach(([x, y, z, s], i) => {
  const m = mesh(new THREE.CircleGeometry(s, 7), new THREE.MeshBasicMaterial({ color: '#2A2420', transparent: true, opacity: 0.85, depthWrite: false }));
  m.position.set(x, y, z + 0.02 + i * 0.002); palace.add(m); scorch.push(m);
});
// flag on the palace roof
const flagPoleTop = 4.0;
const flagRoot = new THREE.Group(); flagRoot.position.set(-3, 6.2, -0.3); palace.add(flagRoot);
flagRoot.add(place(mesh(new THREE.CylinderGeometry(0.06, 0.08, flagPoleTop, 5), mat(C.greyL)), { position: V(0, flagPoleTop / 2, 0) }));
flagRoot.add(place(mesh(new THREE.IcosahedronGeometry(0.13, 0), mat(C.gold)), { position: V(0, flagPoleTop + 0.08, 0) }));
function makeFlag(w = 1.7, h = 1.05) {
  const g = new THREE.PlaneGeometry(w, h, 6, 2).translate(w / 2, -h / 2, 0);
  const m = mesh(g, new THREE.MeshLambertMaterial({ color: C.red, side: THREE.DoubleSide, flatShading: true }));
  m.userData.base = g.attributes.position.array.slice(); return m;
}
function waveFlag(f, T, amp = 1) {
  const p = f.geometry.attributes.position, b = f.userData.base;
  for (let i = 0; i < p.count; i++) { const x = b[i * 3]; p.setZ(i, amp * 0.16 * x * Math.sin(x * 3.2 - T * 7)); }
  p.needsUpdate = true;
}
const flag = makeFlag(); flagRoot.add(flag);
function setFlag(k, T) { flag.position.y = lerp(0.9, flagPoleTop - 0.05, k); waveFlag(flag, T); }

// ---------- people ----------
function person(o) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const hips = new THREE.Group(); hips.position.y = 0.95; body.add(hips);
  const legs = [-1, 1].map(s => {
    const th = new THREE.Group(); th.position.set(s * 0.13, 0, 0); hips.add(th);
    th.add(place(mesh(new THREE.BoxGeometry(0.2, 0.48, 0.22), mat(o.legs)), { position: V(0, -0.24, 0) }));
    const sh = new THREE.Group(); sh.position.y = -0.48; th.add(sh);
    sh.add(place(mesh(new THREE.BoxGeometry(0.18, 0.44, 0.2), mat(o.legs)), { position: V(0, -0.22, 0) }));
    sh.add(place(mesh(new THREE.BoxGeometry(0.2, 0.09, 0.32), mat(o.shoes)), { position: V(0, -0.44, 0.05) }));
    return { th, sh };
  });

  const tg = new THREE.CylinderGeometry(0.27, o.robe ? 0.36 : 0.25, 0.68, 6).translate(0, 0.34, 0);
  torso.add(mesh(tg, mat(o.coat)));

  for (const s of [-1, 1]) {

    head.add(place(mesh(new THREE.BoxGeometry(0.08, 0.02, 0.02), mat(o.brow || C.black)), { position: V(s * 0.075, 0.33, 0.18) }));

  head.add(place(mesh(new THREE.ConeGeometry(0.04, 0.09, 4).rotateX(Math.PI / 2), mat(o.skin)), { position: V(0, 0.22, 0.2) }));

function pose(p, q = {}) {

  p.legs[0].th.rotation.set((q.legL || 0) - sit * 1.5, 0, 0); p.legs[1].th.rotation.set((q.legR || 0) - sit * 1.5, 0, 0);
  p.legs[0].sh.rotation.set(Math.max(0, -(q.legL || 0)) * 1.2 + sit * 1.5, 0, 0); p.legs[1].sh.rotation.set(Math.max(0, -(q.legR || 0)) * 1.2 + sit * 1.5, 0, 0);
  p.arms[0].sh.rotation.set(-(q.armL || 0), 0, -(q.armLout || 0) - 0.08);
  p.arms[1].sh.rotation.set(-(q.armR || 0), 0, (q.armRout || 0) + 0.08);
  p.head.rotation.set(q.headX || 0, q.headY || 0, q.headZ || 0);
