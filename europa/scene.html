<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:540px;height:960px;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
// «Регионы Европы» — RU remake, voice «Арнур». Times = voice beats (beats.json) + OFF.
const OFF = .3;
let B = {}, SH = null, CAPS = [], END = 125;
const V = k => B[k] + OFF;
TEX.push({ k: 'world', l0: -180, l1: 180, b0: -90, b1: 90 });
TEX.push({ k: 'europa', l0: -30, l1: 70, b0: 30, b1: 74, minppd: 12 });
const C = { west: '#4f8cff', east: '#E8502F', cent: '#9F8CF0', balt: '#F08A4B', balk: '#7fe08a', south: '#FEB300', scand: '#FEB300', nord: '#4FD1C5', eu: '#FEB300' };
const WEST = 'PRT ESP AND FRA BEL NLD LUX GBR IRL DEU CHE LIE AUT ITA SMR MLT'.split(' ');
const EASTB = 'POL CZE SVK HUN ROU BGR EST LVA LTU BLR UKR MDA RUS_EU'.split(' ');
const WESTB = 'PRT ESP FRA BEL NLD LUX GBR IRL DEU CHE AUT ITA DNK NOR GRC ISL TUR'.split(' ');
const BALK = 'ALB BIH BGR HRV KOS MNE MKD SRB SVN GRC'.split(' ');
const CURT = [[14.2, 54.0], [13.9, 53.3], [11.3, 53.1], [10.7, 52.2], [10.1, 51.0], [11.3, 50.4], [12.3, 50.2], [13.0, 49.4], [13.8, 48.7], [15.0, 48.9], [16.9, 48.6], [17.1, 48.0], [16.5, 47.5], [16.1, 46.9], [16.3, 46.4], [15.2, 45.9], [13.8, 45.6]];
</script>
<script src="helpers.js"></script>
<script>
const fill = (rings, col, a, o) => glowFill(rings, col, a, Object.assign({ fill: .6, lw: 3.5, blur: 18 }, o || {}));
const fillC = (list, col, a, o) => list.forEach(k => fill(SH[k], col, a, o));
function dashed(rings, a, col = '#fff') {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([18, 14]); ctx.lineDashOffset = -performance.now() * 0; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
  for (const r of rings) { pathRings([r]); ctx.stroke(); } ctx.restore();
}
function strokeC(k, a, col = '#fff', lw = 6) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.lineJoin = 'round'; for (const r of SH[k]) { pathRings([r]); ctx.stroke(); } ctx.restore(); }
function badge(s, x, y, r, a, col) {   // round emblem with short text
  if (a <= 0) return; const p = back(clamp(a * 1.3)); ctx.save(); ctx.globalAlpha = clamp(a * 2); ctx.translate(x, y); ctx.scale(p, p);
  ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, 7); const g = ctx.createRadialGradient(0, 0, r * .6, 0, 0, r * 1.5); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha *= .55; ctx.fillStyle = g; ctx.fill(); ctx.globalAlpha /= .55;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke();

}
let CAMK = [];

    [V('slav') + .7, 30, 52, 36], [V('but') - .1, 30, 52, 38, 'l'],

    [V('balt2') + .7, 23.5, 57, 84], [V('balk2') - .1, 23.5, 57, 88, 'l'],
    [V('balk2') + .7, 20.5, 43, 84], [V('south') - .1, 20.5, 43, 87, 'l'],

    [V('north') + .7, 14, 61, 40], [V('broad') - .1, 14, 61, 42, 'l'],

}
function render(t) {
  CAM = camAt(CAMK, t);
  drawMap(); vignette(.45);
  if (CAM.ppd > 12) { ctx.save(); ctx.globalAlpha = .3; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; for (const r of SH.borders) { pathRings([r]); ctx.stroke(); } ctx.restore(); }
  const A = (a, b, f = .3) => win(t, V(a), V(b), f);
  const pulse = .85 + .15 * Math.sin(t * 5);
  // 1. intro questions

    fillC(WEST, C.west, A('west', 'scand', .25) * pulse); fillC(EASTB, C.east, A('east', 'scand', .25) * pulse);
    label2(['Западная'], 4, 47, A('west', 'scand', .25), C.west, 48); label2(['Восточная'], 32, 52, A('east', 'scand', .25), C.east, 48);
    fillC(['NOR', 'SWE', 'DNK'], C.scand, A('scand', 'go', .25) * pulse); fillC(['FIN', 'ISL'], C.nord, A('nord', 'go', .25) * pulse);
    fillC(['EST', 'LVA', 'LTU'], C.balt, A('balt', 'go', .25) * pulse); fillC(BALK, C.balk, A('balk', 'go', .25) * pulse);
    head('Западная или Восточная?', A('west', 'scand', .2), '#ffffff', H * .15, 80);
    head('Скандинавия? Прибалтика?', A('scand', 'balk', .2), BR.acc, H * .15, 76); head('А Балканы?', A('balk', 'go', .2), C.balk, H * .15, 96);
    head('Давай разберёмся!', A('go', 'eur', .2), BR.acc, H * .15, 92); }
  // 2. borders of Europe
  { const a = A('eur', 'part', .4); fill(SH.EUROPE, C.eu, a * pulse * (1 - .5 * A('bound', 'part', .4)), { fill: .32, lw: 4, blur: 22 });
    head('Где кончается Европа?', A('eur', 'bound', .25), BR.acc, H * .14, 84);
    label2(['Атлантический', 'океан'], -21, 47, A('atl', 'bound', .3), '#7fd3ff', 44); label2(['Россия'], 44, 57, A('rus', 'bound', .3), '#ffffff', 52);
    polyPartial(SH.URAL_MTS, ap(t, V('urm') - .2, 1.0), { col: BR.red, lw: 8, glow: BR.red, a: A('urm', 'part', .3) });
    polyPartial(SH.URAL_RIV, ap(t, V('urr') - .1, 1.2), { col: '#5ad1ff', lw: 7, glow: '#5ad1ff', a: A('urr', 'part', .3) });
    cp(t, 'Уральские горы', 64.5, 60.5, 'urm', 'part', BR.red, 40); cp(t, 'река Урал', 56.5, 50.3, 'urr', 'part', '#5ad1ff', 38);
    fill(SH.KAZ, '#4FD1C5', A('kaz', 'casp', .3) * pulse, { fill: .35 }); fill(SH.KAZ_EU, C.eu, A('kaz', 'casp', .3) * pulse, { fill: .7 });
    cp(t, 'Казахстан', 67, 48, 'kaz', 'casp', '#4FD1C5', 46);
    cp(t, 'Каспийское море', 50.6, 41.8, 'casp', 'part', '#5ad1ff', 36);
    polyPartial(SH.CAUC, ap(t, V('cauc') - .2, .8), { col: BR.red, lw: 8, glow: BR.red, a: A('cauc', 'part', .3) }); cp(t, 'Кавказские горы', 43, 44.8, 'cauc', 'part', BR.red, 36);
    pin(t, 'Босфор', 29.05, 41.15, -150, -120, 'bosp', 'part', BR.acc, 38);
    fill(SH.TUR, '#ffffff', A('tur', 'part', .3) * .7, { fill: .2, lw: 3 }); fill(SH.TUR_EU, C.eu, A('tur', 'part', .3) * pulse, { fill: .8 }); cp(t, 'Турция', 35, 39, 'tur', 'part', '#ffffff', 42); }
  // 3. part of the world vs continent
  { const a = A('part', 'cold', .4); fill(SH.EURASIA, '#ffffff', a * ap(t, V('eura') - .3, .4) * pulse, { fill: .22, lw: 4, blur: 20 }); fill(SH.EUROPE, C.eu, a * pulse, { fill: .5 });
    head('Часть света — Европа', A('part', 'eura', .25), C.eu, H * .15, 84); head('Материк — Евразия', A('eura', 'cold', .25), '#ffffff', H * .15, 88);
    label2(['ЕВРАЗИЯ'], 90, 50, a * ap(t, V('eura'), .3), '#ffffff', 70); }
  // 4. Cold War & the Iron Curtain
  { const a = A('cold', 'today', .4); fillC(WESTB, C.west, a * pulse, { fill: .55 }); fillC(EASTB, C.east, a * pulse, { fill: .55 });
    head('Холодная война', A('cold', 'curt', .25), '#ffffff', H * .14, 92);
    const ca = A('curt', 'today', .3); polyPartial(CURT, ap(t, V('curt') - .3, 1.2), { col: '#fff', lw: 9, glow: '#ffd9a0', blur: 26, a: ca });
    head('«Железный занавес»', A('curt', 'today', .25), BR.acc, H * .14, 88);
    badge('США', ...P(-6, 46.5), 58, A('ideo', 'today', .25), C.west); badge('СССР', ...P(36, 54.5), 58, A('ideo', 'today', .25), C.east); }
  // 5. Western Europe today
  { head('Чёткой границы нет', A('today', 'hist', .25), '#ffffff', H * .14, 86);
    const a = A('hist', 'slav', .35); fillC(WEST, C.west, a * pulse, { fill: .55 }); head('Западная Европа', a, C.west, H * .14, 92);
    strokeC('DEU', A('deu', 'slav', .25), '#fff'); strokeC('AUT', A('aut', 'slav', .25), '#fff'); strokeC('ITA', A('ita', 'slav', .25), '#fff');
    cp(t, 'Германия', 10.4, 51.2, 'deu', 'slav', C.west, 38); cp(t, 'Австрия', 14.6, 47.6, 'aut', 'slav', C.west, 34); cp(t, 'Италия', 12.5, 42.5, 'ita', 'slav', C.west, 38); }
  // 6. Slavic East
  { const a = A('slav', 'but', .35); head('Восточная Европа', a, C.east, H * .14, 92); pill('в основном славянские страны', W / 2, H * .14 + 100, 40, a, { line: C.east });
    [['POL', 'pol', 'Польша', 19.3, 52.1], ['CZE', 'cze', 'Чехия', 15.4, 49.8], ['SVK', 'svk', 'Словакия', 19.6, 48.7], ['UKR', 'ukr', 'Украина', 31.5, 49], ['BLR', 'blr', 'Беларусь', 28, 53.5], ['RUS_EU', 'rus2', 'Россия', 42, 56]]
      .forEach(([k, b, n, lon, lat]) => { fill(SH[k], C.east, A(b, 'but', .25) * pulse); cp(t, n, lon, lat, b, 'but', C.east, 34); }); }
  // 7. Central Europe
  { const a = A('but', 'balt2', .35); fillC(['POL', 'CZE', 'SVK', 'HUN'], C.cent, a * pulse, { fill: .62 });
    [['Польша', 19.3, 52.1], ['Чехия', 15.4, 49.8], ['Словакия', 19.6, 48.7], ['Венгрия', 19.4, 47.1]].forEach(([n, lon, lat]) => { const [x, y] = P(lon, lat); pill(n, x, y, 38, a, { line: C.cent }); });
    const [x0, y0] = P(19, 50), [x1, y1] = P(5, 50.5); arrow(x0, y0, x1, y1, (x0 + x1) / 2, y0 - 160, ap(t, V('cult') - .2, .7), A('cult', 'balt2', .25));
    head('Центральная Европа', A('cent', 'balt2', .25), C.cent, H * .14, 88); pill('тянутся к Западу', W / 2, H * .14, 48, A('cult', 'cent', .25), { line: C.cent }); }
  // 8. Baltics
  { const a = A('balt2', 'balk2', .35); head('Страны Балтии', a, C.balt, H * .14, 92);
    [['EST', 'est', 'Эстония', 25.8, 58.7], ['LVA', 'lva', 'Латвия', 25.2, 56.9], ['LTU', 'ltu', 'Литва', 23.9, 55.3]].forEach(([k, b, n, lon, lat]) => { fill(SH[k], C.balt, A(b, 'balk2', .25) * pulse); cp(t, n, lon, lat, b, 'balk2', C.balt, 42); });
    label2(['Балтийское', 'море'], 19.3, 57.6, A('sea', 'balk2', .3), '#5ad1ff', 40); }
  // 9. Balkans
  { const a = A('balk2', 'south', .35); fillC(BALK, C.balk, a * pulse, { fill: .55 }); dashed(SH.BALKAN, A('pen', 'south', .3) * .9);
    head('Балканы', a, C.balk, H * .14, 110); pill('Балканский полуостров', W / 2, H * .14 + 110, 46, A('pen', 'south', .25), { line: C.balk });
    [['Сербия', 20.8, 44.1], ['Хорватия', 16.2, 45.3], ['Босния и Герц.', 17.8, 44.2], ['Болгария', 25.3, 42.7], ['Греция', 22, 39.5], ['Албания', 20.1, 41.1], ['С. Македония', 21.7, 41.6], ['Черногория', 19.2, 42.8], ['Словения', 14.8, 46.1], ['Косово', 20.9, 42.6]]
      .forEach(([n, lon, lat], i) => { const [x, y] = P(lon, lat); pill(n, x, y, 32, a * ap(t, V('balk2') + .3 + i * .08, .25), { line: C.balk }); }); }
  // 10. Southern Europe
  { const a = A('south', 'north', .35); head('Южная Европа', a, C.south, H * .14, 96);
    [['PRT', 'prt', 'Португалия', -8.2, 39.6], ['ESP', 'esp', 'Испания', -3.7, 40.2], ['ITA', 'ita2', 'Италия', 12.6, 42.6], ['GRC', 'grc', 'Греция', 22, 39.4]].forEach(([k, b, n, lon, lat]) => { fill(SH[k], C.south, A(b, 'north', .25) * pulse); cp(t, n, lon, lat, b, 'north', C.south, 40); }); }
  // 11. Scandinavia
  { const a = A('north', 'broad', .35); head('Скандинавия', a, C.scand, H * .12, 100); dashed(SH.SCAND, A('north', 'nor', .3) * .9);
    [['NOR', 'nor', 'Норвегия', 9.5, 61.5], ['SWE', 'swe', 'Швеция', 15.5, 62.5], ['DNK', 'dnk', 'Дания', 9.3, 56]].forEach(([k, b, n, lon, lat]) => { fill(SH[k], C.scand, A(b, 'broad', .25) * pulse); cp(t, n, lon, lat, b, 'broad', C.scand, 42); });
    pill('общая история и похожие языки', W / 2, H * .12 + 105, 38, A('dnk', 'broad', .25), { line: C.scand }); }

    pill('Скандинавия', W / 2, H * .12 + 100, 44, A('nord2', 'cta', .25), { col: C.scand });

window.ready = (async () => {
  await Promise.all([loadFont('MB', 'fonts/Montserrat-Black.ttf'), loadFont('MX', 'fonts/Montserrat-ExtraBold.ttf'), loadFont('MS', 'fonts/Montserrat-SemiBold.ttf')]);

  END = V('vend') + 3.2; buildCam();
  await Promise.all([loadImg('world', 'tex/world.jpg'), loadImg('europa', 'tex/europa.jpg'), loadImg('logo', 'brand/logo_white_transparent.png')]);
  window.END = END; render(0); return true;
})();
