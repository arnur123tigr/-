  LAND = mkPath(SH.land); LAKES = mkPath(SH.lakes); KAZP = mkPath(SH.KAZ);
  for (const r of SH.rivers) RIV.push({ w: r.w, p: mkPath([r.p], false) });
  PAPER.src = 'paper.jpg'; await PAPER.decode();
  await Promise.all(['900 40px M', '800 40px MX', '700 40px PS', '700 40px PSI'].map(f => document.fonts.load(f)));
  await document.fonts.load('700 40px PSI');
  return true;
})();
