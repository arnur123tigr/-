<script type="module">
// ---------------------------------------------------------------
// Toy-brick 3D reel: "Клеопатра жила ближе к iPhone, чем к пирамидам"
// Deterministic: window.render(t) draws the frame for time t (sec).
// Generic toy bricks and minifigure-like figures, no brand marks.
// World: a brick road along +x, 1 unit = 100 years.
//   pyramid x=0 (2560 BC), Cleopatra x=25 (30 BC), iPhone x=45 (2007).
// ---------------------------------------------------------------
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

await document.fonts.load('800 80px Rubik'); await document.fonts.load('500 80px Rubik');
const W = 1080, H = 1920;
const out = document.getElementById('c'), O = out.getContext('2d');
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- palette & materials ----------
const COL = {
  yellow: '#F5C518', skin: '#F7CB2D', sand: '#E2BE7E', sandD: '#C9A262', road: '#A3A8AD', roadD: '#7E858C',
  white: '#F4F4F0', black: '#1C1C1E', gold: '#E0A526', blue: '#1F55B0', orange: '#F27A1A', jeans: '#2F4E86',
  teal: '#1BA6A0', brown: '#7A4A2A', brownD: '#5C351C', red: '#D42E26', green: '#2E9A43', greenD: '#237A34',
  tusk: '#F4EBD6', trunk: '#8B5A32', hair: '#222024', tan: '#D8B47A', lime: '#8BC34A'
};
const mats = {};
function mat(c, o = {}) {
  const k = c + JSON.stringify(o);
  if (!mats[k]) mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.32, metalness: 0 }, o));
  return mats[k];
}
const goldM = () => mat(COL.gold, { metalness: 0.75, roughness: 0.28 });
function mesh(geo, m, cast = true, recv = true) { const x = new THREE.Mesh(geo, m); x.castShadow = cast; x.receiveShadow = recv; return x; }

// ---------- bricks ----------
const P = 0.4, BH = 0.48;                         // stud pitch, brick height
const studGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 18);
function studs(list, color, cast = true) {         // list of [x,y,z] (y = top surface)
  const im = new THREE.InstancedMesh(studGeo, mat(color), list.length);
  const m4 = new THREE.Matrix4();
  list.forEach((p, i) => { m4.makeTranslation(p[0], p[1] + 0.04, p[2]); im.setMatrixAt(i, m4); });
  im.castShadow = cast; im.receiveShadow = true; return im;
}
function brick(nx, nz, color, h = BH, top = true) { // bottom at y=0, centred
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(nx * P - 0.012, h, nz * P - 0.012).translate(0, h / 2, 0), mat(color)));
  if (top) {
    const l = [];
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) l.push([(i - (nx - 1) / 2) * P, h, (j - (nz - 1) / 2) * P]);
    g.add(studs(l, color));
  }
  return g;
}
function taper(w, h, d, topScaleX, botScaleX = 1, topScaleZ = 1) { // box with scaled top/bottom
  const g = new THREE.BoxGeometry(w, h, d);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) > 0) { p.setX(i, p.getX(i) * topScaleX); p.setZ(i, p.getZ(i) * topScaleZ); }
    else p.setX(i, p.getX(i) * botScaleX);
  }
  g.computeVertexNormals(); return g;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ---------- sky ----------
scene.background = canvasTex(8, 512, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#4FB3EC'); g.addColorStop(0.55, '#9ED8F3'); g.addColorStop(1, '#FBE6BE');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
scene.fog = new THREE.Fog('#F3E2C0', 40, 140);

// ---------- light ----------
scene.add(new THREE.HemisphereLight('#DDEFFF', '#C8A36A', 0.9));
const sun = new THREE.DirectionalLight('#FFF3DC', 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
function aimSun(fx, fz, half = 12) {
  sun.target.position.set(fx, 0, fz); sun.position.set(fx - 8, 18, fz + 12);
  const s = sun.shadow.camera; s.left = -half; s.right = half; s.top = half; s.bottom = -half; s.near = 1; s.far = 70;
  s.updateProjectionMatrix();
}

// ---------- ground & road ----------
const ground = mesh(new THREE.PlaneGeometry(400, 200).rotateX(-Math.PI / 2), mat(COL.sand, { roughness: 0.5 }), false, true);
scene.add(ground);
{ // stud field near the road
  const l = [];
  for (let x = -14; x <= 62; x += P) for (let z = -12; z <= 9; z += P) {
    if (Math.abs(z) < 1.3 && x > -0.4 && x < 48.4) continue;
    l.push([x, 0, z]);
  }
  scene.add(studs(l, COL.sand, false));
}
const ROAD_END = 48;
for (let x0 = 0, k = 0; x0 < ROAD_END; x0 += 5, k++) { // 500-year segments in two greys
  const len = Math.min(5, ROAD_END - x0), nx = Math.round(len / P);
  const b = brick(nx, 6, k % 2 ? COL.roadD : COL.road, 0.16);
  b.position.set(x0 + len / 2, 0, 0); scene.add(b);
}

// ---------- pyramid ----------
const LAYERS = [14, 12, 10, 8, 6, 4];
const pyramid = new THREE.Group();
function seamTex(n, k) {
  return canvasTex(n * 32, 40, (c, w, h) => {
    c.fillStyle = COL.yellow; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(120,80,0,.45)';
    for (let x = (k % 2) * 64; x < w; x += 128) c.fillRect(x - 1, 0, 3, h);
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(0, 0, w, 2);
    c.fillStyle = 'rgba(90,60,0,.35)'; c.fillRect(0, h - 2, w, 2);
  });
}
LAYERS.forEach((n, k) => {
  const tx = seamTex(n, k), side = new THREE.MeshStandardMaterial({ map: tx, roughness: 0.32 }), top = mat(COL.yellow);
  const m = mesh(new THREE.BoxGeometry(n * P - 0.01, BH, n * P - 0.01).translate(0, BH / 2, 0), [side, side, top, top, side, side]);
  m.position.y = k * BH; pyramid.add(m);
  const l = [], inner = LAYERS[k + 1] || 2;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const xi = (i - (n - 1) / 2) * P, zj = (j - (n - 1) / 2) * P;
    if (Math.abs(xi) < inner * P / 2 && Math.abs(zj) < inner * P / 2) continue;
    l.push([xi, (k + 1) * BH, zj]);
  }
  pyramid.add(studs(l, COL.yellow));
});
const capstone = brick(2, 2, COL.yellow); capstone.position.y = LAYERS.length * BH; pyramid.add(capstone);
pyramid.position.set(-0.6, 0, -4.4); scene.add(pyramid);
const CAP_WORLD = V(-0.6, LAYERS.length * BH, -4.4);
const looseBrick = brick(2, 2, COL.yellow); scene.add(looseBrick);   // brick carried / placed by builder

// ---------- palms & decor ----------
function palm(h, seed) {
  const g = new THREE.Group();
  for (let i = 0; i < h; i++) {
    const b = mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.48, 12).translate(0, 0.24, 0), mat(i % 2 ? COL.brown : COL.brownD));
    b.position.set(Math.sin(i * 0.5 + seed) * 0.05 * i, i * 0.48, 0); g.add(b);
  }
  const top = h * 0.48;
  for (let a = 0; a < 6; a++) {
    const leaf = new THREE.Group();
    const p = mesh(new THREE.BoxGeometry(1.5, 0.12, 0.42).translate(0.75, 0, 0), mat(a % 2 ? COL.green : COL.greenD));
    p.rotation.z = -0.35; leaf.add(p);
    leaf.rotation.y = a * Math.PI / 3 + seed; leaf.position.y = top; g.add(leaf);
  }
  const c = mesh(new THREE.SphereGeometry(0.22, 12, 8), mat(COL.brownD)); c.position.y = top; g.add(c);
  return g;
}
[[-5.5, -2.5, 7, 0.3], [4.5, -6.5, 8, 1.1], [7.5, -3.2, 6, 2.2], [-4.2, -8, 9, .6], [13, -4, 7, 1.7], [21, -3.6, 8, .9], [29, -4.6, 6, 2.6], [17, 3.6, 6, 1.2], [33, 4, 7, .4], [-3.2, 3.2, 6, 2.9]]
  .forEach(([x, z, h, s]) => { const p = palm(h, s); p.position.set(x, 0, z); scene.add(p); });
[[9, 2.6, COL.sandD], [11, -2.6, COL.tan], [23, 2.4, COL.sandD], [36, -2.6, COL.tan], [39, 2.5, COL.sandD]]
  .forEach(([x, z, c]) => { const b = brick(2, 2, c); b.position.set(x, 0, z); scene.add(b); const b2 = brick(1, 1, c); b2.position.set(x + 0.2, BH, z); scene.add(b2); });
// Cleopatra's era: two columns; modern era: a lamp post and a bench
function column(x, z) {
  const g = new THREE.Group();
  for (let i = 0; i < 6; i++) { const b = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.48, 18).translate(0, 0.24 + i * 0.48, 0), mat(COL.white)); g.add(b); }
  const cap = brick(2, 2, COL.white); cap.position.y = 2.88; g.add(cap);
  g.position.set(x, 0, z); scene.add(g); return g;
}
column(22.4, -2.8); column(27.8, -2.8);
{
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.4, 10).translate(0, 1.7, 0), mat('#3A3F45')));
  const arm = mesh(new THREE.BoxGeometry(0.7, 0.08, 0.08).translate(0.3, 3.36, 0), mat('#3A3F45')); g.add(arm);
  const lamp = mesh(new THREE.BoxGeometry(0.4, 0.14, 0.24), mat('#FFF6C8', { emissive: '#FFE9A0', emissiveIntensity: 0.4 })); lamp.position.set(0.6, 3.26, 0); g.add(lamp);
  g.position.set(42.5, 0, -2.2); scene.add(g);
  const bench = brick(6, 2, COL.red, 0.16); bench.position.set(48.8, 0.6, -2.6); scene.add(bench);
  [-0.9, 0.9].forEach(dx => { const l = brick(1, 2, '#3A3F45', 0.6, false); l.position.set(48.8 + dx, 0, -2.6); scene.add(l); });
  const grass = brick(16, 10, COL.lime, 0.16); grass.position.set(47, 0, -5.4); scene.add(grass);
}

// ---------- signs ----------
function sign(text, x, z) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(0.22, 1.5, 0.22).translate(0, 0.75, 0), mat(COL.brownD)));
  const tx = canvasTex(640, 256, (c, w, h) => {
    c.fillStyle = '#FFFDF5'; c.fillRect(0, 0, w, h);
    c.strokeStyle = '#1C1C1E'; c.lineWidth = 14; c.strokeRect(7, 7, w - 14, h - 14);
    c.fillStyle = '#1C1C1E'; c.textAlign = 'center'; c.textBaseline = 'middle';
    let px = 130; c.font = `800 ${px}px Rubik`;
    while (c.measureText(text).width > w - 70) { px -= 4; c.font = `800 ${px}px Rubik`; }
    c.fillText(text, w / 2, h / 2 + 6);
  });
  const fm = new THREE.MeshStandardMaterial({ map: tx, roughness: 0.4 }), e = mat(COL.white);
  const board = mesh(new THREE.BoxGeometry(2.0, 0.8, 0.12), [e, e, e, e, fm, e]);
  board.position.y = 1.7; g.add(board);
  g.position.set(x, 0, z); scene.add(g); return g;
}
const signPyr = sign('2560 до н.э.', 4.0, -1.9);
const signCleo = sign('30 до н.э.', 26.7, -1.9);
const signPhone = sign('2007', 46.7, -1.9);

// ---------- face textures ----------
function faceTex(kind) {
  return canvasTex(320, 256, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    c.fillStyle = '#1C1C1E'; c.strokeStyle = '#1C1C1E'; c.lineCap = 'round';
    const ey = h * 0.44, ex = 46;
    // eyes
    [-1, 1].forEach(s => {
      c.beginPath(); c.ellipse(w / 2 + s * ex, ey, 13, 17, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(w / 2 + s * ex + 4, ey - 6, 4.5, 0, 7); c.fill(); c.fillStyle = '#1C1C1E';
    });
    c.lineWidth = 7;
    if (kind === 'cleo') {
      [-1, 1].forEach(s => { // winged eyeliner + lashes
        c.beginPath(); c.moveTo(w / 2 + s * (ex - 18), ey - 14); c.quadraticCurveTo(w / 2 + s * ex, ey - 26, w / 2 + s * (ex + 30), ey - 22); c.stroke();
        c.beginPath(); c.moveTo(w / 2 + s * (ex - 6), ey - 50); c.lineTo(w / 2 + s * (ex + 22), ey - 54); c.stroke();
      });
      c.fillStyle = '#C8283A';
      c.beginPath(); c.moveTo(w / 2 - 34, h * 0.70); c.quadraticCurveTo(w / 2, h * 0.86, w / 2 + 34, h * 0.70); c.quadraticCurveTo(w / 2, h * 0.75, w / 2 - 34, h * 0.70); c.fill();
    } else if (kind === 'builder') {
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(w / 2 + s * (ex - 18), ey - 34); c.lineTo(w / 2 + s * (ex + 16), ey - 40); c.stroke(); });
      c.lineWidth = 8; c.beginPath(); c.arc(w / 2, h * 0.6, 40, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    } else { // boy: big grin
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(w / 2 + s * (ex - 18), ey - 36); c.quadraticCurveTo(w / 2 + s * ex, ey - 46, w / 2 + s * (ex + 16), ey - 36); c.stroke(); });
      c.beginPath(); c.moveTo(w / 2 - 44, h * 0.64); c.quadraticCurveTo(w / 2, h * 0.92, w / 2 + 44, h * 0.64); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.fillRect(w / 2 - 34, h * 0.655, 68, 9);
    }
  });
}

// ---------- phone ----------
function phone() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(0.3, 0.56, 0.05), mat('#26262A', { roughness: 0.25 })));
  const scr = canvasTex(150, 280, (c, w, h) => {
    const gr = c.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#5B7CFA'); gr.addColorStop(1, '#C15BF2');
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
    const cols = ['#FFD54F', '#4DD0E1', '#81C784', '#FF8A65', '#F06292', '#FFFFFF', '#AED581', '#9575CD'];
    for (let i = 0; i < 12; i++) { c.fillStyle = cols[i % cols.length]; const x = 18 + (i % 3) * 42, y = 40 + Math.floor(i / 3) * 48; c.beginPath(); c.roundRect(x, y, 30, 30, 8); c.fill(); }
    c.fillStyle = '#111'; c.beginPath(); c.roundRect(w / 2 - 22, 8, 44, 12, 6); c.fill();
  });
  const sm = new THREE.MeshStandardMaterial({ map: scr, emissive: '#ffffff', emissiveMap: scr, emissiveIntensity: 0.6, roughness: 0.15 });
  const s = mesh(new THREE.PlaneGeometry(0.26, 0.5), sm, false); s.position.z = 0.026; g.add(s);
  const lens = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.02, 14).rotateX(Math.PI / 2), mat('#0E0E10')); lens.position.set(-0.08, 0.2, -0.033); g.add(lens);
  const lens2 = lens.clone(); lens2.position.y = 0.12; g.add(lens2);
  g.userData.screen = sm; return g;
}

// ---------- minifigure ----------
// feet at origin, faces +z. Total height ~2.
function minifig(o) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const legsC = o.legs || COL.blue, hipC = o.hips || legsC;
  body.add(mesh(new THREE.BoxGeometry(0.78, 0.16, 0.4).translate(0, 0.56, 0), mat(hipC)));
  const legs = [-1, 1].map(s => {
    const lg = new THREE.Group(); lg.position.set(s * 0.195, 0.48, 0);
    lg.add(mesh(new THREE.BoxGeometry(0.37, 0.44, 0.4).translate(0, -0.22, 0), mat(legsC)));
    lg.add(mesh(new THREE.BoxGeometry(0.37, 0.1, 0.5).translate(0, -0.43, 0.04), mat(o.feet || legsC)));
    body.add(lg); return lg;
  });
  if (o.skirt) {
    legs.forEach(l => l.visible = false);
    body.add(mesh(taper(0.8, 0.6, 0.46, 1, 1.18, 1).translate(0, 0.3, 0), mat(o.skirt)));
  }
  if (o.loin) body.add(mesh(new THREE.BoxGeometry(0.34, 0.34, 0.06).translate(0, 0.42, 0.22), mat(o.loin)));
  const torso = new THREE.Group(); torso.position.y = 0.64; body.add(torso);
  torso.add(mesh(taper(0.78, 0.64, 0.4, 0.77).translate(0, 0.32, 0), mat(o.torso)));
  if (o.collar) {
    const col = mesh(new THREE.CylinderGeometry(0.2, 0.34, 0.14, 28, 1, true), goldM()); col.scale.z = 0.68; col.position.y = 0.6; torso.add(col);
    const gem = mesh(new THREE.SphereGeometry(0.05, 12, 8), mat('#1E6FD9', { roughness: 0.1 })); gem.position.set(0, 0.5, 0.215); torso.add(gem);
  }
  if (o.belt) torso.add(mesh(new THREE.BoxGeometry(0.8, 0.07, 0.42).translate(0, 0.04, 0), goldM()));
  if (o.hood) {
    const hd = mesh(new THREE.TorusGeometry(0.2, 0.08, 10, 20), mat(o.torso)); hd.rotation.x = Math.PI / 2 - 0.25; hd.position.set(0, 0.64, -0.08); torso.add(hd);
    [-1, 1].forEach(s => { const d = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.22, 6), mat(COL.white)); d.position.set(s * 0.07, 0.48, 0.21); torso.add(d); });
    torso.add(mesh(new THREE.BoxGeometry(0.4, 0.14, 0.02).translate(0, 0.12, 0.205), mat('#D9620E')));
  }
  if (o.backpack) {
    torso.add(mesh(new THREE.BoxGeometry(0.56, 0.58, 0.24).translate(0, 0.32, -0.32), mat(o.backpack)));
    [-1, 1].forEach(s => torso.add(mesh(new THREE.BoxGeometry(0.08, 0.64, 0.44).translate(s * 0.2, 0.33, -0.02), mat(o.backpack))));
  }
  // arms
  const arms = [-1, 1].map(s => {
    const sh = new THREE.Group(); sh.position.set(s * 0.33, 0.52, 0); torso.add(sh);
    const tilt = new THREE.Group(); tilt.rotation.z = s * 0.14; sh.add(tilt);
    tilt.add(mesh(new THREE.SphereGeometry(0.11, 12, 10), mat(o.sleeve || o.torso)));
    tilt.add(mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.44, 12).translate(0, -0.2, 0.02), mat(o.sleeve || o.torso)));
    if (o.bracelet) { const b = mesh(new THREE.TorusGeometry(0.11, 0.025, 8, 16), goldM()); b.rotation.x = Math.PI / 2; b.position.set(0, -0.36, 0.02); tilt.add(b); }
    tilt.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1, 8).translate(0, -0.46, 0.03), mat(COL.skin)));
    const hand = mesh(new THREE.TorusGeometry(0.075, 0.035, 8, 16, Math.PI * 1.5), mat(COL.skin));
    hand.rotation.set(Math.PI / 2, 0, Math.PI * 0.25 + Math.PI / 2); hand.position.set(0, -0.56, 0.06); tilt.add(hand);
    const anchor = new THREE.Group(); anchor.position.set(0, -0.58, 0.06); tilt.add(anchor);
    return { sh, tilt, anchor };
  });
  // head
  const head = new THREE.Group(); head.position.y = 0.64 + 0.64 + 0.06; body.add(head);
  head.add(mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.08, 14).translate(0, -0.02, 0), mat(COL.skin)));
  const hc = new THREE.Group(); hc.position.y = 0.22; head.add(hc);
  hc.add(mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.4, 32), mat(COL.skin)));

  pose(cleo, { x: 0.25, z: 0.7, ry: 0.25, armL: 0.3, armLout: 0.5, armR: 0.15, headZ: -0.16, tilt: -0.06, headY: 0.15 });
  boyPhone.visible = true;
  pose(boy, { x: 1.55, z: 0.75, ry: -0.3, armR: 2.15 + sway, armRout: 0.25, armL: 0.9, armLout: 0.9, headZ: 0.14, tilt: 0.06, headY: -0.2 });
  boy.root.updateMatrixWorld(true);
  boyPhone.lookAt(V(0.9, 1.9, 0.6));
  boyPhone.userData.screen.emissiveIntensity = 0.6 + 3 * Math.max(0, 1 - Math.abs(u - s.click) / 0.12);
  return () => {
    black(1 - seg(u, 0, 0.35));
    flash(0.85 * Math.max(0, 1 - Math.abs(u - s.click - 0.03) / 0.16));
    label('Хочешь ещё? Ставь +', u - 1.45, 290);
    // big plus brick pops at "плюс"
    const p = u - s.plus;
    if (p > 0) {
      const sc = back(seg(p, 0, 0.35)) * (1 + 0.06 * Math.sin(p * 8) * Math.exp(-p * 1.5));
      O.save(); O.translate(W / 2, 1590); O.scale(sc * 0.85, sc * 0.85); O.rotate(0.06);
      const a = 70, b = 210;
      O.fillStyle = 'rgba(0,0,0,.35)'; roundRect(O, -a + 12, -b + 16, 2 * a, 2 * b, 24); O.fill(); roundRect(O, -b + 12, -a + 16, 2 * b, 2 * a, 24); O.fill();
      O.fillStyle = COL.red; O.strokeStyle = '#1C1C1E'; O.lineWidth = 10;
      O.beginPath(); O.moveTo(-a, -b); O.lineTo(a, -b); O.lineTo(a, -a); O.lineTo(b, -a); O.lineTo(b, a); O.lineTo(a, a); O.lineTo(a, b); O.lineTo(-a, b); O.lineTo(-a, a); O.lineTo(-b, a); O.lineTo(-b, -a); O.lineTo(-a, -a); O.closePath(); O.fill(); O.stroke();
      O.fillStyle = 'rgba(255,255,255,.35)';
      [[0, -140], [0, 0], [0, 140], [-140, 0], [140, 0]].forEach(([x, y]) => { O.beginPath(); O.arc(x, y, 34, 0, 7); O.fill(); });
      O.restore();
      O.font = '800 60px Rubik'; O.fillStyle = '#fff'; O.strokeStyle = '#1C1C1E'; O.lineWidth = 12; O.textAlign = 'center';
      O.globalAlpha = seg(p, 0.2, 0.5); O.strokeText('в комментариях', W / 2, 1840); O.fillText('в комментариях', W / 2, 1840); O.globalAlpha = 1;
    }
  };
};

function render(t) {
  const s = TL.scenes.find(x => t < x.end) || TL.scenes[TL.scenes.length - 1];
  const u = t - s.start;
  reset(); blurPx = 0;
  builder.root.visible = true;
  const overlay = SC[s.id](u, s);
  renderer.render(scene, camera);
  O.globalAlpha = 1; O.drawImage(glc, 0, 0);
  if (blurPx > 1.5) { // fake horizontal motion blur for whip pans
    const n = 6;
    for (let i = 1; i <= n; i++) { O.globalAlpha = 0.5 / i; O.drawImage(glc, i * blurPx / n, 0); }
    O.globalAlpha = 1;
  }
  overlay && overlay();
}
window.render = render;
window.ready = (async () => {
  TL = await (await fetch('timeline.json')).json();
  render(0); return true;
})();
</script>
