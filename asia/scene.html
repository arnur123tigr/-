<script>
// Neon map: "Чем отличаются регионы Азии". render(t) is deterministic, t in seconds of the video.
const W = 1080, H = 1920, OFF = 0.3;            // voice starts 0.3 s into the video
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const gl = document.createElement('canvas'); gl.width = W / 4; gl.height = H / 4; const gx = gl.getContext('2d');
let CAPS = []; const MAP = { lo: new Image(), hi: new Image() }; const MLON0 = -30, MY1 = 125.76607230504946;
const D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

const my = lat => 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * D2R)) / D2R;  // Miller projection (degrees)

// ---------- regions ----------
const REG = {
  S: { c: '#3fc43a', name: 'Южная Азия', k: ['IND', 'PAK', 'AFG', 'BGD', 'NPL', 'BTN', 'LKA', 'MDV'] },
  C: { c: '#dc3326', name: 'Центральная Азия', k: ['KAZ', 'UZB', 'TKM', 'KGZ', 'TJK'] },
  E: { c: '#e2cf2c', name: 'Восточная Азия', k: ['CHN', 'MNG', 'PRK', 'KOR', 'JPN', 'TWN'] },
  SE: { c: '#3cc6e2', name: 'Юго-Восточная Азия', k: ['VNM', 'THA', 'LAO', 'KHM', 'MMR', 'MYS', 'SGP', 'IDN', 'PHL', 'BRN', 'TLS'] },
  N: { c: '#2a46dc', name: 'Северная Азия', k: ['RUS'] },
  M: { c: '#f0891c', name: 'Ближний Восток', k: ['TUR', 'GEO', 'ARM', 'AZE', 'SYR', 'LBN', 'ISR', 'PSX', 'JOR', 'IRQ', 'IRN', 'KWT', 'SAU', 'BHR', 'QAT', 'ARE', 'OMN', 'YEM', 'CYP', 'CYN'] },
};
const OF = {}; for (const r in REG) for (const k of REG[r].k) OF[k] = r;
const ASIA = new Set(Object.keys(OF));
const NAMES = { IND: 'Индия', PAK: 'Пакистан', AFG: 'Афганистан', BGD: 'Бангладеш', NPL: 'Непал', BTN: 'Бутан', LKA: 'Шри-Ланка', MDV: 'Мальдивы',
  KAZ: 'Казахстан', UZB: 'Узбекистан', TKM: 'Туркменистан', KGZ: 'Кыргызстан', TJK: 'Таджикистан',
  CHN: 'Китай', MNG: 'Монголия', PRK: 'КНДР', KOR: 'Южная Корея', JPN: 'Япония', TWN: 'Тайвань',
  VNM: 'Вьетнам', THA: 'Таиланд', LAO: 'Лаос', KHM: 'Камбоджа', MMR: 'Мьянма', MYS: 'Малайзия', SGP: 'Сингапур', IDN: 'Индонезия', PHL: 'Филиппины', BRN: 'Бруней', TLS: 'Вост. Тимор',
  IRN: 'Иран', IRQ: 'Ирак', SAU: 'Саудовская Аравия', ISR: 'Израиль', PSX: 'Палестина', TUR: 'Турция', SYR: 'Сирия', JOR: 'Иордания', YEM: 'Йемен', OMN: 'Оман', ARE: 'ОАЭ', KWT: 'Кувейт', GEO: 'Грузия', ARM: 'Армения', AZE: 'Азербайджан', LBN: 'Ливан', EGY: 'Египет' };
// label anchor (lon, lat) and when each country is named in the voice (voice time); size factor
const LBL = {
  IND: [79, 22, 24.26], PAK: [69.5, 29.5, 25.0], AFG: [65.5, 33.6, 25.74], BGD: [90.3, 23.8, 26.62], NPL: [84, 28.4, 27.84, .8], BTN: [90.5, 27.5, 28.1, .8], LKA: [80.7, 7.6, 30.42, .85], MDV: [73.3, 3.5, 31.18, .85],
  KAZ: [67, 48.3, 36.16, 1.15], UZB: [63.5, 41.6, 37.02], TKM: [59, 39, 37.6], KGZ: [74.8, 41.5, 37.9, .9], TJK: [71, 38.6, 38.2, .9],
  CHN: [103, 34, 47.44, 1.15], MNG: [103, 46.5, 48.08], PRK: [127, 40.4, 48.86, .8], KOR: [128, 36.3, 49.44, .8], JPN: [138.5, 36.5, 50.44], TWN: [121, 23.7, 51.2, .8],
  VNM: [106.5, 15, 54.72, .9], THA: [101, 15.5, 55.74, .9], LAO: [102.8, 19.5, 56.4, .8], KHM: [104.9, 12.5, 56.7, .8], MMR: [96, 21, 57.0, .9], IDN: [114, -1.5, 58.88, 1.1], PHL: [122.5, 12.5, 59.68], MYS: [102, 4, 60.16, .85], SGP: [104, 1.2, 60.3, .7], BRN: [114.7, 4.6, 60.4, .7], TLS: [126, -8.8, 60.5, .7],
  IRN: [54, 32.5, 86.22, 1.1], IRQ: [43.7, 33.2, 86.84], SAU: [45, 23.5, 87.4, 1.0], ISR: [34.6, 31.6, 88.66, .75], PSX: [35.5, 32.2, 89.28, .75],
  TUR: [34.5, 39.2, 90.1, .85], SYR: [38.5, 35.2, 90.2, .8], JOR: [36.6, 30.8, 90.3, .75], YEM: [47.5, 15.6, 90.4, .85], OMN: [56.5, 20.6, 90.5, .8], ARE: [54.3, 24, 90.6, .7], KWT: [47.6, 29.4, 90.7, .7], GEO: [43.5, 42.3, 90.8, .7], ARM: [44.8, 40.3, 90.9, .65], AZE: [48, 40.6, 91.0, .7], LBN: [35.85, 33.95, 91.05, .6],
};
// geometry with bboxes
const GEO = {};
for (const k in window.GEO) GEO[k] = window.GEO[k].map(r => { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; for (const p of r) { a = Math.min(a, p[0]); b = Math.max(b, p[0]); c = Math.min(c, p[1]); d = Math.max(d, p[1]); } return { r, bb: [a, b, my(c), my(d)] }; });

// ---------- camera: [voice time, lon, lat, px/deg] ----------
const CAM = [[-1, 85, 34, 11], [12.4, 75, 30, 10.8], [17.6, 90, 28, 11], [23.4, 79, 21, 22], [32.0, 72, 39, 18], [42.8, 108, 36, 12],
  [51.8, 114, 8, 13.5], [61.0, 100, 52, 10.8], [72.3, 62, 38, 10.8], [85.3, 46, 28, 17], [93.2, 40, 25, 12], [99.2, 88, 32, 10.8]];
let cam = { lon: 88, y: my(33), s: 9 };
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  const A = CAM[i], B = CAM[Math.min(i + 1, CAM.length - 1)];
  const P = CAM[Math.max(0, i - 1)];
  const k = ease((t - A[0]) / 1.6); // move from previous key to A over 1.6 s
  const from = i === 0 ? A : P;

  const dr = (t - A[0]) * 0.012;

  y = Math.min(MY1 - H * .46 / sc - 1, Math.max(-54.6 + H * .54 / sc + 1, y));   // keep the map filling the frame

}
const PX = (lon, lat) => [W / 2 + (lon - cam.lon) * cam.s, H * 0.46 - (my(lat) - cam.y) * cam.s];

// ---------- people dots (deterministic) ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function inside(code, lon, lat) {
  let c = false; const y = my(lat);
  for (const { r } of GEO[code] || []) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const yi = my(r[i][1]), yj = my(r[j][1]);
    if ((yi > y) !== (yj > y) && lon < (r[j][0] - r[i][0]) * (y - yi) / (yj - yi) + r[i][0]) c = !c;
  }
  return c;
}
const POP = { IND: 70, CHN: 66, IDN: 14, PAK: 12, BGD: 9, JPN: 6, PHL: 6, VNM: 5, IRN: 4, TUR: 4, THA: 4, MMR: 3, KOR: 3, IRQ: 2, AFG: 2, UZB: 2, SAU: 2, MYS: 2, NPL: 2, YEM: 2, KAZ: 1, LKA: 1, SYR: 1, KHM: 1, PRK: 1, TWN: 1, RUS: 2, MNG: 1, KGZ: 1, TJK: 1 };
const PEOPLE = [];
for (const k in POP) { const bb = GEO[k].reduce((m, g) => [Math.min(m[0], g.bb[0]), Math.max(m[1], g.bb[1]), 0], [1e9, -1e9]); let lat0 = 90, lat1 = -90; for (const g of GEO[k]) for (const p of g.r) { lat0 = Math.min(lat0, p[1]); lat1 = Math.max(lat1, p[1]); }
  let n = POP[k] * 2, tries = 0; while (n > 0 && tries++ < 5000) { const lo = bb[0] + rnd() * (bb[1] - bb[0]), la = lat0 + rnd() * (lat1 - lat0); if (k === 'RUS' && lo < 60) continue; if (inside(k, lo, la)) { PEOPLE.push([lo, la, OF[k], rnd()]); n--; } } }

// ---------- drawing helpers ----------
function pathOf(c, code, cull = true) {
  c.beginPath(); let any = false;
  const x0 = (-60 - W / 2) / cam.s + cam.lon, x1 = (W + 60 - W / 2) / cam.s + cam.lon;
  const y0 = cam.y - (H + 60 - H * .46) / cam.s, y1 = cam.y + (H * .46 + 60) / cam.s;
  for (const { r, bb } of GEO[code] || []) {
    if (cull && (bb[1] < x0 || bb[0] > x1 || bb[3] < y0 || bb[2] > y1)) continue;
    any = true;
    for (let i = 0; i < r.length; i++) { const [x, y] = PX(r[i][0], r[i][1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.closePath();
  }
  return any;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function glowText(s, x, y, size, col = '#fff', glow = '#2de2ff', align = 'center', font = 'R') {
  ctx.font = `800 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (col !== '#fff' && col !== '#ffffff' && /^#(bd|c9|d2|e8)/.test(col)) col = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = size * .22; ctx.shadowOffsetY = size * .04; ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}

  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `800 ${size}px R`; const w = ctx.measureText(s).width + size * .9, h = size * 1.45;
  x = Math.min(W - 24 - w / 2, Math.max(24 + w / 2, x));
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = size * .4; ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h * .28); ctx.fill(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  else { ctx.lineWidth = size * .14; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(s, 0, size * .04); ctx.fillStyle = '#fff'; ctx.fillText(s, 0, size * .04); }

}

  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `800 ${size}px R`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * .22; ctx.strokeStyle = 'rgba(3,8,20,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);

    ctx.textAlign = 'left'; ctx.fillStyle = col; ctx.fillText(pre, x - full / 2, y);

  if (k <= 0) return; ctx.font = `800 ${size}px R`; const w = ctx.measureText(s).width;
  ctx.save(); ctx.strokeStyle = '#ff3d6e'; ctx.lineWidth = size * .16; ctx.lineCap = 'round'; ctx.shadowColor = '#ff3d6e'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.moveTo(x - w / 2 - 6, y + 2); ctx.lineTo(x - w / 2 - 6 + (w + 12) * eout(k), y - 2); ctx.stroke(); ctx.restore();

// ---------- state per time ----------
// region fill level (0..1) for voice time t
function regionLevel(r, t) {
  const flash = (a, b) => win(t, a, b, .25);
  switch (r) {
    case 'M': return Math.max(flash(3.5, 5.0), clamp((t - 73.4) / .6));
    case 'C': return Math.max(flash(5.9, 7.3), t > 38.9 ? clamp((t - 38.9) / .6) : 0);
    case 'S': return Math.max(flash(8.0, 11.3), clamp((t - 20.3) / .8));
    case 'E': return Math.max(flash(8.8, 11.3), clamp((t - 46.0) / .6));
    case 'SE': return Math.max(flash(9.6, 11.3), clamp((t - 53.3) / .6));
    case 'N': return clamp((t - 66.2) / .8);
  }
  return 0;
}
// extra pulse when a country is named
function namePulse(k, t) { const L = LBL[k]; if (!L) return 0; const d = t - L[2]; return d < 0 ? 0 : Math.exp(-d * 1.6) * clamp(d / .12); }
function labelAlpha(k, t) {
  const L = LBL[k]; if (!L) return 0; const r = OF[k];
  const end = { S: 32.0, C: 42.8, E: 51.8, SE: 61.0, M: 93.3 }[r] || 999;
  return win(t, L[2] - .05, end, .25);
}

// ---------- overlays ----------
function drawMountains(t) {
  const a = win(t, 44.1, 51.8, .4); if (a <= 0) return;
  const ranges = [{ n: 'Гималаи', at: 44.3, p: [[73, 35.6], [76, 34.4], [78.5, 32.6], [81, 30.4], [84, 28.6], [87, 27.9], [90, 28], [93, 28.4], [95.5, 29.3]], lab: [84, 31.6] },
    { n: 'Тянь-Шань', at: 45.04, p: [[68.5, 41.6], [71.5, 41.7], [75, 42], [78.5, 42.4], [82, 43], [86, 43.3], [90, 43.4], [94, 43.2]], lab: [80, 45.3] }];
  for (const R of ranges) {
    const k = eout((t - R.at) / 1.0); if (k <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#e8f6ff'; ctx.fillStyle = 'rgba(200,235,255,.18)'; ctx.lineWidth = 3; ctx.shadowColor = '#bfe9ff'; ctx.shadowBlur = 16; ctx.lineJoin = 'round';
    const n = R.p.length - 1, m = Math.floor(n * k * 3);
    for (let i = 0; i < m; i++) {
      const u = i / 3, j = Math.floor(u), f = u - j; const A = R.p[j], B = R.p[Math.min(j + 1, n)];
      const lo = A[0] + (B[0] - A[0]) * f, la = A[1] + (B[1] - A[1]) * f; const [x, y] = PX(lo, la);
      const hgt = cam.s * (1.0 + .5 * Math.sin(i * 2.3)), wd = cam.s * .75;
      ctx.beginPath(); ctx.moveTo(x - wd, y + hgt * .35); ctx.lineTo(x, y - hgt); ctx.lineTo(x + wd, y + hgt * .35); ctx.fill(); ctx.stroke();

    ctx.restore();
    const [lx, ly] = PX(R.lab[0], R.lab[1]); tag(R.n, lx, ly, 34, a * clamp((t - R.at) / .3), '#e8f6ff', '#7fd4ff');
  }
}
function drawPeople(t) {
  const a = win(t, 17.7, 23.5, .3); if (a <= 0) return;
  for (const [lo, la, r, q] of PEOPLE) {
    const appear = clamp((t - 17.9 - q * 1.6) / .25); if (appear <= 0) continue;
    const south = r === 'S'; const hl = south ? clamp((t - 20.4) / .5) : 0, dim = 1 - .6 * clamp((t - 20.4) / .5) * (south ? 0 : 1);
    const [x, y] = PX(lo, la); const s = 9 * back(appear);

    ctx.beginPath(); ctx.arc(x, y - s * 1.25, s * .45, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - s * .5, y - s * .7, s, s * 1.4, s * .4); ctx.fill();
  }

}
function drawUN(t) {
  const a = win(t, 63.3, 66.1, .3); if (a <= 0) return;
  const s = back((t - 63.3) / .5), x = W * .5, y = H * .27;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = '#4fb3ff'; ctx.shadowBlur = 40; ctx.fillStyle = '#1d8cff'; ctx.beginPath(); ctx.arc(0, 0, 120, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, -10, 62, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -10, 38, 0, 7); ctx.stroke();

  ctx.font = '800 54px R'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText('ООН', 0, 175);
  ctx.restore();
}
function arrow(x0, y0, x1, y1, k, col, bend = -.25) {
  if (k <= 0) return; const mx = (x0 + x1) / 2 - (y1 - y0) * bend, myy = (y0 + y1) / 2 + (x1 - x0) * bend;

  ctx.beginPath(); ctx.moveTo(x0, y0); const N = 30, M = Math.floor(N * eout(k)); let px = x0, py = y0, qx = x0, qy = y0;

  ctx.restore();
}
function drawEye(t) {
  const a = win(t, 78.3, 85.4, .3); if (a <= 0) return;
  let [x, y] = PX(18, 50); x = Math.max(110, x); const s = back((t - 78.3) / .5); const blink = Math.abs(Math.sin((t - 78.3) * 1.3)) > .97 ? .15 : 1;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);

  ctx.fillStyle = '#0a1a3a'; ctx.beginPath(); ctx.arc(14 + 18 * clamp(look, -1, 1), 4, 22 * blink, 0, 7); ctx.fill();

  pill('Дальний Восток', cx, cy - 80, 40, '#ffd83d', clamp((t - 82.6) / .3), back((t - 82.6) / .4));
  arrow(x + 20, y + 40, mx - 40, mmy - 20, (t - 83.8) / .7, '#ff9a2e', .2);

}
