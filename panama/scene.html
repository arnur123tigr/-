<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:540px;height:960px;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
// «Панама: рассвет над Тихим, закат над Атлантикой» — RU remake, voice «Арнур». Times = voice beats (beats.json) + OFF.
const OFF = .3;
let B = {}, SH = null, CAPS = [], END = 50;
const V = k => B[k] + OFF;
TEX.push({ k: 'world', l0: -180, l1: 180, b0: -90, b1: 90 });
TEX.push({ k: 'ca', l0: -100, l1: -60, b0: 0, b1: 25, minppd: 12 });
TEX.push({ k: 'pan', l0: -84, l1: -76.5, b0: 6.5, b1: 10.5, minppd: 45 });
const BARU = [-82.54, 8.81];
</script>
<script src="helpers.js"></script>
<script src="ctalink.js"></script>
<script>
const fill = (rings, col, a, o) => glowFill(rings, col, a, Object.assign({ fill: .5, lw: 4, blur: 22 }, o || {}));
function oceanLabel(s, lon, lat, rot, a, size = 54) {
  if (a <= 0) return; const [x, y] = P(lon, lat);
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x, y); ctx.rotate(rot);
  txt(s, 0, 0, size, '#fff', 'MX', { shadow: 'rgba(255,255,255,.9)', blur: 22, dy: 0, ls: 2 }); ctx.restore();
}
function arcLabel(s, lon, lat, R, size, a) {   // letters along an arc above (lon,lat)
  if (a <= 0) return; const [cx, cy0] = P(lon, lat), cy = cy0 + R; const p = back(clamp(a * 1.3));
  ctx.save(); ctx.globalAlpha = clamp(a * 2); ctx.font = `${size}px MB`;
  const ws = [...s].map(ch => ctx.measureText(ch).width + size * .12), tot = ws.reduce((x, y) => x + y, 0);
  let an = -Math.PI / 2 - tot / R / 2;
  [...s].forEach((ch, i) => { const m = an + ws[i] / R / 2; ctx.save(); ctx.translate(cx + Math.cos(m) * R * p, cy + Math.sin(m) * R * p); ctx.rotate(m + Math.PI / 2);
    txt(ch, 0, 0, size, '#fff', 'MB', { stroke: size * .14, sc: 'rgba(0,0,0,.7)', blur: 10 }); ctx.restore(); an += ws[i] / R; });
  ctx.restore();
}
function dashLine(x0, y0, x1, y1, p, a, col = '#fff') {
  if (a <= 0 || p <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.setLineDash([18, 14]); 
  ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, p), lerp(y0, y1, p)); ctx.stroke(); ctx.restore();
}
function cross(x, y, r, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = BR.red; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke(); ctx.restore(); }
function straightArrow(x0, y0, x1, y1, p, a, col = '#fff', lw = 14) {
  if (a <= 0 || p <= 0) return; const ex = lerp(x0, x1, p), ey = lerp(y0, y1, p), an = Math.atan2(y1 - y0, x1 - x0);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex + Math.cos(an) * 30, ey + Math.sin(an) * 30); ctx.lineTo(ex + Math.cos(an + 2.4) * 36, ey + Math.sin(an + 2.4) * 36); ctx.lineTo(ex + Math.cos(an - 2.4) * 36, ey + Math.sin(an - 2.4) * 36); ctx.fill(); ctx.restore();
}
let CAMK = [];
function buildCam() {
  CAMK = [
    [0, -84, 13, 26], [V('pan') - .2, -82.5, 11, 40, 'l'],
    [V('pan') + .9, -80.2, 8.7, 128], [V('baru') - .1, -80.2, 8.7, 136, 'l'],
    [V('baru') + 1.0, -82.4, 8.75, 300], [V('how') - .1, -82.5, 8.8, 330, 'l'],
    [V('how') + .9, -80.2, 8.7, 130], [V('morn') - .1, -80.2, 8.7, 140, 'l'],
    [V('morn') + .9, -80.6, 8.7, 118], [V('clear') - .1, -80.8, 8.75, 124, 'l'],
    [V('clear') + .9, -82.3, 8.8, 220], [V('if') - .1, -82.4, 8.8, 232, 'l'],
    [V('if') + 1.4, -80.5, 9.5, 60], [V('vend') + 4, -80.5, 9.5, 52, 'l'],
  ];
}
function render(t) {
  CAM = camAt(CAMK, t);
  drawMap(); vignette(.5);
  ctx.save(); ctx.globalAlpha = .35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; for (const r of SH.borders) { pathRings([r]); ctx.stroke(); } ctx.restore();
  const A = (a, b, f = .3) => win(t, V(a), V(b), f);
  const pulse = .82 + .18 * Math.sin(t * 5);
  // Panama always glowing after the first beat
  fill(SH.PAN, BR.acc, clamp(ap(t, .2, .6)) * (1 - A('morn', 'if', .4) * .45) * pulse, { fill: .2 });
  // 1. hook: sunrise over Pacific, sunset over Atlantic
  { const a = A('0', 'pan', .3);
    oceanLabel('Тихий океан', -90, 7, -.35, a * ap(t, .3, .4), 50); oceanLabel('Атлантический океан', -77, 16.5, -.35, a * ap(t, V('atl') - .3, .4), 46);
    const [sx, sy] = P(-86, 3.3); sunIcon(sx, sy, 52, a * ap(t, .5, .4), 'rise');
    const [ex, ey] = P(-75, 19.5); sunIcon(ex, ey, 52, a * ap(t, V('atl') - .1, .4), 'set');
    head('Рассвет над Тихим', a * ap(t, .3, .4) * (1 - ap(t, V('atl') - .2, .2)), '#FFC93C', H * .17, 82);
    head('Закат над Атлантикой', a * ap(t, V('atl') - .2, .3), '#FF7A3D', H * .17, 80); }
  // 2. Panama
  { const a = A('pan', 'baru', .3); arcLabel('ПАНАМА', -80.4, 9.3, 700, 80, a); }
  // 3. Volcan Baru
  { const a = A('baru', 'how', .3); pin(t, 'Вулкан Бару', ...BARU, 170, -230, 'baru', 'how', BR.acc, 50);
    const [x, y] = P(...BARU); for (let k = 0; k < 3; k++) { const ph = ((t * .8 + k / 3) % 1); ctx.save(); ctx.globalAlpha = a * (1 - ph) * .8; ctx.strokeStyle = BR.acc; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 20 + ph * 110, 0, 7); ctx.stroke(); ctx.restore(); }
    head('Самая высокая гора', A('high', 'how', .25), BR.acc, H * .15, 80);
    bigNum('3 474 м', H * .7, 150, A('num', 'how', .3), BR.acc, 'над уровнем моря'); }
  // 4. how is it possible
  { head('Как это возможно?', A('how', 'form', .25), '#ffffff', H * .17, 90); }
  // 5. the shape: bent like an S, runs west-east
  { const a = A('form', 'morn', .3);
    const ring = SH.PAN.reduce((m, r) => r.length > m.length ? r : m, []);
    polyPartial(ring, ap(t, V('form'), 2.2), { col: '#fff', lw: 6, glow: BR.acc, blur: 20, a });
    head('Необычная форма', A('form', 's', .25), BR.acc, H * .15, 86);
    const as = A('s', 'ns', .25); pill('изогнута, как буква S', W / 2, H * .15, 56, as, { line: BR.acc });
    const an = A('ns', 'morn', .25), aw = A('we', 'morn', .25);
    straightArrow(W * .5, H * .26, W * .5, H * .74, eout(ap(t, V('ns') - .1, .5)), an * (1 - aw * .5), '#ffffff');
    cross(W * .5, H * .5, 70, an * ap(t, V('ns') + .5, .2));
    straightArrow(W * .06, H * .56, W * .94, H * .44, eout(ap(t, V('we') - .1, .6)), aw, BR.acc, 18);
    pill('не с севера на юг', W / 2, H * .15, 52, an * (1 - aw), { line: BR.red }); pill('а с запада на восток', W / 2, H * .15, 52, aw, { col: BR.acc, line: BR.acc }); }
  // 6. morning sun from the Pacific, evening sun into the Caribbean
  { const a = A('morn', 'clear', .3); const [bx, by] = P(...BARU);
    oceanLabel('Тихий океан', -81.3, 7.0, 0, a, 52); oceanLabel('Карибское море', -80.4, 10.15, 0, a, 52);
    const [sx, sy] = P(-78.4, 7.35), [ex, ey] = P(-83.2, 10.0);
    const am = ap(t, V('morn') + .2, .4), ae = ap(t, V('eve'), .4);
    sunIcon(sx, sy, 62, a * am, 'rise'); dashLine(sx, sy, bx, by, eout(ap(t, V('pac') - .2, .8)), a * am, '#FFC93C');
    sunIcon(ex, ey, 62, a * ae, 'set'); dashLine(bx, by, ex, ey, eout(ap(t, V('car') - .2, .8)), a * ae, '#FF7A3D');
    dot(...BARU, a, BR.acc);
    pill('утро ☀ Тихий океан', W / 2, H * .14, 50, a * am * (1 - ae), { line: '#FFC93C' });
    pill('вечер ☀ Карибское море', W / 2, H * .14, 50, a * ae, { line: '#FF7A3D' });
    pill('= Атлантический океан', W / 2, H * .14 + 100, 44, a * ap(t, V('atl2') - .1, .3), { col: BR.acc, line: '#FF7A3D' }); }
  // 7. both oceans visible from the summit
  { const a = A('clear', 'if', .3); const [bx, by] = P(...BARU);
    const r = eout(ap(t, V('clear') + .3, 1.2)) * .75 * CAM.ppd;
    ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fillStyle = 'rgba(254,179,0,.12)'; ctx.fill(); ctx.strokeStyle = BR.acc; ctx.lineWidth = 5; ctx.setLineDash([20, 12]); ctx.stroke(); ctx.restore();
    dot(...BARU, a, BR.acc);
    oceanLabel('Тихий океан', -82.2, 8.05, 0, a * ap(t, V('both') - .3, .3), 50); oceanLabel('Карибское море', -82.0, 9.55, 0, a * ap(t, V('both'), .3), 50);
    head('Видно оба океана', a * ap(t, V('both') - .5, .3), BR.acc, H * .15, 86); }
  // 8. at least once in your life
  { const a = A('if', 'cta', .3); oceanLabel('Тихий океан', -81, 6.2, 0, a, 50); oceanLabel('Карибское море', -79.5, 11.6, 0, a, 50);
    head('Хотя бы раз в жизни', a * ap(t, V('if') + .3, .3), BR.acc, H * .16, 86); }
  captions(t);
  ctaLink(t);
  logo(.9);
  endCardLink(t, V('vend') + .5);
}
window.ready = (async () => {
  await Promise.all([loadFont('MB', 'fonts/Montserrat-Black.ttf'), loadFont('MX', 'fonts/Montserrat-ExtraBold.ttf'), loadFont('MS', 'fonts/Montserrat-SemiBold.ttf')]);
  SH = await (await fetch('shapes.json')).json(); CAPS = await (await fetch('caps_ru.json')).json(); B = (await (await fetch('beats.json')).json()).ru; B['0'] = -OFF;
  END = V('vend') + 3.2; buildCam();
  await Promise.all([loadImg('world', 'tex/world.jpg'), loadImg('ca', 'tex/ca.jpg'), loadImg('pan', 'tex/pan.jpg'), loadImg('logo', 'brand/logo_white_transparent.png')]);
  window.END = END; render(0); return true;
})();
</script></body></html>
