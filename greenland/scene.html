<script>
// "Почему Гренландия ледяная, а Исландия зелёная" — Russian remake of a geography reel:
// satellite map + glowing labels, old parchment map with a longship, spyglass view, cartoon Vikings.
// render(T) is deterministic, T = video seconds; t = voice time (T - OFF).
const W = 1080, H = 1920, OFF = 0.3, END = 72.0, CTA0 = 61.75;
const main = document.getElementById('c'); let ctx = main.getContext('2d');
const SAT = new Image(), HI = new Image(), PAR = new Image(); let SH = null, CAPS = [];
const D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

  let i = 0; while (i < K.length - 1 && t >= K[i + 1][0]) i++;
  const A = K[i], F = i === 0 ? A : K[i - 1], d = A[4] || 1.1, k = ease((t - A[0]) / d);
  const s = Math.exp(lerp(Math.log(F[3]), Math.log(A[3]), k)) * (1 + Math.max(0, t - A[0]) * .008);
  return { lon: lerp(F[1], A[1], k), y: lerp(my(F[2]), my(A[2]), k), s };
}
let SRC;
function blit(S) {
  const im = S.img, sx = (cam.lon - W / 2 / cam.s - S.L0) * S.S, sy = (S.YT - (cam.y + H / 2 / cam.s)) * S.S, sw = W / cam.s * S.S, sh = H / cam.s * S.S;
  const x0 = Math.max(0, sx), y0 = Math.max(0, sy), x1 = Math.min(im.width, sx + sw), y1 = Math.min(im.height, sy + sh);
  if (x1 > x0 && y1 > y0) ctx.drawImage(im, x0, y0, x1 - x0, y1 - y0, (x0 - sx) / sw * W, (y0 - sy) / sh * H, (x1 - x0) / sw * W, (y1 - y0) / sh * H);
}
function drawBase(src = 'sat') {
  ctx.fillStyle = src === 'par' ? '#2e3a2c' : '#0d3a44'; ctx.fillRect(0, 0, W, H);
  if (src === 'par') { blit(SRC.par); return; }

}
function cpath(rings) { ctx.beginPath(); for (const r of rings) { r.forEach(([lo, la], i) => { const [x, y] = PX(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); } }

function txt(s, x, y, size, col = '#fff', font = 'M', align = 'center', sh = .75) {

  ctx.shadowColor = `rgba(0,0,0,${sh})`; ctx.shadowBlur = size * .25; ctx.shadowOffsetY = size * .05; ctx.fillStyle = col; ctx.fillText(s, x, y);

}

// ---------- labels ----------
function yellowBox(s, x, y, size, a = 1, rot = 0, sc = 1) {    // black text on a lime-yellow box (like the original)
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot * D2R); ctx.scale(sc, sc);
  ctx.font = `800 ${size}px MX`; const w = ctx.measureText(s).width + size * .5, h = size * 1.3;

function glowWord(s, x, y, size, kind, a = 1, rot = 0, sc = 1) {   // 'green' = grassy glow, 'ice' = frosty blue glow with icicles
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot * D2R); ctx.scale(sc, sc);

  const G = kind === 'green' ? ['#3dff3a', '#e8ffd0', '#7dff4a', '#1f9a1a'] : ['#2aa8ff', '#f4fbff', '#9fdcff', '#1a5fb0'];
  ctx.shadowColor = G[0]; ctx.shadowBlur = size * .9; ctx.fillStyle = G[0]; ctx.fillText(s, 0, 0); ctx.shadowBlur = size * .35; ctx.fillText(s, 0, 0);

  if (kind === 'ice') { const r = rnd(s.length * 7); ctx.fillStyle = 'rgba(235,248,255,.95)'; for (let i = 0; i < 12; i++) { const ix = -w / 2 + r() * w, l = size * (.12 + r() * .3); ctx.beginPath(); ctx.moveTo(ix - size * .05, size * .32); ctx.lineTo(ix + size * .05, size * .32); ctx.lineTo(ix, size * .32 + l); ctx.fill(); } }
  if (kind === 'green') { const r = rnd(s.length * 3); for (let i = 0; i < 9; i++) { const ix = -w / 2 + r() * w; ctx.fillStyle = i % 2 ? '#7be04a' : '#a8f070'; ctx.beginPath(); ctx.arc(ix, -size * .42, size * (.07 + r() * .07), 0, 7); ctx.fill(); } }
  ctx.restore();
}

// ---------- characters & props ----------
function horns(s, col = '#f2ecdf') {   // pair of horns for a helmet of radius s
  ctx.fillStyle = col; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * s * .78, -s * .35); ctx.quadraticCurveTo(d * s * 1.55, -s * .55, d * s * 1.35, -s * 1.45); ctx.quadraticCurveTo(d * s * 1.18, -s * .85, d * s * .62, -s * .72); ctx.closePath(); ctx.fill(); }
}
function settler(sz = 1) {      // white silhouette viking head (like the original)
  ctx.save(); ctx.scale(sz, sz); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10; ctx.fillStyle = '#fff';
  horns(30, '#fff'); ctx.beginPath(); ctx.arc(0, -8, 30, Math.PI, 0); ctx.lineTo(30, 10); ctx.quadraticCurveTo(30, 52, 0, 60); ctx.quadraticCurveTo(-30, 52, -30, 10); ctx.closePath(); ctx.fill(); ctx.restore();
}
function erik(sz = 1, face = 'n') {    // red-bearded viking head with horned helmet
  ctx.save(); ctx.scale(sz, sz);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16;
  horns(34);
  ctx.fillStyle = '#c92a1e'; ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-40, 56, 0, 74); ctx.quadraticCurveTo(40, 56, 34, 0); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#f2c7a5'; ctx.beginPath(); ctx.ellipse(0, 4, 26, 24, 0, 0, 7); ctx.fill();

  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, -4, 35, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#545a6b'; ctx.fillRect(-36, -8, 72, 9); ctx.fillRect(-4, -8, 8, 26);
  ctx.fillStyle = '#1b1410'; if (face === 'shock') { ctx.beginPath(); ctx.arc(-11, 9, 4, 0, 7); ctx.arc(11, 9, 4, 0, 7); ctx.fill(); } else { ctx.fillRect(-15, 7, 8, 4); ctx.fillRect(7, 7, 8, 4); }
  ctx.fillStyle = '#e0412c'; ctx.beginPath(); ctx.moveTo(-22, 20); ctx.quadraticCurveTo(0, 12, 22, 20); ctx.quadraticCurveTo(14, 28, 0, 24); ctx.quadraticCurveTo(-14, 28, -22, 20); ctx.fill();
  if (face === 'shock') { ctx.fillStyle = '#5a1a12'; ctx.beginPath(); ctx.ellipse(0, 36, 6, 8, 0, 0, 7); ctx.fill(); }

function bigViking() {          // large cartoon viking head (shot 3)
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30;
  horns(150);
  ctx.fillStyle = '#c87a3a'; ctx.beginPath(); ctx.moveTo(-150, 20); ctx.quadraticCurveTo(-170, 260, 0, 330); ctx.quadraticCurveTo(170, 260, 150, 20); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(90,40,10,.6)'; ctx.lineWidth = 5; for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(i * 28, 120); ctx.quadraticCurveTo(i * 34, 220, i * 18, 300); ctx.stroke(); }

  ctx.fillStyle = '#e8a77c'; ctx.beginPath(); ctx.ellipse(0, 70, 26, 40, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a1b12'; ctx.beginPath(); ctx.ellipse(-46, 30, 13, 15, 0, 0, 7); ctx.ellipse(46, 30, 13, 15, 0, 0, 7); ctx.fill();

  ctx.fillStyle = '#a85a26'; ctx.beginPath(); ctx.moveTo(-90, 120); ctx.quadraticCurveTo(-40, 90, 0, 112); ctx.quadraticCurveTo(40, 90, 90, 120); ctx.quadraticCurveTo(50, 150, 0, 134); ctx.quadraticCurveTo(-50, 150, -90, 120); ctx.fill();
  const hg = ctx.createLinearGradient(0, -160, 0, -10); hg.addColorStop(0, '#9fc3c8'); hg.addColorStop(1, '#4f7c86');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, -20, 150, Math.PI, 0); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#7a5530'; for (let i = -5; i <= 5; i++) { ctx.beginPath(); ctx.arc(i * 28, -17, 5, 0, 7); ctx.fill(); }

  ctx.save(); ctx.scale(sz, sz); ctx.rotate(Math.sin(tt * 3) * .05); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#7a4a26'; ctx.beginPath(); ctx.moveTo(-62, -26); ctx.lineTo(66, -26); ctx.lineTo(48, 8); ctx.lineTo(-48, 8); ctx.closePath(); ctx.fill(); ctx.fillRect(-62, -44, 30, 18); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#4a2c14'; ctx.lineWidth = 4; for (const x of [-10, 26]) { ctx.beginPath(); ctx.moveTo(x, -26); ctx.lineTo(x, -110); ctx.stroke(); }
  ctx.fillStyle = '#f4eee0'; for (const x of [-10, 26]) { ctx.beginPath(); ctx.moveTo(x - 26, -100); ctx.quadraticCurveTo(x, -90, x + 26, -100); ctx.lineTo(x + 26, -40); ctx.quadraticCurveTo(x, -32, x - 26, -40); ctx.fill(); }
  ctx.fillStyle = '#c4161f'; ctx.fillRect(-14, -78, 8, 22); ctx.fillRect(-21, -71, 22, 8);

function boot(sz = 1) { ctx.save(); ctx.scale(sz, sz); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.fillStyle = '#7a4a26';
  ctx.beginPath(); ctx.moveTo(-20, -90); ctx.lineTo(20, -90); ctx.lineTo(22, -10); ctx.quadraticCurveTo(70, -8, 74, 14); ctx.lineTo(-22, 14); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#c23a2a'; ctx.fillRect(-22, -96, 44, 14); ctx.fillStyle = '#4a2c14'; ctx.fillRect(-22, 8, 96, 8); ctx.restore(); }
function flower(sz, hue, tt) { ctx.save(); ctx.scale(sz, sz); ctx.rotate(tt); ctx.fillStyle = `hsl(${hue},85%,62%)`; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(Math.cos(i * 1.047) * 11, Math.sin(i * 1.047) * 11, 9, 6, i * 1.047, 0, 7); ctx.fill(); } ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.restore(); }
function emoji(kind, sz = 1) {
  ctx.save(); ctx.scale(sz, sz); const g = ctx.createRadialGradient(-20, -24, 10, 0, 0, 70); g.addColorStop(0, '#ffe680'); g.addColorStop(1, '#f5a623');
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 16; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 64, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#5a3a14'; ctx.strokeStyle = '#5a3a14'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  if (kind === 'meh') { ctx.beginPath(); ctx.moveTo(-34, -10); ctx.lineTo(-12, -10); ctx.moveTo(12, -10); ctx.lineTo(34, -10); ctx.moveTo(-18, 30); ctx.lineTo(18, 30); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-36, -26); ctx.lineTo(-12, -22); ctx.moveTo(36, -26); ctx.lineTo(12, -22); ctx.stroke(); }
  else { ctx.beginPath(); ctx.ellipse(-22, -14, 9, 13, 0, 0, 7); ctx.ellipse(22, -14, 9, 13, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(0, 30, 12, 15, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(-22, -40, 14, Math.PI * 1.15, Math.PI * 1.85); ctx.moveTo(34, -46); ctx.arc(22, -40, 14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  ctx.restore();

function arrowCurve(x0, y0, x1, y1, k = 1, col = '#ecf53b') {
  const cx = (x0 + x1) / 2 + 80, cy = (y0 + y1) / 2 - 40; ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8;
  ctx.beginPath(); const n = 30; for (let i = 0; i <= n * k; i++) { const u = i / n, x = (1 - u) ** 2 * x0 + 2 * (1 - u) * u * cx + u * u * x1, y = (1 - u) ** 2 * y0 + 2 * (1 - u) * u * cy + u * u * y1; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  if (k >= 1) { const a = Math.atan2(y1 - cy, x1 - cx); ctx.beginPath(); ctx.moveTo(x1 - Math.cos(a - .5) * 26, y1 - Math.sin(a - .5) * 26); ctx.lineTo(x1, y1); ctx.lineTo(x1 - Math.cos(a + .5) * 26, y1 - Math.sin(a + .5) * 26); ctx.stroke(); } ctx.restore();

function dashed(pts, k, col = '#f0d23a', w = 7) {   // dashed route lon/lat drawn up to fraction k; returns tip [x,y]

function snow(t, a, n = 160) { if (a <= 0) return; const r = rnd(42); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
  for (let i = 0; i < n; i++) { const sp = 60 + r() * 140, s = 2 + r() * 7, x = (r() * W + Math.sin(t * (.5 + r()) + i) * 30 + W) % W, y = (r() * H + t * sp) % (H + 20) - 10; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill(); } ctx.restore(); }

// ---------- painted photo cards ----------
let CARD = [];
function makeCards() {
  const mk = (fn) => { const c = document.createElement('canvas'); c.width = 400; c.height = 260; const g = c.getContext('2d'); fn(g, rnd(c.width + CARD.length * 13)); return c; };
  const sky = (g, a, b) => { const s = g.createLinearGradient(0, 0, 0, 150); s.addColorStop(0, a); s.addColorStop(1, b); g.fillStyle = s; g.fillRect(0, 0, 400, 260); };
  const hills = (g, r, y, col, amp) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, 260); for (let x = 0; x <= 400; x += 10) g.lineTo(x, y - amp * Math.abs(Math.sin(x / 90 + y)) - r() * 6); g.lineTo(400, 260); g.fill(); };
  // 1: green valley with mountains and a little house
  CARD.push(mk((g, r) => { sky(g, '#6aa6dc', '#d8e8f0'); hills(g, r, 140, '#5b6f8a', 70); g.fillStyle = '#eef3f6'; g.beginPath(); g.moveTo(150, 80); g.lineTo(175, 62); g.lineTo(200, 84); g.fill(); hills(g, r, 180, '#3f8a34', 40); hills(g, r, 220, '#5fb03e', 20);
    g.fillStyle = '#f2ede2'; g.fillRect(260, 196, 34, 20); g.fillStyle = '#b23a2a'; g.beginPath(); g.moveTo(256, 196); g.lineTo(277, 182); g.lineTo(298, 196); g.fill(); }));
  // 2: sunset waterfall cliffs (Kirkjufell-like)
  CARD.push(mk((g, r) => { sky(g, '#f08a4a', '#ffd9a0'); g.fillStyle = '#3a4a3a'; g.beginPath(); g.moveTo(120, 170); g.quadraticCurveTo(170, 40, 230, 60); g.quadraticCurveTo(290, 90, 330, 170); g.fill(); hills(g, r, 200, '#4f8a3a', 25);
    g.fillStyle = '#9fd8f0'; g.fillRect(60, 170, 280, 90); g.fillStyle = 'rgba(255,255,255,.85)'; for (const x of [140, 190, 240]) g.fillRect(x, 186, 12, 50); hills(g, r, 250, '#3f7a2e', 10); }));
