<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «Орыс хан — атасы қазақ хандарының»: Flat Vector (flat shapes, no outlines, one-tone soft shadow, «pop & slide»).
// Scene 2 is a satellite map (project rule: every map is a "from space" map). render(T) is deterministic.
const LANG = new URLSearchParams(location.search).get('lang') || 'ru';
const OW = 1080, OH = 1920;
const NV = '#1D2B53', NV2 = '#16213F', TQ = '#2EC4B6', TQ2 = '#239E93', Y = '#FFD23F', Y2 = '#E0B21F', CO = '#EF476F', CO2 = '#C9375A', CR = '#FFF3D6', CR2 = '#EADBB8';
const SKIN = '#E9B88C', FUR = '#6B4A35', BROW = '#2A1E1A';
const BR = { navy: '#130B54', amber: '#FEB300' };
const c = document.getElementById('c'), ctx = c.getContext('2d');
let B, M, IMG = {}, SH, SYR;

const L = {
  kk: {
    t1: 'ОРЫС ХАН = ?', w1: 'ОРЫС', trap: 'ҰБТ ТҰЗАҒЫ',
    h: { s2: 'XIV ғ. · АҚ ОРДА', s3: 'ОРЫС ХАН vs ТОҚТАМЫС', s4: 'КЕРЕЙ · ЖӘНІБЕК', s5: 'БҰЛ — ЖАЙ ЕСІМ', s6: 'ҰБТ-ҒА ЕСТЕ САҚТА', s7: 'ҰБТ СҰРАҒЫ', s8: 'Сілтеме профиль шапкасында' },
    syg: 'Сығанақ', ao: 'Ақ Орда', syr: 'Сырдария', kz: 'ҚАЗАҚСТАН', age: 'XIV ғасыр',
    khan: 'ОРЫС ХАН', jochi: 'Жошы ұрпағы', a1: 'Тоқтамыс', a2: 'Әмір Темір',
    tree: { orys: 'Орыс хан', bol: 'Болат', kuy: 'Құйыршық', bar: 'Барақ', ker: 'Керей', jan: 'Жәнібек' }, found: 'Қазақ хандығының негізін қалаушылар',
    q5: 'ОРЫС', no: 'ЖОҚ', tagw: 'есім', tags: ['Темір', 'Едіге', 'Тоқтамыс'], tagsub: 'дала есімдері',
    card: 'ҰБТ', rows: ['Ақ Орда — XIV ғ.', 'Астанасы — Сығанақ', 'Керей мен Жәнібек — Орыс ұрпағы'],
    ph: ['Керей мен Жәнібек ескерткіші', '«Қазақ хандығына 550 жыл» монетасы, 2015', 'ҚР Ұлттық банкі · public domain'],
    q: ['Ақ Орданың', 'астанасы?'], opts: [['А', 'Сарайшық'], ['Ә', 'Сығанақ'], ['Б', 'Түркістан']], ok: 1,
    end: 'ОРЫС ХАН', cta: ['Профиль шапкасындағы', 'сілтемеге өтіңіз']
  },
  ru: {
    t1: 'ОРЫС ХАН = ?', w1: 'ОРЫС', trap: 'ЛОВУШКА ЕНТ',
    h: { s2: 'XIV в. · АҚ ОРДА', s3: 'ОРЫС-ХАН vs ТОХТАМЫШ', s4: 'КЕРЕЙ · ЖАНИБЕК', s5: 'ЭТО ПРОСТО ИМЯ', s6: 'ЗАПОМНИ ДЛЯ ЕНТ', s7: 'ВОПРОС С ЕНТ', s8: 'Ссылка в шапке профиля' },
    syg: 'Сыганак', ao: 'Ақ Орда', syr: 'Сырдарья', kz: 'КАЗАХСТАН', age: 'XIV век',
    khan: 'ОРЫС-ХАН', jochi: 'потомок Джучи', a1: 'Тохтамыш', a2: 'Тимур',
    tree: { orys: 'Орыс-хан', bol: 'Болат', kuy: 'Куйыршык', bar: 'Барак', ker: 'Керей', jan: 'Жанибек' }, found: 'основатели Казахского ханства',
    q5: 'ОРЫС', no: 'НЕТ', tagw: 'имя', tags: ['Тимур', 'Едиге', 'Тохтамыш'], tagsub: 'степные имена',
    card: 'ЕНТ', rows: ['Ақ Орда — XIV век', 'Столица — Сыганак', 'Керей и Жанибек — потомки Орыса'],
    ph: ['Памятник Керею и Жанибеку', 'монета «550 лет Казахскому ханству», 2015', 'Нацбанк РК · public domain'],
    q: ['Столица', 'Ақ Орды?'], opts: [['А', 'Сарайшык'], ['Б', 'Сыганак'], ['В', 'Туркестан']], ok: 1,
    end: 'ОРЫС-ХАН', cta: ['Перейдите по ссылке', 'в шапке профиля']
  }
}[LANG];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const ei = x => Math.pow(clamp(x), 3);
const eob = x => { x = clamp(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (T, t0, d) => clamp((T - t0) / d);
const pop = (T, t0, d = .45) => T < t0 ? 0 : eob(win(T, t0, d));            // spring pop-in 0 -> 1 (overshoots)
const out = (T, t0, d = .35) => 1 - ei(win(T, t0, d));                        // 1 -> 0
const live = (T, a, b) => T >= a && T < b;

// ---------- flat drawing ----------
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shadowed(fn, dy = 12, col = 'rgba(8,12,30,.28)') { ctx.save(); ctx.translate(0, dy); fn(col); ctx.restore(); fn(null); }
function box(x, y, w, h, r, fill, sh = 12, shc) { shadowed(cc => { rr(x, y, w, h, r); ctx.fillStyle = cc || fill; ctx.fill(); }, sh, shc); }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function circS(x, y, r, fill, sh = 10) { shadowed(cc => circ(x, y, r, cc || fill), sh); }
function txt(t, x, y, size, col, o = {}) {
  ctx.save(); ctx.font = `${size}px ${o.f || 'MB'}`; ctx.fillStyle = col; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.sh) { ctx.fillStyle = o.sh; ctx.fillText(t, x, y + (o.shd || 6)); ctx.fillStyle = col; }
  ctx.fillText(t, x, y); ctx.restore();
}
function tw(t, size, f = 'MB') { ctx.save(); ctx.font = `${size}px ${f}`; const w = ctx.measureText(t).width; ctx.restore(); return w; }
function fit(t, base, maxW, f = 'MB') { return Math.min(base, Math.floor(base * maxW / tw(t, base, f))); }
function pill(t, x, y, size, bg, fg, o = {}) {           // rounded label, centred on x,y
  const w = tw(t, size, o.f || 'MB') + size * 1.1, h = size * 1.75;
  box(x - w / 2, y - h / 2, w, h, h / 2, bg, o.sh ?? 8); txt(t, x, y + size * .04, size, fg, { f: o.f }); return w;
}
function scaleAt(x, y, s, r = 0) { ctx.translate(x, y); if (r) ctx.rotate(r); ctx.scale(s, s); ctx.translate(-x, -y); }

// ---------- flat icons ----------
function crown(x, y, s, col = Y, gem = CO) {          // Turkic khan crown: fur rim + gold top with three points; (x,y) = bottom centre
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  shadowed(cc => {
    ctx.beginPath(); ctx.moveTo(-90, -40); ctx.lineTo(-100, -150); ctx.lineTo(-48, -96); ctx.lineTo(0, -178); ctx.lineTo(48, -96); ctx.lineTo(100, -150); ctx.lineTo(90, -40); ctx.closePath();
    ctx.fillStyle = cc || col; ctx.fill();
    rr(-112, -52, 224, 56, 28); ctx.fillStyle = cc || FUR; ctx.fill();
  }, 10);
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.moveTo(-90, -40); ctx.lineTo(-100, -150); ctx.lineTo(-48, -96); ctx.lineTo(-30, -60); ctx.closePath(); ctx.fill();
  circ(0, -120, 15, gem); circ(-100, -150, 10, col); circ(100, -150, 10, col); circ(0, -178, 12, col);
  ctx.restore();
}
function khan(x, y, s, T, o = {}) {                    // flat character; (x,y) = feet centre. Turkic robe (shapan), belt, fur-rim crown, brows only
  const robe = o.robe || TQ, robe2 = o.robe2 || TQ2, bob = Math.sin(T * 2.4) * 4;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(8,12,30,.25)'; ctx.beginPath(); ctx.ellipse(0, 6, 200, 30, 0, 0, 7); ctx.fill();
  ctx.translate(0, bob);
  shadowed(cc => {
    ctx.beginPath(); ctx.moveTo(-95, -430); ctx.lineTo(95, -430); ctx.lineTo(185, 0); ctx.lineTo(-185, 0); ctx.closePath(); ctx.fillStyle = cc || robe; ctx.fill();
  }, 12);
  ctx.fillStyle = robe2; ctx.beginPath(); ctx.moveTo(-10, -430); ctx.lineTo(70, -430); ctx.lineTo(40, 0); ctx.lineTo(-110, 0); ctx.closePath(); ctx.fill();   // overlapping lapel
  ctx.fillStyle = Y; ctx.beginPath(); ctx.moveTo(10, -430); ctx.lineTo(30, -430); ctx.lineTo(-40, 0); ctx.lineTo(-62, 0); ctx.closePath(); ctx.fill();          // gold trim
  rr(-140, -250, 280, 38, 10); ctx.fillStyle = Y2; ctx.fill(); rr(-26, -258, 52, 54, 10); ctx.fillStyle = Y; ctx.fill();                                   // belt + buckle
  rr(-120, -470, 240, 60, 30); ctx.fillStyle = FUR; ctx.fill();                                                                                           // fur collar
  // head
  circS(0, -560, 110, SKIN, 8);
  ctx.fillStyle = BROW; const bw = o.angry ? .22 : .08;
  [[-1, 1], [1, -1]].forEach(([sx, r]) => { ctx.save(); ctx.translate(sx * 42, -585); ctx.rotate(r * bw * sx * sx); rr(-30, -9, 60, 18, 9); ctx.fill(); ctx.restore(); });
  ctx.beginPath(); ctx.moveTo(-46, -505); ctx.quadraticCurveTo(0, -530, 46, -505); ctx.quadraticCurveTo(0, -515, -46, -505); ctx.fill();                  // moustache
  ctx.beginPath(); ctx.moveTo(-18, -470); ctx.quadraticCurveTo(0, -430, 18, -470); ctx.closePath(); ctx.fill();                                          // small beard
  crown(0, -630, .95);
  ctx.restore();
}
function headIcon(x, y, r, T, col) {                  // mini khan inside a tree node
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
  circ(x, y, r, col);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.moveTo(x - r * .7, y + r); ctx.lineTo(x - r * .45, y + r * .45); ctx.lineTo(x + r * .45, y + r * .45); ctx.lineTo(x + r * .7, y + r); ctx.fill();
  circ(x, y + r * .02, r * .36, SKIN);
  ctx.fillStyle = BROW; rr(x - r * .26, y - r * .1, r * .2, r * .07, 3); ctx.fill(); rr(x + r * .06, y - r * .1, r * .2, r * .07, 3); ctx.fill();
  ctx.restore();
  crown(x, y - r * .3, r * .0036, Y, CO);
}
function yurt(x, y, s) {                              // flat yurt with a flag; (x,y) = bottom centre
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  shadowed(cc => {
    ctx.beginPath(); ctx.moveTo(-120, 0); ctx.lineTo(-120, -80); ctx.quadraticCurveTo(-60, -170, 0, -175); ctx.quadraticCurveTo(60, -170, 120, -80); ctx.lineTo(120, 0); ctx.closePath();
    ctx.fillStyle = cc || CR; ctx.fill();
  }, 10);
  ctx.fillStyle = CR2; ctx.fillRect(-120, -80, 240, 22);
  ctx.fillStyle = CO; ctx.fillRect(-120, -92, 240, 12);
  rr(-30, -70, 60, 70, 8); ctx.fillStyle = CO2; ctx.fill();
  ctx.fillStyle = FUR; ctx.fillRect(-4, -270, 8, 100);
  ctx.fillStyle = CR; ctx.beginPath(); ctx.moveTo(4, -270); ctx.lineTo(110, -248); ctx.lineTo(4, -222); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function arrowShape(x, y, len, h, col, col2) {         // pointing left, tip at (x,y)
  shadowed(cc => {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + h * .9, y - h * .75); ctx.lineTo(x + h * .9, y - h * .32); ctx.lineTo(x + len, y - h * .32);
    ctx.lineTo(x + len, y + h * .32); ctx.lineTo(x + h * .9, y + h * .32); ctx.lineTo(x + h * .9, y + h * .75); ctx.closePath(); ctx.fillStyle = cc || col; ctx.fill();
  }, 10);
  ctx.fillStyle = col2; ctx.fillRect(x + len - 40, y - h * .32, 22, h * .64);
}
function check(x, y, r, col, k) {                      // flat check badge
  if (k <= 0) return; ctx.save(); scaleAt(x, y, k); circS(x, y, r, col, 6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .45, y + r * .02); ctx.lineTo(x - r * .1, y + r * .36); ctx.lineTo(x + r * .48, y - r * .34); ctx.stroke(); ctx.restore();
}

// ---------- backgrounds ----------
function bgNavy(T) {
  ctx.fillStyle = NV; ctx.fillRect(0, 0, OW, OH);
  // a few soft flat discs drifting (depth without gradients)
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  [[160, 300, 260], [940, 760, 340], [220, 1500, 300], [900, 1750, 200]].forEach(([x, y, r], i) => circ(x + Math.sin(T * .3 + i) * 30, y + Math.cos(T * .25 + i) * 30, r, 'rgba(255,255,255,.035)'));
}
function bgCream(T) {
  ctx.fillStyle = CR; ctx.fillRect(0, 0, OW, OH);
  [[150, 360, 240], [960, 1300, 330], [300, 1650, 200]].forEach(([x, y, r], i) => circ(x + Math.sin(T * .3 + i) * 25, y + Math.cos(T * .25 + i) * 25, r, 'rgba(29,43,83,.05)'));
}

// ---------- scene 1: «ОРЫС» ----------
function scene1(T) {
  const tEnd = M.s2; if (T > tEnd + .1) return;
  const z = 1 + .05 * ease(win(T, 0, tEnd));                     // slow push-in on the word
  const slide = ease(win(T, tEnd - .55, .55));                   // everything slides out to the left
  ctx.save(); ctx.translate(-OW * 1.1 * slide, 0); scaleAt(540, 900, z);
  // title
  const kt = pop(T, .1, .5); ctx.save(); scaleAt(540, 330, kt); txt(L.t1, 540, 330, fit(L.t1, 96, 900), NV, { sh: 'rgba(29,43,83,.15)' }); ctx.restore();
  // crown
  const kc = pop(T, .3, .55), hit = M.orys, sq = T > hit ? Math.exp(-(T - hit) * 7) * Math.sin((T - hit) * 30) * .06 : 0;
  ctx.save(); scaleAt(540, 760, kc * (1 + sq)); crown(540, 760, 1.7); ctx.restore();
  // the word
  const kw = pop(T, hit - .05, .5), hit2 = M.orys2, sh2 = T > hit2 ? Math.exp(-(T - hit2) * 6) * Math.sin((T - hit2) * 38) * 16 : 0;
  if (kw > 0) { ctx.save(); scaleAt(540, 960, kw); ctx.translate(sh2, 0); const f = fit(L.w1, 300, 960); txt(L.w1, 540, 980, f, NV, { sh: Y, shd: 14 }); ctx.restore(); }
  // trap badge slides in from the right
  const kb = eo(win(T, 1.2, .5)), bx = lerp(1400, 640, kb) + (kb >= 1 ? Math.sin(T * 5) * 4 : 0);
  ctx.save(); ctx.translate(bx, 1230); ctx.rotate(-.05); pill(L.trap, 0, 0, 58, Y, NV, { sh: 10 }); ctx.restore();
  ctx.restore();
}

// ---------- scene 2: satellite map ----------
let CAM = { lon: 67, lat: 47, ppd: 30 };
const KX = () => Math.cos(CAM.lat * Math.PI / 180);
const P = (lon, lat) => [OW / 2 + (lon - CAM.lon) * CAM.ppd * KX(), OH / 2 - (lat - CAM.lat) * CAM.ppd];
const SYG = [66.961, 44.157];
function mapCam(T) {
  const a = M.s2, K = [[a - .6, 67.5, 48.2, 30], [M.xiv, 67.0, 47.4, 28], [M.syg - .3, 66.9, 45.6, 44], [M.syg + 1.6, 66.96, 44.4, 92], [M.s3 + .5, 66.96, 44.3, 100]];
  let i = 0; while (i < K.length - 2 && T >= K[i + 1][0]) i++;
  const p = K[i], q = K[i + 1], k = ease((T - p[0]) / Math.max(.01, q[0] - p[0]));
  return { lon: lerp(p[1], q[1], k), lat: lerp(p[2], q[2], k), ppd: Math.exp(lerp(Math.log(p[3]), Math.log(q[3]), k)) };
}
function texPart(im, l0, l1, b0, b1) {
  if (!im) return; const [x0, y0] = P(l0, b1), [x1, y1] = P(l1, b0);
  const sx0 = Math.max(0, x0), sy0 = Math.max(0, y0), sx1 = Math.min(OW, x1), sy1 = Math.min(OH, y1); if (sx1 <= sx0 || sy1 <= sy0) return;
  const fx = im.width / (x1 - x0), fy = im.height / (y1 - y0);
  ctx.drawImage(im, (sx0 - x0) * fx, (sy0 - y0) * fy, (sx1 - sx0) * fx, (sy1 - sy0) * fy, sx0, sy0, sx1 - sx0, sy1 - sy0);
}
function drawTex() { ctx.fillStyle = '#0d2236'; ctx.fillRect(0, 0, OW, OH); texPart(IMG.world, -180, 180, -90, 90); texPart(IMG.ca, 40, 90, 30, 58); }
function pathRings(rings) { ctx.beginPath(); for (const r of rings) r.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); }
function polyPart(pts, k) {
  const S = pts.map(p => P(p[0], p[1])); let tot = 0; const d = [0];
  for (let i = 1; i < S.length; i++) { tot += Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]); d.push(tot); }
  const lim = tot * clamp(k); ctx.beginPath(); ctx.moveTo(S[0][0], S[0][1]);
  for (let i = 1; i < S.length; i++) { if (d[i] <= lim) ctx.lineTo(S[i][0], S[i][1]); else { const f = (lim - d[i - 1]) / (d[i] - d[i - 1] || 1); ctx.lineTo(lerp(S[i - 1][0], S[i][0], f), lerp(S[i - 1][1], S[i][1], f)); break; } }
}
function scene2(T) {
  if (T < M.s2 - .6 || T > M.s3 + .7) return;
  CAM = mapCam(T);
  drawTex();
  ctx.fillStyle = 'rgba(6,12,30,.30)'; ctx.fillRect(0, 0, OW, OH);
  // Kazakhstan: soft amber glow along the border, very light fill
  const kz = SH.cty.KAZ, ka = win(T, M.s2 + .1, .8);
  ctx.save(); ctx.globalAlpha = ka; pathRings(kz); ctx.fillStyle = 'rgba(254,179,0,.10)'; ctx.fill('evenodd');
  ctx.shadowColor = BR.amber; ctx.shadowBlur = 22; ctx.strokeStyle = BR.amber; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  // country label
  const kl = win(T, M.s2 + .5, .6) * (1 - win(T, M.ao - .2, .3));
  if (kl > 0) { ctx.save(); ctx.globalAlpha = kl; const [x, y] = P(67.5, 48.6); txt(L.kz, x, y, 64, 'rgba(255,255,255,.9)', { sh: 'rgba(0,0,0,.5)', shd: 4 }); ctx.restore(); }
  // Syr Darya draws in, turquoise
  const ks = ease(win(T, M.ao - .4, 1.6));
  if (ks > 0) {
    ctx.save(); polyPart(SYR, ks); ctx.strokeStyle = TQ; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = TQ; ctx.shadowBlur = 18; ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    const lk = win(T, M.syg + .6, .5); if (lk > 0) { ctx.save(); ctx.globalAlpha = lk; const [x, y] = P(63.0, 46.0); pill(L.syr, x, y, 34, 'rgba(19,11,84,.85)', TQ, { sh: 0 }); ctx.restore(); }
  }
  // Ak Orda: big flat label over the steppe
  const ak = pop(T, M.ao, .5) * (1 - win(T, M.syg + .2, .5));
  if (ak > 0) { const [x, y] = P(66.5, 47.2); ctx.save(); scaleAt(x, y, ak); pill(L.ao.toUpperCase(), x, y, 72, Y, NV, { sh: 10 }); txt(L.age, x, y + 105, 44, '#fff', { sh: 'rgba(0,0,0,.5)', shd: 4 }); ctx.restore(); }
  // Sygnak: glow + ping + yurt with the Ak Orda flag + name pill
  const sk = pop(T, M.syg, .5);
  if (sk > 0) {
    const [x, y] = P(SYG[0], SYG[1]);
    const pr = (T - M.syg) % 1.6 / 1.6; ctx.save(); ctx.globalAlpha = (1 - pr) * .8; ctx.strokeStyle = BR.amber; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 14 + pr * 90, 0, 7); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.shadowColor = BR.amber; ctx.shadowBlur = 30; circ(x, y, 14 * sk, BR.amber); ctx.restore(); circ(x, y, 6 * sk, '#fff');
    ctx.save(); scaleAt(x, y - 30, sk); yurt(x + 150, y - 40, .95);

// ---------- scene 4: family tree ----------

function scene4(T) {
