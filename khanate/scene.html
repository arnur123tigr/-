<!doctype html>
<html><head><meta charset="utf-8">
<title>Khanate PS2 reel</title>
<style>
@font-face{font-family:Mont;src:url(fonts/Montserrat-Bold.ttf);font-weight:700}
@font-face{font-family:Mont;src:url(fonts/Montserrat-Black.ttf);font-weight:900}
html,body{margin:0;background:#000}
canvas{display:block;width:540px;height:960px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// ---------------------------------------------------------------
// PS2-style low-poly POV reel: "1465: твой аул уходит за Кереем и Жанибеком"
// Deterministic: window.render(t) draws the frame for time t (sec).
// Two sets: the dry steppe around the origin (s1-s4) and the green Chu valley
// (Zhetysu) at x = VX (s5-end). Camera is first-person most of the time.
// ---------------------------------------------------------------
import * as THREE from 'three';

await document.fonts.load('900 80px Mont'); await document.fonts.load('700 80px Mont');
const W = 1080, H = 1920, LW = 486, LH = 864;
const out = document.getElementById('c'), O = out.getContext('2d');
const glc = document.createElement('canvas'); glc.width = LW; glc.height = LH;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, preserveDrawingBuffer: true });
renderer.setSize(LW, LH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, LW / LH, 0.1, 800);
camera.rotation.order = 'YXZ';

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const smooth = (a, b, x) => ease((x - a) / (b - a));

// ---------- materials ----------
const mats = {};
function mat(c, o = {}) {
  const k = c + JSON.stringify(o);
  if (!mats[k]) mats[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c, flatShading: true }, o));
  return mats[k];
}
function mesh(geo, m) { return new THREE.Mesh(geo, m); }
function place(m, o) { if (o.position) m.position.copy(o.position); if (o.rotation) m.rotation.copy(o.rotation); return m; }
function canvasTex(w, h, draw, nearest = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
  return t;
}
const texMat = (tex, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ map: tex }, o));
const C = {
  felt: '#EDE6D3', feltD: '#D6CCB2', lattice: '#B8682E', wood: '#8A5A30', woodD: '#5E3B1E', black: '#151515',
  skin: '#C98E62', skinD: '#A8714A', chapan: '#7A4E2A', fur: '#5A3E26', velvet: '#7E2A22', blue: '#2F5FB0',
  white: '#F4F1E8', red: '#C0222A', gold: '#E2B23A', horse: '#8A4E26', horseD: '#3A2414', camel: '#C49A62', camelD: '#A07A48'
};

// ---------- sky dome, sun, moon, stars ----------
const dome = mesh(new THREE.SphereGeometry(650, 16, 12), new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
dome.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(dome.geometry.attributes.position.count * 3), 3));
dome.renderOrder = -10; scene.add(dome);
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color(), _cc = new THREE.Color();
function setSky(top, mid, hor) {
  _c1.set(top); _c2.set(mid); _c3.set(hor);
  const p = dome.geometry.attributes.position, c = dome.geometry.attributes.color;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 650;
    if (y > 0.25) _cc.copy(_c2).lerp(_c1, (y - 0.25) / 0.75); else if (y > 0) _cc.copy(_c3).lerp(_c2, y / 0.25); else _cc.copy(_c3);
    c.setXYZ(i, _cc.r, _cc.g, _cc.b);
  }
  c.needsUpdate = true; scene.fog.color.copy(_c3);
}
scene.fog = new THREE.Fog('#DDE6DA', 60, 300);
const sunM = mesh(new THREE.CircleGeometry(26, 10), new THREE.MeshBasicMaterial({ color: '#FFF4C8', fog: false })); sunM.renderOrder = -9; scene.add(sunM);
const moonM = mesh(new THREE.CircleGeometry(16, 10), new THREE.MeshBasicMaterial({ color: '#E8ECF8', fog: false })); moonM.renderOrder = -9; scene.add(moonM);
const starG = new THREE.BufferGeometry(); { const a = []; for (let i = 0; i < 300; i++) { const th = hash(i) * Math.PI * 2, ph = 0.08 + hash(i + 99) * 1.3; a.push(Math.cos(th) * Math.cos(ph) * 600, Math.sin(ph) * 600, Math.sin(th) * Math.cos(ph) * 600); } starG.setAttribute('position', new THREE.Float32BufferAttribute(a, 3)); }
const stars = new THREE.Points(starG, new THREE.PointsMaterial({ color: '#FFFFFF', size: 2, sizeAttenuation: false, fog: false, transparent: true })); scene.add(stars);
const hemi = new THREE.HemisphereLight('#E6F0FF', '#8C7A55', 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight('#FFF1D6', 2.2); sun.position.set(-40, 60, 30); scene.add(sun);
function skyBodies(sunDir, sunOn, moonOn, starOp) {
  const cp = camera.position;
  sunM.visible = sunOn > 0; sunM.position.copy(cp).addScaledVector(sunDir, 560); sunM.lookAt(cp); sunM.material.color.set(sunOn > 0.5 ? '#FFF4C8' : '#FFB070');
  moonM.visible = moonOn > 0; moonM.position.copy(cp).addScaledVector(V(-sunDir.x, Math.abs(sunDir.y) + 0.25, -sunDir.z).normalize(), 560); moonM.lookAt(cp);
  stars.visible = starOp > 0.01; stars.material.opacity = starOp; stars.position.copy(cp);
  dome.position.copy(cp);
}
// named sky palettes
const SKY = {
  morning: ['#4C86CC', '#9CC4E4', '#F3DDB4'], day: ['#3A7CD0', '#7FB7E8', '#DCE9E2'], storm: ['#22262F', '#3E434E', '#7A7A72'],
  sunset: ['#38488A', '#C9786A', '#F6AE5E'], night: ['#050A1C', '#0E1836', '#26304E'], valley: ['#2F79D6', '#78B6EC', '#E4F0EA']
};
function mixSky(a, b, k) { return a.map((c, i) => '#' + new THREE.Color(c).lerp(new THREE.Color(b[i]), k).getHexString()); }

// ---------- terrain ----------
const VX = 2000;   // valley set offset
function hS(x, z) {
  let h = 0.5 * Math.sin(x * 0.045 + 1) * Math.cos(z * 0.038) + 0.25 * Math.sin(x * 0.11 + z * 0.09) + 0.15 * Math.sin(z * 0.21 - x * 0.05);
  h += 7 * Math.exp(-((x - 200) ** 2 + (z + 88) ** 2) / (34 * 34));            // khan's hill (s3)
  const r = Math.hypot(x, z); h += Math.min(14, 0.0012 * Math.max(0, r - 140) ** 2);
  return h;
}
const rz = x => -40 + 12 * Math.sin(x * 0.025);
function hV(x, z) {           // local valley coords
  let h = 0.25 * Math.sin(x * 0.06 + 0.5) * Math.cos(z * 0.05) + 0.15 * Math.sin(x * 0.13 - z * 0.1);
  h += 9 * Math.exp(-(x * x / (45 * 45) + (z - 40) ** 2 / (22 * 22)));          // viewpoint hill
  h += -1.5 * Math.exp(-((z - rz(x)) ** 2) / (5.5 * 5.5));                       // river bed
  h += 12 * smooth(90, 220, Math.abs(x)) + 8 * smooth(-150, -240, z) + 5 * smooth(70, 140, z);
  return h;
}
function terrain(size, segs, hfn, colfn, ox) {
  const g = new THREE.PlaneGeometry(size, size, segs, segs).rotateX(-Math.PI / 2).toNonIndexed();
  const p = g.attributes.position, col = new Float32Array(p.count * 3), cc = new THREE.Color();
  for (let i = 0; i < p.count; i++) p.setY(i, hfn(p.getX(i), p.getZ(i)));
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3, cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    cc.set(colfn(cx, cy, cz, hash(i * 0.37)));
    for (let k = 0; k < 3; k++) col.set([cc.r, cc.g, cc.b], (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })); m.position.x = ox; scene.add(m); return m;
}
const steppeCols = ['#B8B05A', '#A6A84E', '#C4B468', '#9FA34A', '#B3A956'];
terrain(900, 130, hS, (x, y, z, r) => steppeCols[Math.floor(r * steppeCols.length)], 0);
const valleyCols = ['#5EA640', '#4E9636', '#6DB24A', '#58A03C'];
terrain(820, 170, hV, (x, y, z, r) => {
  if (y < -0.3) return '#6E8A52';
  if (y > 10) return ['#8A9A50', '#7C8E4A'][Math.floor(r * 2)];
  return valleyCols[Math.floor(r * valleyCols.length)];
}, VX);
const water = mesh(new THREE.PlaneGeometry(820, 820).rotateX(-Math.PI / 2), mat('#3D92C8')); water.position.set(VX, -0.45, 0); scene.add(water);
// valley mountains
const mtns = new THREE.Group(); mtns.position.x = VX; scene.add(mtns);
for (let i = 0; i < 16; i++) {
  const x = -380 + i * 50 + (hash(i) - 0.5) * 30, z = -300 - hash(i + 5) * 70, h = 70 + hash(i + 9) * 70, r = 55 + hash(i + 3) * 35;
  const m = mesh(new THREE.ConeGeometry(r, h, 6, 1), mat(i % 2 ? '#6B7C96' : '#5F708B')); m.position.set(x, h / 2 - 4, z); m.rotation.y = hash(i) * 3; mtns.add(m);
  const s = mesh(new THREE.ConeGeometry(r * 0.32, h * 0.32, 6, 1), mat('#F4F6FA')); s.position.set(x, h - 4 - h * 0.16 + 0.3, z); s.rotation.y = m.rotation.y; mtns.add(s);
}
// grass tufts + flowers (instanced)
function scatter(n, cx, cz, R, hfn, ox, geo, cols, sc = 1) {
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ flatShading: true }), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), cc = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const a = hash(i * 1.7 + cx) * Math.PI * 2, r = Math.sqrt(hash(i * 2.3 + cz)) * R, x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    const y = hfn(x, z); if (y < -0.3) { m4.makeScale(0, 0, 0); im.setMatrixAt(i, m4); continue; }
    q.setFromEuler(new THREE.Euler(0, hash(i) * 6, 0)); const s = sc * (0.7 + hash(i * 5) * 0.7);
    m4.compose(V(x + ox, y, z), q, V(s, s, s)); im.setMatrixAt(i, m4); im.setColorAt(i, cc.set(cols[i % cols.length]));
  }
  scene.add(im); return im;
}
const tuft = new THREE.ConeGeometry(0.14, 0.5, 3).translate(0, 0.25, 0);
scatter(1400, 0, 0, 45, hS, 0, tuft, ['#C9BC62', '#9EA44C', '#D8C878']);
scatter(1200, -200, 0, 55, hS, 0, tuft, ['#C9BC62', '#9EA44C', '#D8C878']);
scatter(500, 200, -10, 40, hS, 0, tuft, ['#C9BC62', '#9EA44C']);
scatter(2600, 0, -10, 95, hV, VX, tuft, ['#4E9A34', '#69B446', '#3F8A2C']);
scatter(700, 0, -10, 95, hV, VX, new THREE.IcosahedronGeometry(0.09, 0).translate(0, 0.35, 0), ['#F2D23A', '#E8473A', '#FFFFFF', '#C070E0']);

// ---------- clouds ----------
function cloud(x, y, z, s, col = '#FFFFFF') {
  const g = new THREE.Group(); g.position.set(x, y, z);
  for (let k = 0; k < 7; k++) { const m = mesh(new THREE.IcosahedronGeometry(1, 0), mat(col, { emissive: '#7A808C' })); m.position.set((k - 3) * 1.6 * s + hash(k + x) * s, hash(k * 3 + z) * 1.2 * s, hash(k * 7) * 1.4 * s); m.scale.setScalar(s * (1.4 + hash(k + y) * 1.2)); g.add(m); }
  scene.add(g); return g;
}
const clouds = [];
for (let i = 0; i < 12; i++) clouds.push(cloud(-260 + i * 48, 70 + hash(i) * 30, -150 - hash(i + 1) * 120, 6 + hash(i + 2) * 4));
for (let i = 0; i < 10; i++) clouds.push(cloud(VX - 260 + i * 55, 85 + hash(i + 4) * 30, -180 - hash(i + 8) * 100, 7 + hash(i + 2) * 4));

// ---------- helpers ----------
const _up = V(0, 1, 0);
function link(m, a, b) { const d = b.clone().sub(a), L = d.length(); m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(_up, d.normalize()); m.scale.set(1, L, 1); }
function makeFlag(w, h, col) {
  const g = new THREE.PlaneGeometry(w, h, 6, 2).translate(w / 2, -h / 2, 0);
  const m = mesh(g, new THREE.MeshLambertMaterial({ color: col, side: THREE.DoubleSide, flatShading: true }));
  m.userData.base = g.attributes.position.array.slice(); return m;
}
function waveFlag(f, T, amp = 1) {
  const p = f.geometry.attributes.position, b = f.userData.base;
  for (let i = 0; i < p.count; i++) { const x = b[i * 3]; p.setZ(i, amp * 0.18 * x * Math.sin(x * 3.0 - T * 6.5)); }
  p.needsUpdate = true;
}
function banner(col, h = 5.5) {   // tug: pole, gold spear tip, horsetail, flag
  const g = new THREE.Group();
  g.add(place(mesh(new THREE.CylinderGeometry(0.05, 0.07, h, 5), mat(C.woodD)), { position: V(0, h / 2, 0) }));
  g.add(place(mesh(new THREE.ConeGeometry(0.1, 0.45, 4), mat(C.gold, { emissive: '#4A3000' })), { position: V(0, h + 0.22, 0) }));
  g.add(place(mesh(new THREE.ConeGeometry(0.22, 0.8, 6).rotateX(Math.PI), mat('#1E1A18')), { position: V(0, h - 0.4, 0) }));
  const f = makeFlag(1.6, 1.0, col); f.position.y = h - 0.7; g.add(f); g.userData.flag = f;
  scene.add(g); return g;
}

// ---------- yurt ----------
const latticeTex = canvasTex(32, 16, (c, w, h) => {
  c.fillStyle = '#2E2016'; c.fillRect(0, 0, w, h); c.strokeStyle = C.lattice; c.lineWidth = 1.5;
  for (let i = -16; i < 48; i += 6) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + 16, h); c.stroke(); c.beginPath(); c.moveTo(i + 16, 0); c.lineTo(i, h); c.stroke(); }
});
latticeTex.wrapS = THREE.RepeatWrapping; latticeTex.repeat.set(6, 1);
const feltTex = canvasTex(16, 32, (c, w, h) => {
  c.fillStyle = C.felt; c.fillRect(0, 0, w, h); c.fillStyle = '#E0D8C2'; for (let i = 0; i < 20; i++) c.fillRect((i * 7) % w, (i * 11) % h, 2, 1);
  c.fillStyle = '#A3242A'; c.fillRect(0, 0, w, 6); c.fillStyle = '#F4EEDC'; for (let x = 0; x < w; x += 4) { c.fillRect(x, 2, 2, 2); }
  c.fillStyle = '#2E4E8E'; c.fillRect(0, 6, w, 1);
});
const roofTex = canvasTex(16, 16, (c, w, h) => { c.fillStyle = C.feltD; c.fillRect(0, 0, w, h); c.fillStyle = '#C9BEA2'; for (let i = 0; i < 14; i++) c.fillRect((i * 5) % w, (i * 9) % h, 2, 1); });
const uykTex = canvasTex(32, 8, (c, w, h) => { c.fillStyle = '#2E2016'; c.fillRect(0, 0, w, h); c.fillStyle = '#C0703A'; for (let x = 0; x < w; x += 4) c.fillRect(x, 0, 1, h); });
uykTex.wrapS = THREE.RepeatWrapping; uykTex.repeat.set(4, 1);
function yurt(x, y, z, r = 2.6, ry = 0, big = false) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; const N = 12, hw = 1.45 * (big ? 1.25 : 1);
  g.add(place(mesh(new THREE.CylinderGeometry(r, r, hw, N, 1, true), texMat(latticeTex, { side: THREE.DoubleSide })), { position: V(0, hw / 2, 0) }));
  g.add(place(mesh(new THREE.ConeGeometry(r + 0.1, 1.3, N, 1, true), texMat(uykTex, { side: THREE.DoubleSide })), { position: V(0, hw + 0.62, 0) }));
  const wallP = [], roofP = [];
  for (let k = 0; k < N; k++) {
    const w = mesh(new THREE.CylinderGeometry(r + 0.05, r + 0.05, hw, 2, 1, true, k / N * Math.PI * 2, Math.PI * 2 / N), big ? mat('#F6F2E6') : texMat(feltTex, { side: THREE.DoubleSide }));
    w.position.y = hw / 2; g.add(w); wallP.push(w);
    const rf = mesh(new THREE.ConeGeometry(r + 0.18, 1.35, 2, 1, true, k / N * Math.PI * 2, Math.PI * 2 / N), big ? mat('#F6F2E6') : texMat(roofTex, { side: THREE.DoubleSide }));
    rf.position.y = hw + 0.64; g.add(rf); roofP.push(rf);
  }
  if (big) { // gold band + crown for the khan's white horde
    g.add(place(mesh(new THREE.CylinderGeometry(r + 0.08, r + 0.08, 0.3, N, 1, true), mat(C.gold, { emissive: '#4A3000', side: THREE.DoubleSide })), { position: V(0, hw - 0.2, 0) }));
    g.add(place(mesh(new THREE.ConeGeometry(0.25, 0.9, 6), mat(C.gold, { emissive: '#5A3A00' })), { position: V(0, hw + 1.75, 0) }));
  }
  g.add(place(mesh(new THREE.TorusGeometry(0.42, 0.07, 4, 10).rotateX(Math.PI / 2), mat(C.woodD)), { position: V(0, hw + 1.25, 0) }));
  g.add(place(mesh(new THREE.BoxGeometry(0.9, 1.15, 0.12), mat('#B4462A')), { position: V(0, 0.58, r + 0.04) }));
  g.add(place(mesh(new THREE.BoxGeometry(0.5, 0.06, 0.13), mat(C.gold)), { position: V(0, 0.85, r + 0.06) }));
  scene.add(g); return { g, wallP, roofP };
}
function roll(len = 1.6, r = 0.3) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(r, r, len, 8).rotateZ(Math.PI / 2), mat(C.felt)));
  for (const s of [-1, 1]) g.add(place(mesh(new THREE.CircleGeometry(r * 0.98, 8).rotateY(s * Math.PI / 2), mat('#CFC4A8')), { position: V(s * len / 2 * 1.001, 0, 0) }));
  for (const s of [-0.35, 0.35]) g.add(place(mesh(new THREE.CylinderGeometry(r * 1.03, r * 1.03, 0.08, 8).rotateZ(Math.PI / 2), mat(C.velvet)), { position: V(s * len, 0, 0) }));
  scene.add(g); return g;
}

// ---------- people ----------
function person(o) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const hips = new THREE.Group(); hips.position.y = 0.95; body.add(hips);
  const legs = [-1, 1].map(s => {
    const th = new THREE.Group(); th.position.set(s * 0.13, 0, 0); hips.add(th);
    th.add(place(mesh(new THREE.BoxGeometry(0.2, 0.48, 0.22), mat(o.legs)), { position: V(0, -0.24, 0) }));
    const sh = new THREE.Group(); sh.position.y = -0.48; th.add(sh);
    sh.add(place(mesh(new THREE.BoxGeometry(0.18, 0.44, 0.2), mat(o.legs)), { position: V(0, -0.22, 0) }));
    sh.add(place(mesh(new THREE.BoxGeometry(0.2, 0.12, 0.32), mat(o.shoes)), { position: V(0, -0.43, 0.05) }));
    return { th, sh };
  });
  const torso = new THREE.Group(); hips.add(torso);
  torso.add(mesh(new THREE.CylinderGeometry(0.27, 0.36, 0.68, 6).translate(0, 0.34, 0), mat(o.coat)));
  const sk = mesh(new THREE.CylinderGeometry(0.36, o.dress ? 0.5 : 0.42, o.dress ? 0.85 : 0.6, 6).translate(0, o.dress ? -0.42 : -0.3, 0), mat(o.coat)); torso.add(sk); o._skirt = sk;
  if (o.trim) { torso.add(place(mesh(new THREE.BoxGeometry(0.08, 0.66, 0.05), mat(o.trim, { emissive: '#3A2600' })), { position: V(0.04, 0.32, 0.31) })); }
  if (o.sash) torso.add(place(mesh(new THREE.CylinderGeometry(0.33, 0.35, 0.1, 6), mat(o.sash)), { position: V(0, 0.08, 0) }));
  if (o.bib) torso.add(place(mesh(new THREE.BoxGeometry(0.36, 0.34, 0.06), mat(C.white)), { position: V(0, 0.55, 0.27), rotation: new THREE.Euler(-0.15, 0, 0) }));
  const arms = [-1, 1].map(s => {
    const sh = new THREE.Group(); sh.position.set(s * 0.34, 0.62, 0); torso.add(sh);
    sh.add(place(mesh(new THREE.BoxGeometry(0.16, 0.58, 0.17), mat(o.coat)), { position: V(0, -0.28, 0) }));
    sh.add(place(mesh(new THREE.IcosahedronGeometry(0.085, 0), mat(o.skin)), { position: V(0, -0.62, 0) }));
    return { sh };
  });
