  if (sc === 3) {
    const t0 = M.sardar + .15, t1 = M.k15 - .2, k = ap(T, t0, .45) * (1 - seg(T, t1 - .3, t1));
    if (k > 0) { ctx.save(); ctx.translate((1 - easeOut(seg(T, t0, t0 + .5))) * 500, 0); photoCard(PHOTOS.portrait, [290, 700, 500, 640], k, seg(T, t0, t1), { title: L.pTitle, sub: L.pSub, badge: 'АРХИВ', rot: 4 }); ctx.restore(); }
  }
}

// ---------------------------------------------------------------- scene 8: the ENT quiz over the blurred steppe of scene 4
const QBG = (() => { const c = mk(); const x = c.getContext('2d'); if (HF4) { x.filter = 'blur(22px) brightness(.55) saturate(.8)'; const s = Math.max(W / HF4.width, H / HF4.height) * 1.08; x.drawImage(HF4, (W - HF4.width * s) / 2, (H - HF4.height * s) / 2, HF4.width * s, HF4.height * s); } return c; })();
const GREEN = '#2fcf74';
function quiz(T) {
  ctx.drawImage(QBG, 0, 0); ctx.fillStyle = 'rgba(12,7,56,.35)'; ctx.fillRect(0, 0, W, H);
  tag(L.quiz, 262, ap(T, M.S8 + .2, .35));
  const qa = ap(T, M.S8 + .35, .4);
  L.q.forEach((s, i) => txt(s, W / 2, 380 + i * 74 + (1 - qa) * 12, { size: 58, weight: 800, fam: 'IT', alpha: qa, sb: 18 }));
  const ans = ap(T, M.ans + .55, .3), marks = [M.oA, M.oB, M.oC];
  L.opts.forEach(([l, s], i) => {
    const k = ap(T, marks[i] - .12, .3); if (k <= 0) return; const y = 640 + i * 150, x = 130 + (1 - k) * -40, w = W - 260, h = 116, ok = i === 1;
    const dim = ok ? 1 : 1 - .6 * ans, col = ok && ans > 0 ? mixHex('#130B54', GREEN, ans) : BR.navy;
    ctx.save(); ctx.globalAlpha = k * dim; ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 26; rr(ctx, x, y, w, h, 24); ctx.fillStyle = ok && ans > 0 ? col : C.card; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = ok && ans > 0 ? GREEN : C.line; ctx.lineWidth = ok && ans > 0 ? 4 : 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 62, y + h / 2, 36, 0, 7); ctx.fillStyle = ok && ans > 0 ? '#fff' : C.acc; ctx.fill(); ctx.restore();
    txt(l, x + 62, y + h / 2 + 15, { size: 40, weight: 800, fam: 'IT', color: ok && ans > 0 ? GREEN : BR.navy, alpha: k * dim, shadow: 0 });
    txt(s, x + 130, y + h / 2 + 17, { size: 50, weight: 800, fam: 'IT', align: 'left', alpha: k * dim, shadow: 0 });
    if (ok && ans > 0) { ctx.save(); ctx.globalAlpha = ans; ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = ctx.lineJoin = 'round'; const cx = x + w - 70, cy = y + h / 2;
      ctx.beginPath(); ctx.moveTo(cx - 24, cy); ctx.lineTo(cx - 6, cy + 18); ctx.lineTo(cx + 26, cy - 20); ctx.stroke(); ctx.restore(); glowDot(x + w / 2, y + h / 2, 420, GREEN, .25 * ans); }
  });
  // the 3-2-1 timer in the pause
  const p0 = M.ans - 3.0, tk = ap(T, p0 - .1, .25) * (1 - seg(T, M.ans + .3, M.ans + .6));
  if (tk > 0) {
    const u = clamp((T - p0) / 3), n = Math.max(1, 3 - Math.floor(u * 3 - 1e-6)), cx = W / 2, cy = 1170;
    ctx.save(); ctx.globalAlpha = tk; ctx.beginPath(); ctx.arc(cx, cy, 72, 0, 7); ctx.fillStyle = C.card; ctx.fill();
    ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
    ctx.strokeStyle = C.acc; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, 72, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - u)); ctx.stroke(); ctx.restore();
    if (u < 1) { const f = (u * 3) % 1; ctx.save(); ctx.translate(cx, cy + 26); const s = lerp(1.25, 1, easeOut(f * 3)); ctx.scale(s, s); txt(String(n), 0, 0, { size: 76, weight: 800, fam: 'IT', color: C.acc, alpha: tk, shadow: 0 }); ctx.restore(); }
  }
  L.chips.forEach((s, i) => { const k = ap(T, (i ? M.keyki : M.ans + 1.2) - .1, .35); if (k > 0) plate(s, W / 2, 1150 + i * 96, 34, k, { ls: 1, fill: C.card, color: '#fff' }); });
}

// ---------------------------------------------------------------- scene 9: the engraving of Amangeldi, the ENT plate, then the profile card with the link
const ENGR = await loadImg('photos/engrave.png');
function s9(T) {
  const dim = ease(seg(T, M.S9 - .1, M.S9 + .5)); ctx.fillStyle = rgba('#0c0738', .94 * dim); ctx.fillRect(0, 0, W, H);
  const X = W / 2, ek = ap(T, M.S9 + .1, .6) * (1 - seg(T, M.link - .4, M.link + .1));
  if (ENGR && ek > 0) {                                        // drawn in from the top like a print being pulled
    const w = 720, h = w * ENGR.height / ENGR.width, x = X - w / 2, y = 330, rv = easeOut(seg(T, M.S9 + .1, M.S9 + 1.6));
    ctx.save(); ctx.globalAlpha = ek; ctx.beginPath(); ctx.rect(x, y, w, h * rv); ctx.clip(); ctx.drawImage(ENGR, x, y, w, h);
    const g = ctx.createLinearGradient(0, y + h * .7, 0, y + h); g.addColorStop(0, 'rgba(12,7,56,0)'); g.addColorStop(1, 'rgba(12,7,56,1)'); ctx.fillStyle = g; ctx.fillRect(x, y + h * .7, w, h * .3 + 2); ctx.restore();
  }
  const pk = ap(T, M.S9 + .5, .4) * (1 - seg(T, M.link - .4, M.link + .1));
  if (pk > 0) { ctx.save(); ctx.globalAlpha = pk; line(L.plate.map(p => [p[0], p[1] ? C.acc : '#fff']), X, 270, { size: 40, sb: 12 }); ctx.restore(); }
  // arrow up to the profile header
  const m = ap(T, M.link - .1, .5);
  if (m > 0) {
    const ay = 1080 + 14 * Math.sin(T * 6.5) * seg(T, M.link + .4, M.link + .8), hh = 150;
    ctx.save(); ctx.globalAlpha = m; ctx.strokeStyle = C.acc; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = C.acc; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.moveTo(X, ay + hh * .7); ctx.lineTo(X, ay - hh * .55); ctx.moveTo(X - 62, ay - hh * .05); ctx.lineTo(X, ay - hh * .6); ctx.lineTo(X + 62, ay - hh * .05); ctx.stroke(); ctx.restore();
  }
  const l = ap(T, M.link - .12, .4), hi = ap(T, M.bio - .25, .3);
  if (l > 0) {
    const cw = 840, ch = 206, cx = X - cw / 2, cyc = 740 + (1 - l) * 40;
    ctx.save(); ctx.globalAlpha = l;
    line(L.go.map(p => [p[0], p[1] ? C.acc : '#fff']), X, cyc - ch / 2 - 46, { size: 56, sb: 14 });
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12; rr(ctx, cx, cyc - ch / 2, cw, ch, 24); ctx.fillStyle = C.card; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = C.line; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 106, cyc, 62, 0, 7); ctx.strokeStyle = C.acc; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 106, cyc, 51, 0, 7); ctx.fillStyle = '#0b0636'; ctx.fill();
    ctx.drawImage(LOGO_AV, cx + 106 - LOGO_AV.width / 2, cyc - LOGO_AV.height / 2);
    txt('JAS EDUCATION', cx + 206, cyc - 43, { size: 36, weight: 800, fam: 'IT', align: 'left', ls: 1, shadow: 0 });
    ctx.fillStyle = 'rgba(255,255,255,.16)'; rr(ctx, cx + 206, cyc - 24, 504, 17, 8.5); ctx.fill();
    const lx = cx + 199, ly = cyc + 14, lw = 360, lh = 60, my = ly + lh / 2;
    rr(ctx, lx, ly, lw, lh, 30); ctx.fillStyle = rgba(C.acc, .1 + .16 * hi); ctx.fill(); ctx.strokeStyle = rgba(C.acc, .45 + .55 * hi); ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = C.acc; ctx.lineWidth = 5.4; ctx.lineCap = 'round';
    ctx.save(); ctx.translate(lx + 43, my); ctx.rotate(-.7); rr(ctx, -23, -8.5, 26.5, 17, 8.5); ctx.stroke(); rr(ctx, -3.5, -8.5, 26.5, 17, 8.5); ctx.stroke(); ctx.restore();
    txt(L.linkword, lx + 82, my + 12, { size: 35, weight: 700, align: 'left', color: C.acc, shadow: 0 });
    ctx.restore();
    for (const dl of [0, .16]) { const u = (T - M.go - dl) / .6; if (u <= 0 || u >= 1) continue;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = rgba(C.acc, .75 * (1 - u) ** 2); ctx.lineWidth = 5 - 3 * u;
      const g = 6 + 74 * easeOut(u); rr(ctx, lx - g, ly - g, lw + 2 * g, lh + 2 * g, 30 + g); ctx.stroke(); ctx.restore(); }
    if (hi > 0) { glowDot(lx + lw / 2, my, 230, C.acc, .2 * hi * (.7 + .3 * Math.sin(T * 6))); txt(L.where.toUpperCase(), X, 1330 + (1 - hi) * 10, { size: 40, weight: 700, ls: 5, alpha: hi, sb: 12 }); }
  }
}

// ---------------------------------------------------------------- the brand in the frame
const END0 = M.last - .1;
function logo() { ctx.save(); ctx.globalAlpha = .82; ctx.drawImage(LOGO, W - 48 - LOGO.width, 48); ctx.restore(); }
function credit(T, sc) {                                     // small print: map sources on the map scenes, the photo source while a photo is shown
  let s = null;
  if (sc === 3 && T > M.sardar && T < M.k15 - .2) s = PHOTOS.portrait && PHOTOS.portrait.credit;
  else if (sc === 7 && T > M.S8 - 2.9) s = PHOTOS.monument && PHOTOS.monument.credit;
  else if (sc === 2 || sc === 3 || sc === 5 || sc === 7) s = L.credit;
  else if (sc === 1) s = PHOTOS.portrait && PHOTOS.portrait.credit;
  if (s) txt(s, W / 2, 1880, { size: 19, weight: 500, color: 'rgba(255,255,255,.42)', shadow: 0 });
}
function endCard(T) {
  const k = ease(seg(T, END0, END0 + .5)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, W, H);
  const s = lerp(.9, 1, easeOut(seg(T, END0, END0 + .8))), w = LOGO_BIG.width * s, h = LOGO_BIG.height * s, cy = 800;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO_BIG, W / 2 - w / 2, cy - h / 2, w, h); ctx.restore();
  const c = ap(T, END0 + .3, .4), d = ap(T, END0 + .5, .4);
  if (c > 0) txt(L.endA, W / 2, cy + 322 + (1 - c) * 12, { size: 66, weight: 800, fam: 'IT', color: C.acc, alpha: c, shadow: 0 });
  if (d > 0) txt(L.endB, W / 2, cy + 396 + (1 - d) * 12, { size: 40, weight: 600, color: 'rgba(255,255,255,.85)', alpha: d, shadow: 0 });
}

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, g: C.acc, b: C.acc };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });
const CH = CHUNKS.filter(Boolean);
function captions(T, y) {
  let i = -1; for (let k = 0; k < CH.length; k++) if (T >= CH[k].t0 - .07) i = k;
  if (i < 0) return; const c = CH[i], tEnd = Math.min(i + 1 < CH.length ? CH[i + 1].t0 - .07 : 1e9, c.t1 + .5);
  if (T > tEnd) return;
  const its = c.ws.map(w => { const key = w.c !== 'w', size = key ? 60 : 54, weight = key ? 800 : 700, s = w.w.replace(/[.,:;!?]+$/, ''); font(ctx, size, weight); return { w, s, size, weight, wd: ctx.measureText(s).width }; });
  let tot = 0; its.forEach((it, k) => { tot += it.wd + (k < its.length - 1 && !it.w.g ? 17 : 0); });
  const sc = Math.min(1, 960 / tot), a = seg(T, c.t0 - .07, c.t0 + .03) * (1 - seg(T, tEnd - .06, tEnd));
  ctx.save(); ctx.translate(W / 2, y + (1 - seg(T, c.t0 - .07, c.t0 + .05)) * 10); ctx.scale(sc, sc); let x = -tot / 2;
  for (const it of its) {
    const on = seg(T, it.w.t - .04, it.w.t + .05), pop = 1 + .07 * Math.sin(Math.PI * seg(T, it.w.t - .02, it.w.t + .2));
    ctx.save(); ctx.translate(x + it.wd / 2, 0); ctx.scale(pop, pop); font(ctx, it.size, it.weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.globalAlpha = a * lerp(.4, 1, on); ctx.fillStyle = CAPCOL[it.w.c] || '#fff';
    ctx.fillText(it.s, 0, 0); ctx.shadowBlur = 5; ctx.fillText(it.s, 0, 0); ctx.restore();
    x += it.wd + (it.w.g ? 0 : 17);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- frame
// transitions: 1->2 a dip from the black-and-white photo into warm colour, 6->7 and 7->8 dips to black, the other cuts are hard with a soft white flash
const DIPS = [[M.S2, '#c99a5b', .45], [M.S7, '#000000', .5], [M.S8, '#000000', .45]];
const FLASH = [M.S3, M.S4, M.S5, M.S6, M.S9];
async function render(T) {
  T = clamp(T, 0, END);
  const sc = T < M.S2 ? 1 : T < M.S3 ? 2 : T < M.S4 ? 3 : T < M.S5 ? 4 : T < M.S6 ? 5 : T < M.S7 ? 6 : T < M.S8 ? 7 : T < M.S9 ? 8 : 9;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (sc === 1 || sc === 4 || sc === 6) {
    await film(sc, T);
    if (sc === 1) oldFilm(T);
    if (sc === 4) { ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(200,150,80,.18)'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    vignette(.85);
  } else if (sc === 8 || sc === 9) {
    quiz(sc === 8 ? T : M.S9 - .01);
  } else {
    const cam = window.CAMQ || camAt(sc, T); setCam(cam);
    globeMat.uniforms.expo.value = sc === 7 ? lerp(.7, .5, ease(seg(T, M.S8 - 2.9, M.S8 - 2.3))) : .7;
    globeMat.uniforms.sat.value = .9; globeMat.uniforms.haze.value = .7; atmo.material.uniforms.k.value = .5;
    stars(sc === 2 ? .6 : .3);
    renderer.render(scene, camera); ctx.drawImage(glc, 0, 0);
    borders(.16);
    if (sc === 2) mapS2(T); else if (sc === 3) mapS3(T); else if (sc === 5) mapS5(T); else mapS7(T);
    vignette(1);
  }
  if (sc === 9) s9(T); else if (sc === 8) {} else hud(T, sc);
  photos(T, sc);
  captions(T, 1450);
  credit(T, sc); logo(); if (sc === 9) endCard(T);
  for (const [t0, col, d] of DIPS) { const u = Math.abs(T - t0) / d; if (u < 1) { ctx.fillStyle = rgba(col, (1 - u) ** 1.6 * (col === '#000000' ? 1 : .85)); ctx.fillRect(0, 0, W, H); } }
  for (const tc of FLASH) if (T >= tc && T < tc + .16) { ctx.fillStyle = `rgba(255,255,255,${.2 * (1 - (T - tc) / .16) ** 2})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render; window.setCamQ = c => { window.CAMQ = c; }; window.END = END; window.M = M;
window.ready = true;
</script>
