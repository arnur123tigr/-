  // portraits on the map

  if (sy > 0) { const p = pinned(PL.syr, T < M.S3 ? 150 : -150); if (p[2]) { portrait(p[0], p[1], 92, 'batyr', sy); if (T > M.S3) mapPill(PL.syr, L.syr, sy * ap(T, M.bala - .1, .4), { size: 34, dy: -24 }); } }
  const nk = win2(T, M.nur - .2, M.S6 + .3, .4, .4);
  if (nk > 0) { const p = pinned(PL.stavka, -150); if (p[2]) { strings(p[0], p[1], 84, ap(T, M.doll - .2, .6) * nk, T); portrait(p[0], p[1], 84, 'khan', nk, { ring: '#c9c3df' }); mapPill(PL.stavka, L.nur, nk, { size: 32, dy: -42 }); } }

  if (n7 > 0) { const u = easeIO(seg(T, M.ufa - .7, M.ufa + .5)), q = ptAlong(ROUTES[2], u), p = pinned(q, -110); if (p[2]) portrait(p[0], p[1], 64, 'khan', n7, { ring: RUS, grey: .4 * u }); }
  const ek = win2(T, M.S10 + .5, M.S11 + .4, .4, .4);
  if (ek > 0) { const p = pinned(PL.esim, -150), x = ap(T, M.Kill, .35); if (p[2]) { portrait(p[0], p[1], 88, 'esim', ek, { ring: '#c9c3df', grey: x, x }); mapPill(PL.esim, L.esim, ek, { size: 32, dy: -42 }); } }
}
// ---------------------------------------------------------------- titles and panels

function vignette(top = 1) {
  let g = ctx.createLinearGradient(0, 0, 0, 640); g.addColorStop(0, `rgba(0,0,0,${.9 * top})`); g.addColorStop(.5, `rgba(0,0,0,${.46 * top})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 640);
  g = ctx.createLinearGradient(0, 1080, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.42, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 1080, W, H - 1080);
  g = ctx.createRadialGradient(W / 2, H / 2, 620, W / 2, H / 2, 1180); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');

const tag = (s, y, a, col = C.acc) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; rr(ctx, W / 2 - 30, y - 52, 60, 6, 3); ctx.fill(); ctx.restore();

  ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate((o.rot || 0) * RAD); ctx.globalAlpha *= clamp(a * 1.5);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; rr(ctx, -w / 2, -h / 2, w, h, 16); ctx.fillStyle = o.fill || C.acc; ctx.fill(); ctx.shadowColor = 'transparent';
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = o.color || BR.navy; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, (o.ls ?? 4) / 2, size * .06); ctx.restore();

function datePlate(s, a, y = 300, col = C.acc, size = 84) {

  ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();

}
const yearRun = (T, y0, y1, t0, t1) => Math.round(lerp(y0, y1, easeIO(seg(T, t0, t1))));

function hud(T) {
  // 1: the hook title and the years
  const h1 = ap(T, .4, .5) * (1 - seg(T, M.S2 + .9, M.S2 + 1.3));
  if (h1 > 0) {
    txt(L.hook[0], W / 2, 320 + (1 - h1) * 10, { size: 74, weight: 900, fam: 'IT', alpha: h1, sb: 24 });
    txt(L.hook[1], W / 2, 400 + (1 - h1) * 10, { size: 52, weight: 800, fam: 'IT', color: C.acc, alpha: h1 * ap(T, M.war - .1, .4), sb: 26 });
    datePlate(L.years, h1 * ap(T, 1.0, .4), 520, C.acc, 60);
  }
  // the khans counter 0/2 .. 2/2, top left (frames 2-11)
  const n = T < M.ufa ? 0 : T < M.Kill ? 1 : 2;
  const ck = win2(T, M.two - .1, M.S12 - .1, .4, .4);
  if (ck > 0) {
    const pop = [M.ufa, M.Kill].reduce((a, t) => a + Math.sin(Math.PI * seg(T, t, t + .35)) * .22, 0);
    ctx.save(); ctx.translate(170, 128); ctx.scale(1 + pop, 1 + pop); plate(`${n} / 2`, 0, 0, 50, ck, { fill: C.card, color: '#fff', stroke: rgba(C.acc, .7), ls: 5 }); ctx.restore();
    for (let i = 0; i < 2; i++) { ctx.save(); ctx.globalAlpha = ck; ctx.beginPath(); ctx.arc(150 + i * 40, 202, 11, 0, 7); ctx.fillStyle = i < n ? C.warn : 'rgba(255,255,255,.28)'; ctx.fill(); ctx.restore(); }
    txt(L.khans, 170, 250, { size: 26, weight: 800, ls: 4, alpha: ck, color: 'rgba(255,255,255,.85)' });
  }
  // 4: the tsar's decree
  const k4 = win2(T, M.y1782 - .1, M.S5 - .05);
  if (k4 > 0) { datePlate(L.y1782, k4, 320, C.warn, 66); const r = ap(T, M.winter - .1, .35) * k4; if (r > 0) plate(L.rule, W / 2, 440, 42, r, { fill: C.warn, color: '#fff', ls: 1, pop: 1 }); }
  // 5: the khan is a puppet

    const parts = [['2700', M.n2700], ['+ 1500', M.tl], ['+ 2000', M.tl + .5]], vis = parts.filter(p => T >= p[1] - .1);
    const sum = ap(T, M.n6000 - .1, .35);
    if (vis.length && sum < 1) { const s = vis.map(p => p[0]).join(' '); txt(s, W / 2, 470, { size: 60, weight: 800, fam: 'IT', color: '#fff', alpha: k6 * (1 - sum), sb: 22 }); }
    if (sum > 0) { txt('= ' + L.sum, W / 2, 480, { size: 96, weight: 900, fam: 'IT', color: C.acc, alpha: k6 * sum, sb: 26 }); tag(L.sumS, 560, k6 * sum, '#fff'); }
  }
  // 7: 1786, Ufa
  const k7 = win2(T, M.y1786 - .1, M.S8 - .05); if (k7 > 0) datePlate(L.y1786, k7, 320, C.acc, 66);
  // 8: Igelstrom: the khan's power struck out ... then the reform itself
  const k8 = win2(T, M.igel - .2, M.S9 - .05);
  if (k8 > 0) {
    datePlate(L.igel, k8, 320, '#fff', 60);
    const a1 = ap(T, M.abol - .1, .35) * k8, w1 = plateW(L.khanW, 44, 3);
    if (a1 > 0) { plate(L.khanW, W / 2, 450, 44, a1, { fill: C.card, color: '#fff', stroke: rgba('#ffffff', .4), ls: 3 });
      strike(W / 2, 450, w1 + 20, ap(T, M.abol + .5, .35) * (1 - ap(T, M.fail + .6, .35)) * k8); }
    const a2 = ap(T, M.fail - .1, .35) * k8, w2 = plateW(L.reform, 44, 3);
    if (a2 > 0) { plate(L.reform, W / 2, 560, 44, a2, { fill: C.card, color: '#fff', stroke: rgba(C.warn, .6), ls: 3 }); strike(W / 2, 560, w2 + 20, ap(T, M.fail + .7, .35) * k8); }
  }
  // 9: 1792, Ilek, a defeat
  const k9 = win2(T, M.y1792 - .1, M.S10 - .05);
  if (k9 > 0) { datePlate(L.y1792, k9, 320, C.acc, 66); txt(L.n1000, W / 2, 425, { size: 40, weight: 700, alpha: k9 * ap(T, M.y1792 + .4, .3) * (1 - ap(T, M.lose - .45, .25)) });
    const l = ap(T, M.lose - .1, .35) * k9; if (l > 0) plate(L.lose, W / 2, 440, 50, l, { fill: C.warn, color: '#fff', ls: 4, pop: 1 }); }
  // 10: 1797

  // 11: 1801

    const q = ap(T, M.q - .1, .35) * uk;
    if (q > 0) { card(W / 2, 520, 920, 260, q); txt(L.q, W / 2, 465, { size: 42, weight: 700, fam: 'IT', alpha: q, shadow: 0 }); txt(L.q2, W / 2, 520, { size: 42, weight: 700, fam: 'IT', alpha: q, shadow: 0 });
      txt(L.ans, W / 2, 612, { size: 78, weight: 900, fam: 'IT', color: C.acc, alpha: q * ap(T, M.years - .05, .3), shadow: 0 }); }
  }
}

function finale(T) {
  const ar = ap(T, M.link - .3, .4); if (ar <= 0) return;

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, b: '#8fb6ff' };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });

  const FLASH = [M.ilek + .6, M.Kill];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
