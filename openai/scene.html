</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// «Artificial — OpenAI-дің 5 күні»: documentary montage-collage reel, 1080x1920, deterministic render(T).
// Scenes are timed to the voice beats in beats.json (voice starts OFF s into the video).
const W = 1080, H = 1920, OFF = 0.3;
const NAVY = '#17181f', AMB = '#FFD400', RED = '#E23B2E', GRN = '#2FB45A', WHITE = '#fff';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const IM = {}, CLIP = {};
const off = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = off(), bufB = off();
let B, CAPS, VEND, END, SC = [];
window.CUES = [];

// ---------- utils ----------
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => cl((t - a) / (b - a));

function load(name, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IM[name] = i; r(); }; i.onerror = () => r(); i.src = src; }); }

function cover(c, img, x, y, w, h, z = 1, fx = .5, fy = .5) {
  if (!img) { c.fillStyle = '#222'; c.fillRect(x, y, w, h); return; }
  const s = Math.max(w / img.width, h / img.height) * z, iw = img.width * s, ih = img.height * s;
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
  c.drawImage(img, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih); c.restore();
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function shadow(c, b = 40, a = .55, oy = 14) { c.shadowColor = `rgba(0,0,0,${a})`; c.shadowBlur = b; c.shadowOffsetY = oy; }
function noShadow(c) { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; c.shadowOffsetX = 0; }
function grounds(c, kind, t = 0) {
  if (kind === 'dark') { const g = c.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, 1200); g.addColorStop(0, '#1d1a2e'); g.addColorStop(1, '#050409'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  else if (kind === 'navy') { const g = c.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, 1300); g.addColorStop(0, '#2a2d3a'); g.addColorStop(1, '#0b0c10'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  else if (kind === 'black') { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); }
  else cover(c, IM[kind], 0, 0, W, H, 1.04 + t * .01);
}
// grid paper on navy (studio look)
function grid(c) { grounds(c, 'navy'); c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 2; for (let x = 0; x <= W; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = 0; y <= H; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } }
// blinds: dark wall with slanted light stripes + a moving bright bar
function blinds(c, lt, d) {
  c.fillStyle = '#0b0a10'; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, H / 2); c.rotate(-.32); c.translate(-W, -H);
  for (let i = 0; i < 40; i++) { const y = i * 110; c.fillStyle = 'rgba(150,170,210,.07)'; c.fillRect(0, y, W * 2, 52); }
  c.restore();
}
function lightBar(c, lt, d) {
  const p = lin(lt, .1, d - .1), x = -500 + p * (W + 1000);
  c.save(); c.globalCompositeOperation = 'screen'; c.translate(x, H / 2); c.rotate(.32);
  const g = c.createLinearGradient(-170, 0, 170, 0); g.addColorStop(0, 'rgba(255,230,180,0)'); g.addColorStop(.5, 'rgba(255,230,180,.55)'); g.addColorStop(1, 'rgba(255,230,180,0)');
  c.fillStyle = g; c.fillRect(-170, -1600, 340, 3200); c.restore();
}
function vignette(c, a = .75) { const g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .78); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }

// ---------- collage pieces ----------
function cutout(c, img, cx, by, h, o = {}) {
  if (!img) { silhouette(c, cx, by, h, o); return; }
  const w = img.width / img.height * h; c.save(); c.globalAlpha = o.a ?? 1;
  if (o.tint) c.filter = o.tint;
  shadow(c, 50, .6, 20); c.drawImage(img, cx - w / 2, by - h, w, h); c.restore();
}
function silhouette(c, cx, by, h, o = {}) {
  c.save(); c.globalAlpha = o.a ?? 1; c.fillStyle = o.col || '#3a3550'; const s = h / 600;
  c.beginPath(); c.arc(cx, by - 470 * s, 105 * s, 0, 7); c.fill();
  c.beginPath(); c.moveTo(cx - 250 * s, by); c.quadraticCurveTo(cx - 240 * s, by - 330 * s, cx, by - 340 * s); c.quadraticCurveTo(cx + 240 * s, by - 330 * s, cx + 250 * s, by); c.fill(); c.restore();
}
function polaroid(c, img, x, y, w, h, rot, o = {}) {
  c.save(); c.translate(x, y); c.rotate(rot); shadow(c, 30, .5, 12);
  c.fillStyle = '#f4f1ea'; c.fillRect(-w / 2 - 22, -h / 2 - 22, w + 44, h + 110); noShadow(c);
  if (img) cover(c, img, -w / 2, -h / 2, w, h, o.z || 1, .5, o.fy ?? .3); else { c.fillStyle = '#2b2838'; c.fillRect(-w / 2, -h / 2, w, h); silhouette(c, 0, h / 2, h * .85, { col: '#4a4560' }); }
  if (o.bw) { c.globalCompositeOperation = 'saturation'; c.fillStyle = '#000'; c.fillRect(-w / 2, -h / 2, w, h); c.globalCompositeOperation = 'source-over'; }
  if (o.cap) { c.fillStyle = '#222'; c.font = `700 ${o.cs || 46}px Hand`; c.textAlign = 'center'; c.fillText(o.cap, 0, h / 2 + 70); }
  c.restore();
}
function tape(c, x, y, w, rot, text, col = AMB, tc = NAVY, fs = 40) {
  c.save(); c.translate(x, y); c.rotate(rot); shadow(c, 10, .35, 4); c.fillStyle = col; c.globalAlpha = .96;
  c.beginPath(); c.moveTo(-w / 2, -32); for (let i = 0; i <= 6; i++) c.lineTo(-w / 2 + (i % 2) * 6, -32 + i * 64 / 6); c.lineTo(w / 2, 32); for (let i = 0; i <= 6; i++) c.lineTo(w / 2 - (i % 2) * 6, 32 - i * 64 / 6); c.fill();
  noShadow(c); c.globalAlpha = 1; if (text) { c.fillStyle = tc; c.font = `900 ${fs}px MontB`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 0, 2); }
  c.restore();
}
function stamp(c, text, col, x, y, rot, p, s = 1, crossed = 0) {
  if (p <= 0) return; const k = 1 + 1.6 * (1 - eo(lin(p, 0, .35)));
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(k * s, k * s); c.globalAlpha = cl(p * 3) * .92;
  c.font = '900 120px MontB'; const tw = c.measureText(text).width, w = tw + 90, h = 190;
  c.strokeStyle = col; c.lineWidth = 12; rrect(c, -w / 2, -h / 2, w, h, 18); c.stroke(); c.lineWidth = 5; rrect(c, -w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 10); c.stroke();
  c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 0, 8);
  // worn ink
  c.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 160; i++) { c.globalAlpha = .5; c.beginPath(); c.arc((rnd(i + text.length) - .5) * w, (rnd(i * 3.1) - .5) * h, 2 + rnd(i * 7) * 6, 0, 7); c.fill(); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  if (crossed > 0) { c.strokeStyle = '#111'; c.lineWidth = 22; c.lineCap = 'round'; c.beginPath(); c.moveTo(-w / 2 - 20, 0); c.lineTo(-w / 2 - 20 + (w + 40) * eo(crossed), 0); c.stroke(); }
  c.restore();
}
function flag(c, text, x, y, p = 1, fs = 40, col = NAVY, tc = AMB) {
  if (p <= 0) return; c.save(); c.translate(x, y); const s = back(p); c.scale(s, s); c.font = `800 ${fs}px MontE`;
  const tw = c.measureText(text).width; shadow(c, 18, .5, 6);
  c.fillStyle = '#ddd'; c.fillRect(-4, -10, 8, 120); c.fillStyle = col; rrect(c, 0, -fs * .9 - 20, tw + 50, fs * 1.6, 10); c.fill(); noShadow(c);
  c.fillStyle = tc; c.textBaseline = 'middle'; c.fillText(text, 25, -fs * .9 - 20 + fs * .8); c.restore();
}
function sign(c, text, lt, cx = W / 2, y = 560, fs = 120, w0 = 0) {
  const p = lin(lt, 0, .55), yy = -400 + (y + 400) * bounce(p); c.save();
  c.font = `900 ${fs}px MontB`; const w = Math.max(w0, c.measureText(text).width + 120), h = fs * 1.7;
  c.strokeStyle = '#8a8a90'; c.lineWidth = 7; c.setLineDash([16, 8]);
  for (const sx of [-w / 2 + 70, w / 2 - 70]) { c.beginPath(); c.moveTo(cx + sx, -20); c.lineTo(cx + sx, yy - h / 2); c.stroke(); }
  c.setLineDash([]); shadow(c, 30, .6, 14);
  const g = c.createLinearGradient(0, yy - h / 2, 0, yy + h / 2); g.addColorStop(0, '#2a2b33'); g.addColorStop(1, NAVY); c.fillStyle = g; rrect(c, cx - w / 2, yy - h / 2, w, h, 16); c.fill(); noShadow(c);
  c.strokeStyle = AMB; c.lineWidth = 6; rrect(c, cx - w / 2 + 14, yy - h / 2 + 14, w - 28, h - 28, 10); c.stroke();
  c.fillStyle = WHITE; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, cx, yy + 6); c.restore();
}
function typed(c, text, x, y, p, font, col, align = 'left', lh = 0, maxW = 0) {
  const n = Math.floor(text.length * cl(p)); c.font = font; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (!maxW) { c.fillText(text.slice(0, n), x, y); return; }
  const words = text.split(' '); let line = '', yy = y, cnt = 0;
  for (const wd of words) { const tr = line ? line + ' ' + wd : wd; if (c.measureText(tr).width > maxW && line) { draw(line); line = wd; yy += lh; } else line = tr; }
  draw(line);
  function draw(s) { const vis = s.slice(0, cl(n - cnt, 0, s.length)); c.fillText(vis, x, yy); cnt += s.length + 1; }
}
function wrapLines(c, text, maxW) { const L = []; let line = ''; for (const wd of text.split(' ')) { const tr = line ? line + ' ' + wd : wd; if (c.measureText(tr).width > maxW && line) { L.push(line); line = wd; } else line = tr; } L.push(line); return L; }
function hilite(c, text, phrase, x, y, lh, maxW, font, p, col = 'rgba(255,212,0,.8)', mode = 'box') {
  if (p <= 0) return; c.save(); c.font = font; const L = wrapLines(c, text, maxW); const a = text.indexOf(phrase), b = a + phrase.length; let k = 0; const segs = [];
  L.forEach((ln, i) => { const s0 = k, s1 = k + ln.length; const u0 = Math.max(a, s0), u1 = Math.min(b, s1); if (u1 > u0) segs.push([x + c.measureText(ln.slice(0, u0 - s0)).width, y + i * lh, c.measureText(ln.slice(u0 - s0, u1 - s0)).width]); k = s1 + 1; });
  const tot = segs.reduce((q, s) => q + s[2], 0); let left = tot * cl(p);
  for (const [sx, sy, sw] of segs) { const w = Math.min(sw, left); left -= w; if (w <= 0) break;
    if (mode === 'box') { c.globalCompositeOperation = 'multiply'; c.fillStyle = col; c.fillRect(sx - 4, sy - lh * .72, w + 8, lh * .9); c.globalCompositeOperation = 'source-over'; }
    else underline(c, sx, sy + 14, w, 1, RED, 9); }
  c.restore();
}
function marker(c, x, y, rx, ry, p, col = RED, lw = 10) {
  if (p <= 0) return; c.save(); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.globalAlpha = .9; c.beginPath();
  const N = 80, a0 = -2.2; for (let i = 0; i <= N * cl(p) * 1.12; i++) { const a = a0 + i / N * Math.PI * 2, k = 1 + .06 * Math.sin(i * .4); const px = x + rx * k * Math.cos(a), py = y + ry * k * Math.sin(a) + i * .25; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.stroke(); c.restore();
}
function underline(c, x, y, w, p, col = RED, lw = 12) { if (p <= 0) return; c.save(); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.globalAlpha = .9; c.beginPath(); c.moveTo(x, y); for (let i = 0; i <= 30 * p; i++) c.lineTo(x + w * i / 30, y + Math.sin(i * .7) * 3); c.stroke(); c.restore(); }
function label(c, text, x, y, fs = 30) { c.save(); c.font = `600 ${fs}px MontS`; const tw = c.measureText(text).width; c.fillStyle = 'rgba(0,0,0,.6)'; rrect(c, x, y, tw + 36, fs * 1.6, 10); c.fill(); c.fillStyle = '#e8e8ee'; c.textBaseline = 'middle'; c.fillText(text, x + 18, y + fs * .82); c.restore(); }
function bigNum(c, text, x, y, p, fs = 150, col = AMB) {
  if (p <= 0) return; c.save(); c.translate(x, y); const s = p < 1 ? back(p) : 1; c.scale(s, s); c.font = `900 ${fs}px MontB`; c.textAlign = 'center'; c.textBaseline = 'middle';
  shadow(c, 30, .7, 10); c.fillStyle = col; c.fillText(text, 0, 0); c.restore();
}
// money / props
function bundle(c, x, y, rot, s = 1) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); shadow(c, 14, .5, 8);
  c.fillStyle = '#5f8c55'; c.fillRect(-150, -62, 300, 124); noShadow(c);
  c.fillStyle = '#7fae6f'; c.fillRect(-150, -62, 300, 92); c.strokeStyle = '#3f6a3a'; c.lineWidth = 3; c.strokeRect(-140, -54, 280, 76);
  c.fillStyle = '#3f6a3a'; c.beginPath(); c.ellipse(0, -16, 34, 30, 0, 0, 7); c.fill(); c.fillStyle = '#9cc58a'; c.font = '900 30px MontB'; c.textAlign = 'center'; c.fillText('100', -100, -2); c.fillText('100', 100, -2);
  for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#b9d8a8' : '#cfe6c1'; c.fillRect(-150, 30 + i * 5, 300, 4); }
  c.fillStyle = '#e9dcc0'; c.fillRect(-30, -62, 60, 124); c.fillStyle = '#7a5c2e'; c.font = '700 20px MontE'; c.fillText('$10K', 0, 6); c.restore();
}
function goldBar(c, x, y, rot, s = 1) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); shadow(c, 16, .55, 8);
  const g = c.createLinearGradient(0, -50, 0, 50); g.addColorStop(0, '#ffe58a'); g.addColorStop(.5, '#e0a91e'); g.addColorStop(1, '#a8740c'); c.fillStyle = g;
  c.beginPath(); c.moveTo(-120, 45); c.lineTo(-90, -45); c.lineTo(90, -45); c.lineTo(120, 45); c.closePath(); c.fill(); noShadow(c);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(-85, -40); c.lineTo(85, -40); c.lineTo(70, -20); c.lineTo(-70, -20); c.fill();
  c.fillStyle = '#8a5d06'; c.font = '800 22px MontE'; c.textAlign = 'center'; c.fillText('999.9', 0, 18); c.restore();
}
function sheet(c, x, y, rot, s = 1, sig = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); shadow(c, 12, .4, 6); c.fillStyle = '#f7f5ef'; c.fillRect(-105, -148, 210, 296); noShadow(c);
  c.fillStyle = '#c9c6bd'; for (let i = 0; i < 9; i++) c.fillRect(-80, -120 + i * 18, 160 - (i % 3) * 30, 6);
  c.strokeStyle = '#1b3a8a'; c.lineWidth = 3; c.beginPath(); for (let i = 0; i < 14; i++) c.lineTo(-70 + i * 10, 95 + Math.sin(i * 1.3 + sig) * 9); c.stroke(); c.restore();
}
// deterministic falling pile: item i falls from above to rest spot
function pile(c, lt, n, t0, dt, draw, spots) {
  for (let i = 0; i < n; i++) {
    const ti = t0 + i * dt, p = lin(lt, ti, ti + .45); if (p <= 0) continue; const sp = spots(i);
    const y = -200 + (sp.y + 200) * (p < 1 ? p * p : 1) - (p >= 1 ? 0 : 0), r = sp.r + (1 - p) * (rnd(i) - .5) * 1.5;
    draw(c, sp.x + (1 - p) * (rnd(i * 5) - .5) * 200, y, r, sp.s || 1, i);
  }
}
function xcard(c, o, x, y, w, p) {
  if (p <= 0) return; const h = o.h; c.save(); c.globalAlpha = cl(p * 2); c.translate(x, y + (1 - eo(p)) * 80); shadow(c, 40, .6, 16);
  c.fillStyle = '#fff'; rrect(c, 0, 0, w, h, 28); c.fill(); noShadow(c);
  c.save(); c.beginPath(); c.arc(70, 70, 40, 0, 7); c.clip(); if (IM[o.av]) c.drawImage(IM[o.av], 30, 30, 80, 80); c.restore();
  c.fillStyle = '#0f1419'; c.font = '800 34px Inter'; c.textBaseline = 'alphabetic'; c.fillText(o.name, 128, 66); c.fillStyle = '#536471'; c.font = '500 28px Inter'; c.fillText(o.handle, 128, 102);
  c.fillStyle = '#0f1419'; c.font = 'bold 40px Inter'; c.fillText('𝕏', w - 70, 76);
  c.font = '500 38px Inter'; let yy = 175; const words = o.text.split(' '); let line = '';
  const lines = []; for (const wd of words) { const tr = line ? line + ' ' + wd : wd; if (c.measureText(tr).width > w - 80 && line) { lines.push(line); line = wd; } else line = tr; } lines.push(line);
  o._lines = []; for (const L of lines) { c.fillStyle = '#0f1419'; c.fillText(L, 40, yy); o._lines.push(yy); yy += 52; }
  if (o.img) { const ih = h - (yy - 20) - 90; cover(c, IM[o.img], 40, yy - 20, w - 80, ih, o.iz || 1, .5, o.ify ?? .4); yy += ih; }
  c.fillStyle = '#536471'; c.font = '500 28px Inter'; c.fillText(o.date, 40, h - 34); c.restore();
}
function phone(c, x, y, s, lt) {
  c.save(); c.translate(x, y); c.scale(s, s); const shake = lt > .3 && lt < 1.4 ? Math.sin(lt * 90) * 6 : 0; c.translate(shake, 0); shadow(c, 60, .7, 20);
  c.fillStyle = '#16161a'; rrect(c, -230, -470, 460, 940, 70); c.fill(); noShadow(c);
  const g = c.createLinearGradient(0, -440, 0, 440); g.addColorStop(0, '#22305e'); g.addColorStop(1, '#0d1028'); c.fillStyle = g; rrect(c, -208, -448, 416, 896, 52); c.fill();
  c.fillStyle = '#000'; rrect(c, -60, -432, 120, 34, 17); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '300 120px Inter'; c.fillText('23:12', 0, -230); c.font = '500 30px Inter'; c.fillText('бейсенбі, 16 қараша', 0, -180);
  const p = eo(lin(lt, .35, .8)); if (p > 0) {
    c.globalAlpha = p; c.translate(0, (1 - p) * -40); c.fillStyle = 'rgba(245,245,250,.92)'; rrect(c, -190, -110, 380, 170, 30); c.fill();
    c.fillStyle = '#2b5cd8'; rrect(c, -170, -90, 54, 54, 14); c.fill(); c.fillStyle = '#fff'; c.font = '800 30px Inter'; c.fillText('✉', -143, -52);
    c.textAlign = 'left'; c.fillStyle = '#111'; c.font = '700 30px Inter'; c.fillText('Илья Суцкевер', -100, -56); c.fillStyle = '#555'; c.font = '500 26px Inter'; c.fillText('қазір', 100, -56);
    c.fillStyle = '#333'; c.font = '500 28px Inter'; c.fillText('1 жаңа хабарлама', -170, 10);
  }
  c.restore();
}
function calendar(c, x, y, lt, from, to, t0, dt) {
  const n = to - from; for (let i = n; i >= 0; i--) {

// ---------- timeline ----------
function build() {
  const st = k => B[k] + OFF - .12;
  SC = S.map((s, i) => ({ ...s, t0: i ? st(s.k) : 0 }));
  END = B.vend + OFF + 2.6; // CTA hold
  SC.forEach((s, i) => s.t1 = i < SC.length - 1 ? SC[i + 1].t0 : END);

  window.CUES = cues.sort((a, b) => a.t - b.t);
}
function drawScene(c, i, T) { const s = SC[i]; c.save(); s.f(c, T - s.t0, s.t1 - s.t0); c.restore(); }

  const TW = .18; let done = false;
  // transition into s from prev (first half handled when T < s.t0 + TW), or out of s to next (T > s.t1 - TW)
  const tr = (a, b, kind, u) => { // u 0..1 across the boundary
    const ca = bufA.getContext('2d'), cb = bufB.getContext('2d'); drawScene(ca, a, Math.min(T, SC[a].t1 - 1e-3)); drawScene(cb, b, Math.max(T, SC[b].t0));

    if (kind === 'swipe') { const e = eio(u), dx = -e * W; for (let k = 0; k < 5; k++) { X.globalAlpha = .3; X.drawImage(bufA, dx + k * 18 * (u < 1 ? 1 : 0), 0); X.drawImage(bufB, dx + W + k * 18, 0); } X.globalAlpha = 1; X.drawImage(bufA, dx, 0); X.drawImage(bufB, dx + W, 0); }
    else if (kind === 'zoom') { if (u < .5) { const k = 1 + ei(u * 2) * .9; X.translate(W / 2, H / 2); X.scale(k, k); X.translate(-W / 2, -H / 2); X.globalAlpha = 1 - ei(u * 2) * .4; X.drawImage(bufA, 0, 0); } else { const k = .7 + .3 * eo((u - .5) * 2); X.translate(W / 2, H / 2); X.scale(k, k); X.translate(-W / 2, -H / 2); X.globalAlpha = eo((u - .5) * 2); X.drawImage(bufB, 0, 0); } }
    else if (kind === 'fade') { X.globalAlpha = u < .5 ? 1 - u * 2 : (u - .5) * 2; X.drawImage(u < .5 ? bufA : bufB, 0, 0); }
    X.restore(); done = true;

  if (prev && ['swipe', 'zoom', 'fade'].includes(prev.tr) && T < s.t0 + (prev.tr === 'fade' ? .25 : TW)) { const w = prev.tr === 'fade' ? .25 : TW; tr(i - 1, i, prev.tr, .5 + (T - s.t0) / w / 2); }
  else if (nxt && ['swipe', 'zoom', 'fade'].includes(s.tr) && T > s.t1 - (s.tr === 'fade' ? .25 : TW)) { const w = s.tr === 'fade' ? .25 : TW; tr(i, i + 1, s.tr, (T - (s.t1 - w)) / w / 2); }
  if (!done) { X.save(); drawScene(X, i, T); X.restore(); }

}
