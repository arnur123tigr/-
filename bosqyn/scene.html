// ---------------------------------------------------------------- the painted panels (frames 3 and 10), instead of film shots
const FLAKES = Array.from({ length: 260 }, (_, i) => ({ x: hash(i * 1.3), y: hash(i * 2.7 + 1), z: .3 + .7 * hash(i * 3.9 + 2), s: hash(i * 5.1) }));
function snow(T, a, speed = 1, dir = -1) {

    ctx.globalAlpha = a * (.25 + .6 * f.z); ctx.beginPath(); ctx.ellipse(x, y, 1.6 + 3.2 * f.z, 1.2 + 1.8 * f.z, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}
function grain(a, T) { ctx.save(); ctx.globalAlpha = a; for (let i = 0; i < 900; i++) { const x = hash(i * 1.7 + Math.floor(T * 24) * 3.1) * W, y = hash(i * 2.9 + Math.floor(T * 24) * 5.3) * H; ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.25)'; ctx.fillRect(x, y, 2, 2); } ctx.restore(); }
// a woman in a white kimeshek and a dark-red chapan; facing = 1 (towards us, child at the chest) or 'back' (climbing, child on the back)

  // the chapan (long quilted coat), slightly flapping
  const g = ctx.createLinearGradient(-60, -330, 60, 0); g.addColorStop(0, '#7a2a2c'); g.addColorStop(1, '#3d1517');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-46, -300); ctx.quadraticCurveTo(-70, -150, -62 - wind, -12); ctx.lineTo(64 - wind * 1.3, -12); ctx.quadraticCurveTo(70, -150, 46, -300); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-50 + i * 4, -250 + i * 40); ctx.lineTo(50 - i * 3, -246 + i * 40); ctx.stroke(); }

    ctx.fillStyle = '#5c2124'; ctx.beginPath(); ctx.ellipse(28, -228, 22, 12, .9, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(-26, -214, 20, 11, -.6, 0, 7); ctx.fill();   // arms
  } else {

    ctx.strokeStyle = '#4a3a30'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-40, -300); ctx.lineTo(36, -205); ctx.stroke();

  ctx.quadraticCurveTo(58, -350, 50, -298); ctx.quadraticCurveTo(70 + wind, -280, 62 + wind * 1.5, -262); ctx.quadraticCurveTo(0, -280, -60, -268); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.moveTo(-40, -300); ctx.quadraticCurveTo(0, -288, 40, -300); ctx.lineTo(40, -296); ctx.quadraticCurveTo(0, -282, -40, -296); ctx.fill();
  if (!back) {
    ctx.fillStyle = '#b98a6c'; ctx.beginPath(); ctx.ellipse(0, -346, 19, 25, 0, 0, 7); ctx.fill();          // the thin face
    ctx.fillStyle = 'rgba(60,30,20,.55)'; ctx.fillRect(-11, -352, 7, 3); ctx.fillRect(4, -352, 7, 3);     // eyes looking to the horizon
    ctx.fillStyle = 'rgba(80,40,30,.25)'; ctx.beginPath(); ctx.ellipse(-12, -338, 5, 8, 0, 0, 7); ctx.ellipse(12, -338, 5, 8, 0, 0, 7); ctx.fill();    // hollow cheeks

function panelYurt(T, a) {                                       // frame 3: winter 1932, an empty yurt frame in the snow

  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * .62); ctx.scale(z, z); ctx.translate(-W / 2, -H * .62);
  let g = ctx.createLinearGradient(0, 0, 0, 1180); g.addColorStop(0, '#3b4558'); g.addColorStop(.7, '#8792a3'); g.addColorStop(1, '#b8b2a8'); ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, 1240);
  glowDot(720, 980, 260, '#f3e2c4', .35);                       // the pale sun behind the clouds
  for (let i = 0; i < 7; i++) { ctx.fillStyle = `rgba(70,78,96,${.28 + .05 * i})`; ctx.beginPath(); ctx.ellipse(((i * 260 + t * 8) % 1500) - 200, 700 + i * 55, 420, 40 + i * 4, 0, 0, 7); ctx.fill(); }
  g = ctx.createLinearGradient(0, 1150, 0, H); g.addColorStop(0, '#d9dbe0'); g.addColorStop(1, '#a9adb8'); ctx.fillStyle = g; ctx.fillRect(-60, 1150, W + 120, H);

  ctx.lineWidth = 4.5; for (let i = 0; i <= 16; i++) { if (i === 5 || i === 6 || i === 12) continue; const x0 = cx - R + i * R / 8; ctx.beginPath(); ctx.moveTo(x0, base - hw); ctx.lineTo(lerp(x0, cx, .82), base - hw - 150); ctx.stroke(); }
  ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(cx, base - hw - 160, 46, 14, 0, Math.PI * .1, Math.PI * 1.55); ctx.stroke();       // the shanyrak, broken
  ctx.restore();
  ctx.fillStyle = '#e4e6ea'; ctx.beginPath(); ctx.moveTo(cx - 330, 1260); ctx.quadraticCurveTo(cx - 120, 1150, cx + 60, 1200); ctx.quadraticCurveTo(cx + 250, 1160, cx + 380, 1262); ctx.closePath(); ctx.fill();

  ctx.lineWidth = 6; for (let i = 0; i < 7; i++) { if (i === 2) continue; const an = i / 7 * 6.28; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * 78, Math.sin(an) * 78); ctx.stroke(); } ctx.restore();
  // the mother with her child, the slow push-in towards her

  ctx.save(); ctx.globalAlpha = a * .22; ctx.fillStyle = '#5f7799'; ctx.globalCompositeOperation = 'multiply'; ctx.fillRect(0, 0, W, H); ctx.restore();
  snow(T, a, 2.2, -1); grain(a * .5, T);

function panelPass(T, a) {                                       // frame 10: the same woman climbing a snowy Tian Shan pass at sunset
  if (a <= .004) return;
  const t = T - M.S10, rise = easeIO(clamp(t / 6)) * 70;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, rise);
  let g = ctx.createLinearGradient(0, -100, 0, 1000); g.addColorStop(0, '#120c2e'); g.addColorStop(.6, '#3a2462'); g.addColorStop(.86, '#7a3d6a'); g.addColorStop(1, '#e0773c'); ctx.fillStyle = g; ctx.fillRect(0, -120, W, 1200);

    while (x < W + 40) { const w = 60 + 120 * hash(seed + x * .013); const pk = y0 - amp * (.4 + .6 * hash(seed + x * .021 + 5)); ctx.lineTo(x + w / 2, pk); caps.push([x + w / 2, pk, w]); x += w; ctx.lineTo(x, y0 - amp * .25 * hash(seed + x * .03)); }
    ctx.lineTo(W + 40, H); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); if (lit) { ctx.strokeStyle = `rgba(255,150,70,${.7 * fade})`; ctx.lineWidth = 3; ctx.stroke(); }
    if (lit) { ctx.fillStyle = 'rgba(220,214,240,.55)'; for (const [cx, cy, w] of caps) { const d = w * .22; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - d, cy + d * 1.3); ctx.lineTo(cx - d * .3, cy + d); ctx.lineTo(cx + d * .2, cy + d * 1.4); ctx.lineTo(cx + d, cy + d * 1.3); ctx.closePath(); ctx.fill(); } } };
  ridge(900, 330, 3, '#2b2350', true); ridge(1080, 260, 11, '#1d1838', true); ridge(1260, 180, 23, '#141029', false);
  // the snowy slope in front, with the trail of footprints
  ctx.fillStyle = '#c9cde0'; ctx.beginPath(); ctx.moveTo(-20, H + 100); ctx.lineTo(-20, 1500); ctx.quadraticCurveTo(400, 1340, 1100, 1180); ctx.lineTo(1100, H + 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(110,110,150,.35)'; ctx.beginPath(); ctx.moveTo(-20, 1560); ctx.quadraticCurveTo(400, 1400, 1100, 1240); ctx.lineTo(1100, 1260); ctx.quadraticCurveTo(400, 1430, -20, 1600); ctx.fill();
  ctx.fillStyle = 'rgba(70,70,110,.45)'; for (let i = 0; i < 14; i++) { const u = i / 14; ctx.beginPath(); ctx.ellipse(lerp(560, 120, u) + (i % 2) * 22, lerp(1420, 1800, u), 9 + u * 6, 5 + u * 3, 0, 0, 7); ctx.fill(); }
  // tiny figures far below
  for (let i = 0; i < 9; i++) { const x = 140 + i * 34 + Math.sin(T + i) * 2, y = 1650 + i * 10; ctx.fillStyle = 'rgba(20,16,40,.8)'; ctx.fillRect(x, y - 16, 6, 16); ctx.beginPath(); ctx.arc(x + 3, y - 19, 3.5, 0, 7); ctx.fill(); }
  // the mother, from behind, climbing
  mother(600 + t * 6, 1400 - t * 4, 1.05, T, true);
  ctx.restore();
  snow(T, a * .9, 3.2, -1); grain(a * .45, T);
}

// ---------------------------------------------------------------- titles and panels
function vignette(top = 1) {
  let g = ctx.createLinearGradient(0, 0, 0, 640); g.addColorStop(0, `rgba(0,0,0,${.9 * top})`); g.addColorStop(.5, `rgba(0,0,0,${.46 * top})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 640);
  g = ctx.createLinearGradient(0, 1080, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.42, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 1080, W, H - 1080);
  g = ctx.createRadialGradient(W / 2, H / 2, 620, W / 2, H / 2, 1180); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const tag = (s, y, a, col = C.acc) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; rr(ctx, W / 2 - 30, y - 52, 60, 6, 3); ctx.fill(); ctx.restore();
  txt(s, W / 2, y + (1 - a) * 8, { size: 31, weight: 800, ls: 5, color: col, alpha: a, sb: 10 }); };
function plate(s, x, y, size, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); font(ctx, size, 800, 'IT'); ctx.letterSpacing = (o.ls ?? 4) + 'px'; const w = ctx.measureText(s).width + size * 1.1, h = size * 1.55, sc = o.pop ? lerp(1.25, 1, easeBack(a)) : 1;
  ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(a * 1.5);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; rr(ctx, -w / 2, -h / 2, w, h, 16); ctx.fillStyle = o.fill || C.acc; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = o.color || BR.navy; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, (o.ls ?? 4) / 2, size * .06); ctx.restore();
}
function datePlate(s, a, y = 300, col = C.acc, size = 84) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; font(ctx, size, 800, 'IT'); const w = ctx.measureText(s).width + 90, h = size * 1.48, sc = lerp(.9, 1, easeBack(a));
  ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 30; rr(ctx, -w / 2, -h / 2, w, h, 22); ctx.fillStyle = C.pill; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  txt(s, W / 2, y + size * .36, { size, weight: 800, fam: 'IT', color: col, alpha: a, shadow: 0, ls: 2 });
}
function card(x, y, w, h, a, edge = C.line) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 10; rr(ctx, x - w / 2, y - h / 2, w, h, 26); ctx.fillStyle = C.card; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
function routeCounter(T, n, t0, t1, label) {                     // "1/3" chip with the route name
  const k = win2(T, t0, t1); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; for (let i = 0; i < 3; i++) { const on = i < n; ctx.beginPath(); ctx.arc(W / 2 - 60 + i * 60, 250, on ? 16 : 12, 0, 7); ctx.fillStyle = on ? C.acc : 'rgba(255,255,255,.25)'; ctx.fill(); } ctx.restore();
  txt(`${n}/3`, W / 2, 360, { size: 92, weight: 900, fam: 'IT', color: C.acc, alpha: k, sb: 26 });
  txt(label.toUpperCase(), W / 2, 430, { size: 36, weight: 800, ls: 5, alpha: k, sb: 12 });
}
function pie(T, x, y, r, a) {                                    // 1926: 58 % -> 1939: 38 %
  if (a <= 0) return;
  const u = easeIO(seg(T, M.y13, M.minor + .4)), v = lerp(58, 38, u), s = lerp(.8, 1, easeBack(a));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 14, 0, 7); ctx.fillStyle = C.card; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + v / 100 * Math.PI * 2); ctx.closePath(); ctx.fillStyle = C.acc; ctx.shadowColor = C.acc; ctx.shadowBlur = 24; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(0, 0, r * .58, 0, 7); ctx.fillStyle = BR.navy; ctx.fill();
  ctx.restore();
  txt(Math.round(v) + '%', x, y + 30, { size: 96, weight: 900, fam: 'IT', color: '#fff', alpha: a, shadow: 0 });
  txt(u < .5 ? L.y1926 : L.y1939, x, y - r - 46, { size: 64, weight: 800, fam: 'IT', color: C.acc, alpha: a, sb: 18, ls: 3 });
  txt(L.share, x, y + r + 74, { size: 38, weight: 700, alpha: a, sb: 14 });
}

function hud(T) {
  // 1: the hook
  const h1 = win2(T, M.mil - .2, M.S2 + .9, .3, .4);
  if (h1 > 0) { counter(T, 0, 1000000, M.mil - .1, M.mil + 1.0, W / 2, 470, 150, '#fff', h1, { step: 1000 }); tag(L.hookSub, 570, ap(T, M.mil + .4, .4) * h1); }
  // 2: where?
  const wk = win2(T, M.where - .1, M.S3 + .1); if (wk > 0) plate(L.where, W / 2, 470, 80, wk, { pop: 1, ls: 2 });
  // 3: the year on the panel
  datePlate(L.y1932, win2(T, M.S3 + .3, M.S4 - .1), 300, '#ffffff', 84);
  // 4: the herd count 40 000 000 -> 4 500 000
  const k4 = win2(T, M.S4 - .05, M.S5 + .1);
  if (k4 > 0) {
    const n = T < M.y4 ? lerp(0, 40e6, easeOut5(seg(T, M.m40 - .3, M.m40 + .7))) : lerp(40e6, 4.5e6, easeIO(seg(T, M.y4 + .2, M.m45 + .6)));
    txt(fmt(Math.round(n / 1e5) * 1e5), W / 2, 420, { size: 124, weight: 900, fam: 'IT', color: T < M.y4 + .3 ? '#fff' : mixHex('#ffffff', RED, seg(T, M.y4 + .2, M.m45 + .6)), alpha: k4, sb: 30, ls: 2 });
    tag(L.livestock, 505, k4); txt(T < M.y4 + .2 ? L.y1929 : L.y1933, W / 2, 285, { size: 58, weight: 800, fam: 'IT', color: C.acc, alpha: k4, ls: 4, sb: 14 });
  }
  // 5: the portrait, «Кіші Қазан»
  const k5 = win2(T, Math.min(M.gol, M.kq) - .15, M.S6 - .1);
  if (k5 > 0) { portrait(W / 2, 420, 135, k5); plate(L.gol, W / 2, 610, 40, k5, { fill: C.card, color: '#fff', ls: 1 });
    plate(L.kq, W / 2, 712, 54, k5 * ap(T, M.kq - .1, .35), { fill: RED, color: '#fff', pop: 1, ls: 1 }); txt(L.take, W / 2, 800, { size: 34, weight: 700, color: REDHI, alpha: k5 * ap(T, M.take, .4), sb: 12 }); }
  const pw = win2(T, M.power - .1, M.gol - .1); if (pw > 0) plate(KK ? 'ӨЗ БИЛІГІ' : 'СВОЯ ВЛАСТЬ', W / 2, 400, 72, pw, { fill: RED, color: '#fff', pop: 1 });
  // 6-8: the three routes
  routeCounter(T, 1, M.r1 - .1, M.S7 - .1, L.r[0]); routeCounter(T, 2, M.r2 - .1, M.S8 - .1, L.r[1]); routeCounter(T, 3, M.r3 - .1, M.but + .2, L.r[2]);
  const bk = win2(T, M.but, M.S9 - .1); if (bk > 0) plate(L.border.toUpperCase(), W / 2, 360, 72, bk, { fill: RED, color: '#fff', pop: 1 });
  // 9: 616 000 did not come back
  const k9 = win2(T, M.k616 - .2, M.S10 + .1);
  if (k9 > 0) { counter(T, 0, 616000, M.k616 - .1, M.k616 + 1.2, W / 2, 430, 140, '#fff', k9, { step: 1000 }); tag(L.noret, 520, k9 * ap(T, M.noret - .1, .4), REDHI); }
  // 10: on the panel, 1 500 000+
  const k10 = win2(T, M.m15 - .2, M.S11 - .1);
  if (k10 > 0) { counter(T, 0, 1500000, M.m15 - .1, M.m15 + 1.2, W / 2, 400, 124, '#fff', k10, { step: 1000, suf: '+' }); tag(L.hunger, 490, k10 * ap(T, M.hunger, .3), REDHI); }
  // 11: the share pie, then 30+ years
  const k11 = win2(T, M.S11 + .3, M.S12 - .1); pie(T, W / 2, 560, 200, k11);
  const yk = win2(T, M.y30 - .1, M.S12 - .1); if (yk > 0) plate(L.y30, W / 2, 1000, 60, yk, { pop: 1, ls: 2 });
  // 12: ҰБТ / ЕНТ
  const uk = win2(T, M.ubt - .15, M.S13 + .1);
  if (uk > 0) {
    plate(L.ubt, W / 2, 290, 66, uk, { pop: 1, ls: 6 }); txt(L.ubtLine, W / 2, 395, { size: 44, weight: 800, fam: 'IT', alpha: uk, sb: 14 });
    const q = ap(T, M.q - .1, .35) * uk, a = ap(T, M.ans - .1, .35) * uk, mk = ap(T, M.may - .1, .35) * uk;
    if (q > 0 && mk < 1) { const qa = q * (1 - mk); card(W / 2, 560, 900, 220, qa); txt(L.qL, W / 2, 500, { size: 30, weight: 800, ls: 6, color: C.acc, alpha: qa, shadow: 0 });
      L.q.forEach((s, i) => txt(s, W / 2, 565 + i * 62, { size: 50, weight: 700, fam: 'IT', alpha: qa, shadow: 0 })); }
    if (a > 0 && mk < 1) { const aa = a * (1 - mk); card(W / 2, 830, 900, 290, aa, rgba('#3ddc84', .8)); portrait(W / 2 - 300, 830, 95, aa, { edge: '#3ddc84' });
      txt(L.aL, W / 2 + 90, 790, { size: 30, weight: 800, ls: 6, color: '#3ddc84', alpha: aa, shadow: 0 }); txt(L.a, W / 2 + 90, 860, { size: 50, weight: 900, fam: 'IT', color: C.acc, alpha: aa, shadow: 0 }); }
    if (mk > 0) { card(W / 2, 640, 900, 330, mk, rgba('#ffffff', .5)); txt(L.may, W / 2, 640, { size: 110, weight: 900, fam: 'IT', color: '#fff', alpha: mk, shadow: 0 });
      const ws = L.maySub.split(' '), half = Math.ceil(ws.length / 2); [ws.slice(0, half).join(' '), ws.slice(half).join(' ')].forEach((s, i) => txt(s, W / 2, 712 + i * 46, { size: 34, weight: 600, color: 'rgba(255,255,255,.85)', alpha: mk, shadow: 0 })); }
  }
}
// 13: a quiet candle-like light over the country, then the arrow to the profile header
function finale(T) {
  const k = ap(T, M.S13 - .1, .5); if (k <= 0) return;
  const ar = ap(T, M.link - .3, .4);
  if (ar > 0) { const ay = 980 + 14 * Math.sin(T * 6.5), hh = 170; ctx.save(); ctx.globalAlpha = ar; ctx.strokeStyle = C.acc; ctx.lineWidth = 18; ctx.lineCap = ctx.lineJoin = 'round'; ctx.shadowColor = C.acc; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.moveTo(W / 2, ay + hh * .6); ctx.lineTo(W / 2, ay - hh * .6); ctx.moveTo(W / 2 - 70, ay - hh * .1); ctx.lineTo(W / 2, ay - hh * .65); ctx.lineTo(W / 2 + 70, ay - hh * .1); ctx.stroke(); ctx.restore();
    plate(L.link, W / 2, 1220, 54, ar, { pop: 1, ls: 2 }); }
}

// ---------------------------------------------------------------- the brand in the frame
const END0 = M.last + .55;
function logo() { ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(LOGO, W - 48 - LOGO.width, 48); ctx.restore(); }
function credit(T) { if (T < END0) txt(L.credit, W / 2, 1880, { size: 17, weight: 500, color: 'rgba(255,255,255,.42)', shadow: 0 }); }
function endCard(T) {
  const k = ease(seg(T, END0, END0 + .5)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, W, H);
  const s = lerp(.9, 1, easeOut(seg(T, END0, END0 + .8))), w = LOGO_BIG.width * s, h = LOGO_BIG.height * s, cy = 800;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO_BIG, W / 2 - w / 2, cy - h / 2, w, h); ctx.restore();
  const c = ap(T, END0 + .3, .4), d = ap(T, END0 + .5, .4);
  if (c > 0) txt(L.endA, W / 2, cy + 322 + (1 - c) * 12, { size: 66, weight: 800, fam: 'IT', color: C.acc, alpha: c, shadow: 0 });
  if (d > 0) txt(L.endB, W / 2, cy + 396 + (1 - d) * 12, { size: 40, weight: 600, color: 'rgba(255,255,255,.85)', alpha: d, shadow: 0 });
}

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, b: '#8fb6ff' };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });
const CH = CHUNKS.filter(Boolean);
function captions(T, y) {
  let i = -1; for (let k = 0; k < CH.length; k++) if (T >= CH[k].t0 - .07) i = k;
  if (i < 0) return; const c = CH[i], tEnd = Math.min(i + 1 < CH.length ? CH[i + 1].t0 - .07 : 1e9, c.t1 + .5);
  if (T > tEnd || T > END0) return;
  const its = c.ws.map(w => { const key = w.c !== 'w', size = key ? 60 : 54, weight = key ? 800 : 700, s = w.w.replace(/[.,:;!?]+$/, ''); font(ctx, size, weight); return { w, s, size, weight, wd: ctx.measureText(s).width }; });
  let tot = 0; its.forEach((it, k) => { tot += it.wd + (k < its.length - 1 && !it.w.g ? 17 : 0); });
  const sc = Math.min(1, 960 / tot), a = seg(T, c.t0 - .07, c.t0 + .03) * (1 - seg(T, tEnd - .06, tEnd));
  ctx.save(); ctx.translate(W / 2, y + (1 - seg(T, c.t0 - .07, c.t0 + .05)) * 10); ctx.scale(sc, sc); let x = -tot / 2;
  for (const it of its) {
    const on = seg(T, it.w.t - .04, it.w.t + .05), pop = 1 + .07 * Math.sin(Math.PI * seg(T, it.w.t - .02, it.w.t + .2));
    ctx.save(); ctx.translate(x + it.wd / 2, 0); ctx.scale(pop, pop); font(ctx, it.size, it.weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.globalAlpha = a * lerp(.4, 1, on); ctx.fillStyle = CAPCOL[it.w.c] || '#fff';
    ctx.fillText(it.s, 0, 0); ctx.shadowBlur = 5; ctx.fillText(it.s, 0, 0); ctx.restore();
    x += it.wd + (it.w.g ? 0 : 17);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- frame
const FLASH = [M.S6, M.S7, M.S8, M.S12];
async function render(T) {
  T = clamp(T, 0, END); T_NOW = T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const p3 = win2(T, M.S3 + .1, M.S4 + .1, .7, .6), p10 = win2(T, M.S10 + .2, M.S11 + .2, .8, .7);
  if (p3 < 1 && p10 < 1) {
    const cam = window.CAMQ || camAt(T); setCam(cam);
    globeMat.uniforms.expo.value = lerp(.5, .64, seg(T, 0, 3)) * (1 + .5 * clamp((cam.lat - 50) / 10)) * (1 - .2 * win2(T, M.S12, END, .6, .1));
    globeMat.uniforms.sat.value = .82; globeMat.uniforms.haze.value = .7; atmo.material.uniforms.k.value = .5;
    stars(clamp((cam.range - .3) / 1.2) * .8);
    renderer.render(scene, camera); ctx.drawImage(glc, 0, 0);
    borders(.22 * clamp(2.6 - cam.range * .6));
    mapLayer(T);
  }
  panelYurt(T, p3); panelPass(T, p10);
  vignette(1);
  hud(T); finale(T);
  captions(T, 1450);
  credit(T); logo(); endCard(T);
  for (const tc of FLASH) if (T >= tc && T < tc + .16) { ctx.fillStyle = `rgba(255,255,255,${.16 * (1 - (T - tc) / .16) ** 2})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render; window.setCamQ = c => { window.CAMQ = c; }; window.END = END; window.M = M;
window.ready = true;
</script>
