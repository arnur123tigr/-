// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - (1 - k) ** 3;
const ease = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
const back = k => { const c = 1.9; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- depth -> radius (crust drawn thicker so it can be seen) ----------
const R = 10, RC = 0.546, RI = 0.192, RM = 0.962;           // core-mantle boundary, inner core, base of the (drawn) crust
function rOf(km) {                                            // fraction of R at depth km
  if (km <= 40) return lerp(1, RM, km / 40);
  if (km <= 2900) return lerp(RM, RC, (km - 40) / 2860);
  return lerp(RC, 0, (km - 2900) / 3471);
}

// ---------- lights ----------

const sun = new THREE.DirectionalLight('#FFF4E0', 2.6); sun.position.set(30, 25, 40); scene.add(sun);
const fill = new THREE.DirectionalLight('#8FB0FF', .6); fill.position.set(-30, -10, -20); scene.add(fill);

// ===================================================================================
// the Earth: Blue Marble sphere with a quarter cut out (x>0 and z>0), two cut faces with the layers

const EARTH = new THREE.Group(); scene.add(EARTH);
const CLIP = [new THREE.Plane(V(-1, 0, 0), 0), new THREE.Plane(V(0, 0, -1), 0)];

const SURF = new THREE.Mesh(new THREE.SphereGeometry(R, 160, 120), surfMat); EARTH.add(SURF);
{ // put Kazakhstan (48N, 68E) on top
  const lat = 48 * Math.PI / 180, phi = (68 + 180) * Math.PI / 180, th = Math.PI / 2 - lat;

    g.fillStyle = rnd() < .5 ? 'rgba(255,255,220,0.14)' : 'rgba(230,140,20,0.12)'; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();

const faceTex = new THREE.CanvasTexture(layerCanvas()); faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 8;
const faceMat = new THREE.MeshBasicMaterial({ map: faceTex, side: THREE.DoubleSide, toneMapped: false });
const FACE_A = new THREE.Mesh(new THREE.CircleGeometry(R, 200, -Math.PI / 2, Math.PI), faceMat); FACE_A.rotation.y = -Math.PI / 2; EARTH.add(FACE_A); // plane x=0, z>0
const FACE_B = new THREE.Mesh(new THREE.CircleGeometry(R, 200, -Math.PI / 2, Math.PI), faceMat); EARTH.add(FACE_B);                                   // plane z=0, x>0

const onA = (r, a) => V(0, Math.cos(a) * r * R, Math.sin(a) * r * R);
const onB = (r, a) => V(Math.sin(a) * r * R, Math.cos(a) * r * R, 0);
// elevator cabin running down the corner edge
const CAB = new THREE.Group(); EARTH.add(CAB);
{
  const m = new THREE.MeshStandardMaterial({ color: '#FEB300', emissive: '#FEB300', emissiveIntensity: .6, roughness: .4 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(.32, .42, .32), m); CAB.add(box);
  const win = new THREE.Mesh(new THREE.BoxGeometry(.2, .2, .34), new THREE.MeshBasicMaterial({ color: '#130B54' })); win.position.y = .04; CAB.add(win);

}
const cabL = new THREE.PointLight('#FFC64A', 0, 6, 1.5); CAB.add(cabL);

// ---------- the little digger ----------

  const hip = new THREE.Group(); hip.position.y = .42; g.add(hip);

  part(new THREE.BoxGeometry(.13, .07, .2), M('#3A2416'), 0, -.42, .04, legL); part(new THREE.BoxGeometry(.13, .07, .2), M('#3A2416'), 0, -.42, .04, legR);
  const torso = new THREE.Group(); hip.add(torso);
  part(new THREE.BoxGeometry(.3, .4, .18), M('#F07A1A'), 0, .2, 0, torso);                        // orange work vest
  part(new THREE.BoxGeometry(.31, .05, .19), M('#E8E8E8'), 0, .14, 0, torso);                     // reflective stripe
  const head = part(new THREE.SphereGeometry(.12, 20, 14), M('#E2B48C'), 0, .53, 0, torso);
  const hat = part(new THREE.SphereGeometry(.135, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), M('#FEB300'), 0, .56, 0, torso);
  part(new THREE.CylinderGeometry(.17, .17, .02, 20), M('#FEB300'), 0, .565, .02, torso);
  part(new THREE.SphereGeometry(.018, 8, 6), M('#111'), -.045, .54, .11, torso); part(new THREE.SphereGeometry(.018, 8, 6), M('#111'), .045, .54, .11, torso);
  const armL = new THREE.Group(), armR = new THREE.Group(); armL.position.set(-.19, .36, 0); armR.position.set(.19, .36, 0); torso.add(armL, armR);
  part(new THREE.BoxGeometry(.08, .32, .09), M('#F07A1A'), 0, -.15, 0, armL); part(new THREE.BoxGeometry(.08, .32, .09), M('#F07A1A'), 0, -.15, 0, armR);
  const shovel = new THREE.Group(); shovel.position.set(.19, -.28, .08); armR.add(shovel);

}
const MAN = digger(); MAN.scale.setScalar(1.6); EARTH.add(MAN);
const manBase = V(-.9, Math.sqrt(R * R - 2 * .81) - .02, -.9);
MAN.position.copy(manBase); MAN.lookAt(V(1.5, manBase.y, 1.5)); MAN.rotateY(Math.PI * .75);
const DIRT = new THREE.Mesh(new THREE.SphereGeometry(.38, 12, 8, 0, 7, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#6B4A2A', roughness: 1 }));
DIRT.scale.set(1, .35, 1); DIRT.position.set(-.35, manBase.y - .05, -1.45); EARTH.add(DIRT);

  const u = MAN.userData;
  if (mode === 'dig') {
    const p = (T * 1.6) % 1, s = Math.sin(p * Math.PI * 2);
    u.torso.rotation.x = .35 + .25 * s; u.armR.rotation.x = -.6 - .7 * s; u.armL.rotation.x = -.8 - .5 * s; u.shovel.rotation.x = .6 + .4 * s;

// ===================================================================================
// crust block ("cake"): ocean | plain | mountains, 0.1 unit per km
// ===================================================================================
const CRUST = new THREE.Group(); scene.add(CRUST);
const XS = []; for (let x = -9; x <= 9.001; x += 0.05) XS.push(+x.toFixed(3));
const surfH = x => {
  const ocean = -0.75, plain = 0.15 + 0.04 * Math.sin(x * 2.3);
  const peaks = 0.2 + 2.3 * Math.exp(-((x - 6.2) ** 2) / 2.2) + 0.7 * Math.exp(-((x - 4.6) ** 2) / .35) + .5 * Math.exp(-((x - 7.6) ** 2) / .4) + .12 * Math.sin(x * 9);

};
const mohoH = x => { let m = lerp(-0.75 - 0.7, -3.5, smooth(-4.2, -1.8, x)); m = lerp(m, -7.6, smooth(3, 5.8, x) * (1 - smooth(7.6, 9.5, x)) + smooth(3, 5.8, x) * smooth(7.6, 9.5, x) * .85); return m; };

}

const L_SED = band(x => surfH(x) - 0.02, sedB, '#E2B66E');
const L_GR = band(sedB, grB, '#B9A7B4');

// snow on the high peaks
{ const xs = XS.filter(x => surfH(x) > 1.15); const s = new THREE.Shape(); xs.forEach((x, i) => i ? s.lineTo(x, surfH(x) + .05) : s.moveTo(x, surfH(x) + .05)); [...xs].reverse().forEach(x => s.lineTo(x, Math.max(1.1, surfH(x) - .25)));

// water over the ocean
{ const s = new THREE.Shape(); const xo = XS.filter(x => surfH(x) < 0.02);

const RIG = new THREE.Group(); CRUST.add(RIG); RIG.position.set(0, surfH(0), ZF - .35);
{ const m = new THREE.MeshStandardMaterial({ color: '#D8DCE2', metalness: .5, roughness: .4 });

// ===================================================================================

// ===================================================================================
let B, M, IMG = {};
function toScreen(p) { camera.updateMatrixWorld(); const v = p.clone().project(camera); return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, z: v.z }; }
function rr(x, y, w, h, r) { O.beginPath(); O.roundRect(x, y, w, h, r); }
function fitFont(txt, px, maxW, fam = 'MB') { O.font = `${px}px ${fam}`; const w = O.measureText(txt).width; if (w > maxW) { px *= maxW / w; O.font = `${px}px ${fam}`; } return px; }
