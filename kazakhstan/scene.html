<html><head><meta charset="utf-8">

<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Самая недооценённая страна" — satellite-map reel about Kazakhstan (remake of a geoallday reel). render(T) is deterministic, T = video seconds.
// Kazakhstan's outline (shapes.json) already includes Baikonur, so it is always filled completely — no hole.
const LANG = new URLSearchParams(location.search).get('lang') || 'ru';
const KK = {};
const L = s => (LANG === 'kk' && KK[s]) || s;
let TMAP = null;
const mapT = v => { if (!TMAP) return v; let i = 0; while (i < TMAP.length - 2 && v > TMAP[i + 1][0]) i++; const [a0, b0] = TMAP[i], [a1, b1] = TMAP[i + 1]; return b0 + (v - a0) * (b1 - b0) / (a1 - a0); };
const W = 1080, H = 1920, OFF = 0.3; let END = 67.4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const MAP = new Image(), WORLD = new Image(), MOS = new Image();
let SH = null, WPX = null;   // shapes, world texture pixels
const MLON0 = -20, MY1 = 117.30871701272397, SI = 26;
const D2R = Math.PI / 180, EMO = '"Noto Color Emoji"';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .35) => clamp((t - a) / f) * clamp((b - t) / f);
const lerp = (a, b, k) => a + (b - a) * k;
const my = lat => 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * D2R)) / D2R;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- camera keys: [voice time, lon, lat, px/deg] ----------
const CAM = [[-1, 60, 44, 11.5], [0.6, 67, 46, 15], [4.4, 67, 46, 13], [6.7, 72, 43, 12.5], [13.6, 67, 47, 16], [16.0, 72, 51, 11.2],
  [24.6, 68, 46, 14], [27.0, 67, 47.5, 22], [34.4, 72, 45, 12], [36.2, 82, 42, 11.2], [38.6, 74, 43, 11.2], [41.0, 48, 45, 11.2],
  [45.9, 63.5, 46.5, 21], [48.3, 67, 48, 22], [53.3, 67, 47, 14], [58.1, 68, 46, 12]];
let cam = { lon: 60, y: my(44), s: 11.5 };
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  const A = CAM[i], P = CAM[Math.max(0, i - 1)], from = i === 0 ? A : P;
  const k = ease((t - A[0]) / 1.3);
  const sc = Math.exp(lerp(Math.log(from[3]), Math.log(A[3]), k)) * (1 + (t - A[0]) * 0.008);
  const s = Math.max(11, sc); let y = lerp(my(from[2]), my(A[2]), k);
  y = Math.min(MY1 - H * .5 / s - .5, y);
  return { lon: lerp(from[1], A[1], k), y, s };
}
const PX = (lon, lat) => [W / 2 + (lon - cam.lon) * cam.s, H * .5 - (my(lat) - cam.y) * cam.s];

// ---------- helpers ----------
function txt(s, x, y, size, col = '#fff', font = 'M', glow = null, gb = .5, align = 'center') {
  ctx.font = `900 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = size * gb; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.fillText(s, x, y); }
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = size * .2; ctx.shadowOffsetY = size * .05; ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function fitTxt(s, x, y, size, maxW, ...r) { ctx.font = `900 ${size}px M`; const w = ctx.measureText(s).width; txt(s, x, y, w > maxW ? size * maxW / w : size, ...r); }
function emoji(e, x, y, size, a = 1, rot = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = size * .15; ctx.shadowOffsetY = size * .05; ctx.fillText(e, 0, 0); ctx.restore();
}
// country path in map space (or with a custom projector)
function cpath(rings, P = PX) { ctx.beginPath(); for (const r of rings) { r.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); } }
// glowing filled country like the original (red glow, light border)
function glowCountry(rings, a, rgb = '255,45,45', P = PX, fillA = .55, line = 4) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  cpath(rings, P); ctx.shadowColor = `rgba(${rgb},1)`; ctx.shadowBlur = 60; ctx.fillStyle = `rgba(${rgb},${fillA})`; ctx.fill(); ctx.fill();
  ctx.shadowBlur = 0; ctx.save(); ctx.clip(); ctx.shadowColor = `rgba(${rgb},1)`; ctx.shadowBlur = 40; ctx.lineWidth = 30; ctx.strokeStyle = `rgba(255,235,235,.35)`; ctx.stroke(); ctx.restore();
  ctx.lineJoin = 'round'; ctx.lineWidth = line; ctx.strokeStyle = 'rgba(255,240,240,.95)'; ctx.shadowColor = `rgba(${rgb},1)`; ctx.shadowBlur = 14; ctx.stroke(); ctx.restore();
}
function kzLabel(a, size = 64, dy = 0, P = PX, flag = true) {
  if (a <= 0) return; const [x, y] = P(SH.center[0] + 1, SH.center[1] - .5); ctx.save(); ctx.globalAlpha = a;
  if (flag) emoji('🇰🇿', x, y - size * 1.05 + dy, size * 1.25);
  txt(L('КАЗАХСТАН'), x, y + dy, size, '#fff', 'M', 'rgba(255,60,60,.9)', .4); ctx.restore();
}
function plainLabel(s, lon, lat, a, size = 34, fl = null) { if (a <= 0) return; const [x, y] = PX(lon, lat); ctx.save(); ctx.globalAlpha = a; if (fl) emoji(fl, x, y - size * 1.1, size * 1.3); txt(s, x, y, size, '#fff', 'MX'); ctx.restore(); }

function drawMap(filter = 'none') {
  ctx.fillStyle = '#1b4a58'; ctx.fillRect(0, 0, W, H);
  const sx = (cam.lon - W / 2 / cam.s - MLON0) * SI, sy = (MY1 - (cam.y + H * .5 / cam.s)) * SI, sw = W / cam.s * SI, sh = H / cam.s * SI;
  const cx0 = Math.max(0, sx), cy0 = Math.max(0, sy), cx1 = Math.min(MAP.width, sx + sw), cy1 = Math.min(MAP.height, sy + sh);
  const dx = (cx0 - sx) / sw * W, dy = (cy0 - sy) / sh * H, dw = (cx1 - cx0) / sw * W, dh = (cy1 - cy0) / sh * H;
  ctx.save(); ctx.filter = filter; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(MAP, cx0, cy0, cx1 - cx0, cy1 - cy0, dx, dy, dw, dh); ctx.restore();
}
// soft clouds for the opening (part to the sides)
const CLOUDS = []; for (let i = 0; i < 26; i++) CLOUDS.push({ x: rnd(), y: rnd(), r: 140 + rnd() * 200, d: rnd() < .5 ? -1 : 1 });
function clouds(k) {
  if (k >= 1) return; ctx.save();
  for (const c of CLOUDS) { const dx = c.d * eout(k) * 900, x = c.x * W + dx, y = c.y * H, a = (1 - k);
    for (let j = 0; j < 4; j++) { const g = ctx.createRadialGradient(x + j * 60 - 90, y + (j % 2) * 30, 0, x + j * 60 - 90, y + (j % 2) * 30, c.r);
      g.addColorStop(0, `rgba(255,255,255,${.95 * a})`); g.addColorStop(.6, `rgba(240,244,248,${.7 * a})`); g.addColorStop(1, 'rgba(240,244,248,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); } }
  ctx.restore();
}
function blurBack(a, dark = .35) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.filter = 'blur(14px)'; ctx.drawImage(cv, 0, 0); ctx.filter = 'none'; ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// ---------- scenes ----------
function title(t) {   // "САМАЯ НЕДООЦЕНЁННАЯ СТРАНА?"
  const a = win(t, 1.2, 4.4, .3); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const k1 = back((t - 1.2) / .4), k2 = back((t - 2.0) / .4), k3 = back((t - 3.1) / .4), y0 = 300;
  ctx.save(); ctx.translate(W / 2, y0); ctx.scale(k1, k1); txt(L('САМАЯ'), 0, 0, 104); ctx.restore();
  if (t > 2.0) { ctx.save(); ctx.translate(W / 2, y0 + 128); ctx.scale(k2, k2); ctx.font = '900 92px M'; const w = ctx.measureText(L('НЕДООЦЕНЁННАЯ')).width + 50;
    ctx.fillStyle = '#17b3b0'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20; ctx.fillRect(-w / 2, -62, w, 124); ctx.shadowBlur = 0; txt(L('НЕДООЦЕНЁННАЯ'), 0, 4, 92); ctx.restore(); }
  if (t > 3.1) { ctx.save(); ctx.translate(W / 2, y0 + 256); ctx.scale(k3, k3); txt(L('СТРАНА?'), 0, 0, 104); ctx.restore(); }
  ctx.restore();
}
const RANK = [['🇷🇺', 'РОССИЯ', '17 098 246'], ['🇨🇦', 'КАНАДА', '9 984 670'], ['🇨🇳', 'КИТАЙ', '9 596 961'], ['🇺🇸', 'США', '9 525 067'], ['🇧🇷', 'БРАЗИЛИЯ', '8 515 767'],
  ['🇦🇺', 'АВСТРАЛИЯ', '7 688 287'], ['🇮🇳', 'ИНДИЯ', '3 287 263'], ['🇦🇷', 'АРГЕНТИНА', '2 780 400'], ['🇰🇿', 'КАЗАХСТАН', '2 724 900']];
function ranking(t) {
  const a = win(t, 4.45, 6.75, .3); if (a <= 0) return; blurBack(a, .3); ctx.save(); ctx.globalAlpha = a;
  txt(L('СТРАНЫ ПО ПЛОЩАДИ, КМ²'), W / 2, 330, 60);
  RANK.forEach(([f, n, v], i) => { const k = eout((t - 4.5 - i * .12) / .35); if (k <= 0) return; const y = 470 + i * 112, x0 = 90 - (1 - k) * 200;
    ctx.globalAlpha = a * k;
    if (i === 8) { const h = clamp((t - 5.75) / .25); ctx.fillStyle = `rgba(230,240,40,${.85 * h})`; ctx.fillRect(40, y - 50, W - 80, 100); }
    emoji(f, x0 + 30, y, 62); txt(`${i + 1}. ${n}`, x0 + 95, y + 3, 50, '#fff', 'M', null, .5, 'left'); txt(v, W - 70, y + 3, 50, '#fff', 'M', null, .5, 'right'); });
  ctx.restore();
}
function neighbours(t) {
  const a = win(t, 6.8, 9.25, .3); if (a <= 0) return;
  for (const [c, n, fl, lo, la] of [['RUS', 'РОССИЯ', '🇷🇺', 80, 59], ['CHN', 'КИТАЙ', '🇨🇳', 92, 35], ['UZB', 'УЗБЕКИСТАН', null, 63, 42.3], ['KGZ', 'КЫРГЫЗСТАН', null, 76.5, 41.2], ['TKM', 'ТУРКМЕНИСТАН', null, 58.5, 38.7], ['MNG', 'МОНГОЛИЯ', '🇲🇳', 103, 46.5]]) {
    const k = clamp((t - 6.9) / .3); ctx.save(); ctx.globalAlpha = a * k * .9; cpath(SH[c]); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    plainLabel(n, lo, la, a * k, fl ? 30 : 25, fl);
  }
  const k = clamp((t - 7.5) / .3); if (k > 0) { ctx.save(); ctx.globalAlpha = a * k; const sc = back((t - 7.5) / .4); ctx.translate(W / 2, 330); ctx.scale(sc, sc);
    txt(L('КРУПНЕЙШАЯ СТРАНА'), 0, -45, 68); txt(L('БЕЗ ВЫХОДА К МОРЮ'), 0, 45, 68, '#ffe14d'); ctx.restore(); }
}
// size comparison on a dark background, equal-area local projection (same km per pixel for every shape)
function sizeCompare(t) {
  const a = win(t, 9.2, 13.65, .3); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const bg = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, H * .7); bg.addColorStop(0, '#2a1416'); bg.addColorStop(1, '#070506'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 2; for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  const K = 15.5;   // px per degree of latitude
  const proj = (cx, cy, lon0, lat0, sc = 1) => (lo, la) => [cx + (lo - lon0) * Math.cos(lat0 * D2R) * K * sc, cy - (la - lat0) * K * sc];
  const tex = clamp((t - 11.4) / .4);
  const kzY = lerp(560, 880, ease((t - 11.4) / .6)), euY = lerp(1230, 1450, ease((t - 11.4) / .6));
  const k1 = back((t - 9.25) / .5), k2 = back((t - 9.9) / .5);
  glowCountry(SH.KAZ, a, '255,45,45', proj(W / 2, kzY, 67, 48, k1), .6, 4);
  kzLabel(a, 52, 0, proj(W / 2, kzY, 67, 48, k1));
  ctx.save(); ctx.globalAlpha = a; txt(L('2,725 МЛН КМ²'), W / 2, kzY + 205, 54, '#fff', 'M', 'rgba(255,80,80,.8)', .4); ctx.restore();
  if (t > 9.9) { glowCountry(SH.WEU, a, '235,225,40', proj(W / 2 - 40, euY, 7, 48.5, k2), .6, 3);
    ctx.save(); ctx.globalAlpha = a; txt(L('ЗАПАДНАЯ'), W / 2 - 30, euY - 30, 48, '#fff8b0'); txt(L('ЕВРОПА'), W / 2 - 30, euY + 25, 48, '#fff8b0'); txt(L('1,1 МЛН КМ²'), W / 2, euY + 230, 52, '#fff', 'M', 'rgba(240,230,40,.7)', .4); ctx.restore(); }
  if (tex > 0) { const pos = [[W / 2 - 150, 330], [W / 2 + 150, 330], [W / 2 - 150, 520], [W / 2 + 150, 520]];
    pos.forEach(([x, y], i) => { const k = back((t - 11.6 - i * .15) / .4); if (k <= 0) return; glowCountry(SH.TEX, a * clamp((t - 11.6 - i * .15) / .2), '60,150,255', proj(x, y - 80 * 0, -99.3, 31.3, k), .6, 3); });
    ctx.save(); ctx.globalAlpha = a * tex; txt(L('ТЕХАС × 4'), W / 2, 170, 60, '#d6ebff', 'M', 'rgba(60,150,255,.9)', .5); ctx.restore(); }
}
function question(t) {
  const a = win(t, 13.75, 16.1, .3); if (a <= 0) return; const [x, y] = PX(68, 48); ctx.save(); ctx.globalAlpha = a;
  const sc = back((t - 13.8) / .45); ctx.translate(x, y - 40); ctx.scale(sc, sc); txt('?', 0, -60, 330, '#fff', 'M', 'rgba(255,255,255,.8)', .25); ctx.restore();
  ctx.save(); ctx.globalAlpha = a; txt(L('ЧЕМ ЖЕ ЭТА СТРАНА'), W / 2, 330, 66); txt(L('ТАК ИНТЕРЕСНА?'), W / 2, 420, 66); ctx.restore();
}
function nukeIcon(x, y, s, a, rot = -.6) {   // simple bomb with radiation sign
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(0, -38, 0, 38); g.addColorStop(0, '#fff27a'); g.addColorStop(1, '#c9a400');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 90, 40, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#555c66'; ctx.beginPath(); ctx.moveTo(80, -14); ctx.lineTo(140, -36); ctx.lineTo(140, 36); ctx.lineTo(80, 14); ctx.fill(); ctx.fillRect(132, -40, 10, 80);
  ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-20, 0, 30, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe23a';
  for (let k = 0; k < 3; k++) { const a0 = k * 2.094 - .52; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.arc(-20, 0, 25, a0, a0 + 1.05); ctx.fill(); }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-20, 0, 7, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe23a'; ctx.beginPath(); ctx.arc(-20, 0, 4, 0, 7); ctx.fill();
  ctx.restore();
}
function nuclear(t) {
  const a = win(t, 16.05, 27.1, .5); if (a <= 0) return;
  const rus = win(t, 20.8, 27.1, .6); if (rus > 0) glowCountry(SH.RUS, a * rus * .9, '150,90,255', PX, .45, 2);
  glowCountry(SH.KAZ, a, '255,45,45', PX, .5, 3); kzLabel(a, 40);
  // counter 1410 -> 0 while warheads fly to Russia
  const cnt = t < 21 ? 1410 : Math.round(1410 * (1 - ease((t - 21) / 3.2)));
  const k = clamp((t - 17.3) / .3); if (k > 0) { const [x, y] = PX(70, 44.5), sc = back((t - 17.3) / .4); ctx.save(); ctx.globalAlpha = a * k; ctx.translate(x, y + 60); ctx.scale(sc, sc);
    nukeIcon(-150, 10, .9, 1); txt(cnt.toLocaleString('ru-RU').replace(/\s/g, ' '), 40, 0, 120, '#fff', 'M', 'rgba(255,255,255,.6)', .3, 'left'); ctx.restore(); }
  for (let i = 0; i < 8; i++) { const t0 = 21.1 + i * .35, q = clamp((t - t0) / 1.4); if (q <= 0 || q >= 1) continue;
    const [x0, y0] = PX(72 + (i % 3) * 3, 48), [x1, y1] = PX(55 + i * 6, 61 + (i % 2) * 3), x = lerp(x0, x1, ease(q)), y = lerp(y0, y1, ease(q)) - Math.sin(q * Math.PI) * 120;
    nukeIcon(x, y, .28, a * Math.sin(q * Math.PI) * 1.5, Math.atan2(y1 - y0, x1 - x0) + Math.PI); }
  const m = clamp((t - 24.6) / .3); if (m > 0) { ctx.save(); ctx.globalAlpha = a * m; const sc = back((t - 24.6) / .45); ctx.translate(W / 2, 330); ctx.scale(sc, sc);
    // medal
    ctx.fillStyle = '#d42a3a'; ctx.beginPath(); ctx.moveTo(-330, 20); ctx.lineTo(-300, 130); ctx.lineTo(-275, 100); ctx.lineTo(-245, 130); ctx.lineTo(-215, 20); ctx.fill();
    const g = ctx.createRadialGradient(-280, -20, 10, -272, 0, 85); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa3ad'); ctx.fillStyle = g; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20;
    ctx.beginPath(); for (let j = 0; j < 24; j++) { const r = j % 2 ? 78 : 88, an = j * Math.PI / 12; ctx.lineTo(-272 + Math.cos(an) * r, Math.sin(an) * r); } ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#5f6872'; ctx.beginPath(); ctx.arc(-272, 0, 56, 0, 7); ctx.fill(); emoji('☢️', -272, 2, 70);
    txt(L('ЯДЕРНОЕ'), -170, -42, 76, '#fff', 'M', null, .5, 'left'); txt(L('РАЗОРУЖЕНИЕ'), -170, 42, 76, '#fff', 'M', null, .5, 'left'); ctx.restore(); }
}
function bubble(x, y, r, a, draw) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 5; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke(); draw(r); ctx.restore();
}
function resources(t) {
  const a = win(t, 27.05, 34.5, .4); if (a <= 0) return;
  glowCountry(SH.KAZ, a, '255,40,40', PX, .62, 4);
  kzLabel(a * win(t, 27.1, 28.6, .3), 80);
  { const k = clamp((t - 28.6) / .35), [x, y] = PX(66, 48); bubble(x, y, 150 * back((t - 28.6) / .45), a * k, r => {
      ctx.fillStyle = '#f2f4f6'; ctx.fillRect(-r * .5, -r * .55, r, r * 1.1); ctx.fillStyle = '#e04848'; ctx.fillRect(-r * .5, -r * .55, r, r * .22);
      ctx.fillStyle = '#e04848'; ctx.font = `900 ${r * .7}px M`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('U', 0, r * .12); ctx.font = `900 ${r * .14}px M`; ctx.fillStyle = '#fff'; ctx.fillText('92', 0, -r * .44); });
    ctx.save(); ctx.globalAlpha = a * k; txt(L('№1 ПО ДОБЫЧЕ УРАНА'), W / 2, 330, 70, '#fff', 'M', 'rgba(255,90,90,.7)', .4); ctx.restore(); }
  for (const [e, lo, la, t0, nm] of [['🛢️', 56, 45, 31.9, 'НЕФТЬ'], ['⛽', 52.5, 50, 32.9, 'ГАЗ'], ['💎', 78, 49.5, 33.4, 'РЕДКИЕ МЕТАЛЛЫ']]) {
    const k = clamp((t - t0) / .3); if (k <= 0) continue; const [x, y] = PX(lo, la); const r = 100 * back((t - t0) / .45);
