<script>
// «Кто первым встречает Новый год» — RU remake, voice «Арнур». Pacific-centred shapes (lon < 0 shifted +360); Samoa/Baker part in raw lon.
const OFF = .3;
let B = {}, SH = null, CAPS = [], END = 70;
const V = k => B[k] + OFF;
TEX.push({ k: 'world', l0: -180, l1: 180, b0: -90, b1: 90 });
TEX.push({ k: 'world', l0: 180, l1: 540, b0: -90, b1: 90 });
TEX.push({ k: 'pacw', l0: 140, l1: 180, b0: -30, b1: 20, minppd: 14 });
TEX.push({ k: 'pace', l0: 180, l1: 220, b0: -30, b1: 20, minppd: 14 });
TEX.push({ k: 'pace', l0: -180, l1: -140, b0: -30, b1: 20, minppd: 14 });
TEX.push({ k: 'samoa', l0: -173, l1: -168, b0: -15, b1: -13, minppd: 90 });
TEX.push({ k: 'kiri', l0: 202.38, l1: 202.92, b0: 1.62, b1: 2.1, minppd: 250 });
const GOLD = '#FEB300', BLUE = '#4FB3FF', GREEN = '#7fe08a', RED = '#ff6b5a';

<script src="helpers.js"></script>
<script>
const fill = (rings, col, a, o) => glowFill(rings, col, a, Object.assign({ fill: .55, lw: 4, blur: 18 }, o || {}));
const offR = (rings, dx) => dx ? rings.map(r => r.map(([x, y]) => [x + dx, y])) : rings;
const fill2 = (rings, col, a, o) => { if (a <= 0) return; for (const dx of [0, -360]) fill(offR(rings, dx), col, a, o); };
function burst(x, y, t0, t, col, seed = 1, R = 170) {        // firework: radial sparks with gravity, fading
  const k = (t - t0) / 1.6; if (k <= 0 || k >= 1) return; const r = rng(seed * 7919 + 13); r();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (k < .12) { ctx.globalAlpha = 1 - k / .12; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 30 * (1 - k / .12) + 6, 0, 7); ctx.fill(); }
  const n = 36, e = eout(clamp(k * 1.6));
  for (let i = 0; i < n; i++) {
    const an = i / n * 6.283 + r() * .2, sp = R * (.7 + .5 * r()), px = x + Math.cos(an) * sp * e, py = y + Math.sin(an) * sp * e + 120 * k * k;
    ctx.globalAlpha = (1 - k) * (1 - k); ctx.fillStyle = i % 3 ? col : '#fff'; ctx.shadowColor = col; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(px, py, 4.5 * (1 - k * .6), 0, 7); ctx.fill();
  }
  ctx.restore();
}
function show(lon, lat, t0, t, col, seed, R) { const [x, y] = P(lon, lat); burst(x, y, t0, t, col, seed, R); }
function bird(x, y, s, ph, a) {

  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * s; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(x - 26 * s, y - 14 * s * f); ctx.quadraticCurveTo(x - 12 * s, y - 16 * s * (f + .4), x, y); ctx.quadraticCurveTo(x + 12 * s, y - 16 * s * (f + .4), x + 26 * s, y - 14 * s * f); ctx.stroke(); ctx.restore();
}
function plane(x, y, an, s, a) {

  ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(24, -4); ctx.lineTo(4, -4); ctx.lineTo(-8, -28); ctx.lineTo(-16, -28); ctx.lineTo(-8, -4); ctx.lineTo(-24, -4); ctx.lineTo(-30, -14); ctx.lineTo(-36, -14); ctx.lineTo(-32, 0);
  ctx.lineTo(-36, 14); ctx.lineTo(-30, 14); ctx.lineTo(-24, 4); ctx.lineTo(-8, 4); ctx.lineTo(-16, 28); ctx.lineTo(-8, 28); ctx.lineTo(4, 4); ctx.lineTo(24, 4); ctx.closePath(); ctx.fill(); ctx.restore();

function boat(x, y, s, a) {

}
function clockCard(x, y, place, date, time, col, a) {

    pin(t, 'Столица Тарава', 172.98, 1.42, 110, 190, 'cap', 'after', '#fff', 40); pin(t, 'Банана', 202.66, 1.97, 0, 170, 'ban2', 'after', '#fff', 40);
    bigNum('разница — сутки', H * .74, 96, A('sut', 'moved', .3), RED);

    { const a2 = A('km', 'after', .3); if (a2 > 0) { const [x0, y0] = P(180, -6), [x1] = P(210, -6); ctx.save(); ctx.globalAlpha = a2; ctx.setLineDash([16, 12]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * ap(t, V('km'), .8), y0); ctx.stroke(); ctx.restore();
      pill('≈ 3 300 км', (x0 + x1) / 2, y0 + 80, 46, a2, { line: '#fff' }); } } }

    cp(t, 'Американское Самоа', -170.3, -14.55, 'asm', 'bh', BLUE, 42); pill('территория США', W / 2, H * .15, 46, A('usa', 'funny', .3), { line: BLUE });

    const a7 = A('k70', 'some', .3); if (a7 > 0) { const p0 = P(-171.41, -14.03), p1 = P(-170.84, -14.3), k = ap(t, V('k70'), .7);

    head('А разница — целые сутки!', A('diff', 'some', .25), RED, H * .15, 80);
