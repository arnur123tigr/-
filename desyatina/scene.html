const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const seg = (t, a, b) => clamp((t - a) / (b - a));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- texts ----------
const TX = {

        foot: '1 десятина ≈ 1,09 га · 17 млн десятин ≈ 185 тыс. км²', p1861: 'отмена крепостного права', p1868: '30 десятин на человека', blk: '30 ДЕСЯТИН', kolp: 'Семиречье · Г. Колпаковский',
        ts: 'ТРАНССИБ', petro: 'Петропавловск', omsk: 'Омск', ppl: 'переселенцев', stol: 'СТОЛЫПИН', col1: '17 млн десятин', col2: '1 600 000 чел.', s5t: '1,6 МЛН КРЕСТЬЯН',
        tax: 'КИБИТОЧНЫЙ НАЛОГ', unit: 'руб.', late: 'конец XIX в.', quote: ['«Под вопросом оказалось', 'само существование', 'казахского народа»'], sign: 'А. Байтурсынулы, 1913',

const kgMesh = mesh(kgGeo, kgMat); MAP.add(kgMesh);

const SG3 = new THREE.Group(); world.add(SG3);
function plateTex(year) { return canvasTex(1024, 640, (c, w, h) => { c.fillStyle = '#d99a22'; c.fillRect(0, 0, w, h); const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#ffe3a0'); g.addColorStop(.5, '#e6a52c'); g.addColorStop(1, '#9e6a12'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.font = '300px MB'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(70,40,0,.85)'; c.fillText(year, w / 2, h / 2 + 18); c.fillStyle = 'rgba(255,240,200,.5)'; c.fillText(year, w / 2 - 3, h / 2 + 14); }); }
function plate(year, x) {
  const g = new THREE.Group(); const w = 2.6, d = 1.62;
  g.add(mesh(new THREE.BoxGeometry(w, .2, d).translate(0, .1, 0), Mt.goldD));
  const top = mesh(new THREE.PlaneGeometry(w * .96, d * .96).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: plateTex(year), metalness: .9, roughness: .3 })); top.position.y = .201; g.add(top);
  g.position.x = x; SG3.add(g); return g;
}

const peasant = new THREE.Group(); SG3.add(peasant);
{ const pts = [[0, 0], [.36, 0], [.38, .05], [.33, .2], [.28, .5], [.22, .78], [.24, .84], [.14, .9], [0, .92]].map(([x, y]) => new THREE.Vector2(x, y));
  peasant.add(mesh(new THREE.LatheGeometry(pts, 48), Mt.glassW));
  const head = mesh(new THREE.SphereGeometry(.17, 40, 30), Mt.glassW); head.position.y = 1.07; peasant.add(head);
  const brim = mesh(new THREE.CylinderGeometry(.27, .27, .03, 40), Mt.glassW); brim.position.y = 1.2; peasant.add(brim);
  const crown = mesh(new THREE.CylinderGeometry(.13, .16, .17, 40), Mt.glassW); crown.position.y = 1.29; peasant.add(crown);
  const bag = mesh(new THREE.SphereGeometry(.15, 24, 18), Mt.glassW); bag.scale.set(1, 1.2, .8); bag.position.set(.3, .55, -.12); peasant.add(bag); }
const blockTex = canvasTex(1024, 512, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffe7a8'); g.addColorStop(.45, '#f0b63c'); g.addColorStop(1, '#a8700f'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.font = '150px MB'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(60,30,0,.9)'; c.fillText(TX.blk.split(' ')[0], w / 2, h * .36); c.font = '92px MB'; c.fillText(TX.blk.split(' ')[1], w / 2, h * .74); });
const block = mesh(new THREE.BoxGeometry(1.0, .5, .55).translate(0, .25, 0), [Mt.gold, Mt.gold, Mt.gold, Mt.gold, new THREE.MeshStandardMaterial({ map: blockTex, metalness: .85, roughness: .3 }), Mt.gold]); SG3.add(block);
// archive photo in a thin gold frame, fixed to the camera (it turns towards the viewer like a glass plate)
const photoG = new THREE.Group(); camera.add(photoG);
function photoMesh(im, w) {
  const g = new THREE.Group(); if (!im) return g; const h = w * im.height / im.width;
  const t = new THREE.Texture(im); t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; t.anisotropy = 8;
  g.add(mesh(new THREE.BoxGeometry(w + .06, h + .06, .03), Mt.gold));
  const p = mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, toneMapped: false, transparent: true })); p.position.z = .017; g.add(p);
  g.userData.mat = p.material; return g;
}
const photoS = photoMesh(PH.settlers ? sepia(PH.settlers) : null, 1.8); photoG.add(photoS);
function sepia(im, tone = [1, .9, .74]) {   // archive look: grey -> warm, a little contrast
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) { let v = (a[i] * .3 + a[i + 1] * .59 + a[i + 2] * .11) / 255; v = clamp((v - .5) * 1.15 + .5); a[i] = 255 * v * tone[0]; a[i + 1] = 255 * v * tone[1]; a[i + 2] = 255 * v * tone[2]; }
  x.putImageData(d, 0, 0); return c;
}
const grey = im => sepia(im, [1, 1, 1]);

// ---------- Stolypin sphere + columns ----------
const SG5 = new THREE.Group(); world.add(SG5);
const SPH_R = 1.15, SPH_Y = 4.55;
const sphere = mesh(new THREE.SphereGeometry(SPH_R, 64, 48), Mt.glass); sphere.position.set(0, SPH_Y, 0); SG5.add(sphere);
const ring = mesh(new THREE.TorusGeometry(SPH_R * .5, .035, 16, 64).rotateX(Math.PI / 2), Mt.gold); ring.position.set(0, SPH_Y - SPH_R - .02, 0); SG5.add(ring);
const TILE = .075, NT = 42;
const tileGeo = new THREE.BoxGeometry(.95, TILE * .86, .95);
const colA = new THREE.InstancedMesh(tileGeo, Mt.gold, NT); colA.frustumCulled = false; SG5.add(colA);
const colB = new THREE.InstancedMesh(new THREE.BoxGeometry(.95, TILE * .86, .95), Mt.glassW, NT); colB.frustumCulled = false; SG5.add(colB);

// ---------- coins ----------
const SG6 = new THREE.Group(); world.add(SG6);
function coinFace(v) { return canvasTex(512, 512, (c, w, h) => { const g = c.createRadialGradient(w * .4, h * .35, 10, w / 2, h / 2, w * .55); g.addColorStop(0, '#fff0bf'); g.addColorStop(.5, '#f0b63c'); g.addColorStop(1, '#93600c'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(90,50,0,.6)'; c.lineWidth = 14; c.beginPath(); c.arc(w / 2, h / 2, w * .43, 0, 7); c.stroke();
  c.font = `${v.length > 1 ? 170 : 230}px MB`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(70,38,0,.92)'; c.fillText(v, w / 2, h * .46); c.font = '70px MB'; c.fillText(TX.unit, w / 2, h * .74); }); }
const COINROT = Math.PI / 2;
const COINS = [['1,5', .62, -2.05], ['3', .82, -.25], ['4', 1.08, 2.0]].map(([v, r, x]) => {
  const ft = coinFace(v); ft.center.set(.5, .5); ft.rotation = COINROT; const fm = new THREE.MeshStandardMaterial({ map: ft, metalness: .85, roughness: .28 });
  const m = mesh(new THREE.CylinderGeometry(r, r, .16 * r / .8, 72).rotateX(Math.PI / 2), [Mt.goldD, fm, Mt.gold]); m.userData = { r, x }; SG6.add(m); return m;
});

const GROUPS = [MAP, SG3, SG5, SG6];
function show(...g) { for (const x of GROUPS) x.visible = g.includes(x); photoG.visible = false; }

// ---------- 2D helpers ----------
function goldText(c, s, x, y, size, font = 'MB', depth = 8, glowA = 1) {
  c.save(); c.font = `${size}px ${font}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = depth; i > 0; i--) { c.fillStyle = `rgb(${92 + i * 4},${54 + i * 3},8)`; c.fillText(s, x, y + i * size / 90); }
  const g = c.createLinearGradient(0, y - size * .5, 0, y + size * .45);
  g.addColorStop(0, '#fff4cc'); g.addColorStop(.35, '#ffcd55'); g.addColorStop(.62, '#e59d12'); g.addColorStop(1, '#9a6306');
  if (glowA > 0) { c.shadowColor = `rgba(254,179,0,${.55 * glowA})`; c.shadowBlur = size * .32; }
  c.fillStyle = g; c.fillText(s, x, y); c.shadowBlur = 0;
  c.globalAlpha *= .45; c.strokeStyle = '#fff3c0'; c.lineWidth = Math.max(1, size / 70); c.strokeText(s, x, y); c.restore();
}

  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillText(s, x, y + size * .06);

}

  g.addColorStop(0, col.replace('A', (.5 * a).toFixed(3))); g.addColorStop(.45, col.replace('A', (.2 * a).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
const GOLD = 'rgba(254,170,20,A)', NAVY = 'rgba(52,36,190,A)', RED = 'rgba(232,80,47,A)';
function pill(s, x, y, size, a = 1, sc = 1, dot = true, font = 'ME') {

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.78)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

}

    ctx.save(); ctx.globalAlpha = pa; ctx.drawImage(BAIT, x, y, w, h);
    const g = ctx.createLinearGradient(0, y + h * .55, 0, y + h); g.addColorStop(0, 'rgba(3,3,6,0)'); g.addColorStop(1, 'rgba(3,3,6,1)'); ctx.fillStyle = g; ctx.fillRect(x - 2, y, w + 4, h + 2);
    const g2 = ctx.createLinearGradient(x, 0, x + w, 0); g2.addColorStop(0, 'rgba(3,3,6,1)'); g2.addColorStop(.18, 'rgba(3,3,6,0)'); g2.addColorStop(.82, 'rgba(3,3,6,0)'); g2.addColorStop(1, 'rgba(3,3,6,1)'); ctx.fillStyle = g2; ctx.fillRect(x - 2, y - 2, w + 4, h + 4); ctx.restore(); }
  TX.quote.forEach((s, i) => { const q = seg(v, M.S7 + .9 + i * .9, M.S7 + 1.9 + i * .9) * out; if (q <= 0) return;
    ctx.save(); ctx.globalAlpha = q; ctx.font = 'italic 70px SI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.25)'; ctx.shadowBlur = 18; ctx.fillText(s, W / 2, 1060 + i * 96 + (1 - q) * 12); ctx.restore(); });
  const sq = seg(v, M.S7 + 3.8, M.S7 + 4.4) * out; title('— ' + TX.sign, W / 2, 1400, 38, sq, 'ME', BR.amber);
}

// ---------- scene 8: all numbers into one glass sphere, it floats up ----------
function glassBall(x, y, r, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r); g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(.35, 'rgba(120,120,255,.12)'); g.addColorStop(.85, 'rgba(60,40,200,.22)'); g.addColorStop(1, 'rgba(255,220,150,.45)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,225,160,.7)'; ctx.lineWidth = 3; ctx.shadowColor = BR.amber; ctx.shadowBlur = 25; ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .5, r * .22, r * .1, -.6, 0, 7); ctx.fill(); ctx.restore();
}
function scene8(v) {
  const a = seg(v, M.S8, M.S8 + .4), gather = easeIO(seg(v, M.s8 + 1.4, M.link - .2)), up = easeIO(seg(v, M.link - .3, M.link + 1.2));
  glow(W / 2, H * .45, 850, GOLD, .5 * a);
  const bx = W / 2, by = lerp(H * .47, 60, up), br = lerp(250, 70, up);
  title(TX.ent, W / 2, 300, 64, a * (1 - gather), 'MB', '#ffffff');
  const NUM = [['1906', ''], [`17 ${TX.mil}`, TX.des.toLowerCase()], ['1,6 ' + TX.mil, TX.col2.split(' ').pop()]];
  NUM.forEach(([n, s], i) => { const q = seg(v, M.s8 + .2 + i * .35, M.s8 + .6 + i * .35); if (q <= 0) return;
    const x0 = W / 2, y0 = 560 + i * 250, x = lerp(x0, bx + (i - 1) * br * .45, gather), y = lerp(y0, by - br * .35 + i * br * .34, gather), sz = lerp(130, br * .32, gather);
    ctx.save(); ctx.globalAlpha = q; goldText(ctx, n, x, y, sz * (.85 + .15 * back(q)), 'MB', 7); ctx.restore();
    if (s && gather < .5) title(s, x0, y0 + 88, 36, q * (1 - gather * 2), 'ME'); });
  glassBall(bx, by, br, seg(v, M.s8 + 1.2, M.s8 + 1.8));
}

// ---------- captions, logo, end card ----------
function drawCaption(v) {
  if (v > M.End - .05 || (v > M.S7 + .2 && v < M.S8)) return;
  const ws = B.words, i = ws.findIndex(w => v >= w.t0 - .08 && v < w.t1 + .25); if (i < 0) return;
  const k = ws[i].k, ch = ws.filter(w => w.k === k); const last = ch[ch.length - 1];
  if (v > last.t1 + .25 && ws[i + 1] && ws[i + 1].k !== k) return;
  const a = clamp((v - ch[0].t0 + .1) / .12) * clamp((last.t1 + .3 - v) / .12);
  ctx.save(); ctx.globalAlpha = a; ctx.font = '54px ME'; ctx.textBaseline = 'middle';
  const parts = ch.map(w => w.w.toUpperCase()), sp = ctx.measureText(' ').width, wsz = parts.map(p => ctx.measureText(p).width), tot = wsz.reduce((s, x) => s + x, 0) + sp * (parts.length - 1);
  let x = W / 2 - tot / 2; const y = H * .785;
  ch.forEach((w, j) => { const cur = v >= w.t0 && v < w.t1 + .05; ctx.fillStyle = w.c === 'r' ? '#ff7a5a' : (w.c === 'a' || cur) ? BR.amber : '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14; ctx.textAlign = 'left'; ctx.fillText(parts[j], x, y); x += wsz[j] + sp; });
  ctx.restore();
}
function drawLogo(v, a = .8) { if (!LOGO) return; const h = 70, w = h * LOGO.width / LOGO.height; ctx.save(); ctx.globalAlpha = a; ctx.drawImage(LOGO, W - 48 - w, 48, w, h); ctx.restore(); }
function endCard(v) {
  const a = seg(v, M.End, M.End + .5); if (a <= 0) return false;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, 900); g.addColorStop(0, 'rgba(70,50,200,.45)'); g.addColorStop(1, 'rgba(19,11,84,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (LOGO) { const q = back(seg(v, M.End + .1, M.End + .6)), h = 420 * q, w = h * LOGO.width / LOGO.height; ctx.save(); ctx.globalAlpha = a; ctx.drawImage(LOGO, W / 2 - w / 2, H * .38 - h / 2, w, h); ctx.restore(); }
  TX.cta.forEach((s, i) => title(s, W / 2, H * .62 + i * 84, 62, seg(v, M.End + .35 + i * .25, M.End + .7 + i * .25), 'MB', BR.amber));
  // profile header hint: a small sphere landing at the top
  glassBall(W / 2, 60 + Math.sin(v * 3) * 3, 70, a * (1 - seg(v, M.End + 1.5, M.End + 2)));
  return a >= 1;
}

// ---------- main ----------
window.render = function (T) {
  const v = T;
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.fillStyle = '#030306'; ctx.fillRect(0, 0, W, H);
  if (v < M.S2) scene1(v);
  else if (v < M.S3) scene2(v);
  else if (v < M.S4) scene3(v);
  else if (v < M.S5) scene4(v);
  else if (v < M.S6) scene5(v);
  else if (v < M.S7) scene6(v);
  else if (v < M.S8) scene7(v);
  else scene8(v);
  vignette(); grain(T);
  // cut transitions: quick dip; S5 = flash, S7 = fade to black
  const dip = Math.max(...[M.S2, M.S3, M.S6, M.S8].map(c => 1 - clamp(Math.abs(v - c) / .12)));
  if (dip > 0) { ctx.fillStyle = `rgba(0,0,0,${dip * .85})`; ctx.fillRect(0, 0, W, H); }
  const fl = 1 - clamp(Math.abs(v - M.S5) / .18); if (fl > 0) { ctx.fillStyle = `rgba(255,236,190,${fl * .9})`; ctx.fillRect(0, 0, W, H); }
  const fb = 1 - clamp(Math.abs(v - M.S7) / .35); if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${fb})`; ctx.fillRect(0, 0, W, H); }
  const full = endCard(v);
  drawCaption(v); if (!full) drawLogo(v);
  if (T < .25) { ctx.fillStyle = `rgba(0,0,0,${1 - T / .25})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = (async () => {
  if (PH.stolypin) STOLY = grey(PH.stolypin);
  if (PH.baitur) BAIT = grey(PH.baitur);
  render(0); return true;
})();
</script></body></html>
