<!doctype html>
<html><head><meta charset="utf-8">
<title>Kirgiz flat vector</title>
<style>
@font-face{font-family:Rubik;src:url(fonts/Rubik-Medium.ttf);font-weight:500}
@font-face{font-family:Rubik;src:url(fonts/Rubik-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Hand;src:url(fonts/Caveat-Bold.ttf);font-weight:700}
html,body{margin:0;background:#000}
canvas{display:block;width:540px;height:960px}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------
// Flat Vector reel: "Почему казахов называли киргизами?"
// Deterministic: window.render(t) draws the frame for time t (sec).
// Scene timing comes from timeline.json (fitted to the voiceover).
// ---------------------------------------------------------------
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const main = document.getElementById('c');
const M = main.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const A = mk(), AC = A.getContext('2d');
const B = mk(), BC = B.getContext('2d');

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const back = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const font = (px, w = 800, fam = 'Rubik') => `${w} ${px}px ${fam}`;

// ---------- palette ----------
const C = {
  navy: '#1F3B57', ink: '#2B2B3A', cream: '#FBF1DF', paper: '#F1E2BE', paperD: '#D9C394',
  red: '#E04E39', orange: '#F08A4B', yellow: '#F6C453', teal: '#1FA3B5', sky: '#A9DCE3',
  skin: '#EDBB8D', skinD: '#D9A273', cheek: 'rgba(240,120,110,.45)', white: '#FAF8F2',
  blue: '#2D5FA8', blueD: '#244C88', gold: '#F2C14E', green: '#3E7A4F', greenD: '#2F5F3D',
  brown: '#8A5A36', brownD: '#6C4428', kaftan: '#C8372D', black: '#25232A', shadow: 'rgba(30,30,50,.16)'
};

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function ell(c, x, y, rx, ry, col) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function poly(c, pts, col) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.fillStyle = col; c.fill(); }
function limb(c, x1, y1, x2, y2, w, col) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = w; c.lineCap = 'round'; c.strokeStyle = col; c.stroke(); }
function fitText(c, txt, maxW, px, w = 800, fam = 'Rubik') {
  c.font = font(px, w, fam); const m = c.measureText(txt).width;
  if (m > maxW) { px = px * maxW / m; c.font = font(px, w, fam); }
  return px;
}

// ---------- characters ----------
// Person, local units: feet at (0,0), head centre at (0,-370). o.hand(side) may override hands.
function person(c, o) {
  c.save(); c.translate(o.x, o.y); c.scale((o.flip ? -1 : 1) * o.s, o.s);
  const bob = o.bob || 0; c.translate(0, bob);
  ell(c, 0, 4, 120, 18, C.shadow);
  // boots
  rr(c, -58, -40, 46, 42, 14); c.fillStyle = C.black; c.fill();
  rr(c, 12, -40, 46, 42, 14); c.fill();
  // arms behind robe (sleeves)
  const hl = o.handL || [-100, -150], hr = o.handR || [100, -150];
  limb(c, -66, -282, hl[0], hl[1], 46, o.robeD);
  // robe
  c.beginPath(); c.moveTo(-70, -300); c.lineTo(70, -300); c.quadraticCurveTo(92, -170, 112, -34);
  c.lineTo(-112, -34); c.quadraticCurveTo(-92, -170, -70, -300); c.closePath(); c.fillStyle = o.robe; c.fill();
  // trim
  if (o.trim) {
    c.fillStyle = o.trim;
    c.beginPath(); c.moveTo(-10, -300); c.lineTo(10, -300); c.lineTo(22, -34); c.lineTo(2, -34); c.closePath(); c.fill();
    c.fillRect(-112, -52, 224, 18);
  }
  if (o.belt) { c.fillStyle = o.belt; c.fillRect(-86, -168, 172, 22); }
  if (o.buttons) { for (let i = 0; i < 5; i++) circle(c, 0, -280 + i * 42, 8, C.gold); }
  if (o.epaulet) { rr(c, -92, -310, 50, 20, 8); c.fillStyle = C.gold; c.fill(); rr(c, 42, -310, 50, 20, 8); c.fill(); }
  // neck + collar
  rr(c, -24, -318, 48, 30, 10); c.fillStyle = C.skinD; c.fill();
  // front arm
  limb(c, 66, -282, hr[0], hr[1], 46, o.robe);
  circle(c, hl[0], hl[1], 22, C.skin); circle(c, hr[0], hr[1], 22, C.skin);
  if (o.item) o.item(c, hr[0], hr[1]);
  // head
  circle(c, -68, -366, 16, C.skinD); circle(c, 68, -366, 16, C.skinD);
  circle(c, 0, -370, 70, C.skin);
  const lx = (o.look || [0, 0])[0], ly = (o.look || [0, 0])[1];
  const bl = o.blink ? 0.15 : 1;
  c.fillStyle = C.ink;
  c.beginPath(); c.ellipse(-25 + lx, -372 + ly, 7.5, 9 * bl, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(25 + lx, -372 + ly, 7.5, 9 * bl, 0, 0, Math.PI * 2); c.fill();
  const br = (o.brows || 0) * 16;
  limb(c, -38, -394 - br, -14, -398 - br * 1.2, 7, C.ink);
  limb(c, 14, -398 - br * 1.2, 38, -394 - br, 7, C.ink);
  circle(c, -42, -346, 12, C.cheek); circle(c, 42, -346, 12, C.cheek);
  // mouth
  const sm = o.smile == null ? 0.4 : o.smile;
  if (o.mouthO) { ell(c, 0, -334, 9, 12 * o.mouthO, C.ink); }
  else {
    c.beginPath(); c.moveTo(-18, -338); c.quadraticCurveTo(0, -338 + 24 * sm, 18, -338);
    c.lineWidth = 6; c.lineCap = 'round'; c.strokeStyle = C.ink; c.stroke();
  }
  if (o.mustache) { c.beginPath(); c.moveTo(-30, -342); c.quadraticCurveTo(0, -362, 30, -342); c.quadraticCurveTo(0, -350, -30, -342); c.fillStyle = C.black; c.fill(); }
  hat(c, o.hat);
  c.restore();
}
function hat(c, kind) {
  if (kind === 'kalpak') {           // Kazakh white kalpak
    c.beginPath(); c.moveTo(-64, -404); c.quadraticCurveTo(-46, -520, 0, -536); c.quadraticCurveTo(46, -520, 64, -404); c.closePath();
    c.fillStyle = C.white; c.fill();
    rr(c, -82, -420, 164, 30, 14); c.fillStyle = '#ECE6D8'; c.fill();
    c.fillStyle = C.gold; for (let i = -3; i <= 3; i++) circle(c, i * 21, -405, 4, C.gold);
    limb(c, -30, -470, 0, -520, 5, '#E2DACA');
  } else if (kind === 'akkalpak') {  // Kyrgyz ak-kalpak: tall white, black brim
    c.beginPath(); c.moveTo(-60, -410); c.lineTo(-30, -560); c.quadraticCurveTo(0, -580, 30, -560); c.lineTo(60, -410); c.closePath();
    c.fillStyle = C.white; c.fill();
    limb(c, -40, -470, -18, -548, 4, '#2A2A2A'); limb(c, 40, -470, 18, -548, 4, '#2A2A2A');
    c.fillStyle = C.black;
    c.beginPath(); c.moveTo(-86, -398); c.lineTo(-4, -410); c.lineTo(-10, -446); c.lineTo(-74, -436); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(86, -398); c.lineTo(4, -410); c.lineTo(10, -446); c.lineTo(74, -436); c.closePath(); c.fill();
    circle(c, 0, -578, 9, C.black);
  } else if (kind === 'cap') {       // Imperial official peaked cap
    c.beginPath(); c.ellipse(0, -438, 92, 32, 0, 0, Math.PI * 2); c.fillStyle = C.green; c.fill();
    rr(c, -70, -436, 140, 36, 6); c.fillStyle = C.green; c.fill();
    rr(c, -70, -418, 140, 18, 4); c.fillStyle = C.red; c.fill();
    c.beginPath(); c.ellipse(0, -398, 74, 16, 0, 0, Math.PI); c.fillStyle = C.black; c.fill();
    circle(c, 0, -428, 9, C.gold);
  }
}
const nomad = o => Object.assign({ robe: C.blue, robeD: C.blueD, trim: C.gold, belt: '#7B4A2A', hat: 'kalpak' }, o);
const kyrgyz = o => Object.assign({ robe: '#8B5E3C', robeD: '#6E482C', trim: '#5A3A22', belt: '#3E2A1A', hat: 'akkalpak' }, o);
const official = o => Object.assign({ robe: C.green, robeD: C.greenD, buttons: true, epaulet: true, hat: 'cap', mustache: true, smile: 0.1 }, o);

function quill(c, x, y) {
  c.save(); c.translate(x, y); c.rotate(-0.6);
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(14, -70, 4, -130); c.quadraticCurveTo(-16, -70, 0, 0); c.fillStyle = '#FFFFFF'; c.fill();
  limb(c, 0, 10, 4, -110, 3, '#9A9A9A');
  c.restore();
}
function stampTool(c, x, y) {
  rr(c, x - 34, y + 10, 68, 22, 6); c.fillStyle = C.red; c.fill();
  rr(c, x - 26, y - 6, 52, 20, 4); c.fillStyle = '#5A3A22'; c.fill();
  rr(c, x - 10, y - 60, 20, 58, 8); c.fillStyle = '#8A5A36'; c.fill();
  circle(c, x, y - 64, 20, '#6C4428');
}
function seal(c, x, y, r, a, rot = -0.2, txt = 'ПЕРЕПИСЬ') {
  if (a <= 0) return;
  c.save(); c.globalAlpha = clamp(a); c.translate(x, y); c.rotate(rot);
  c.strokeStyle = 'rgba(205,40,40,.88)'; c.fillStyle = 'rgba(205,40,40,.88)';
  c.lineWidth = r * 0.09; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  c.lineWidth = r * 0.04; c.beginPath(); c.arc(0, 0, r * 0.78, 0, Math.PI * 2); c.stroke();
  for (let i = 0; i < 5; i++) { const an = -Math.PI / 2 + i * Math.PI * 2 / 5; circle(c, Math.cos(an) * r * 0.89, Math.sin(an) * r * 0.89, r * 0.035, 'rgba(205,40,40,.88)'); }
  c.font = font(r * 0.26); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 0, 0);
  c.restore();
}

// Horse + Cossack rider, local units: ground at 0, faces +x.
function cossack(c, x, y, s, t, flip) {
  c.save(); c.translate(x, y); c.scale(flip ? -s : s, s);
  const bob = Math.sin(t * 5) * 3;
  ell(c, 0, 6, 260, 22, C.shadow);
  const legs = [[-150, 0], [-112, 1], [112, 2], [150, 3]];
  for (const [lx, k] of legs) { rr(c, lx - 14, -210, 28, 210, 12); c.fillStyle = k % 2 ? C.brownD : C.brown; c.fill(); rr(c, lx - 17, -22, 34, 24, 6); c.fillStyle = C.black; c.fill(); }
  c.translate(0, bob);
  // tail
  c.beginPath(); c.moveTo(-195, -280); c.quadraticCurveTo(-270 + Math.sin(t * 3) * 14, -220, -240, -120);
  c.lineWidth = 34; c.lineCap = 'round'; c.strokeStyle = '#3A2516'; c.stroke();
  ell(c, 0, -255, 205, 82, C.brown);
  // neck + head
  poly(c, [[110, -300], [200, -440], [262, -420], [200, -250]], C.brown);
  c.save(); c.translate(258, -420); c.rotate(0.55); rr(c, -40, -36, 132, 72, 34); c.fillStyle = C.brown; c.fill(); c.restore();
  poly(c, [[196, -452], [212, -500], [228, -446]], C.brownD);
  circle(c, 252, -432, 8, C.ink);
  poly(c, [[110, -300], [196, -452], [176, -430], [96, -300]], '#3A2516');
  // saddle blanket
  rr(c, -78, -340, 156, 70, 14); c.fillStyle = C.navy; c.fill();
  rr(c, -78, -290, 156, 14, 6); c.fillStyle = C.gold; c.fill();
  // rider
  rr(c, -6, -330, 40, 150, 16); c.fillStyle = '#2E2A2A'; c.fill();     // leg + boot
  rr(c, -12, -200, 58, 30, 12); c.fillStyle = C.black; c.fill();
  c.beginPath(); c.moveTo(-58, -320); c.lineTo(58, -320); c.lineTo(46, -510); c.lineTo(-46, -510); c.closePath(); c.fillStyle = C.kaftan; c.fill();
  for (let i = 0; i < 4; i++) { rr(c, -40, -480 + i * 22, 22, 10, 3); c.fillStyle = '#F3E6CF'; c.fill(); rr(c, 18, -480 + i * 22, 22, 10, 3); c.fill(); }
  rr(c, -50, -360, 100, 16, 5); c.fillStyle = C.black; c.fill();
  limb(c, 40, -490, 110, -380, 40, '#A82C24'); circle(c, 114, -376, 20, C.skin);
  limb(c, 114, -376, 210, -420, 4, '#3A2516');   // reins
  circle(c, 0, -566, 58, C.skin);
  circle(c, 20, -572, 7, C.ink);
  limb(c, 6, -594, 30, -598, 6, C.ink);
  c.beginPath(); c.moveTo(-6, -540); c.quadraticCurveTo(22, -556, 50, -536); c.quadraticCurveTo(22, -544, -6, -540); c.fillStyle = C.black; c.fill();
  circle(c, 34, -548, 10, C.cheek);
  rr(c, -62, -760, 124, 160, 26); c.fillStyle = C.black; c.fill();
  for (let i = 0; i < 6; i++) limb(c, -44 + i * 18, -740, -44 + i * 18, -620, 5, '#3A363E');
  rr(c, -24, -770, 48, 26, 10); c.fillStyle = C.red; c.fill();
  c.restore();
}

// ---------- UI caption card ----------
function card(c, txt, lt, t0 = 0.12, y = 250, px = 74) {
  const p = back(seg(lt, t0, t0 + 0.35)); if (p <= 0) return;
  c.save(); c.translate(CX, y); c.scale(p, p);
  px = fitText(c, txt, W - 200, px);
  const w = c.measureText(txt).width + 90, h = px * 1.55;
  rr(c, -w / 2 + 10, -h / 2 + 12, w, h, h / 2); c.fillStyle = C.navy; c.fill();
  rr(c, -w / 2, -h / 2, w, h, h / 2); c.fillStyle = '#FFFFFF'; c.fill();
  c.fillStyle = C.navy; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 0, 4);
  c.restore();
}

// ---------- backgrounds ----------
function office(c, w) {
  c.fillStyle = '#F2DDB6'; c.fillRect(-200, 0, w + 400, H);
  c.fillStyle = 'rgba(255,255,255,.18)';
  for (let x = -200; x < w + 200; x += 120) c.fillRect(x, 0, 50, 1250);
  c.fillStyle = '#D6AE7E'; c.fillRect(-200, 1250, w + 400, 400);
  c.fillStyle = '#C49A69'; c.fillRect(-200, 1250, w + 400, 18);
  c.fillStyle = '#8F5F3E'; c.fillRect(-200, 1640, w + 400, H);
  c.fillStyle = '#7E5236'; for (let x = -200; x < w + 200; x += 160) c.fillRect(x, 1640, 8, 300);
  // window
  for (const wx of [600, 1330]) {
    rr(c, wx - 10, 480, 320, 420, 18); c.fillStyle = '#7E5236'; c.fill();
    rr(c, wx + 6, 496, 288, 388, 10); c.fillStyle = C.sky; c.fill();
    ell(c, wx + 90, 640, 70, 26, '#FFFFFF'); ell(c, wx + 140, 624, 50, 26, '#FFFFFF');
    c.fillStyle = '#7E5236'; c.fillRect(wx + 144, 496, 12, 388); c.fillRect(wx + 6, 684, 288, 12);
  }
  // framed portrait-ish emblem
  rr(c, 130, 520, 230, 280, 14); c.fillStyle = C.gold; c.fill();
  rr(c, 148, 538, 194, 244, 8); c.fillStyle = '#E8D3A6'; c.fill();
  poly(c, [[245, 590], [300, 640], [280, 720], [245, 700], [210, 720], [190, 640]], '#B98A3A');
  circle(c, 245, 600, 18, '#B98A3A');
}
function desk(c, x1, x2) {
  ell(c, (x1 + x2) / 2, 1645, (x2 - x1) / 2 + 30, 20, C.shadow);
  rr(c, x1, 1340, x2 - x1, 300, 10); c.fillStyle = '#7A4A2C'; c.fill();
  rr(c, x1 - 20, 1318, x2 - x1 + 40, 34, 10); c.fillStyle = '#9C6440'; c.fill();
  c.fillStyle = '#6A3F25';
  rr(c, x1 + 40, 1400, (x2 - x1) / 2 - 70, 90, 8); c.fill();
  rr(c, (x1 + x2) / 2 + 30, 1400, (x2 - x1) / 2 - 70, 90, 8); c.fill();
  circle(c, x1 + (x2 - x1) / 4, 1445, 9, C.gold); circle(c, x1 + (x2 - x1) * 0.75, 1445, 9, C.gold);
}
function sheet(c, cx, by, w, h, rot, txt, reveal, sealA, sealTxt) {
  c.save(); c.translate(cx, by); c.rotate(rot);
  rr(c, -w / 2 + 8, -h + 8, w, h, 8); c.fillStyle = 'rgba(0,0,0,.12)'; c.fill();
  rr(c, -w / 2, -h, w, h, 8); c.fillStyle = C.paper; c.fill();
  c.fillStyle = C.paperD; for (let i = 0; i < 3; i++) c.fillRect(-w / 2 + 26, -h + 34 + i * 20, w * (i ? 0.5 : 0.7), 8);
  c.fillRect(-w / 2 + 26, -38, w - 52, 4);
  if (txt) {
    const px = fitText(c, txt, w - 50, 64, 700, 'Hand');
    const tw = c.measureText(txt).width, x0 = -tw / 2, base = -58;
    c.save(); c.beginPath(); c.rect(x0 - 10, -h, (tw + 20) * reveal, h); c.clip();
    c.fillStyle = '#26324A'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(txt, x0, base); c.restore();
    sheet.pen = [x0 + tw * reveal, base - px * 0.25];
  }
  seal(c, w * 0.3, -h * 0.66, 50, sealA, -0.25, sealTxt);
  c.restore();
}
function steppe(c, t) {
  c.fillStyle = C.sky; c.fillRect(0, 0, W, H);
  circle(c, 860, 560, 92, '#FBD56A');
  for (let i = 0; i < 3; i++) {
    const x = ((i * 430 + t * 25) % 1500) - 250, y = 470 + i * 170;
    ell(c, x, y, 110, 34, '#FFFFFF'); ell(c, x + 60, y - 22, 64, 34, '#FFFFFF'); ell(c, x - 50, y - 10, 50, 26, '#FFFFFF');
  }
  c.fillStyle = '#9CC7A0'; c.beginPath(); c.moveTo(0, 1320);
  for (let x = 0; x <= W; x += 60) c.lineTo(x, 1290 - Math.sin(x / 170) * 40 - Math.sin(x / 70) * 10);
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.fillStyle = '#D9CF73'; c.beginPath(); c.moveTo(0, 1420);
  for (let x = 0; x <= W; x += 60) c.lineTo(x, 1420 - Math.sin(x / 260 + 1) * 26);
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.fillStyle = '#C9BE5F'; for (let i = 0; i < 26; i++) { const x = (i * 197) % W, y = 1480 + (i * 89) % 380; rr(c, x, y, 34, 8, 4); c.fill(); }
}

// ---------- map ----------
const KZ = [[46.5,48.4],[48.7,50.6],[50.8,51.6],[52.6,51.5],[54.5,51.0],[55.7,50.6],[57.5,51.1],[59.0,50.6],[60.2,50.9],[61.5,51.0],[61.6,51.8],[60.4,52.2],[61.0,52.9],[62.2,53.0],[61.3,53.6],[62.5,54.0],[65.2,54.6],[68.2,55.4],[70.0,55.2],[71.2,54.2],[73.4,54.0],[73.7,53.6],[76.3,54.2],[76.6,53.6],[78.2,52.6],[80.0,50.8],[81.5,50.8],[83.4,51.0],[85.0,50.0],[86.2,49.5],[87.3,49.2],[86.6,48.6],[85.6,47.2],[83.2,47.2],[82.3,45.6],[79.9,44.9],[80.3,42.9],[79.2,42.8],[77.5,42.9],[75.6,42.8],[74.2,43.3],[73.4,42.5],[71.8,42.8],[70.9,42.2],[70.2,41.5],[69.1,41.4],[68.6,40.6],[68.0,41.0],[66.6,41.2],[66.0,42.0],[66.0,43.0],[64.9,43.7],[62.0,43.5],[61.0,44.4],[58.5,45.6],[56.0,45.0],[56.0,41.3],[55.4,41.3],[54.8,42.0],[53.0,42.1],[52.5,41.8],[52.7,42.6],[51.3,43.6],[50.3,44.6],[51.3,45.3],[53.1,45.3],[53.1,46.6],[51.2,47.1],[49.2,46.4],[48.6,47.4],[47.2,47.8]];
const proj = (lon, lat) => [(lon - 67) * 21.8 + 540, (48 - lat) * 33 + 1000];
function mapBoard(c, fillCol, unroll = 1) {
  c.save(); c.translate(540, 1000); c.scale(lerp(0.04, 1, unroll), 1); c.translate(-540, -1000);
  rr(c, 50 + 12, 620 + 14, 980, 760, 30); c.fillStyle = 'rgba(0,0,0,.12)'; c.fill();

// ---------- timeline ----------
async function loadTL() { TL = await (await fetch('timeline.json')).json(); }
function drawScene(ctx, sc, t) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  SCN[sc.id](ctx, t, sc.end - sc.start, sc);
  ctx.restore();
}
window.render = function (T) {
  const S = TL.scenes; let i = S.findIndex(s => T >= s.start && T < s.end); if (i < 0) i = S.length - 1;
  const sc = S[i], t = T - sc.start, d = sc.end - sc.start;
  M.setTransform(1, 0, 0, 1, 0, 0);
  if (sc.trIn === 'swipe' && t < 0.35 && i > 0) {
    // swipe: a slanted navy band sweeps right-to-left; old scene left of it, new scene right of it
    const pv = S[i - 1], p = ease(t / 0.35), bw = W * 1.25, sl = 300;
    const bx = lerp(W + sl, -bw - sl, p);
    drawScene(AC, pv, T - pv.start); drawScene(BC, sc, t);
    const side = (img, x0, x1) => { M.save(); M.beginPath(); M.moveTo(x0 + sl, 0); M.lineTo(x1 + sl, 0); M.lineTo(x1, H); M.lineTo(x0, H); M.closePath(); M.clip(); M.drawImage(img, 0, 0); M.restore(); };
    side(A, -W * 3, bx); side(B, bx + bw, W * 3);
    M.save(); M.beginPath(); M.moveTo(bx + sl, 0); M.lineTo(bx + bw + sl, 0); M.lineTo(bx + bw, H); M.lineTo(bx, H); M.closePath();
    M.fillStyle = C.navy; M.fill(); M.restore();
    M.save(); M.beginPath(); M.moveTo(bx + sl + 60, 0); M.lineTo(bx + sl + 120, 0); M.lineTo(bx + 120, H); M.lineTo(bx + 60, H); M.closePath(); M.fillStyle = C.orange; M.fill(); M.restore();
  } else drawScene(M, sc, t);
  let blk = 0;
  if (sc.fadeOut) blk = Math.max(blk, seg(t, d - 0.35, d));
  if (sc.fadeIn) blk = Math.max(blk, 1 - seg(t, 0, 0.35));
  if (blk > 0) { M.fillStyle = `rgba(0,0,0,${blk})`; M.fillRect(0, 0, W, H); }
};
