    uniform sampler2D tW, tM, tA; uniform vec4 wM, wA; uniform vec3 camPos; uniform float expo, sat, haze;
    varying vec2 vLL; varying vec3 vP;

const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.05, 128, 96), new THREE.ShaderMaterial({
  uniforms: { camPos: globeMat.uniforms.camPos, k: { value: 1 } }, side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,

function star(x, y, r, a = 1, T = 0) {                       // the capital: a glowing five-point star

  ctx.shadowColor = 'transparent'; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
}
function person(x, y, s, col, a = 1) {                       // a simple person icon (head + body)

}

function people(T, t0, t1, a = 1) {
