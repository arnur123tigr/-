<script>

const W = 1080, H = 1920, c = document.getElementById('c'), ctx = c.getContext('2d');
const L = document.createElement('canvas'); L.width = W; L.height = H; const g = L.getContext('2d');      // glow line layer
const B1 = document.createElement('canvas'); B1.width = 270; B1.height = 480; const b1 = B1.getContext('2d'); // wide bloom
const B2 = document.createElement('canvas'); B2.width = 540; B2.height = 960; const b2 = B2.getContext('2d'); // tight bloom
const S = [0, 5.55, 10.4, 14.8, 19.5, 23.4, 28.0, 32.0, 36.6], END = S[8];
const COL = { hero: '#7FE9FF', sheep: '#CFE3FF', wood: '#FFCF7A', elder: '#FFE6A8', yurt: '#FFB25A', enemy: '#FF5E4D', horse: '#9FD8FF', horse2: '#FF9A7A', gold: '#FFC94F', white: '#F4FBFF', grass: '#4FA8C8', star: '#DDEBFF' };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const ease = x => (x = clamp(x), x * x * (3 - 2 * x)), eout = x => 1 - Math.pow(1 - clamp(x), 3), ein = x => Math.pow(clamp(x), 2);
const win = (t, a, b, f = .3) => clamp((t - a) / f) * clamp((b - t) / f);
function hsh(a, b = 0) { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }
let BOIL = 0, SID = 0, T = 0;

// ---------- stroke helpers ----------
function cr(P, n = 7) { // Catmull-Rom densify

    for (let k = 0; k < n; k++) {

function ell(cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 44, bump = 0, bk = 8) {

}
function line(P, col, w = 4, p = 1, a = 1) {

  const m = g.getTransform(), sc = Math.hypot(m.a, m.b) || 1, J = 2.2 / sc, sid = SID++;

  let tot = 0; const ls = [0]; for (let i = 1; i < P.length; i++) { tot += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); ls.push(tot); }

}
function fillBlack(P) { g.beginPath(); P.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = '#000'; g.globalAlpha = 1; g.fill(); }
function dot(x, y, r, col, a = 1) { g.globalAlpha = a; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.globalAlpha = 1; }
const st = (p, k, n = 6) => clamp(p * n - k);  // staggered part reveal

// ---------- background ----------
const STARS = Array.from({ length: 140 }, (_, i) => [hsh(i, 1) * W, hsh(i, 2) * 1250, .6 + hsh(i, 3) * 2.2, hsh(i, 4) * 6]);
function bg(top = '#050B1C', bot = '#01030A') {

}
function stars(a = 1, ymax = 1300) { for (const [x, y, r, ph] of STARS) if (y < ymax) dot(x, y, r, COL.star, a * (.35 + .35 * Math.sin(T * 1.3 + ph))); }
function moon(x, y, r, p) { line(ell(x, y, r, r, -1.2, 2.1, 40), COL.white, 4, p); line(cr([[x + r * Math.cos(-1.2), y + r * Math.sin(-1.2)], [x + r * .2, y - r * .1], [x + r * Math.cos(2.1), y + r * Math.sin(2.1)]]), COL.white, 4, p); }
function grass(y0, n, seed, p, col = COL.grass, sway = 1) {
  for (let i = 0; i < n; i++) {
    const x = hsh(i, seed) * W, y = y0 + hsh(i, seed + 1) * (H - y0), h = 18 + hsh(i, seed + 2) * 26 * (y / H + .3), w = Math.sin(T * 1.6 + x * .01) * 6 * sway;
    line([[x - 8, y], [x - 10 + w, y - h * .8]], col, 2.5, p, .55); line([[x, y], [x + w * 1.2, y - h]], col, 2.5, p, .55); line([[x + 8, y], [x + 12 + w, y - h * .7]], col, 2.5, p, .55);
  }
}

// ---------- characters ----------
function hair(cx, cy, rx, ry, n, len, seed, col, w, p, wind = 0, front = 5) {

  }
  for (let i = 0; i < front; i++) { // strands falling over the forehead / eyes
    const x0 = cx - rx * .7 + i * rx * 1.4 / (front - 1 || 1), sw = Math.sin(T * 2 + i * 1.7) * wind;
    line(cr([[x0, cy - ry * .95], [x0 + rx * .18 + sw * .4, cy - ry * .5], [x0 + rx * .05 + sw, cy + ry * (.05 + .2 * hsh(i, seed + 3))]], 4), col, w, st(p, .3 + i * .05, 1.6));
  }
}
function shepherd(x, y, s, p, o = {}) { // feet at (x,y), ~640 units tall, thin, torn chapan, crook staff
  const C = o.col || COL.hero, wind = o.wind ?? 6;
  g.save(); g.translate(x, y); g.scale(s, s);
  fillBlack([[-62, -455], [-100, -130], [100, -112], [62, -455]]);
  line([[150, 15], [133, -600]], COL.wood, 5, st(p, 0)); line(ell(109, -600, 24, 24, 0, -Math.PI, 20).concat([[84, -588]]), COL.wood, 5, st(p, .6));
  line(cr([[-38, -128], [-42, -60], [-46, 0]]), C, 5, st(p, 1)); line([[-46, 0], [-78, 4]], C, 5, st(p, 1.4));
  line(cr([[36, -120], [42, -60], [46, 0]]), C, 5, st(p, 1)); line([[46, 0], [78, 4]], C, 5, st(p, 1.4));
  line(cr([[-62, -455], [-80, -380], [-88, -260], [-98, -130]]), C, 5, st(p, 1.5));
  line([[-98, -130], [-80, -112], [-68, -128], [-50, -106], [-30, -126], [-10, -102], [12, -126], [30, -108], [48, -128], [66, -104], [84, -124], [100, -112]], C, 4.5, st(p, 2));
  line(cr([[100, -112], [90, -250], [82, -380], [62, -455]]), C, 5, st(p, 1.5));
  line(cr([[-62, -455], [-30, -470], [0, -468], [30, -470], [62, -455]]), C, 5, st(p, 2));
  line([[-24, -466], [0, -400], [22, -466]], C, 4, st(p, 2.4)); line(cr([[0, -400], [6, -300], [-4, -122]]), C, 3.5, st(p, 2.6));
  line(cr([[-86, -300], [0, -288], [86, -300]]), C, 4, st(p, 2.6));
  line([[-72, -222], [-60, -210], [-68, -198], [-56, -186]], C, 3, st(p, 3)); line([[50, -172], [62, -160], [52, -148], [64, -138]], C, 3, st(p, 3));
  line([[30, -372], [60, -376], [58, -348], [28, -346], [30, -372]], C, 3, st(p, 3));
  line(cr([[-60, -450], [-90, -380], [-104, -300], [-96, -232]]), C, 5, st(p, 2.5)); line(ell(-96, -226, 13, 10), C, 4, st(p, 3));
  line(cr([[60, -450], [100, -400], [120, -335], [132, -312]]), C, 5, st(p, 2.5)); line(ell(136, -306, 13, 13), C, 4, st(p, 3));
  line([[-14, -490], [-14, -462]], C, 4, st(p, 3)); line([[14, -490], [14, -462]], C, 4, st(p, 3));
  fillBlack(ell(0, -538, 40, 52)); line(ell(0, -538, 40, 52), C, 5, st(p, 3.3));
  line([[-2, -530], [-8, -512], [2, -508]], C, 3, st(p, 4)); line([[-12, -496], [10, -496]], C, 3, st(p, 4));
  hair(0, -548, 44, 50, 15, 58, 3, C, 4, st(p, 3.6, 3), wind);

}
function sheep(x, y, s, p, ph, f = 1) {
  g.save(); g.translate(x, y); g.scale(s * f, s);
  const body = ell(0, -62, 72, 40, 0, Math.PI * 2, 70, .09, 8), bob = 12 * Math.max(0, Math.sin(T * .9 + ph));
  fillBlack(body); line(body, COL.sheep, 4, st(p, 0, 2));
  for (const [a, b] of [[-42, -28], [-16, -24], [22, -24], [46, -28]]) line([[a, b], [a + (b > -26 ? 1 : -2), 0]], COL.sheep, 4, st(p, .6, 2));
  line(ell(84, -70 + bob, 22, 15), COL.sheep, 4, st(p, .8, 2)); line([[74, -82 + bob], [60, -92 + bob]], COL.sheep, 3.5, st(p, 1, 2)); dot(90, -73 + bob, 3, COL.sheep, st(p, 1, 2));

function yurt(x, y, s, p, col = COL.yurt, a = 1) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const out = [[-125, 0], [-125, -110], ...cr([[-125, -110], [-70, -170], [-28, -200]]).slice(1), [28, -200], ...cr([[28, -200], [70, -170], [125, -110]]).slice(1), [125, 0]];
  fillBlack(out); line(out, col, 5, st(p, 0, 2), a); line([[-130, 0], [130, 0]], col, 4, st(p, .3, 2), a);
  for (let i = -5; i < 5; i++) { line([[i * 25, -105], [i * 25 + 25, -8]], col, 2.5, st(p, .6, 2), a * .7); line([[i * 25 + 25, -105], [i * 25, -8]], col, 2.5, st(p, .6, 2), a * .7); }
  line(cr([[-125, -110], [0, -96], [125, -110]]), col, 3.5, st(p, .5, 2), a);

function elderBack(x, y, s, p) { // Tole bi seen from behind (over-the-shoulder)
  const C = COL.elder; g.save(); g.translate(x, y); g.scale(s, s);

  const hat = cr([[-46, -560], [-42, -610], [-10, -642], [30, -634], [48, -600], [48, -560]]); fillBlack(hat); line(hat, COL.white, 5, st(p, 1.3));
  line(ell(0, -558, 60, 16, 0, Math.PI * 2, 60, .12, 14), COL.white, 4.5, st(p, 1.6));
  // beard showing on the right of the face
  for (let i = 0; i < 5; i++) line(cr([[38 + i * 4, -520 + i * 6], [62 + i * 5, -470], [58 + i * 6, -420 + i * 8], [70 + i * 4, -380 + i * 10]]), COL.white, 3.5, st(p, 2 + i * .15));
  // staff
  line([[205, 220], [195, -690]], COL.wood, 6, st(p, .8)); line(ell(195, -704, 14, 14), COL.wood, 5, st(p, 1.2));
  line(cr([[150, -380], [180, -400], [198, -420]]), C, 5, st(p, 2));
  g.restore();
}
function legs4(ph, A = .6) { // gallop legs (horse units)
  const R = [[72, -128, 0], [52, -128, .5], [-70, -128, 2.6], [-88, -128, 3.1]], out = [];
  for (const [x, y, o] of R) {
    const th = A * Math.sin(ph + o), kn = [x + 58 * Math.sin(th), y + 58 * Math.cos(th)], b = th + (o > 2 ? -.6 : .6) * (.5 + .5 * Math.sin(ph + o + 1.2));
    out.push([[x, y], kn, [kn[0] + 58 * Math.sin(b), kn[1] + 58 * Math.cos(b)]]);
  }
  return out;
}
function horse(p, ph, C) { // facing +x, hooves at y≈0
  const body = cr([[-100, -170], [-60, -192], [20, -190], [80, -182], [106, -160], [100, -132], [60, -112], [-20, -108], [-80, -116], [-110, -140], [-100, -170]]);
  for (const lg of legs4(ph).slice(2)) line(lg, C, 5, st(p, 1), .75);
  fillBlack(body);
  const neck = [...cr([[100, -150], [130, -200], [150, -250], [160, -272]]), ...cr([[160, -272], [190, -238], [215, -224], [224, -232], [210, -256], [180, -286], [150, -294]]), ...cr([[150, -294], [108, -244], [72, -186]])];
  fillBlack(neck); line(body, C, 5, st(p, 0)); line(neck, C, 5, st(p, .5));
  line([[150, -294], [148, -318], [162, -296]], C, 4, st(p, 1)); dot(182, -268, 4, C, st(p, 1));
  for (let i = 0; i < 6; i++) { const q = i / 5, bx = lerp(150, 78, q), by = lerp(-294, -190, q), fl = Math.sin(T * 14 + i) * 8; line(cr([[bx, by], [bx - 28, by - 4 + fl], [bx - 48, by + 6 + fl]], 3), C, 3, st(p, 1.2)); }
  for (let i = 0; i < 4; i++) { const fl = Math.sin(T * 12 + i * 1.3) * 10; line(cr([[-104, -162], [-150, -160 + i * 8 + fl], [-190, -140 + i * 14 + fl]], 4), C, 3.5, st(p, 1.2)); }
  for (const lg of legs4(ph).slice(0, 2)) line(lg, C, 5, st(p, 1));
}
function rider(p, o) { // seat at (0,-190) of horse units, facing +x
  const C = o.col, big = o.big;
  line(cr([[0, -186], [32, -150], [24, -100]]), C, 5, st(p, 1));
  const torso = [...cr([[-26, -192], [-30, -260], [-22, -322]]), ...cr([[22, -322], [32, -260], [26, -192]])];
  fillBlack(torso); line(torso.slice(0, 15), C, 5, st(p, 1.5)); line(torso.slice(15), C, 5, st(p, 1.5)); line([[-22, -322], [22, -322]], C, 5, st(p, 1.8));
  if (big) { for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) line(ell(-14 + k * 14, -300 + r * 26, 8, 8, 0, Math.PI, 8), C, 2.5, st(p, 2.2), .8); line(ell(-24, -318, 20, 14), C, 4, st(p, 2)); }
  fillBlack(ell(8, -356, 24, 28)); line(ell(8, -356, 24, 28), C, 5, st(p, 2));
  if (big) { const hm = cr([[-18, -362], [-16, -386], [8, -404], [32, -386], [34, -362]]); line(hm, C, 5, st(p, 2.4)); line([[8, -404], [8, -446]], C, 4, st(p, 2.6)); line([[28, -370], [30, -340]], C, 4, st(p, 2.6)); }
  else hair(8, -360, 26, 30, 10, 34, 9, C, 3.5, st(p, 2.4, 3), 10, 0);

function seated(x, y, s, p, C = COL.hero) { // front view, cross-legged
  g.save(); g.translate(x, y); g.scale(s, s);
  const legsP = cr([[-120, -10], [-70, -40], [0, -30], [70, -40], [120, -10], [60, 10], [0, 0], [-60, 10], [-120, -10]]);

  line(ell(0, -222, 22, 26), C, 4.5, st(p, .8), a); line(ell(0, -244, 26, 10, Math.PI, Math.PI * 2, 16), C, 4, st(p, 1), a);

// ---------- captions (main ctx, clean Montserrat) ----------
function txt(s, x, y, size, col, font = 'M', al = 'center') { ctx.font = `${font === 'M' ? 900 : 800} ${size}px ${font}`; ctx.textAlign = al; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); }
function fit(s, size, maxw, font = 'M') { ctx.font = `900 ${size}px ${font}`; const w = ctx.measureText(s).width; return w > maxw ? size * maxw / w : size; }
function caption(lines, t0, t1, y = 330) { // lines: [[text, size, color]]
  const a = win(T, t0, t1, .35); if (a <= 0) return;
