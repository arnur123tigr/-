<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «Долли қойының үш анасы болған»: Flat Vector (flat shapes, no outlines, one-tone soft shadow, «pop & slide»).
// Scene 6 is a Higgsfield film shot (frames in hf/f_###.jpg, loaded by prep(T) before each frame). render(T) is deterministic.
const LANG = new URLSearchParams(location.search).get('lang') || 'ru';
const OW = 1080, OH = 1920;
const NV = '#1D2B53', NV2 = '#16213F', TQ = '#2EC4B6', TQ2 = '#239E93', Y = '#FFD23F', Y2 = '#E0B21F', CO = '#EF476F', CO2 = '#C9375A', CR = '#FFF3D6', CR2 = '#EADBB8';
const WOOL = '#FFFFFF', WOOL2 = '#F2EBDD', BFACE = '#2B2730', HORN = '#E6D3A8', LEG = '#3A3340', PINK = '#F6B9B5';
const BR = { navy: '#130B54', amber: '#FEB300' };
const c = document.getElementById('c'), ctx = c.getContext('2d');
let B, M, IMG = {}, CLIP = { n: 0, i: -1, im: null };

const L = {
  kk: {
    t1: ['3 АНА', '0 ӘКЕ'], ana: 'АНА', papa: 'ӘКЕ',
    h: { s2: 'ДОЛЛИ · 1996', s3: '№1 · ДНҚ БЕРДІ', s4: '№2 · ЖҰМЫРТҚА ЖАСУШАСЫ', s5: '№3 · ТУЫП БЕРДІ', s7: 'ГЕНДЕРІ — №1-ДІКІ', s8: 'ҰБТ СҰРАҒЫ', s9: 'СІЛТЕМЕ ШАПКАДА' },
    tagSub: '1996 · ШОТЛАНДИЯ', first: 'ересек жасушадан алғашқы клон', ent: 'ҰБТ: КЛОНДАУ',
    white: 'ақ тұмсық', black: 'қара тұмсық', cell: 'желін жасушасы', dna: 'ДНҚ', egg: 'жұмыртқа жасушасы', empty: 'БОС', emb: 'ұрық',
    tries: 'әрекет', date: '05.07.1996', dolly: 'ДОЛЛИ', copy: ['КЛОН =', 'ГЕНЕТИКАЛЫҚ КӨШІРМЕ'],
    q: ['Клон қай ағзаның', 'көшірмесі?'], opts: [['А', 'Ядро берген'], ['Ә', 'Жұмыртқа берген'], ['Б', 'Туған ана']], ok: 0,
    cta: ['Профиль шапкасындағы', 'сілтемеге өтіңіз']
  },
  ru: {
    t1: ['3 МАТЕРИ', '0 ОТЦОВ'], ana: 'МАМА', papa: 'ПАПА',
    h: { s2: 'ДОЛЛИ · 1996', s3: '№1 · ДАЛА ДНК', s4: '№2 · ЯЙЦЕКЛЕТКА', s5: '№3 · ВЫНОСИЛА', s7: 'ГЕНЫ — ОТ №1', s8: 'ВОПРОС ЕНТ', s9: 'ССЫЛКА В ШАПКЕ' },
    tagSub: '1996 · ШОТЛАНДИЯ', first: 'первый клон из взрослой клетки', ent: 'ЕНТ: КЛОНИРОВАНИЕ',
    white: 'белая морда', black: 'чёрная морда', cell: 'клетка вымени', dna: 'ДНК', egg: 'яйцеклетка', empty: 'ПУСТАЯ', emb: 'зародыш',
    tries: 'попыток', date: '05.07.1996', dolly: 'ДОЛЛИ', copy: ['КЛОН =', 'ГЕНЕТИЧЕСКАЯ КОПИЯ'],
    q: ['Копией кого', 'является клон?'], opts: [['А', 'Кто дал ядро'], ['Б', 'Кто дал яйцеклетку'], ['В', 'Кто родил']], ok: 0,
    cta: ['Перейдите по ссылке', 'в шапке профиля']
  }
}[LANG];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const ei = x => Math.pow(clamp(x), 3);
const eob = x => { x = clamp(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (T, t0, d) => clamp((T - t0) / d);
const pop = (T, t0, d = .45) => T < t0 ? 0 : eob(win(T, t0, d));            // spring pop-in 0 -> 1 (overshoots)
const out = (T, t0, d = .35) => 1 - ei(win(T, t0, d));                        // 1 -> 0
const live = (T, a, b) => T >= a && T < b;

// ---------- flat drawing ----------
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shadowed(fn, dy = 12, col = 'rgba(8,12,30,.28)') { ctx.save(); ctx.translate(0, dy); fn(col); ctx.restore(); fn(null); }
function box(x, y, w, h, r, fill, sh = 12, shc) { shadowed(cc => { rr(x, y, w, h, r); ctx.fillStyle = cc || fill; ctx.fill(); }, sh, shc); }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function circS(x, y, r, fill, sh = 10) { shadowed(cc => circ(x, y, r, cc || fill), sh); }
function txt(t, x, y, size, col, o = {}) {
  ctx.save(); ctx.font = `${size}px ${o.f || 'MB'}`; ctx.fillStyle = col; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.sh) { ctx.fillStyle = o.sh; ctx.fillText(t, x, y + (o.shd || 6)); ctx.fillStyle = col; }
  ctx.fillText(t, x, y); ctx.restore();
}
function tw(t, size, f = 'MB') { ctx.save(); ctx.font = `${size}px ${f}`; const w = ctx.measureText(t).width; ctx.restore(); return w; }
function fit(t, base, maxW, f = 'MB') { return Math.min(base, Math.floor(base * maxW / tw(t, base, f))); }
function pill(t, x, y, size, bg, fg, o = {}) {           // rounded label, centred on x,y
  const w = tw(t, size, o.f || 'MB') + size * 1.1, h = size * 1.75;
  box(x - w / 2, y - h / 2, w, h, h / 2, bg, o.sh ?? 8); txt(t, x, y + size * .04, size, fg, { f: o.f }); return w;
}
function scaleAt(x, y, s, r = 0) { ctx.translate(x, y); if (r) ctx.rotate(r); ctx.scale(s, s); ctx.translate(-x, -y); }

// ---------- flat icons ----------
function sheep(x, y, s, T, o = {}) {      // flat sheep; (x,y) = feet centre. o.face 'w' (white) | 'b' (Scottish Blackface, horns), o.flip faces left
  const blk = o.face === 'b', face = blk ? BFACE : WOOL, wool = blk ? WOOL2 : WOOL, ph = o.ph || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(o.flip ? -s : s, s);
  if (o.dim) ctx.filter = `saturate(${1 - .8 * o.dim}) brightness(${1 - .5 * o.dim})`;
  const hop = o.hop ? -Math.abs(Math.sin(T * 4.5 + ph)) * 45 : 0;
  ctx.fillStyle = 'rgba(8,12,30,.22)'; ctx.beginPath(); ctx.ellipse(0, 4, 185 * (1 + hop / 300), 24, 0, 0, 7); ctx.fill();
  ctx.translate(0, hop);
  [[-105, 0], [-45, 1], [55, 0], [115, 1]].forEach(([lx, p]) => { ctx.save(); ctx.translate(lx, -150); ctx.rotate(o.walk ? Math.sin(T * 7 + p * 3) * .12 : 0); rr(-15, 0, 30, 150, 14); ctx.fillStyle = LEG; ctx.fill(); ctx.restore(); });
  ctx.translate(0, Math.sin(T * 2.6 + ph) * 4);
  const blobs = [[-120, -245, 78], [-55, -300, 88], [40, -302, 88], [118, -255, 78], [-95, -185, 76], [0, -178, 86], [95, -188, 76], [0, -245, 110]];
  shadowed(cc => { for (const [bx, by, br] of blobs) circ(bx, by, br, cc || wool); circ(-192, -262, 34, cc || wool); }, 10);
  ctx.fillStyle = blk ? 'rgba(150,120,80,.12)' : 'rgba(29,43,83,.06)';
  for (const [bx, by, br] of blobs.slice(4, 7)) { ctx.beginPath(); ctx.arc(bx, by + br * .35, br * .62, 0, 7); ctx.fill(); }
  // head
  ctx.save(); ctx.translate(178, -312); ctx.rotate(.35 + (o.tilt || 0) + Math.sin(T * 1.7 + ph) * .05);
  const ear = (sx, r) => { ctx.save(); ctx.translate(sx * 52, -34); ctx.rotate(r + (o.ear ? Math.sin(T * 9) * .15 : 0)); ctx.beginPath(); ctx.ellipse(sx * 26, 0, 40, 17, 0, 0, 7); ctx.fillStyle = face; ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx * 28, 0, 26, 8, 0, 0, 7); ctx.fillStyle = blk ? '#4a4450' : PINK; ctx.fill(); ctx.restore(); };
  ear(-1, .45);
  shadowed(cc => { ctx.beginPath(); ctx.ellipse(0, 10, 56, 80, 0, 0, 7); ctx.fillStyle = cc || face; ctx.fill(); }, 8);
  if (blk) {                                                                                   // curled horns
    ctx.strokeStyle = HORN; ctx.lineWidth = 15; ctx.lineCap = 'round';
    [-1, 1].forEach(sx => { ctx.beginPath(); for (let a = 0; a <= 1; a += .05) { const ang = sx * (-1.2 + a * 4.2), rad = 34 * (1 - a * .55); const px = sx * 52 + Math.cos(ang) * rad * sx, py = -18 + Math.sin(ang) * rad; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); });
  }
  [[-22, -62, 30], [10, -72, 30], [36, -58, 24], [-40, -48, 20]].forEach(([a, b, r]) => circ(a, b, r, wool));
  ear(1, -.45);
  const bl = ((T + ph * 1.3) % 3.4) < .12 ? .15 : 1;
  [-22, 22].forEach(ex => {
    ctx.save(); ctx.translate(ex, -4); ctx.scale(1, bl);
    if (blk) { circ(0, 0, 11, '#fff'); circ(2, 1, 6.5, '#15131a'); } else { circ(0, 0, 9, '#1D1B26'); circ(-3, -3, 3, '#fff'); }
    ctx.restore();
  });
  ctx.beginPath(); ctx.ellipse(0, 66, 15, 9, 0, 0, 7); ctx.fillStyle = blk ? '#57525e' : PINK; ctx.fill();
  ctx.restore(); ctx.restore();
}
function faceAt(x, y, s, flip) { const k = flip ? -1 : 1; return [x + k * 182 * s, y - 300 * s]; }
function heart(x, y, r, col) {
  y -= r * .4; ctx.beginPath(); ctx.moveTo(x, y + r * .35);
  ctx.bezierCurveTo(x, y - r * .3, x - r, y - r * .3, x - r, y + r * .15); ctx.bezierCurveTo(x - r, y + r * .6, x, y + r * .85, x, y + r * 1.1);
  ctx.bezierCurveTo(x, y + r * .85, x + r, y + r * .6, x + r, y + r * .15); ctx.bezierCurveTo(x + r, y - r * .3, x, y - r * .3, x, y + r * .35);
  ctx.fillStyle = col; ctx.fill();
}
function heartS(x, y, r, col) { shadowed(cc => heart(x, y, r, cc || col), 10); }
function check(x, y, r, col, k) {                      // flat check badge
  if (k <= 0) return; ctx.save(); scaleAt(x, y, k); circS(x, y, r, col, 6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .45, y + r * .02); ctx.lineTo(x - r * .1, y + r * .36); ctx.lineTo(x + r * .48, y - r * .34); ctx.stroke(); ctx.restore();
}
function cross(x, y, r, col, k) {
  if (k <= 0) return; ctx.save(); scaleAt(x, y, k); circS(x, y, r, col, 6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .24; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .38, y - r * .38); ctx.lineTo(x + r * .38, y + r * .38); ctx.moveTo(x + r * .38, y - r * .38); ctx.lineTo(x - r * .38, y + r * .38); ctx.stroke(); ctx.restore();
}
function cell(x, y, r, fill, rim, T, ph = 0) {          // wobbly flat cell
  const n = 40; ctx.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr2 = r * (1 + .025 * Math.sin(a * 3 + T * 2 + ph) + .015 * Math.sin(a * 5 - T * 3)); const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.save(); ctx.translate(0, 10); ctx.fillStyle = 'rgba(8,12,30,.25)'; ctx.fill(); ctx.restore();
  ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = Math.max(3, r * .07); ctx.strokeStyle = rim; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .22, r * .12, -.6, 0, 7); ctx.fill();
}
function nucleus(x, y, r, col = Y) {
  circS(x, y, r, col, 6); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .35, r * .3, r * .16, -.6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(29,43,83,.35)'; ctx.lineWidth = Math.max(2, r * .07); ctx.lineCap = 'round';      // DNA squiggle
  ctx.beginPath(); for (let i = 0; i <= 12; i++) { const px = x - r * .45 + i * r * .075, py = y + r * .1 + Math.sin(i * 1.3) * r * .18; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke();
}
function bolt(x, y, s, col = Y) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  shadowed(cc => { ctx.beginPath(); ctx.moveTo(10, -90); ctx.lineTo(-40, 10); ctx.lineTo(0, 10); ctx.lineTo(-15, 90); ctx.lineTo(45, -15); ctx.lineTo(5, -15); ctx.lineTo(25, -90); ctx.closePath(); ctx.fillStyle = cc || col; ctx.fill(); }, 8);
  ctx.restore();
}
function papaIcon(x, y, r, k) {
  if (k <= 0) return; ctx.save(); scaleAt(x, y, k);
  circS(x, y, r, CR2, 8);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
  circ(x, y - r * .22, r * .3, NV); ctx.beginPath(); ctx.ellipse(x, y + r * .62, r * .55, r * .48, 0, 0, 7); ctx.fillStyle = NV; ctx.fill(); ctx.restore();
  ctx.strokeStyle = CO; ctx.lineWidth = r * .16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - r * .72, y + r * .72); ctx.lineTo(x + r * .72, y - r * .72); ctx.stroke();
  ctx.restore();
}
const slideX = (T, a, b) => OW * (1 - ease(win(T, a - .15, .5))) - OW * ease(win(T, b - .35, .5));

// ---------- backgrounds ----------
function bgNavy(T) {
  ctx.fillStyle = NV; ctx.fillRect(0, 0, OW, OH);
  [[160, 300, 260], [940, 760, 340], [220, 1500, 300], [900, 1750, 200]].forEach(([x, y, r], i) => circ(x + Math.sin(T * .3 + i) * 30, y + Math.cos(T * .25 + i) * 30, r, 'rgba(255,255,255,.035)'));
}
function bgCream(T) {
  ctx.fillStyle = CR; ctx.fillRect(0, 0, OW, OH);
  [[150, 360, 240], [960, 1300, 330], [300, 1650, 200]].forEach(([x, y, r], i) => circ(x + Math.sin(T * .3 + i) * 25, y + Math.cos(T * .25 + i) * 25, r, 'rgba(29,43,83,.05)'));
}

// ---------- scene 1: three mothers, zero fathers ----------
function scene1(T) {
  const tEnd = M.s2; if (T > tEnd + .1) return;
  const slide = ease(win(T, tEnd - .55, .55));
  ctx.save(); ctx.translate(-OW * 1.1 * slide, 0);
  // title: «3 АНА» then «0 ӘКЕ»
  const k1 = pop(T, .15, .5), k2 = pop(T, M.oke, .5);
  ctx.save(); scaleAt(540, 330, k1); txt(L.t1[0], 540, 330, fit(L.t1[0], 120, 900), NV, { sh: Y, shd: 10 }); ctx.restore();
  if (k2 > 0) { ctx.save(); scaleAt(540, 470, k2); txt(L.t1[1], 540, 470, fit(L.t1[1], 96, 900), CO, { sh: 'rgba(29,43,83,.15)' }); ctx.restore(); }
  // sheep jumps in
  const ks = pop(T, .05, .6), jump = T < .7 ? -Math.sin(Math.PI * clamp(T / .7)) * 120 : 0;
  ctx.save(); scaleAt(540, 1540, ks); sheep(540 - 30, 1540 + jump, 1.05, T, { face: 'w', ear: true }); ctx.restore();
  // three hearts
  [[300, 700], [540, 640], [780, 700]].forEach(([x, y], i) => {
    const k = pop(T, .45 + i * .3, .45); if (k <= 0) return; const b = Math.sin(T * 3 + i) * 8;
    ctx.save(); scaleAt(x, y, k); heartS(x, y + b, 90, CO); txt(L.ana, x, y + b - 4, fit(L.ana, 36, 120), '#fff'); ctx.restore();
  });
  // crossed father
  papaIcon(840, 960, 80, pop(T, M.oke + .1, .45));
  if (T > M.oke + .1) { const k = pop(T, M.oke + .3, .4); ctx.save(); scaleAt(840, 1070, k); pill(L.papa, 840, 1070, 34, NV, CR, { sh: 6 }); ctx.restore(); }
  ctx.restore();
}

// ---------- scene 2: ear tag «DOLLY · 1996» ----------
function scene2(T) {
  if (T < M.s2 - .3 || T > M.s3 + .3) return;
  ctx.save(); ctx.translate(slideX(T, M.s2, M.s3), 0);
  const k = pop(T, M.s2 + .1, .55), sw = Math.sin(T * 1.6) * .03;
  ctx.save(); scaleAt(540, 690, k, sw);
  shadowed(cc => { rr(150, 640, 780, 470, 60); ctx.fillStyle = cc || Y; ctx.fill(); }, 14);
  circ(540, 715, 40, Y2); circ(540, 715, 24, NV);
  txt('DOLLY', 540, 860, 170, NV);
  txt(L.tagSub, 540, 1000, fit(L.tagSub, 58, 680), NV2, { f: 'MX' });
  ctx.restore();
  const kf = pop(T, M.s2 + 1.2, .5); if (kf > 0) { ctx.save(); scaleAt(540, 1200, kf); txt(L.first, 540, 1200, fit(L.first, 48, 920, 'MX'), CR, { f: 'MX' }); ctx.restore(); }
  const ke = pop(T, M.ent, .5); if (ke > 0) { ctx.save(); scaleAt(560, 1360, ke, -.05); pill(L.ent, 560, 1360, fit(L.ent, 60, 820), CO, '#fff', { sh: 10 }); ctx.restore(); }
  ctx.restore();
}

// ---------- scenes 3-5: the three mothers + the cell layer ----------
const M1 = { x: 300, y: 1500, s: .95 }, M2 = { x: 790, y: 1500, s: .95 }, EGG = { x: 400, y: 880, r: 210 }, PARK = [905, 470], EMB = [540, 700];
function momBadge(x, y, n, k, label) {
  if (k <= 0) return; ctx.save(); scaleAt(x, y, k); pill('№' + n, x, y, 52, Y, NV, { sh: 8 }); ctx.restore();
  if (label) { ctx.save(); scaleAt(x, y + 530, k); pill(label, x, y + 530, 34, 'rgba(255,243,214,.95)', NV, { sh: 6 }); ctx.restore(); }
}
function scene3(T) {
  if (T < M.s3 - .3 || T > M.s4 + .3) return;
  ctx.save(); ctx.translate(slideX(T, M.s3, M.s4), 0);
  const k = pop(T, M.s3, .55);
  ctx.save(); scaleAt(M1.x, M1.y, k); sheep(M1.x, M1.y, M1.s, T, { face: 'w' }); ctx.restore();
  momBadge(M1.x, 1030, 1, pop(T, M.s3 + .3, .45), L.white);
  ctx.restore();
}
function scene4(T) {
  if (T < M.s4 - .3 || T > M.s5 + .3) return;
  ctx.save(); ctx.translate(slideX(T, M.s4, M.s5), 0);
  const k = pop(T, M.s4, .55);
  ctx.save(); scaleAt(M2.x, M2.y, k); sheep(M2.x, M2.y, M2.s, T, { face: 'b', flip: true, ph: 1 }); ctx.restore();
  momBadge(M2.x, 1030, 2, pop(T, M.s4 + .3, .45), L.black);
  ctx.restore();
}
function mom3Pose(T) {
  const k = ease(win(T, M.hard - .2, .6));
  return { x: 540, y: lerp(1500, 1590, k), s: lerp(.9, .5, k) };
}
function scene5(T) {
  if (T < M.s5 - .3 || T > M.s6 + .2) return;
  ctx.save(); ctx.translate(slideX(T, M.s5, 999), 0);
  const p = mom3Pose(T), k = pop(T, M.s5 + .1, .55);
  ctx.save(); scaleAt(p.x, p.y, k); sheep(p.x, p.y, p.s, T, { face: 'b', ph: 2 }); ctx.restore();
  // embryo glowing in the belly once it has landed
  const land = M.s5 + 2.6;
  if (T > land) { const bx = p.x - 10 * p.s, by = p.y - 190 * p.s, pu = .6 + .4 * Math.sin((T - land) * 5); ctx.save(); ctx.globalAlpha = .5 * pu; circ(bx, by, 60 * p.s, TQ); ctx.restore(); circ(bx, by, 26 * p.s, TQ); circ(bx, by, 11 * p.s, Y); }
  const bk = pop(T, M.s5 + .4, .45) * (1 - win(T, M.hard - .2, .3));
  if (bk > 0) { ctx.save(); scaleAt(540, 1060, bk); pill('№3', 540, 1060, 52, Y, NV, { sh: 8 }); ctx.restore(); }
  // 277 attempts: grid of dots, all fail except one
  if (T > M.hard) {
    const N = 277, cols = 17, sp = 44, x0 = 540 - (cols - 1) * sp / 2, y0 = 640, WIN = 236;
    const tf = M.try + .25, dur = 1.9;
    for (let i = 0; i < N; i++) {
