    txt(L.shSub, W / 2, 815, { size: 34, weight: 700, color: C.warnHi, alpha: sk * ap(T, M.cut, .3), sb: 12 }); }
  // 4
  tag(L.past, 330, win2(T, M.S4 + .3, M.S5 - .1), C.acc);
  // 5: 25.5 million hectares
  const hk = win2(T, M.ha - .2, M.S6 - .1);
  if (hk > 0) { counter(T, 25.5, M.ha - .1, M.ha + 1.6, W / 2, 420, 132, C.acc, hk, { dec: 1, suf: ' млн га' }); tag(L.haSub, 520, hk, '#fff'); }
  // 6: +600 state farms
  const vk = win2(T, M.sov - .2, M.S7 - .1);
  if (vk > 0) { counter(T, 600, M.sov - .1, M.sov + 1.6, W / 2, 420, 132, C.acc, vk, { pre: '+', suf: ' ' + L.sov }); }
  tag(L.ech, 520, win2(T, M.ech - .2, M.S7 - .1), '#fff');
  // 7: the Virgin Lands Krai
  datePlate(L.tyn, win2(T, M.tyn - .1, M.S8 - .1), 300, RUSHI, 62);
  plate(L.fear, W / 2, 430, 46, win2(T, M.split - .2, M.S8 - .1), { fill: C.warn, color: '#fff', pop: 1, ls: 2 });
  // 9: dust storms
  tag(L.dust, 420, win2(T, M.dust - .4, M.S10 - .1), '#ffd2a0');
  // 10-11: the census
  const ck = win2(T, M.S10 + .2, M.tsel2 - .2);

    datePlate(u < .5 ? L.census : L.y2021, ck, 280, u < .5 ? C.acc : '#3ddc84', 60); donut(T, sh, ck * ap(T, M.S10 + .4, .4));
    tag(L.own, 1060, win2(T, M.own - .1, M.S11 + .2), '#fff'); }
  // 12: ҰБТ / ЕНТ
  const uk = win2(T, M.ubt - .15, M.S13 + .2);

    plate(L.ubt, W / 2, 290, 66, uk, { pop: 1, ls: 6 }); txt(L.ubtLine, W / 2, 400, { size: 44, weight: 800, fam: 'IT', alpha: uk, sb: 14 });
    const q = ap(T, M.q - .1, .35) * uk, a = ap(T, M.ans - .1, .35) * uk;
    if (q > 0) { card(W / 2, 600, 900, 240, q); txt(L.qL, W / 2, 530, { size: 30, weight: 800, ls: 6, color: C.acc, alpha: q, shadow: 0 });
      L.q.forEach((s, i) => txt(s, W / 2, 595 + i * 62, { size: 50, weight: 700, fam: 'IT', alpha: q, shadow: 0 })); }
    if (a > 0) { card(W / 2, 840, 900, 170, a, rgba('#3ddc84', .8)); txt(L.aL, W / 2, 810, { size: 30, weight: 800, ls: 6, color: '#3ddc84', alpha: a, shadow: 0 });
      txt(L.a, W / 2, 878, { size: 60, weight: 900, fam: 'IT', color: C.acc, alpha: a, shadow: 0 }); }

}
// 13: an arrow up to the profile header
function finale(T) {

  ctx.beginPath(); ctx.moveTo(W / 2, ay + hh * .6); ctx.lineTo(W / 2, ay - hh * .6); ctx.moveTo(W / 2 - 70, ay - hh * .1); ctx.lineTo(W / 2, ay - hh * .65); ctx.lineTo(W / 2 + 70, ay - hh * .1); ctx.stroke(); ctx.restore();
  plate(L.link, W / 2, 1000, 54, ar, { pop: 1, ls: 2 });
}

// ---------------------------------------------------------------- the brand in the frame
const END0 = M.last + .55;
function logo() { ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(LOGO, W - 48 - LOGO.width, 48); ctx.restore(); }
function credit(T) { if (T < END0) txt(L.credit, W / 2, 1880, { size: 19, weight: 500, color: 'rgba(255,255,255,.42)', shadow: 0 }); }
function endCard(T) {
  const k = ease(seg(T, END0, END0 + .5)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = BR.navy; ctx.fillRect(0, 0, W, H);
  const s = lerp(.9, 1, easeOut(seg(T, END0, END0 + .8))), w = LOGO_BIG.width * s, h = LOGO_BIG.height * s, cy = 800;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO_BIG, W / 2 - w / 2, cy - h / 2, w, h); ctx.restore();
  const c = ap(T, END0 + .3, .4), d = ap(T, END0 + .5, .4);
  if (c > 0) txt(L.endA, W / 2, cy + 322 + (1 - c) * 12, { size: 66, weight: 800, fam: 'IT', color: C.acc, alpha: c, shadow: 0 });
  if (d > 0) txt(L.endB, W / 2, cy + 396 + (1 - d) * 12, { size: 40, weight: 600, color: 'rgba(255,255,255,.85)', alpha: d, shadow: 0 });
}

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, b: '#8fb6ff' };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });
const CH = CHUNKS.filter(Boolean);
function captions(T, y) {
  let i = -1; for (let k = 0; k < CH.length; k++) if (T >= CH[k].t0 - .07) i = k;
  if (i < 0) return; const c = CH[i], tEnd = Math.min(i + 1 < CH.length ? CH[i + 1].t0 - .07 : 1e9, c.t1 + .5);
  if (T > tEnd || T > END0) return;
  ctx.letterSpacing = '0px'; const its = c.ws.map(w => { const key = w.c !== 'w', size = key ? 60 : 54, weight = key ? 800 : 700, s = w.w.replace(/[.,:;!?]+$/, ''); font(ctx, size, weight); return { w, s, size, weight, wd: ctx.measureText(s).width }; });
  let tot = 0; its.forEach((it, k) => { tot += it.wd + (k < its.length - 1 && !it.w.g ? 17 : 0); });
  const sc = Math.min(1, 960 / tot), a = seg(T, c.t0 - .07, c.t0 + .03) * (1 - seg(T, tEnd - .06, tEnd));
  ctx.save(); ctx.translate(W / 2, y + (1 - seg(T, c.t0 - .07, c.t0 + .05)) * 10); ctx.scale(sc, sc); let x = -tot / 2;
  for (const it of its) {
    const on = seg(T, it.w.t - .04, it.w.t + .05), pop = 1 + .07 * Math.sin(Math.PI * seg(T, it.w.t - .02, it.w.t + .2));
    ctx.save(); ctx.translate(x + it.wd / 2, 0); ctx.scale(pop, pop); font(ctx, it.size, it.weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.globalAlpha = a * lerp(.4, 1, on); ctx.fillStyle = CAPCOL[it.w.c] || '#fff';
    ctx.fillText(it.s, 0, 0); ctx.shadowBlur = 5; ctx.fillText(it.s, 0, 0); ctx.restore();
    x += it.wd + (it.w.g ? 0 : 17);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- frame
const FLASH = [M.S3, M.S4, M.S7, M.S10, M.S12];
async function render(T) {
  T = clamp(T, 0, END); T_NOW = T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const cam = window.CAMQ || camAt(T); setCam(cam);
  globeMat.uniforms.expo.value = lerp(.5, .66, seg(T, 0, 3)) * (1 + .7 * clamp((cam.lat - 47) / 10)) * (1 - .25 * win2(T, M.S12 + .2, M.S13 + .6, .6, .6));
  globeMat.uniforms.sat.value = .88; globeMat.uniforms.haze.value = .7; atmo.material.uniforms.k.value = .5;
  stars(clamp((cam.range - .3) / 1.2) * .8);
  renderer.render(scene, camera); ctx.drawImage(glc, 0, 0);
  borders(.18 * clamp(1.4 - cam.range));
  mapLayer(T);
  vignette(1);
  dustStorm(T); hud(T); finale(T);

  for (const tc of FLASH) if (T >= tc && T < tc + .16) { ctx.fillStyle = `rgba(255,255,255,${.2 * (1 - (T - tc) / .16) ** 2})`; ctx.fillRect(0, 0, W, H); }

window.render = render; window.setCamQ = c => { window.CAMQ = c; }; window.END = END; window.M = M;
