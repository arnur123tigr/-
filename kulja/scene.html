    ctx.save(); ctx.globalAlpha = ck * .5; ctx.setLineDash([4, 14]); ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 3; ctx.beginPath(); pts.forEach((q, i) => { const p = P(q[0], q[1], true); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke(); ctx.restore();

}

// ---------------------------------------------------------------- titles and panels
function vignette(top = 1) {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 640);
  g = ctx.createLinearGradient(0, 1080, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.42, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,.92)');

const tag = (s, y, a, col = C.acc) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; rr(ctx, W / 2 - 30, y - 52, 60, 6, 3); ctx.fill(); ctx.restore();

  ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 30; rr(ctx, -w / 2, -h / 2, w, h, 22); ctx.fillStyle = C.pill; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();

function card(x, y, w, h, a, edge = C.line) {

}
const yearRun = (T, y0, y1, t0, t1) => Math.round(lerp(y0, y1, easeIO(seg(T, t0, t1))));

function hud(T) {
  // 1: the hook — 9 000 000 ₽
  const h1 = (1 - seg(T, M.S2 + .9, M.S2 + 1.3)) * ap(T, M.r9 - .25, .25);
  if (h1 > 0) {
    counter(T, 9000000, M.r9 - .1, M.r9 + .9, W / 2, 470, 140, '#fff', h1, { step: 10000, rub: 1 });
    tag(L.hookSub, 570, ap(T, M.r9 + .3, .4) * h1);
  }
  // 3: the open question on Zhetysu
  // 4-5: 1864
  datePlate(L.y1864, win2(T, M.S4 + .1, M.S6 - .1));
  tag(L.rebels, 430, win2(T, M.rise - .1, M.S6 - .1), C.warn);
  // 6: 1871 + the promise
  datePlate(L.y1871, win2(T, M.S6 + .1, M.S7 - .1), 300, RUS);
  const qk = win2(T, M.quote - .1, M.S7 + .2);

    txt(L.quote[1], W / 2, 572, { size: 58, weight: 900, fam: 'IT', color: C.acc, alpha: qk * ap(T, M.quote + .7, .3), shadow: 0 }); }
  // 7: «уақытша» struck out -> 10 years, the year counter

  if (s7 > 0) {
    txt(String(yearRun(T, 1871, 1881, M.tmp + .2, M.y10 + 1.2)), W / 2, 290, { size: 64, weight: 800, fam: 'IT', color: 'rgba(255,255,255,.85)', alpha: s7, ls: 4, sb: 14 });
    const st = ap(T, M.tmp - .1, .3) * (1 - seg(T, M.y10 - .1, M.y10 + .3) * .55);
    txt('«' + L.tmp + '»', W / 2, 450, { size: 96, weight: 900, fam: 'IT', alpha: s7 * st });
    const sl = easeOut(seg(T, M.tmp + .45, M.tmp + .8)); if (sl > 0) { ctx.save(); ctx.globalAlpha = s7; ctx.strokeStyle = C.warn; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(W / 2 - 260, 420); ctx.lineTo(W / 2 - 260 + 520 * sl, 410); ctx.stroke(); ctx.restore(); }

  const ek = win2(T, M.pek + .3, M.S9 + .3);

  // 9: war?
  const wk = win2(T, M.war - .15, M.S10 + .3); if (wk > 0) plate(L.war, W / 2, 360, 76, wk, { fill: C.warn, color: '#fff', pop: 1 });
  // 10: the treaty, Kulja back, the payment
  datePlate(L.treaty, win2(T, M.S10 + .4, M.pay - .2), 300, C.acc, 62);
  const bk = win2(T, M.ret + .8, M.pay - .2); if (bk > 0) plate(L.back, W / 2, 420, 40, bk, { fill: QING, color: BR.navy, ls: 1 });
  const pk = win2(T, M.pay - .1, M.S11 + .2);
  if (pk > 0) { counter(T, 9000000, M.pay, M.pay + 1.2, W / 2, 400, 124, '#fff', pk, { step: 10000, rub: 1 });
    tag(L.pay.toUpperCase(), 490, pk); }
  // 11: Alaska next to Kulja
  const ak = win2(T, M.ak - .2, M.S12 + .2);
  if (ak > 0) {
    const box = (x, nm, v, y, col, k) => { if (k <= 0) return; ctx.save(); ctx.globalAlpha = k; card(x, 420, 440, 250, 1, rgba(col, .8));
      txt(nm, x, 345, { size: 36, weight: 700, color: 'rgba(255,255,255,.8)', shadow: 0 }); txt(v, x, 440, { size: 72, weight: 900, fam: 'IT', color: col, shadow: 0 }); txt(y, x, 505, { size: 40, weight: 700, shadow: 0 }); ctx.restore(); };
    box(W / 2 - 235, L.alaska, L.akVal, L.akY, C.acc, ak); box(W / 2 + 235, L.kul, L.kuVal, L.kuY, QING, ap(T, M.ak + .4, .35) * ak);
    txt('≈', W / 2, 455, { size: 70, weight: 900, fam: 'IT', alpha: ap(T, M.ak + .7, .3) * ak });
  }
  // 12: the choice
  const ck = win2(T, M.choice - .1, M.S13 + .2);
  if (ck > 0) {
    const chip = (x, top, s, hk) => { const k = ck * ap(T, hk - .1, .3); if (k <= 0) return; const on = ap(T, hk, .3); ctx.save(); ctx.globalAlpha = k; card(x, 440, 420, 170, 1, rgba(on > .5 ? C.acc : '#ffffff', .6));
      txt(top, x, 415, { size: 34, weight: 800, ls: 4, color: C.acc, shadow: 0 }); txt(s, x, 475, { size: s.length > 14 ? 34 : 46, weight: 800, fam: 'IT', shadow: 0 }); ctx.restore(); };
    chip(W / 2 - 220, L.choice[0][0], L.choice[0][1], M.y1); chip(W / 2 + 220, L.choice[1][0], L.choice[1][1], M.move);
  }

  if (nk > 0) { const n = Math.round(50000 * clamp(MIG.reduce((a, m) => a + (T >= m.t0 ? 1 : 0), 0) / MIG.length) / 100) * 100; txt('~' + fmt(Math.max(0, n)), W / 2, 420, { size: 140, weight: 900, fam: 'IT', color: C.acc, alpha: nk, sb: 30, ls: 2 });
    tag(L.k50.toUpperCase() + ' · ' + L.mig.toUpperCase(), 500, nk, '#fff'); }
  const tk = win2(T, M.aha, M.S14 - .1); if (tk > 0) datePlate(L.today, tk, 300, C.acc, 60);
  // the ? of scene 3 and the ! of scene 13

  const em = win2(T, M.uy + .1, M.kor + .3); if (em > 0) { const p = P(79.4, 43.75); if (p[2]) bigMark(p[0], Math.max(560, p[1] - 230), '!', em, C.acc, T); }

    if (a > 0) { card(W / 2, 900, 900, 170, a, rgba('#3ddc84', .8)); txt(L.aL, W / 2, 870, { size: 30, weight: 800, ls: 6, color: '#3ddc84', alpha: a, shadow: 0 });
      txt(L.a, W / 2, 935, { size: 52, weight: 900, fam: 'IT', color: C.acc, alpha: a, shadow: 0 }); }
  }
}
// 15: back to the coin; it spins and turns into the arrow to the profile header
function finale(T) {

// ---------------------------------------------------------------- the brand in the frame
const END0 = M.last + .55;

function credit(T) { if (T < END0) txt(L.credit, W / 2, 1880, { size: 19, weight: 500, color: 'rgba(255,255,255,.42)', shadow: 0 }); }

// ---------------------------------------------------------------- captions: the chunk being spoken, word by word
const CAPCOL = { w: '#ffffff', t: C.acc, n: C.acc, r: C.warn, b: '#8fb6ff' };
const CHUNKS = []; B.words.forEach(w => { if (!/[0-9A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w.w)) return; (CHUNKS[w.k] ||= { ws: [], t0: w.t }).ws.push(w); CHUNKS[w.k].t1 = w.e; });
const CH = CHUNKS.filter(Boolean);
function captions(T, y) {
  let i = -1; for (let k = 0; k < CH.length; k++) if (T >= CH[k].t0 - .07) i = k;
  if (i < 0) return; const c = CH[i], tEnd = Math.min(i + 1 < CH.length ? CH[i + 1].t0 - .07 : 1e9, c.t1 + .5);
  if (T > tEnd || T > END0) return;

  for (const it of its) {
    const on = seg(T, it.w.t - .04, it.w.t + .05), pop = 1 + .07 * Math.sin(Math.PI * seg(T, it.w.t - .02, it.w.t + .2));
    ctx.save(); ctx.translate(x + it.wd / 2, 0); ctx.scale(pop, pop); font(ctx, it.size, it.weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.globalAlpha = a * lerp(.4, 1, on); ctx.fillStyle = CAPCOL[it.w.c] || '#fff';
    ctx.fillText(it.s, 0, 0); ctx.shadowBlur = 5; ctx.fillText(it.s, 0, 0); ctx.restore();
    x += it.wd + (it.w.g ? 0 : 17);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- frame
const FLASH = [M.S4, M.S10, M.S13 - .0, M.S14];
async function render(T) {
  T = clamp(T, 0, END); T_NOW = T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const cam = window.CAMQ || camAt(T); setCam(cam);
  globeMat.uniforms.expo.value = lerp(.5, .66, seg(T, 0, 3)) * (1 + .7 * clamp((cam.lat - 47) / 10)) * (1 - .25 * win2(T, M.S14 + .2, M.S15 + .6, .6, .6));
  globeMat.uniforms.sat.value = .88; globeMat.uniforms.haze.value = .7; atmo.material.uniforms.k.value = .5;
  stars(clamp((cam.range - .3) / 1.2) * .8);
  renderer.render(scene, camera); ctx.drawImage(glc, 0, 0);
  borders(.18 * clamp(1.4 - cam.range));
  mapLayer(T);
  // the coin falls on Kulja (scene 1) and stays as a small mark until scene 3
  const cf = seg(T, M.r9 - .55, M.r9 + .1), p = P(...PL.kul);
  if (T >= M.r9 - .55 && T < M.S3 + .5 && p[2]) { const bounce = T > M.r9 + .1 ? Math.abs(Math.sin((T - M.r9 - .1) * 9)) * 30 * Math.exp(-(T - M.r9) * 5) : 0;
    coin(p[0], lerp(-200, p[1] - 70, easeIn(cf)) - bounce, lerp(110, 62, ease(seg(T, M.r9 + .3, M.S2 + .8))), (T - M.r9) * 3 + 1.2, 1 - seg(T, M.S3, M.S3 + .5)); }

window.render = render; window.setCamQ = c => { window.CAMQ = c; }; window.END = END; window.M = M;
