  const s = mesh(new THREE.SphereGeometry(r, 64, 48), m); s.rotation.y = -Math.PI / 2 + Math.PI / 2; return s;
}
const COIN_R = .5, COIN_H = .058;
const coinGeo = new THREE.CylinderGeometry(COIN_R, COIN_R, COIN_H * .86, 48);

}

  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; const bo = mesh(new THREE.SphereGeometry(.05, 16, 12), M.steelD); bo.position.set(Math.cos(a) * .62, b / 2 + Math.sin(a) * .62, b / 2 + .1); safe.add(bo); }

// I: glass $1 coin + crowd

  const g = c.createLinearGradient(0, y - size * .5, 0, y + size * .45);

    ctx.fillStyle = '#fff'; for (let u = 0; u < p; u += .025) { const [x, y] = pt(u); ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); }

    ctx.save(); ctx.globalAlpha = c; goldText(ctx, `$${n} млрд`, W * .66, 760, 110, 'MB', 9); whiteTitle('ГАЗА В ГОД', W * .66, 855, 44, 1, 'MB'); ctx.restore();
  }
}
function ship(x, y, ang, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(255,255,255,.6)'; ctx.shadowBlur = 14; ctx.fillStyle = '#f2f2f2';
  ctx.beginPath(); ctx.moveTo(-48, -12); ctx.lineTo(36, -12); ctx.quadraticCurveTo(56, 0, 36, 12); ctx.lineTo(-48, 12); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#c8c8cc'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-30 + i * 19, 0, 8, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#555'; ctx.fillRect(-48, -9, 9, 18); ctx.restore();
}
function sceneText(v, a1, b1, t0, t1, col, glowCol) {
  const a = seg(v, t0, t0 + .2) * (1 - seg(v, t1 - .15, t1));
  glow(W / 2, H * .47, 650, glowCol, a * clamp((v - t0 - .4) / .4) * 1.2);
  ctx.save(); ctx.globalAlpha = a;
  whiteTitle(a1, W / 2, H * .43, 78, 1, 'MB');
  const q = seg(v, t0 + .35, t0 + .65); ctx.globalAlpha = a * q;
  ctx.font = 'italic 600 150px PF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 40;
  ctx.fillText(b1, W / 2, H * .43 + 150 - (1 - easeOut(q)) * 30); ctx.restore();
}

// ---------- captions & CTA ----------
let CAPS = [];
function drawCaption(v) {
  if (v > CTA0) return;
  const c = CAPS.find(c => v >= c.s - .05 && v < c.e + .08); if (!c) return;
  const a = clamp((v - c.s + .05) / .08) * clamp((c.e + .08 - v) / .08);
  ctx.save(); ctx.globalAlpha = a; ctx.font = '600 46px IN'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff'; ctx.fillText(c.t, W / 2, 205); ctx.restore();
}
function pill(s, x, y, size, col, a = 1, sc = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px MB`; const w = ctx.measureText(s).width + size * .9, h = size * 1.45;
  ctx.translate(x, y); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = size * .4; ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h * .28); ctx.fill(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(s, 0, size * .04); ctx.restore();
}
function drawCTA(v) {
  const a = seg(v, CTA0, CTA0 + .5); if (a <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${.62 * a})`; ctx.fillRect(0, 0, W, H);

  whiteTitle('Такие вопросы', W / 2, H * .13, 76, a * p1); whiteTitle('часто попадаются на', W / 2, H * .13 + 92, 58, a * p1, 'ME');
  pill('ЕНТ по географии', W / 2, H * .13 + 225, 70, '#d99a2b', a * seg(v, 61.5, 61.8), back(seg(v, 61.5, 61.95)));
  whiteTitle('Мы подготовили', W / 2, H * .37, 68, a * p2); whiteTitle('гайд ЕНТ по географии', W / 2, H * .37 + 86, 68, a * p2);
  { const q = seg(v, 63.8, 64.2); if (q > 0) { ctx.save(); ctx.globalAlpha = a * q; const s = back(q); ctx.translate(W / 2, H * .37 + 250); ctx.scale(s, s); guideIcon(); ctx.restore(); } }
  whiteTitle('Напиши в комментариях', W / 2, H * .6, 62, a * p3);
  { const q = seg(v, 68.4, 68.7); if (q > 0) {
    const pulse = 1 + .06 * Math.sin((v - 68.4) * 8) * seg(v, 68.8, 69.1), sc = back(seg(v, 68.4, 68.85)) * pulse;
    ctx.save(); ctx.globalAlpha = a * q; ctx.translate(W / 2, H * .6 + 200); ctx.scale(sc, sc);
    ctx.font = '110px MB'; const w = ctx.measureText('ГЕО').width + 130, h = 180;
    ctx.fillStyle = '#3fc43a'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 44); ctx.moveTo(-w / 2 + 70, h / 2 - 2); ctx.lineTo(-w / 2 + 40, h / 2 + 50); ctx.lineTo(-w / 2 + 125, h / 2 - 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ГЕО', 0, 8); ctx.restore(); } }
}
function guideIcon() {   // gold-edged book
  ctx.shadowColor = 'rgba(255,190,80,.6)'; ctx.shadowBlur = 40;
  const g = ctx.createLinearGradient(-90, -110, 90, 110); g.addColorStop(0, '#2b2b30'); g.addColorStop(1, '#111114');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-90, -115, 180, 230, 16); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#e9b44c'; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-90, -115, 180, 230, 16); ctx.stroke();
  ctx.fillStyle = '#e9b44c'; ctx.fillRect(-70, -115, 10, 230);
  goldText(ctx, 'ЕНТ', 10, -30, 54, 'MB', 4, false); ctx.font = '30px ME'; ctx.fillStyle = '#ddd'; ctx.textAlign = 'center'; ctx.fillText('гео', 10, 40);
}

// ---------- main ----------
window.render = function (T) {
  const v = T - OFF;
  ctx.globalAlpha = 1; ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, W, H);
  if (v < 9.2) { const r = sceneBarrels(v, 'A'); drawBarrelsBG(v, r); render3D();
    const q = seg(v, 5.35, 5.7); if (q > 0) { const [x, y] = project(new THREE.Vector3(1.05, 3.6, 0)); ctx.save(); ctx.globalAlpha = q * (1 - seg(v, 9.0, 9.2)); goldText(ctx, '$2', x, y - 120, 150 * (.8 + .2 * back(q)), 'MB', 10); whiteTitle('ТРЛН', x, y + 10, 60, 1); whiteTitle('ФОНД', x, y + 85, 60, 1); ctx.restore(); } }
  else if (v < 10.4) sceneText(v, 'Сейчас', 'объясним.', 9.2, 10.45, '#e8b85a', GOLD);
  else if (v < 14.0) { sceneTower(v); glow(W / 2, H * .3, 800, GOLD, .9); render3D(); }
  else if (v < 17.7) sceneGauge(v);
  else if (v < 21.0) { sceneSafe(v); glow(W * .45, H * .35, 850, GOLD, .7); render3D(); }

  else if (v < 37.7) sceneMap(v);
  else if (v < 43.3) { sceneCoin(v); glow(W / 2, H * .3, 760, GOLD, .9 * seg(v, 37.7, 38.1) * (1 - seg(v, 42.2, 42.6) * .4)); render3D();
    const q = seg(v, 42.0, 42.35); if (q > 0) { ctx.save(); ctx.globalAlpha = q; goldText(ctx, '3¢', W / 2, 640, 210 * (.8 + .2 * back(q)), 'MB', 10); whiteTitle('С КАЖДОГО ДОЛЛАРА', W / 2, 790, 54, 1); ctx.restore(); } }
  else if (v < 44.8) sceneText(v, 'И вот самое', 'худшее.', 43.3, 44.85, '#ff3446', RED);
  else if (v < 52.4) { scenePlant(v); const rq = seg(v, 47.4, 47.7);
    glow(W / 2, 520, 620, RED, rq * (1 - seg(v, 51.6, 52.3) * .7)); glow(W * .25, 1250, 500, GOLD, seg(v, 50.7, 51.2) * .8); render3D();
    if (rq > 0) { ctx.save(); ctx.globalAlpha = rq; const sc = .8 + .2 * back(rq);
      colorText('$0', W / 2, 470, 190 * sc, '#ffd0d0', '#ff3a4a', '#a3101c', '#4a050a', 'rgba(255,40,60,.7)');
      const k = seg(v, 49.9, 50.2); whiteTitle('НАЛОГОВ', W / 2, 620, 58, 1 - k); whiteTitle('ДО 2024 ГОДА', W / 2, 620, 58, k); ctx.restore(); } }
  else { const mode = v < 54.8 ? 'L' : 'M'; const r = sceneBarrels(v, mode); drawBarrelsBG(v, r); render3D();
    if (mode === 'L') { const q = seg(v, 53.5, 53.8); if (q > 0) { const [x, y] = project(new THREE.Vector3(0, 1.0, 0)); whiteTitle('=', x, y, 140 * (.7 + .3 * back(q)), q, 'MB'); } }
    if (mode === 'L') { const q = seg(v, 52.5, 52.8) * (1 - seg(v, 54.6, 54.8)); if (q > 0) whiteTitle('ДВЕ СТРАНЫ', W / 2, 520, 64, q); }
  }

};
window.ready = (async () => {
  CAPS = await (await fetch('captions.json')).json();
  DOTS = await (await fetch('dots.json')).json();
  render(0); return true;
})();
