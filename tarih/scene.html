<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-Black.ttf);font-weight:900}
@font-face{font-family:MX;src:url(fonts/Montserrat-ExtraBold.ttf);font-weight:800}
html,body{margin:0;background:#000}canvas{width:540px;height:960px;display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «Қазақстан тарихының 3 000 жылы бір минутта» — Flat Vector map reel (KZ voice).
// render(T) is deterministic, T = video seconds (voice starts at T = 0.3).
// Kazakhstan outline in shapes.json includes Baikonur (filled, no hole).
const W = 1080, H = 1920, END = 60.2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SH = null, cam = null;
const D2R = Math.PI / 180, KX = Math.cos(46 * D2R);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .35) => clamp((t - a) / f) * clamp((b - t) / f);
const lerp = (a, b, k) => a + (b - a) * k;

// palette (flat vector)
const C = {
  sea: '#8FCFD6', sea2: '#A9DCE1', land: '#F6E7C1', land2: '#EAD6A6', coast: '#C9AE78', ink: '#1F2A44', navy: '#1F3B57',
  saka: '#F08A4B', usun: '#1FA3B5', kangju: '#8E6BBF', hun: '#B5523B', turk: '#3D7DD8', karakh: '#3E9E5F',
  mongol: '#25232A', gh: '#E8B730', ch: '#6BBF59', yuan: '#D9534F', il: '#7E57C2', kz: '#00AFCA', dz: '#D63A3A',
  emp: '#7A6A4F', ussr: '#C62828', gold: '#F2C14E', white: '#FFFDF6'
};
// scene starts (video time), fitted to the voice
const S = [0, 3.95, 6.9, 11.35, 15.4, 18.35, 23.45, 27.8, 31.55, 34.75, 38.75, 44.15, 49.3, 54.5, END];

// camera keys [start t, lon, lat, px per degree, move duration]
const CAM = [[0, 67, 46.5, 29, 0], [15.4, 88, 47, 25, .5], [15.9, 44, 48, 25, 2.4], [18.35, 80, 46, 14.5, 1.2], [23.45, 70.5, 42.5, 44, 1.0], [27.8, 80, 45, 14.5, 1.0],
  [31.55, 60, 49.5, 22, 1.0], [34.75, 67, 46.5, 28.5, .8], [35.6, 67, 46, 32, 3.0], [38.75, 67, 47.5, 27, .8], [49.3, 67, 47, 28, .6], [50.5, 68.2, 49.5, 33, 3.5], [54.5, 67, 40.8, 36, .9]];
function camAt(t) {
  let p = { lon: CAM[0][1], lat: CAM[0][2], s: CAM[0][3] };
  for (const [t0, lon, lat, s, d] of CAM) {
    if (t < t0) break;
    const k = d ? ease((t - t0) / d) : 1;
    p = { lon: lerp(p.lon, lon, k), lat: lerp(p.lat, lat, k), s: Math.exp(lerp(Math.log(p.s), Math.log(s), k)) };
  }
  return p;
}
const PX = (lon, lat) => [W / 2 + (lon - cam.lon) * cam.s * KX, H * .52 - (lat - cam.lat) * cam.s];

function path(rings) { ctx.beginPath(); for (const r of rings) { r.forEach(([lo, la], i) => { const [x, y] = PX(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); } }
// state blob: fill + darker border + soft shadow; optional reveal circle (lon, lat, radius in degrees)
function blob(key, col, a, rev = null, stroke = true) {
  if (a <= 0 || !SH['h_' + key] && !SH[key]) return;
  const R = SH['h_' + key] || SH[key];
  ctx.save(); ctx.globalAlpha = a;
  if (rev) { const [x, y] = PX(rev[0], rev[1]); ctx.beginPath(); ctx.arc(x, y, Math.max(0, rev[2]) * cam.s, 0, 7); ctx.clip(); }
  path(R); ctx.shadowColor = 'rgba(40,30,10,.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; ctx.fillStyle = col; ctx.fill('evenodd');
  ctx.shadowColor = 'transparent';
  // flat inner highlight stripes
  ctx.save(); ctx.clip('evenodd'); ctx.globalAlpha = a * .12; ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
  for (let x = -H; x < W + H; x += 46) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H * .6, H); ctx.stroke(); } ctx.restore();
  if (stroke) { ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.strokeStyle = shade(col, -.3); ctx.lineWidth = 5; ctx.stroke(); }
  ctx.restore();
}
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const m = v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f); return `rgb(${m(r)},${m(g)},${m(b)})`; }

function txt(s, x, y, size, col = '#fff', font = 'M', align = 'center', outline = null, ow = .16) {
  ctx.font = `900 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.lineWidth = size * ow; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function fit(s, size, maxW, font = 'M') { ctx.font = `900 ${size}px ${font}`; const w = ctx.measureText(s).width; return w > maxW ? size * maxW / w : size; }
function label(s, lon, lat, a, size = 46, col = '#fff', sub = null) {
  if (a <= 0) return; const [x, y] = PX(lon, lat); ctx.save(); ctx.globalAlpha = a; const k = back(a);
  ctx.translate(x, y); ctx.scale(k, k); txt(s, 0, 0, size, col, 'M', 'center', C.ink, .2);
  if (sub) txt(sub, 0, size * .95, size * .62, '#fff', 'MX', 'center', C.ink, .22);
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- base map ----------
function drawBase(t) {
  ctx.fillStyle = C.sea; ctx.fillRect(0, 0, W, H);
  // flat wave dashes
  ctx.strokeStyle = C.sea2; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let i = 0; i < 60; i++) { const x = (i * 397 % W), y = (i * 733 % H), d = Math.sin(t * 1.2 + i) * 8; ctx.beginPath(); ctx.moveTo(x + d, y); ctx.lineTo(x + 40 + d, y); ctx.stroke(); }
  path(SH.land); ctx.save(); ctx.shadowColor = 'rgba(30,60,70,.35)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 10; ctx.fillStyle = C.land2; ctx.fill('evenodd'); ctx.restore();
  path(SH.land); ctx.fillStyle = C.land; ctx.fill('evenodd'); ctx.strokeStyle = C.coast; ctx.lineWidth = 3; ctx.stroke();
}
function drawLakes() { for (const k in SH.lakes) { path(SH.lakes[k]); ctx.fillStyle = C.sea; ctx.fill(); ctx.strokeStyle = C.coast; ctx.lineWidth = 2; ctx.stroke(); } }
function kzGhost(a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; path(SH.KAZ); ctx.setLineDash([14, 12]); ctx.strokeStyle = 'rgba(31,42,68,.45)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore(); }
function borders(a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(120,95,55,.55)'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  for (const c of ['RUS', 'CHN', 'MNG', 'UZB', 'KGZ', 'TKM', 'TJK', 'AFG', 'IRN', 'AZE', 'GEO', 'ARM', 'TUR', 'UKR']) { path(SH[c]); ctx.stroke(); } ctx.restore(); }

// ---------- icons ----------
function horse(x, y, s, ph, col = '#6C4428', rider = null) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
  // legs (gallop)
  ctx.lineWidth = 9;
  const L = [[-34, 1], [-22, 2.2], [26, 0.5], [38, 1.7]];
  for (const [lx, o] of L) { const a = Math.sin(ph + o) * .55; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx + Math.sin(a) * 34, 34 * Math.cos(a) + 6); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(0, -6, 50, 22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(34, -18); ctx.lineTo(58, -56); ctx.lineTo(76, -50); ctx.lineTo(78, -40); ctx.lineTo(56, -30); ctx.lineTo(46, -4); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-48, -14); ctx.quadraticCurveTo(-72, -10, -70, 16); ctx.stroke();   // tail
  ctx.fillStyle = shade(col, -.35); ctx.beginPath(); ctx.moveTo(40, -26); ctx.lineTo(56, -58); ctx.lineTo(50, -24); ctx.fill(); // mane
  if (rider) { ctx.fillStyle = rider; rr(-14, -62, 28, 40, 10); ctx.fill(); ctx.beginPath(); ctx.arc(0, -74, 13, 0, 7); ctx.fillStyle = '#EDBB8D'; ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(-14, -80); ctx.lineTo(0, -102); ctx.lineTo(14, -80); ctx.fill();
    ctx.strokeStyle = '#5a3b22'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(14, -50, 20, -1.3, 1.3); ctx.stroke(); }
  ctx.restore();
}
function chariot(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(60,40,20,.18)'; ctx.beginPath(); ctx.ellipse(-20, 60, 190, 16, 0, 0, 7); ctx.fill();
  horse(90, 8, 1.15, t * 14, '#8A5A36'); horse(60, 14, 1.15, t * 14 + 1.3, '#6C4428');
  ctx.strokeStyle = '#5a3b22'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-70, -6); ctx.lineTo(40, -14); ctx.stroke();   // pole
  // driver + archer
  ctx.fillStyle = '#C8372D'; rr(-118, -96, 30, 56, 10); ctx.fill(); ctx.fillStyle = '#2D5FA8'; rr(-86, -102, 30, 62, 10); ctx.fill();
  ctx.fillStyle = '#EDBB8D'; ctx.beginPath(); ctx.arc(-103, -110, 15, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(-71, -116, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = '#5a3b22'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-60, -150); ctx.lineTo(-40, -40); ctx.stroke();   // spear
  ctx.fillStyle = '#B0B6C0'; ctx.beginPath(); ctx.moveTo(-62, -168); ctx.lineTo(-54, -146); ctx.lineTo(-66, -148); ctx.fill();
  // box
  ctx.fillStyle = '#B9783F'; rr(-140, -46, 100, 46, 12); ctx.fill(); ctx.fillStyle = '#8A5A36'; ctx.fillRect(-140, -12, 100, 10);
  // wheel with spokes (rotating)
  const wx = -90, wy = 14, R = 42; ctx.lineWidth = 9; ctx.strokeStyle = '#5a3b22'; ctx.beginPath(); ctx.arc(wx, wy, R, 0, 7); ctx.stroke();
  ctx.lineWidth = 5; for (let k = 0; k < 6; k++) { const a = t * 9 + k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * R, wy + Math.sin(a) * R); ctx.stroke(); }
  ctx.fillStyle = '#5a3b22'; ctx.beginPath(); ctx.arc(wx, wy, 9, 0, 7); ctx.fill();
  ctx.restore();
}
function goldenMan(x, y, s, t) {   // Altyn adam: tall pointed headdress with arrows, gold armour, sword
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(-60, -300, 60, 60); g.addColorStop(0, '#FFE58A'); g.addColorStop(.5, '#F2B925'); g.addColorStop(1, '#C98A0B');
  // halo
  ctx.save(); ctx.globalAlpha = .35 + .15 * Math.sin(t * 4); ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.arc(0, -140, 190, 0, 7); ctx.fill(); ctx.restore();
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + t * .6; ctx.save(); ctx.globalAlpha = .35; ctx.strokeStyle = '#FFE58A'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 200, -140 + Math.sin(a) * 200); ctx.lineTo(Math.cos(a) * 240, -140 + Math.sin(a) * 240); ctx.stroke(); ctx.restore(); }
  ctx.fillStyle = g;
  // legs + boots
  rr(-40, -40, 32, 90, 10); ctx.fill(); rr(8, -40, 32, 90, 10); ctx.fill();
  // body (kaftan with scale plates)
  ctx.beginPath(); ctx.moveTo(-58, -170); ctx.lineTo(58, -170); ctx.lineTo(70, -20); ctx.lineTo(-70, -20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#B07A08'; ctx.lineWidth = 3; for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) { ctx.beginPath(); ctx.arc(-44 + c * 22 + (r % 2) * 11, -150 + r * 22, 9, 0, Math.PI); ctx.stroke(); }
  ctx.fillStyle = '#9C6A05'; ctx.fillRect(-64, -78, 128, 14);
  // sword
  ctx.fillStyle = '#C98A0B'; rr(52, -80, 12, 90, 5); ctx.fill();
  // arms
  ctx.fillStyle = g; rr(-84, -166, 28, 100, 12); ctx.fill(); rr(56, -166, 28, 100, 12); ctx.fill();
  // head
  ctx.fillStyle = '#EDBB8D'; ctx.beginPath(); ctx.arc(0, -200, 36, 0, 7); ctx.fill();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-12, -202, 4.5, 0, 7); ctx.arc(12, -202, 4.5, 0, 7); ctx.fill();
  // tall headdress
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-40, -212); ctx.lineTo(0, -420); ctx.lineTo(40, -212); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#B07A08'; ctx.lineWidth = 5; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-6, -240 - k * 40); ctx.lineTo(-34 + k * 4, -290 - k * 40); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, -240 - k * 40); ctx.lineTo(34 - k * 4, -290 - k * 40); ctx.stroke(); }
  ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.arc(0, -424, 10, 0, 7); ctx.fill();
  // sparkle
  const sp = (t * 1.3) % 1; ctx.save(); ctx.globalAlpha = Math.sin(sp * Math.PI); ctx.fillStyle = '#fff'; ctx.translate(30, -320); ctx.rotate(sp * 2);
  ctx.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? 6 : 26, a = k * Math.PI / 4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.fill(); ctx.restore();
  ctx.restore();
}
function crescent(x, y, r, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(back(a), back(a));
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, 7); ctx.fill(); ctx.strokeStyle = C.karakh; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = C.karakh; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * .38, -r * .12, r * .82, 0, 7); ctx.fill();
  ctx.fillStyle = C.karakh; ctx.beginPath(); for (let k = 0; k < 10; k++) { const rr2 = k % 2 ? r * .13 : r * .3, an = k * Math.PI / 5 - Math.PI / 2; ctx.lineTo(r * .62 + Math.cos(an) * rr2, -r * .1 + Math.sin(an) * rr2); } ctx.fill();
  ctx.restore(); }
function city(lon, lat, a, name) { if (a <= 0) return; const [x, y] = PX(lon, lat); ctx.save(); ctx.globalAlpha = clamp(a * 3);
  const pul = 1 + .25 * Math.sin(a * 20); ctx.fillStyle = 'rgba(255,215,90,.45)'; ctx.beginPath(); ctx.arc(x, y, 30 * back(a) * pul, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFD35A'; ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 14 * back(a), 0, 7); ctx.fill(); ctx.stroke();
  if (name) txt(name, x, y - 44, 34, '#fff', 'MX', 'center', C.ink, .25); ctx.restore(); }
function arrow(pts, k, col, w = 34, a = 1) {   // pts lon/lat, k = drawn fraction 0..1
  if (k <= 0 || a <= 0) return; const P = pts.map(p => PX(p[0], p[1])); let L = 0; const seg = []; for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(d); L += d; }
  let need = L * clamp(k), q = [P[0]], hx = P[0][0], hy = P[0][1], dir = 0;
  for (let i = 1; i < P.length && need > 0; i++) { const d = seg[i - 1], f = Math.min(1, need / d); hx = P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f; hy = P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f; dir = Math.atan2(P[i][1] - P[i - 1][1], P[i][0] - P[i - 1][0]); q.push([hx, hy]); need -= d; }
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const line = (c, lw) => { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); q.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowOffsetY = 6; ctx.shadowBlur = 8; line(shade(col, -.35), w + 10); ctx.shadowColor = 'transparent'; line(col, w);
  ctx.translate(hx, hy); ctx.rotate(dir); ctx.fillStyle = shade(col, -.35); ctx.beginPath(); ctx.moveTo(w * 1.7, 0); ctx.lineTo(-w * .6, -w * 1.55); ctx.lineTo(-w * .6, w * 1.55); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(w * 1.35, 0); ctx.lineTo(-w * .4, -w * 1.2); ctx.lineTo(-w * .4, w * 1.2); ctx.closePath(); ctx.fill();
  ctx.restore(); return [hx, hy, dir];
}
function factory(x, y, s, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a * 2); ctx.translate(x, y); const k = back(a); ctx.scale(s * k, s * k);
  for (let i = 0; i < 3; i++) { const p = ((t * .5 + i * .33) % 1); ctx.globalAlpha = clamp(a * 2) * (1 - p) * .7; ctx.fillStyle = '#d9d4cc'; ctx.beginPath(); ctx.arc(28 + p * 30, -110 - p * 90, 14 + p * 26, 0, 7); ctx.fill(); }
  ctx.globalAlpha = clamp(a * 2); ctx.fillStyle = '#3b3b46'; ctx.fillRect(18, -110, 20, 70);
  ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(-60, -50); ctx.lineTo(-30, -70); ctx.lineTo(-30, -50); ctx.lineTo(0, -70); ctx.lineTo(0, -50); ctx.lineTo(30, -70); ctx.lineTo(60, -50); ctx.lineTo(60, 0); ctx.closePath(); ctx.fillStyle = '#55556a'; ctx.fill();
  ctx.fillStyle = '#FFD35A'; for (let i = 0; i < 4; i++) ctx.fillRect(-50 + i * 28, -32, 16, 16); ctx.restore(); }
function star(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); for (let k = 0; k < 10; k++) { const rr2 = k % 2 ? r * .42 : r, an = k * Math.PI / 5 - Math.PI / 2; ctx.lineTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2); } ctx.closePath(); ctx.fill(); }
function kzFlag(x, y, w, wave, t) {   // sky-blue flag, sun with rays, steppe eagle, ornament band
  const h = w / 2;
  ctx.save(); ctx.translate(x, y);
  const N = 24; const off = i => Math.sin(t * 5 - i / N * 5) * wave * (i / N);
  ctx.beginPath(); for (let i = 0; i <= N; i++) ctx.lineTo(i / N * w, off(i)); for (let i = N; i >= 0; i--) ctx.lineTo(i / N * w, h + off(i)); ctx.closePath();
  ctx.fillStyle = '#00AFCA'; ctx.fill(); ctx.save(); ctx.clip();
  const sx = w * .52, sy = h * .42 + off(N * .52);
  ctx.fillStyle = '#FEC50C'; ctx.beginPath(); ctx.arc(sx, sy, h * .17, 0, 7); ctx.fill();
  for (let k = 0; k < 32; k++) { const a = k * Math.PI / 16; ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * h * .2, sy + Math.sin(a) * h * .2); ctx.lineTo(sx + Math.cos(a + .06) * h * .3, sy + Math.sin(a + .06) * h * .3); ctx.lineTo(sx + Math.cos(a - .06) * h * .3, sy + Math.sin(a - .06) * h * .3); ctx.fill(); }
  // eagle (wings spread under the sun)
  const ey = h * .72 + off(N * .52); ctx.beginPath(); ctx.moveTo(sx, ey - h * .05);
  ctx.quadraticCurveTo(sx - w * .12, ey - h * .2, sx - w * .25, ey - h * .1); ctx.quadraticCurveTo(sx - w * .14, ey - h * .02, sx - w * .2, ey + h * .04); ctx.quadraticCurveTo(sx - w * .07, ey, sx, ey + h * .08);
  ctx.quadraticCurveTo(sx + w * .07, ey, sx + w * .2, ey + h * .04); ctx.quadraticCurveTo(sx + w * .14, ey - h * .02, sx + w * .25, ey - h * .1); ctx.quadraticCurveTo(sx + w * .12, ey - h * .2, sx, ey - h * .05); ctx.fill();
  // ornament band near the pole
  for (let j = 0; j < 8; j++) { const oy = h * (j + .5) / 8 + off(1.5); ctx.beginPath(); ctx.moveTo(w * .05, oy - h * .04); ctx.quadraticCurveTo(w * .09, oy - h * .06, w * .09, oy); ctx.quadraticCurveTo(w * .09, oy + h * .06, w * .05, oy + h * .04); ctx.quadraticCurveTo(w * .07, oy, w * .05, oy - h * .04); ctx.fill(); }
  ctx.restore(); ctx.restore();
}

// ---------- HUD: date counter + progress through 3000 years + scene title ----------
