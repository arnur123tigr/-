<script>
logo = function (a = .9) {   // corner logo, bigger since 18.11.2026 (anti-theft): ~122 px high
  const im = IM.logo; if (!im) return; const h = 122, w = im.width / im.height * h;
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 12; ctx.drawImage(im, W - 44 - w, 44, w, h); ctx.restore();
};
captions = function (t) {   // 2-3 words, the spoken word amber
  const vt = t - OFF; if (vt >= B.cta - .05) return;
  const c = CAPS.find(c => vt >= c[0] - .05 && vt < c[1] + .12); if (!c) return;
  const a = Math.min(ap(vt, c[0] - .05, .12), 1), size = 54, sp = tw(' ', size, 'MX');
  const ws = c[2].map(w => w[0]), tot = ws.reduce((s, w) => s + tw(w, size, 'MX'), 0) + sp * (ws.length - 1);
  const k = Math.min(1, 980 / tot); let x = W / 2 - tot * k / 2;

    txt(w, x + ww / 2, H * .835, size * k, on ? GOLD : '#fff', 'MX', { shadow: 'rgba(0,0,0,.9)', blur: 14, dy: 2, stroke: 8, sc: 'rgba(0,0,0,.55)' }); x += ww + sp * k; });
  ctx.restore();
};
let TT = 0;
const A = (k0, k1, f = .3) => win(TT, V(k0), V(k1), f);
function head2(l1, l2, a, y = H * .15) {

function counter(n, a) { if (a <= 0) return; pill(`${n} / 3`, W / 2, H * .085, 46, a, { line: GOLD, scale: .9 + .1 * clamp(a) }); }
function bigPill(s, y, a, t0) { if (a > 0) pill(s, W / 2, y, 50, a, { bg: GOLD, col: BR.navy, line: GOLD, font: 'MB', scale: back(clamp(ap(TT, t0, .4))) }); }

// ---------- icons ----------

  ctx.lineWidth = 4; ctx.strokeStyle = GOLD; ctx.stroke();

let SYR = [], AMU = [];

  { from: 'syr', pts: [[68.6, 40.95], [68.5, 40.5], [68.2, 40.2]], field: [68.4, 40.4] },                                                     // Hungry steppe
