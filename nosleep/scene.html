<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:R;src:url(fonts/Rubik-Medium.ttf)}
@font-face{font-family:RB;src:url(fonts/Rubik-ExtraBold.ttf)}
html,body{margin:0;background:#000}canvas{width:540px;height:960px;display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Что будет с мозгом, если не спать сутки" — Minimal Line style (thin white lines on black).
// render(t) is deterministic: record.js calls it for every frame.
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1080, H = 1920, PI = Math.PI;
let TL, SC = {};
window.ready = (async () => {
  TL = await (await fetch('timeline.json')).json();
  TL.scenes.forEach(s => SC[s.id] = s);
  await document.fonts.load('80px R'); await document.fonts.load('80px RB');
  render(0);
})();

// ---------- math ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => { u = cl(u); return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };
const eo = u => 1 - Math.pow(1 - cl(u), 3);
const seg = (t, a, b) => cl((t - a) / (b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const back = u => { u = cl(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

// ---------- line engine (optional "boiling" jitter for the sleepy scene) ----------
let JIT = 0, JSTEP = 0;
function jp(x, y) {
  if (!JIT) return [x, y];
  const k = JSTEP;
  const a = Math.sin(x * .045 + y * .031 + k * 2.7) + Math.sin(x * .013 - y * .052 + k * 1.3);
  const b = Math.cos(x * .037 - y * .041 + k * 3.1) + Math.sin(x * .061 + y * .009 - k * 1.9);
  return [x + JIT * a * .5, y + JIT * b * .5];
}
function subdiv(pts, closed) {
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p = pts[i], q = pts[(i + 1) % n], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const s = JIT ? Math.max(1, Math.ceil(L / 16)) : 1;
    for (let k = 0; k < s; k++) out.push([p[0] + (q[0] - p[0]) * k / s, p[1] + (q[1] - p[1]) * k / s]);
  }
  out.push(closed ? pts[0] : pts[n - 1]);
  return out;
}
function poly(pts, o = {}) {
  let closed = !!o.closed, fill = o.fill, prog = o.prog ?? 1;
  if (prog <= 0 || pts.length < 2) return;
  let P = subdiv(pts, closed).map(p => jp(p[0], p[1]));
  if (prog < 1) {
    const L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    const tg = L[L.length - 1] * prog, Q = [P[0]];
    for (let i = 1; i < P.length; i++) {
      if (L[i] <= tg) Q.push(P[i]);
      else { const u = (tg - L[i - 1]) / (L[i] - L[i - 1] || 1); Q.push([lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u)]); break; }
    }
    P = Q; closed = false; fill = false;
  }
  X.beginPath(); X.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) X.lineTo(P[i][0], P[i][1]);
  if (closed) X.closePath();
  if (fill) { X.save(); X.shadowBlur = 0; X.fillStyle = fill === true ? '#000' : fill; X.fill(); X.restore(); }
  if (o.stroke !== false) X.stroke();
}
const arcPts = (cx, cy, rx, ry, a0 = 0, a1 = 2 * PI, n = 40) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; };
const circle = (cx, cy, r, o = {}) => poly(arcPts(cx, cy, r, r, 0, 2 * PI, 48).slice(0, -1), { closed: true, ...o });
const ellipse = (cx, cy, rx, ry, o = {}) => poly(arcPts(cx, cy, rx, ry, 0, 2 * PI, 48).slice(0, -1), { closed: true, ...o });
const line = (x1, y1, x2, y2, o = {}) => poly([[x1, y1], [x2, y2]], o);
function rrPts(x, y, w, h, r) {
  const p = [], c = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i / 6 * PI / 2; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  c(x + w - r, y + r, -PI / 2); c(x + w - r, y + h - r, 0); c(x + r, y + h - r, PI / 2); c(x + r, y + r, PI); return p;
}
const rrect = (x, y, w, h, r, o = {}) => poly(rrPts(x, y, w, h, r), { closed: true, ...o });
function dot(x, y, r, a = 1) { const [px, py] = jp(x, y); X.save(); X.fillStyle = `rgba(255,255,255,${a})`; X.beginPath(); X.arc(px, py, r, 0, 2 * PI); X.fill(); X.restore(); }
function ink(a = 1, w = 5, glow = 10, col = '255,255,255') {
  X.strokeStyle = `rgba(${col},${a})`; X.lineWidth = w; X.lineCap = 'round'; X.lineJoin = 'round';
  X.shadowColor = `rgba(${col},${Math.min(1, a) * .75})`; X.shadowBlur = glow;
}
function cam(z, cx, cy) { X.translate(W / 2, H / 2); X.scale(z, z); X.translate(-cx, -cy); }

// ---------- text ----------
function title(str, t0, t, y = 250, size = 80) {
  const u = eo(seg(t, t0, t0 + .4)); if (u <= 0) return;
  X.save(); X.font = `${size}px R`;
  let w = X.measureText(str).width; if (w > 960) { size *= 960 / w; X.font = `${size}px R`; w = 960; }
  X.textAlign = 'center'; X.textBaseline = 'middle'; X.globalAlpha = u;
  X.fillStyle = '#fff'; X.shadowColor = 'rgba(255,255,255,.55)'; X.shadowBlur = 14;
  X.fillText(str, W / 2, y + (1 - u) * 26);
  ink(.7, 3, 6); const hw = (w / 2 + 10) * eo(seg(t, t0 + .15, t0 + .7));
  if (hw > 1) line(W / 2 - hw, y + size * .72, W / 2 + hw, y + size * .72);
  X.restore();
}
function label(str, x, y, size = 40, a = 1, font = 'R') {
  X.save(); X.font = `${size}px ${font}`; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillStyle = `rgba(255,255,255,${a})`; X.shadowColor = `rgba(255,255,255,${.5 * a})`; X.shadowBlur = 10;
  X.fillText(str, x, y); X.restore();
}

// ---------- characters & props ----------
function face(hx, hy, o) {
  const d = o.drop || 0, ey = hy - 8 + d * 14, ex = 26, eyes = o.eyes || 'open', my = hy + 32 + d * 10;
  if (eyes === 'open') { dot(hx - ex, ey, 6.5); dot(hx + ex, ey, 6.5); }
  else if (eyes === 'wide') { circle(hx - ex, ey, 11); circle(hx + ex, ey, 11); dot(hx - ex, ey, 4.5); dot(hx + ex, ey, 4.5); }
  else if (eyes === 'closed') { poly(arcPts(hx - ex, ey - 4, 13, 9, .15 * PI, .85 * PI, 10)); poly(arcPts(hx + ex, ey - 4, 13, 9, .15 * PI, .85 * PI, 10)); }
  else if (eyes === 'tired') {
    line(hx - ex - 12, ey, hx - ex + 12, ey); line(hx + ex - 12, ey, hx + ex + 12, ey);
    dot(hx - ex, ey + 3, 4); dot(hx + ex, ey + 3, 4);
    X.save(); ink(.45, 3, 4); poly(arcPts(hx - ex, ey + 6, 13, 9, .2 * PI, .8 * PI, 10)); poly(arcPts(hx + ex, ey + 6, 13, 9, .2 * PI, .8 * PI, 10)); X.restore();
  }
  if (o.brows) { const b = o.brows; line(hx - ex - 14, ey - 22 - 6 * b, hx - ex + 12, ey - 22 + 6 * b); line(hx + ex + 14, ey - 22 - 6 * b, hx + ex - 12, ey - 22 + 6 * b); }
  const m = o.mouth || 'flat', zz = o.zig ?? (m === 'zig' ? 1 : 0);
  if (m === 'smile') poly(arcPts(hx, my - 16, 22, 16, .2 * PI, .8 * PI, 12));
  else if (m === 'frown') poly(arcPts(hx, my + 14, 20, 11, 1.2 * PI, 1.8 * PI, 12));
  else if (m === 'o') ellipse(hx, my, 8, 10);
  else { const p = []; for (let i = 0; i <= 8; i++) p.push([hx - 28 + i * 7, my + (i % 2 ? -1 : 1) * 9 * zz]); poly(p); }
}
// boy seen from the front, chest up; (x,y) = head centre
function boy(x, y, o = {}) {
  const s = o.s || 1, d = o.drop || 0;
  X.save(); X.translate(x, y); X.scale(s, s); if (o.rot) X.rotate(o.rot);
  rrect(-122, 62, 244, 236, 46, { fill: true });                           // backpack behind
  rrect(-50, 40, 100, 34, 14, { fill: true });                              // backpack handle top
  poly([[-30, 86], [-104, 116], [-124, 340], [124, 340], [104, 116], [30, 86]], { closed: true, fill: true });
  poly([[-72, 104], [-64, 200], [-78, 330]]); poly([[72, 104], [64, 200], [78, 330]]);   // straps
  if (o.desk) { poly([[-104, 122], [-150, 262], [-40, 272]]); poly([[104, 122], [150, 262], [40, 272]]); }
  line(0, 70, 0, 88);
  const hy = d * 62, hx = 0;
  X.save(); X.translate(hx, hy); X.scale(1, 1 - d * .08); circle(0, 0, 72, { fill: true }); face(0, 0, o); X.restore();
  X.restore();
}
function desk(dy, o = {}) {
  const x0 = o.x0 ?? 70, x1 = o.x1 ?? 1010;
  poly([[x0 + 60, dy - 70], [x1 - 60, dy - 70], [x1, dy], [x0, dy]], { closed: true, fill: true });
  poly([[x0, dy], [x1, dy], [x1, dy + 330], [x0, dy + 330]], { closed: true, fill: true });
  line(x0 + 60, dy + 40, x1 - 60, dy + 40, {}); rrect(W / 2 - 60, dy + 80, 120, 26, 12);
}
function notebookFlat(cx, cy, w = 300, o = {}) {        // open notebook lying on the desk
  const h = 58;
  poly([[cx - w / 2 + 18, cy - h], [cx, cy - h + 6], [cx, cy + 6], [cx - w / 2, cy]], { closed: true, fill: true });
  poly([[cx, cy - h + 6], [cx + w / 2 - 18, cy - h], [cx + w / 2, cy], [cx, cy + 6]], { closed: true, fill: true });
  X.save(); ink(.5, 3, 3);
  for (let i = 1; i < 4; i++) { const yy = cy - h + i * 13; line(cx - w / 2 + 30 + i * 2, yy, cx - 18, yy + 5); line(cx + 18, yy + 5, cx + w / 2 - 30 - i * 2, yy); }
  X.restore();
}
function lamp(bx, by, glow = 1) {
  X.save();
  const g = X.createRadialGradient(bx - 130, by - 40, 10, bx - 130, by - 40, 420);
  g.addColorStop(0, `rgba(255,255,255,${.10 * glow})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  X.fillStyle = g; X.beginPath(); X.moveTo(bx - 70, by - 330); X.lineTo(bx - 470, by); X.lineTo(bx + 60, by); X.closePath(); X.fill();
  ink(.25 * glow, 3, 4); line(bx - 80, by - 320, bx - 440, by - 8); line(bx + 10, by - 300, bx + 40, by - 8);
  X.restore();
  ellipse(bx, by - 12, 56, 13, { fill: true });
  poly([[bx, by - 22], [bx + 34, by - 220], [bx - 10, by - 330]]);
  circle(bx + 34, by - 220, 7, { fill: true });
  poly([[bx - 10, by - 330], [bx - 100, by - 370], [bx - 130, by - 290], [bx - 30, by - 270]], { closed: true, fill: true });
}
function clock(cx, cy, r, hours, o = {}) {
  circle(cx, cy, r, { fill: true });
  X.save(); ink(X.strokeStyle ? .8 : .8, 3, 4);
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * PI; const r0 = i % 3 ? r * .86 : r * .78; line(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r * .93, cy + Math.sin(a) * r * .93); }
  X.restore();
  const ha = (hours % 12) / 12 * 2 * PI - PI / 2, ma = (hours % 1) * 2 * PI - PI / 2;
  if (o.blur) { X.save(); for (let k = 1; k <= 6; k++) { ink(.5 / k, 4, 0); const a = ma - k * o.blur; line(cx, cy, cx + Math.cos(a) * r * .8, cy + Math.sin(a) * r * .8); } X.restore(); }
  X.save(); X.lineWidth *= 1.5; line(cx, cy, cx + Math.cos(ha) * r * .5, cy + Math.sin(ha) * r * .5); X.restore();
  line(cx, cy, cx + Math.cos(ma) * r * .8, cy + Math.sin(ma) * r * .8);
  if (o.sec != null) { X.save(); ink(.8, 2.5, 3); const sa = o.sec / 60 * 2 * PI - PI / 2; line(cx - Math.cos(sa) * r * .15, cy - Math.sin(sa) * r * .15, cx + Math.cos(sa) * r * .86, cy + Math.sin(sa) * r * .86); X.restore(); }
  dot(cx, cy, 7);
  if (o.digital) label(o.digital, cx, cy + r + 52, r * .42, .95);
}
// ---------- brain ----------
const sq = (x0, y0, x1, y1, amp, n) => { const o = [], dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L; for (let i = 0; i <= 26; i++) { const u = i / 26, w = Math.sin(u * PI * n) * amp * Math.sin(u * PI); o.push([x0 + dx * u + nx * w, y0 + dy * u + ny * w]); } return o; };
const HALF = [
  [sq(-1.02, -.18, -.56, -.66, .09, 3), sq(-.86, .14, -.38, -.30, .08, 3)],
  [sq(-.42, -.78, -.12, -.30, .08, 3), sq(-.52, -.06, -.16, .16, .07, 2)],
  [sq(-1.0, .36, -.46, .56, .07, 3), sq(-.62, .30, -.26, .44, .05, 2)],
];
const PARTS = [...HALF, ...HALF.map(p => p.map(c => c.map(([x, y]) => [-x, y])))];
const MID = sq(0, -.9, 0, .52, .045, 4);
function brainPts(bx, by, R) {
  const p = []; for (let i = 0; i < 110; i++) { const a = i / 110 * 2 * PI, b = 1 + .05 * Math.sin(a * 13) + .02 * Math.sin(a * 5 + 1); let x = Math.cos(a) * 1.3 * R * b, y = Math.sin(a) * .92 * R * b; if (y > 0) y *= .82; p.push([bx + x, by + y]); } return p;
}
function brain(bx, by, R, o = {}) {
  const a = o.alpha ?? 1, glow = o.glow ?? 14, lit = o.lit || [1, 1, 1, 1, 1, 1];
  X.save();
  if (o.halo) {
    const g = X.createRadialGradient(bx, by, R * .2, bx, by, R * 2.1);
    g.addColorStop(0, `rgba(255,255,255,${.16 * o.halo})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    X.fillStyle = g; X.fillRect(bx - R * 2.2, by - R * 2.2, R * 4.4, R * 4.4);
  }
  const op = brainPts(bx, by, R);
  ink(a, 5, glow); poly(op, { closed: true, fill: true });
  ink(a * .9, 4, glow); poly(MID.map(([x, y]) => [bx + x * R, by + y * R]));
  PARTS.forEach((part, i) => { const l = cl(lit[i], 0, 1.4); if (l < .02) return; ink(a * Math.min(1, l), 4, glow * l); part.forEach(c => poly(c.map(([x, y]) => [bx + x * R, by + y * R]))); });
  if (o.red) {
    const r = o.red, rx = R * .24 * (1 + .12 * r), ry = R * .16 * (1 + .12 * r);
    X.save();
    const g = X.createRadialGradient(bx, by + R * .12, 2, bx, by + R * .12, R * .8);
    g.addColorStop(0, `rgba(255,50,50,${.45 * r})`); g.addColorStop(1, 'rgba(255,50,50,0)');
    X.fillStyle = g; X.fillRect(bx - R, by - R * .7, R * 2, R * 1.6);
    ink(.55 + .45 * r, 5, 10 + 30 * r, '255,60,60');
    ellipse(bx, by + R * .12, rx, ry, { fill: `rgba(255,40,40,${.25 + .35 * r})` });
    X.restore();
  }
  if (o.clipFx) { X.save(); X.beginPath(); op.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.closePath(); X.clip(); o.clipFx(); X.restore(); }
  X.restore();
}
function memBox(cx, cy, w, h, lab = 'память', a = 1) {
  ink(a, 5, 10);
  poly([[cx - w / 2, cy - h / 2], [cx - w / 2, cy + h / 2], [cx + w / 2, cy + h / 2], [cx + w / 2, cy - h / 2]], { fill: true });
  poly([[cx - w / 2, cy - h / 2], [cx - w / 2 - 30, cy - h / 2 - 40]]); poly([[cx + w / 2, cy - h / 2], [cx + w / 2 + 30, cy - h / 2 - 40]]);
  label(lab, cx, cy + h / 2 + 50, 44, a);
}
function page(x, y, rot, s = 1, a = 1) {
  X.save(); X.translate(x, y); X.rotate(rot); X.scale(s, s); ink(a, 4, 10);
  rrect(-42, -54, 84, 108, 6, { fill: true });
  X.save(); ink(a * .6, 3, 3); for (let i = 0; i < 4; i++) line(-26, -30 + i * 20, 26 - (i === 3 ? 20 : 0), -30 + i * 20); X.restore();
  X.restore();
}
function bed(x0, x1, y) {
  poly([[x0, y - 260], [x0, y + 110]]); line(x0 - 10, y - 260, x0 + 34, y - 260);      // headboard
  poly([[x0, y - 70], [x1, y - 70], [x1, y], [x0, y]], { closed: true, fill: true });   // mattress
  line(x0, y + 40, x1, y + 40); line(x1, y - 70, x1, y + 110);
}
function sleeper(hx, hy, x1, o = {}) {            // lying boy: head on pillow, blanket to x1
  ellipse(hx - 10, hy + 38, 110, 34, { fill: true });                                    // pillow
  const br = o.breath || 0;
  poly([[hx + 40, hy + 20], [hx + 70, hy - 40 - br * 6], [hx + 260, hy - 70 - br * 10], [hx + 470, hy - 40 - br * 6], [x1 - 40, hy - 10], [x1, hy + 60], [hx + 40, hy + 60]], { closed: true, fill: true });
  X.save(); ink(.4, 3, 3); poly([[hx + 110, hy - 10], [hx + 300, hy - 28], [hx + 450, hy - 10]]); X.restore();
  circle(hx, hy, 60, { fill: true });
  face(hx, hy, { eyes: 'closed', mouth: o.mouth || 'smile' });
}
function zz(x, y, s, a) {
  X.save(); ink(a, 4, 10); X.translate(x, y); X.scale(s, s);
  poly([[-20, -20], [20, -20], [-20, 20], [20, 20]]); X.restore();
}
function fadeBlack(a) { if (a <= 0) return; X.save(); X.shadowBlur = 0; X.fillStyle = `rgba(0,0,0,${cl(a)})`; X.fillRect(0, 0, W, H); X.restore(); }

// ---------- scenes ----------
function S1(t, s) {
  const z = lerp(1, 1.12, ease(t / (s.end - s.start)));
  X.save(); cam(z, 540, 980);
  ink(1, 5, 12);
  clock(225, 600, 110, 3 + Math.floor(t) / 3600, { sec: Math.floor(t + 1), digital: '03:00' });
  boy(540, 1060, { desk: true, eyes: 'tired', mouth: 'flat' });
  desk(1340);
  lamp(880, 1320);
  ink(1, 5, 12); notebookFlat(540, 1318, 320);
  const fl = k => hash(Math.floor(t * 14) + k * 17) > .3 ? 1 : .25;
  const lit = [0, 1, 2, 3, 4, 5].map(k => .35 + .65 * fl(k));
  brain(540, 790, 150, { alpha: .75 + .25 * fl(9), lit, glow: 18, halo: .4 * fl(3) });
  X.restore();
  title('Не спишь перед ЕНТ?', .1, t);
}
function S2(t, s) {
  const u = ease(seg(t, .15, 2.7));
  const hours = 3 + 24 * u, spd = Math.sin(PI * u);
  ink(1, 5, 12);
  clock(540, 760, 240, hours, { blur: .18 * spd, digital: u < 1 ? '' : '03:00' });
  if (u < 1) label(`+${Math.round(24 * u)} ч`, 540, 1080, 52, .9);
  JIT = 8 * eo(seg(t, .2, 1.2)); JSTEP = Math.floor(t * 5);
  const sway = Math.sin(t * 2.2) * .07 * eo(seg(t, .3, 1.5));
  X.save(); X.translate(540, 1420); X.rotate(sway * .4);
  for (let g = 2; g >= 0; g--) {          // ghost copies = slow, smeared reaction
    const lag = g * .35; const sw2 = Math.sin((t - lag) * 2.2) * .07 * eo(seg(t, .3, 1.5));
    X.save(); X.rotate(sw2 - sway * .4); ink(g ? .16 / g : 1, 5, g ? 2 : 12);
    boy(0, 0, { desk: true, eyes: 'tired', mouth: 'flat', drop: .25 * eo(seg(t, .5, 2)) });
    X.restore();
  }
  X.restore();
  JIT = 0;
  ink(1, 5, 12); desk(1700);
  title('Реакция — как у пьяного', .15, t);
}
function S3(t, s) {
  const c = s.click, d0 = s.drop;
  let drop = 0;
  if (t < c) drop = eo(seg(t, d0, d0 + .3)) * (1 + .08 * Math.sin((t - d0) * 9) * Math.exp(-(t - d0) * 3) * (t > d0 + .3));
  else drop = 1 - eo(seg(t, c, c + .07));
  const after = t >= c;
  const shake = after ? Math.exp(-(t - c) * 10) * 14 * Math.sin((t - c) * 70) : 0;
  X.save(); cam(1.22, 540 + shake, 980);
  ink(1, 5, 12);
  boy(540, 1060, { desk: true, drop, eyes: drop > .3 ? 'closed' : (after && t < c + .8 ? 'wide' : 'tired'), mouth: after && t < c + .8 ? 'o' : 'flat' });
  desk(1340); ink(1, 5, 12); notebookFlat(540, 1318, 320);
  const lit = [0, 1, 2, 3, 4, 5].map(k => {
